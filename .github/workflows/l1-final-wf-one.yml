name: L1 Final WF One Match

on:
  workflow_call:
    inputs:
      candidate:
        required: true
        type: string
      validation_year:
        required: true
        type: number
    secrets:
      KEIBA_ML_SNAPSHOTS:
        required: true

jobs:
  run:
    name: league-${{ inputs.candidate }}-y${{ inputs.validation_year }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      MATRIX_CANDIDATE: ${{ inputs.candidate }}
      VALIDATION_YEAR: ${{ inputs.validation_year }}

    steps:
      - name: Checkout KEIBA-ML
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax checks
        run: |
          python -m py_compile research/run_feature_arena.py research/train-staged-lightgbm.py research/archive_l1_walkforward_run.py
          node --check research/project-yearly-snapshots.mjs
          bash -n scripts/kaggle-fetch-snapshot.sh

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Load league config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          cfg=json.loads(Path("research/l1-final-walkforward-v1.json").read_text(encoding="utf-8"))
          generation=str(cfg.get("snapshot_generation") or "")
          if not generation or generation.startswith("PENDING"):
              raise SystemExit("snapshot_generation is still pending")
          year=int(os.environ["VALIDATION_YEAR"])
          if year in set(int(x) for x in cfg.get("locked_years") or []):
              raise SystemExit(f"locked validation year: {year}")
          name=os.environ["MATRIX_CANDIDATE"]
          rows=[x for x in cfg["candidates"] if x["name"]==name]
          if len(rows)!=1:
              raise SystemExit(f"candidate config mismatch: {name}")
          row=rows[0]
          train_y1,train_y2=year-2,year-1
          candidate={"name":name,"feature_sets":row["feature_sets"]}
          if row.get("actor_prefixes"): candidate["actor_prefixes"]=row["actor_prefixes"]
          if row.get("auto_slices"): candidate["auto_slices"]=row["auto_slices"]
          Path("candidate.json").write_text(json.dumps([candidate],ensure_ascii=False)+"\n",encoding="utf-8")
          env={
            "GENERATION_ID":generation,
            "KAGGLE_DATASET_REF":f"pino1945/keiba-ml-snapshot-{generation}",
            "CANDIDATE_LABEL_JA":str(row.get("label_ja") or name),
            "TRAIN_YEAR_1":str(train_y1),"TRAIN_YEAR_2":str(train_y2),
            "TRAIN_START":f"{train_y1}-01-01","TRAIN_END":f"{train_y2}-12-31",
            "VALID_START":f"{year}-01-01","VALID_END":f"{year}-12-31",
          }
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              for k,v in env.items(): fh.write(f"{k}={v}\n")
          PY

      - name: Restore rolling three-year snapshots
        shell: bash
        run: |
          set -euo pipefail
          root="out/wf-input/$GENERATION_ID"
          mkdir -p "$root"
          for y in "$TRAIN_YEAR_1" "$TRAIN_YEAR_2" "$VALIDATION_YEAR"; do
            bash scripts/kaggle-fetch-snapshot.sh "$GENERATION_ID" "$y" "$root"
          done
          paths=()
          for y in "$TRAIN_YEAR_1" "$TRAIN_YEAR_2" "$VALIDATION_YEAR"; do
            if [[ -s "$root/snapshot-$y.jsonl" ]]; then paths+=("$root/snapshot-$y.jsonl")
            elif [[ -s "$root/snapshot-$y.jsonl.gz" ]]; then paths+=("$root/snapshot-$y.jsonl.gz")
            else echo "::error::snapshot $y missing"; exit 1
            fi
          done
          echo "INPUTS=$(IFS=,; echo "${paths[*]}")" >> "$GITHUB_ENV"

      - name: Run walk-forward candidate
        shell: bash
        run: |
          set -euo pipefail
          out="out/l1-final-walkforward/$MATRIX_CANDIDATE-y$VALIDATION_YEAR"
          python research/run_feature_arena.py             --inputs "$INPUTS"             --out-dir "$out"             --train-start "$TRAIN_START"             --train-end "$TRAIN_END"             --valid-start "$VALID_START"             --valid-end "$VALID_END"             --prediction-phase FINAL             --feature-selection none             --candidates-json candidate.json             --source-ref main             --ml-source-sha "$GITHUB_SHA"

      - name: Print walk-forward result
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          n=os.environ["MATRIX_CANDIDATE"]; y=int(os.environ["VALIDATION_YEAR"])
          s=json.loads((Path("out/l1-final-walkforward")/f"{n}-y{y}"/"feature-arena-summary.json").read_text())
          r=s["results"][0]
          print("L1_WALKFORWARD_RESULT")
          print(json.dumps({
            "candidate":n,"validation_year":y,
            "train_start":os.environ["TRAIN_START"],"train_end":os.environ["TRAIN_END"],
            "feature_sets":r["feature_sets"],"actor_prefixes":r.get("actor_prefixes") or [],
            "auto_slices":r.get("auto_slices") or [],"feature_count":r["feature_count"],
            "metrics":r["metrics"],"resource_usage":r.get("resource_usage")
          },ensure_ascii=False,separators=(",",":")))
          PY

      - name: Cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted CPU runner only."
          echo "No GPU. No Artifact/Cache."
          echo "Approved Kaggle snapshot storage is read-only."
