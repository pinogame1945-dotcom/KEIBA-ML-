name: L2 EV Top6 Historical Result Detailed Report V1

on:
  push:
    branches:
      - research/l2-ev-top6-raw-ai-allbets-20261018
    paths:
      - .github/triggers/l2-ev-top6-detailed-v1.trigger

permissions:
  contents: write

concurrency:
  group: l2-ev-top6-detailed-20261018
  cancel-in-progress: false

jobs:
  detail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check static syntax and source results
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/summarize_l2_ev_top6_detailed_v1.py
          test -s research-results/l2-ev-top6-raw-ai-allbets-v1/run-39112399214/all-ev-top6-raw-ai-templates.csv
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/l2-ev-top6-detailed-v1.yml").read_text()
          assert "runs-on: ubuntu-latest" in wf
          assert "actions/cache" not in wf and "upload-artifact" not in wf
          print("FREE_CPU_NO_STORAGE_BILL_OK")
          PY
      - name: Reuse completed 2023-25 result, no model re-run
        shell: bash
        run: |
          set -euo pipefail
          python research/summarize_l2_ev_top6_detailed_v1.py
          p=research-results/l2-ev-top6-raw-ai-allbets-v1/run-39112399214
          test -s "$p/detail-summary.json"
          test -s "$p/detail-all-1032-combinations-yearly.csv"
          test -s "$p/detail-best-k-per-rank-and-bet-family-72.csv"
      - name: Persist detailed small results to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add research-results/l2-ev-top6-raw-ai-allbets-v1/run-39112399214/detail-*
          git commit -m "research: add precise EV top6 all bet breakdown from completed run"
          git push origin "HEAD:$GITHUB_REF_NAME"
