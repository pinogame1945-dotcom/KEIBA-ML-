name: L1 Newcomer Specialist Smoke

on:
  push:
    branches:
      - research/l1-newcomer-specialist-v0-20260928
    paths:
      - .github/workflows/l1-newcomer-specialist-smoke.yml
      - research/train-staged-lightgbm.py
      - research/run_feature_arena.py
      - research/project-yearly-snapshots.mjs
      - research/feature-arena-smoke.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax checks
        run: |
          python -m py_compile research/train-staged-lightgbm.py research/run_feature_arena.py research/feature-arena-smoke.py

      - name: Install ML dependencies
        run: |
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Run feature arena smoke
        run: python research/feature-arena-smoke.py

      - name: Cost guard
        if: always()
        run: |
          if grep -E '^[[:space:]]+runs-on:[[:space:]]*(macos|windows|.*gpu)' .github/workflows/l1-newcomer-specialist-smoke.yml; then
            echo "Paid/special runner found; refusing workflow." >&2
            exit 1
          fi
          if grep -E '^[[:space:]]+uses:[[:space:]]*actions/(upload-artifact|cache)@' .github/workflows/l1-newcomer-specialist-smoke.yml; then
            echo "Persistent GitHub Artifact/Cache usage found; refusing workflow." >&2
            exit 1
          fi
          echo "Standard GitHub-hosted ubuntu-latest runner only."
          echo "No GPU."
          echo "No Artifact or Cache."
