name: L1 Structural Risk Fullfield Monotonicity

on:
  push:
    branches:
      - research/l1-structural-risk-fullfield-v1-20261004
    paths:
      - .github/triggers/l1-structural-risk-fullfield-monotonicity.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/audit_l1_structural_risk_fullfield_monotonicity_v1.py
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/l1-structural-risk-fullfield-monotonicity.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses)
          assert not any(u.startswith("actions/cache") for u in uses)
          print("MONOTONICITY_STATIC_GUARDS_OK")
          PY

      - name: Install lightweight dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pandas scipy

      - name: Audit monotonicity
        shell: bash
        run: |
          set -euo pipefail
          pred="research-results/l1-structural-risk-fullfield-v1/run-37154323510/oos-fullfield-votes.csv.gz"
          test -s "$pred"
          result="research-results/l1-structural-risk-fullfield-monotonicity-v1/run-$GITHUB_RUN_ID"
          python research/audit_l1_structural_risk_fullfield_monotonicity_v1.py             --pred "$pred"             --out-dir "$result"

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner / Artifact / Cache."
          echo "No Kaggle access. Saved OOS predictions only."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l1-structural-risk-fullfield-monotonicity-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: archive Structural Risk monotonicity $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
