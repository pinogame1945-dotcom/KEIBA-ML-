name: L2 EV1-6 All 6870 No-Odds Ticket Pruning Gates V1

on:
  push:
    branches:
      - research/l2-ev-top6-raw-ai-allbets-20261018
    paths:
      - .github/triggers/l2-ev-top6-no-odds-pruning-v1.trigger

permissions:
  contents: write

concurrency:
  group: l2-ev-top6-no-odds-pruning-v1
  cancel-in-progress: false

jobs:
  prune-all-no-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Safety, source integrity, non-price-gate checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/apply_odds_free_l2_gates_ev_top6_6870_v1.py
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/l2-ev-top6-no-odds-pruning-v1.yml").read_text()
          run=[s.strip() for s in wf.splitlines() if s.strip().startswith("runs-on:")]
          uses=[s.strip() for s in wf.splitlines() if s.strip().startswith("- uses:")]
          assert run==["runs-on: ubuntu-latest"]
          assert all(x not in u.lower() for u in uses for x in
                     ("actions/cache@", "actions/upload-artifact@", "self-hosted", "gpu"))
          src=Path("research/apply_odds_free_l2_gates_ev_top6_6870_v1.py").read_text()
          assert "load_odds_day" not in src and "ticket_price(" not in src
          import sys
          sys.path.insert(0,"research")
          import apply_odds_free_l2_gates_ev_top6_6870_v1 as m
          assert m.GATES == ("ALL","RAW_TOP6","RAW_TOP10",
              "CALIBRATED_TOP6","CALIBRATED_TOP10",
              "ABILITY_Z_GE_M1","ABILITY_Z_GE_0","MODEL_WIN_P_GE_003")
          print("SEVEN_ORIGINAL_ODDS_FREE_GATES_SAFE")
          PY
          test -s research-cache/market-fixed-anchor-residual-v2/fair-base-bf811fa2eab73db0.csv.gz
          test -s research-results/l2-ev-top6-raw-ai-rank-tickets-v1/run-39113910151/atomic-exact-rank-yearly-returns.csv
      - name: Fetch only the frozen 2023-2025 race settlement packs
        shell: bash
        run: |
          set -euo pipefail
          input="research-results/market-fixed-anchor-residual-v2/run-38659856085/oos-fair-value-predictions.csv.gz"
          SHA="0d4af461b77f0060dd9c789dd2da646026fada47"
          mkdir -p out/backfill
          git init -q out/backfill
          git -C out/backfill remote add origin https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git
          git -C out/backfill sparse-checkout init --no-cone
          python - "$input" out/backfill/.git/info/sparse-checkout <<'PY'
          import pandas as pd,sys
          df=pd.read_csv(sys.argv[1],compression="infer",usecols=["year","_race_date"])
          assert set(df.year.astype(int))=={2023,2024,2025},"2026 SEALED"
          dates=sorted(set(df["_race_date"].astype(str).str[:10]))
          assert 200<=len(dates)<=500,len(dates)
          with open(sys.argv[2],"w") as fh:
              fh.writelines("/data/daily/"+d+".jsonl.gz\n" for d in dates)
          print("NO_ODDS_HISTORICAL_DAYS",len(dates))
          PY
          git -C out/backfill fetch --filter=blob:none --depth=1 origin "$SHA"
          git -C out/backfill checkout -q --detach FETCH_HEAD
          test "$(git -C out/backfill rev-parse HEAD)" = "$SHA"
      - name: Evaluate ALL 6870 settings with only seven no-odds per-ticket gates
        shell: bash
        run: |
          set -euo pipefail
          dest="research-results/l2-ev-top6-raw-ai-odds-free-pruning-v1/run-$GITHUB_RUN_ID"
          python -u research/apply_odds_free_l2_gates_ev_top6_6870_v1.py \
            --predictions research-results/market-fixed-anchor-residual-v2/run-38659856085/oos-fair-value-predictions.csv.gz \
            --ability-cache research-cache/market-fixed-anchor-residual-v2/fair-base-bf811fa2eab73db0.csv.gz \
            --atomic-reference research-results/l2-ev-top6-raw-ai-rank-tickets-v1/run-39113910151/atomic-exact-rank-yearly-returns.csv \
            --backfill-root out/backfill \
            --out-dir "$dest"
          for f in summary.json red-black-transition-by-gate-and-year.csv \
             all-6870-odds-free-gates-yearly.csv.gz \
             all-6870-odds-free-gates-pooled.csv.gz;do test -s "$dest/$f";done
      - name: Remove only temporary backfill packs
        if: always()
        run: rm -rf out/backfill
      - name: Commit only compressed aggregate statistics
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          dest="research-results/l2-ev-top6-raw-ai-odds-free-pruning-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$dest"
          git commit -m "research: no-odds pruning all EV1-6 6870 rank-ticket settings $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
