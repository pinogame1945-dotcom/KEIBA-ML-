  ledger:
    name: ledger
    if: ${{ always() }}
    needs:
      - daytrend_2025
      - raceshape_2025
      - gatecourse_2025
      - jockey_2025
      - field_2025
      - chimera_2025
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fast-forward branch
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Archive structured logs
        run: |
          set -euo pipefail
          python research/archive_l1_outsider_arena_v1.py             --repo "$GITHUB_REPOSITORY"             --run-id "$GITHUB_RUN_ID"             --config research/l1-outsider-nonhorse-v1.json             --out-root research-results/l1-outsider-nonhorse-v1

      - name: Commit small permanent ledger
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research-results/l1-outsider-nonhorse-v1/OUTSIDER-NONHORSE-001
          if git diff --cached --quiet; then
            echo "No ledger changes to commit"
            exit 0
          fi
          git commit -m "research: archive nonhorse outsider run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1

      - name: Cost guard
        if: ${{ always() }}
        run: |
          echo "Standard GitHub-hosted CPU only."
          echo "No GPU. No paid runner. No GitHub Artifact/Cache."
          echo "Six outsider candidates run in parallel; years are sequential per candidate."
          echo "Initial Kaggle reads are staggered to avoid rate-limit bursts."
          echo "Only small text/JSON ledgers are committed."
          echo "Existing Kaggle data is read-only."
          echo "2026 remains sealed."
