name: Temporary Feature Arena ledger smoke

on:
  push:
    branches:
      - feature/l1-feature-arena-trainer-v1-20260927
    paths:
      - .github/workflows/tmp-feature-arena-ledger-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ledger syntax and CLI smoke
        run: |
          python -m py_compile research/archive_feature_arena_run.py
          python research/archive_feature_arena_run.py --help >/dev/null
          echo "FEATURE_ARENA_LEDGER_SMOKE_OK"
      - name: Cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted runner only."
          echo "No GPU."
          echo "No Artifact or Cache."
