name: L1 Outsider Nonhorse Arena V4

on:
  push:
    branches:
      - research/l1-outsider-nonhorse-v1-20260928
    paths:
      - .github/triggers/l1-outsider-nonhorse-v4.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l1-outsider-nonhorse-v4
  cancel-in-progress: true

jobs:
  candidate:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - candidate: outsider_daytrend
            label: daytrend
            delay: 0
          - candidate: outsider_raceshape
            label: raceshape
            delay: 30
          - candidate: outsider_gatecourse
            label: gatecourse
            delay: 60
          - candidate: outsider_jockey
            label: jockey
            delay: 90
          - candidate: outsider_field
            label: field
            delay: 120
          - candidate: outsider_chimera
            label: chimera
            delay: 150
    uses: ./.github/workflows/l1-outsider-nonhorse-incremental-v4.yml
    with:
      candidate: ${{ matrix.candidate }}
      start_delay_seconds: ${{ matrix.delay }}
    secrets:
      KEIBA_ML_SNAPSHOTS: ${{ secrets.KEIBA_ML_SNAPSHOTS }}

  ledger:
    name: ledger
    needs:
      - candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - run: git pull --ff-only origin "$GITHUB_REF_NAME"
      - run: |
          python research/archive_l1_outsider_arena_v1.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --config research/l1-outsider-nonhorse-v1.json \
            --out-root research-results/l1-outsider-nonhorse-v1
      - run: |
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research-results/l1-outsider-nonhorse-v1/OUTSIDER-NONHORSE-001
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: archive nonhorse outsider v4 run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1
