name: L1.5 Consensus Rank Podium V1

on:
  push:
    branches:
      - research/l15-podium-containment-v1-20260929
    paths:
      - .github/triggers/l15-consensus-rank-podium-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l15-consensus-rank-podium-v1
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      GENERATION_ID: eb13d4096519167b
      KAGGLE_DATASET_REF: pino1945/keiba-ml-snapshot-eb13d4096519167b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and install Kaggle
        run: |
          set -euo pipefail
          python -m py_compile research/analyze_l15_consensus_rank_podium_v1.py
          python -m pip install --disable-pip-version-check kaggle
      - name: Restore frozen inputs read-only
        run: |
          set -euo pipefail
          mkdir -p out/rank-podium/snapshot out/rank-podium/router
          bash scripts/kaggle-snapshot-session.sh init "$GENERATION_ID" out/rank-podium/snapshot
          bash scripts/kaggle-snapshot-session.sh fetch "$GENERATION_ID" out/rank-podium/snapshot 2022 2023 2024 2025
          bash scripts/kaggle-fetch-router-years.sh "2022,2023,2024,2025" out/rank-podium/router
      - name: Analyze rank podium rates
        run: |
          set -euo pipefail
          out="research-results/l15-consensus-rank-podium-v1/run-$GITHUB_RUN_ID"
          python research/analyze_l15_consensus_rank_podium_v1.py \
            --snapshot-root out/rank-podium/snapshot \
            --router-root out/rank-podium/router \
            --out-dir "$out"
          cat "$out/summary.json"
      - name: Cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner."
          echo "No GitHub Artifact or Cache."
          echo "Kaggle inputs read-only; no Dataset/Model persistence."
          echo "Only small JSON/CSV results committed."
          echo "2026 remains sealed."
      - name: Commit compact results
        if: success()
        run: |
          set -euo pipefail
          out="research-results/l15-consensus-rank-podium-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$out/summary.json" "$out/rank-podium.csv"
          git commit -m "research: consensus rank podium run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
