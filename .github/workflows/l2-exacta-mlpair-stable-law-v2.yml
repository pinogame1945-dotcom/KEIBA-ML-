name: L2 EXACTA MLPair Stable LAW V2

on:
  push:
    branches:
      - research/l2-exacta-mlpair-stable-law-v2-20260930
    paths:
      - .github/triggers/l2-exacta-mlpair-stable-law-v2.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-exacta-mlpair-stable-law-v2
  cancel-in-progress: true

jobs:
  exacta-mlpair-stable-law-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Contract and cost guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/run_l2_exacta_mlpair_stable_law_v2.py \
            research/run_l2_exacta_stable_law_v1.py \
            research/run_l2_exacta_decomposed_v1.py \
            research/materialize_l17_seven_king_fullfield_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.load(open("contracts/l2-exacta-mlpair-stable-law-v2.json",encoding="utf-8"))
          assert c["contract"]=="L2_EXACTA_MLPAIR_STABLE_LAW_V2"
          assert c["locked_years"]==[2026]
          assert c["law_test_years"]==[2024,2025]
          assert c["test_year_use"].startswith("evaluation only")
          assert c["direction_model_added"] is False
          cost=c["cost"]
          assert cost["standard_github_cpu_only"] is True
          for k in ("gpu","paid_runner","github_artifact","github_cache","persistent_kaggle_upload"):
              assert cost[k] is False,(k,cost[k])
          wf=Path(".github/workflows/l2-exacta-mlpair-stable-law-v2.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses)
          assert not any(u.startswith("actions/cache") for u in uses)
          print("EXACTA_MLPAIR_STABLE_LAW_V2_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore seven horse-level score tables once
        shell: bash
        run: |
          set -euo pipefail
          session_script="scripts/kaggle-dataset-session-v2.sh"
          for y in 2022 2023 2024 2025; do
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              d="out/exacta-mlpair-law/scores/$y/$alias"
              ref="pino1945/keiba-l15-7k-$alias-y$y-v1"
              bash "$session_script" init "$ref" "$d"
              bash "$session_script" fetch "$d" score.jsonl
              p="$(find "$d" -type f \( -name 'score.jsonl.gz' -o -name 'score.jsonl' \) -print -quit)"
              test -n "$p"; test -s "$p"
            done
          done

      - name: Materialize L1.7 once per year
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/exacta-mlpair-law/l17
          for y in 2022 2023 2024 2025; do
            args=()
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              p="$(find "out/exacta-mlpair-law/scores/$y/$alias" -type f \( -name 'score.jsonl.gz' -o -name 'score.jsonl' \) -print -quit)"
              test -n "$p"; test -s "$p"
              args+=(--expert "$alias=$p")
            done
            python research/materialize_l17_seven_king_fullfield_v1.py \
              --year "$y" "${args[@]}" \
              --output "out/exacta-mlpair-law/l17/l17-$y.jsonl.gz"
            test -s "out/exacta-mlpair-law/l17/l17-$y.jsonl.gz"
            echo "L17_$y=out/exacta-mlpair-law/l17/l17-$y.jsonl.gz" >> "$GITHUB_ENV"
          done

      - name: Sparse restore 2022-2025 race and odds packs once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          cat > out/backfill/.git/info/sparse-checkout <<'EOF'
          /data/daily/2022-*.jsonl.gz
          /data/daily/2023-*.jsonl.gz
          /data/daily/2024-*.jsonl.gz
          /data/daily/2025-*.jsonl.gz
          /data/odds/daily/2022-*.jsonl.gz
          /data/odds/daily/2023-*.jsonl.gz
          /data/odds/daily/2024-*.jsonl.gz
          /data/odds/daily/2025-*.jsonl.gz
          EOF
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Run ML-pair stable LAW V2
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-exacta-mlpair-stable-law-v2/run-$GITHUB_RUN_ID"
          python research/run_l2_exacta_mlpair_stable_law_v2.py \
            --l17-year "2022:$L17_2022" \
            --l17-year "2023:$L17_2023" \
            --l17-year "2024:$L17_2024" \
            --l17-year "2025:$L17_2025" \
            --backfill-root out/backfill \
            --out-dir "$result"
          echo "===== SUMMARY ====="
          cat "$result/summary.json"
          echo "===== MLPAIR FOUNDATION ====="
          cat "$result/mlpair-foundation.csv"
          echo "===== RECURRENCE ====="
          head -n 80 "$result/cross-year-recurrence.csv"
          echo "===== UNSEEN ====="
          head -n 100 "$result/unseen-year-results.csv"

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner."
          echo "No actions/cache and no upload-artifact."
          echo "No paid persistence."
          echo "Existing Kaggle score datasets are read-only."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-exacta-mlpair-stable-law-v2/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add \
            "$result/README.md" \
            "$result/summary.json" \
            "$result/mlpair-foundation.csv" \
            "$result/mlpair-folds.csv" \
            "$result/unseen-year-results.csv" \
            "$result/prior-period-audit.csv" \
            "$result/learned-thresholds.csv" \
            "$result/cross-year-recurrence.csv"
          git commit -m "research: archive exacta ML-pair stable LAW V2 run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
