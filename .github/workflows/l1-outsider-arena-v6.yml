name: L1 Outsider Arena V6

on:
  push:
    branches:
      - research/l1-outsider-arena-v1-20260928
    paths:
      - .github/triggers/l1-outsider-arena-v6.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l1-outsider-arena-v6
  cancel-in-progress: true

jobs:
  candidate:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - candidate: outsider_style
            label: style
            delay: 0
          - candidate: outsider_lap
            label: lap
            delay: 30
          - candidate: outsider_network
            label: network
            delay: 60
          - candidate: outsider_distance
            label: distance
            delay: 90
          - candidate: outsider_backfill
            label: backfill
            delay: 120
    uses: ./.github/workflows/l1-outsider-all-years-v6.yml
    with:
      candidate: ${{ matrix.candidate }}
      start_delay_seconds: ${{ matrix.delay }}
    secrets:
      KEIBA_ML_SNAPSHOTS: ${{ secrets.KEIBA_ML_SNAPSHOTS }}

  ledger:
    name: ledger
    if: always()
    needs:
      - candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout outsider branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fast-forward branch
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Archive all candidate-year results
        run: |
          set -euo pipefail
          python research/archive_l1_outsider_arena_v1.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --config research/l1-outsider-arena-v1.json

      - name: Commit small permanent ledger
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research-results/l1-outsider-arena-v1/OUTSIDER-ARENA-001
          if git diff --cached --quiet; then
            echo "No ledger changes to commit"
            exit 0
          fi
          git commit -m "research: archive outsider v6 run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1

      - name: Cost guard
        if: always()
        run: |
          echo "Five standard ubuntu-latest CPU runners at most."
          echo "No GPU. No paid runner. No GitHub Artifact/Cache."
          echo "Each candidate downloads seven snapshots and five routers only once."
          echo "All 2021-2025 folds then run from ephemeral runner SSD."
          echo "Only small structured result ledger is committed."
          echo "2026 remains sealed."
