name: Research affiliate selected races vs favorite top5
on:
  push:
    branches: ["research/affiliate-top5-20261015"]
    paths:
      - ".github/workflows/research-affiliate-top5.yml"
      - "research/affiliate_top5/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install small parsers
        run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4
      - name: Compute same-race popularity top5 trio returns (195 fixed races)
        run: python research/affiliate_top5/analyze.py
