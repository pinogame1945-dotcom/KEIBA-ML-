name: Market Fixed Anchor Residual V2

on:
  push:
    branches:
      - research/market-fixed-anchor-residual-v2-20261015
    paths:
      - .github/triggers/market-fixed-anchor-residual-v2.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-fixed-anchor-residual-v2
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      DATASET_REF: pino1945/keiba-ml-snapshot-bf811fa2eab73db0
      GENERATION_ID: bf811fa2eab73db0
      PYTHONUNBUFFERED: "1"
      L1_THREADS: "2"
      KAGGLE_DOWNLOAD_PARALLEL: "4"
      PROJECTION_PARALLEL: "4"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static and cost guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/run_market_fixed_anchor_residual_v2.py             research/run_market_fixed_anchor_residual_from_cache_v2.py             research/run_l1_sameday_track_bias_v1.py             research/run_l1_ceiling_audit_v1.py             research/run_l1_objective_rebuild_v1.py             research/resolve_snapshot_manifest_remote_v1.py
          node --check research/project-yearly-snapshots.mjs
          bash -n research/run_market_fixed_anchor_residual_v2.sh
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/market-fixed-anchor-residual-v2.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses)
          assert not any(u.startswith("actions/cache") for u in uses)
          src=Path("research/run_market_fixed_anchor_residual_v2.py").read_text()
          for token in ("MARKET_FIXED_ANCHOR_RESIDUAL_V2","ANCHOR_FULL","p_i proportional","2026_locked"):
              assert token in src
          assert "final_win_odds" in Path("research/run_l1_ceiling_audit_v1.py").read_text()
          print("MARKET_FIXED_ANCHOR_RESIDUAL_V2_STATIC_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Run market-anchored fair value model
        shell: bash
        run: |
          set -euo pipefail
          bash research/run_market_fixed_anchor_residual_v2.sh

      - name: Preserve reusable fair-base cache on downstream failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/market-fixed-anchor-residual-v2/run-$GITHUB_RUN_ID"
          cache="$result/fair-base-cache.csv.gz"
          if [[ -s "$cache" ]]; then
            stable="research-cache/market-fixed-anchor-residual-v2/fair-base-bf811fa2eab73db0.csv.gz"
            mkdir -p "$(dirname "$stable")"
            cp "$cache" "$stable"
            git config user.name "keiba-ml-research-bot"
            git config user.email "actions@users.noreply.github.com"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git add "$stable"
            if ! git diff --cached --quiet; then
              git commit -m "research: preserve reusable fair-base cache"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner."
          echo "No actions/cache or upload-artifact."
          echo "Kaggle is read-only."
          echo "Metadata is listed once; only resolved existing remote names are downloaded."
          echo "404 is non-retryable; only transient 429/5xx/network errors retry."
          echo "2019-2025 snapshots are reused within one runner."
          echo "Only compact CSV/JSON diagnostics are committed."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/market-fixed-anchor-residual-v2/run-$GITHUB_RUN_ID"
          test -s "$result/summary.json"
          test -s "$result/fold-probability-metrics.csv"
          test -s "$result/pooled-probability-metrics.csv"
          test -s "$result/lambda-selection.csv"
          test -s "$result/residual-coefficients.csv"
          test -s "$result/fixed-edge-roi-by-year.csv"
          test -s "$result/fixed-edge-roi-pooled.csv"
          test -s "$result/edge-band-roi-by-year.csv"
          test -s "$result/oos-fair-value-predictions.csv.gz"
          test -s "research-cache/market-fixed-anchor-residual-v2/fair-base-bf811fa2eab73db0.csv.gz"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: archive market-fixed anchor residual run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
