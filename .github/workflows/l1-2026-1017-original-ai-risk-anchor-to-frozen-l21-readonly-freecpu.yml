name: 2026 saved original AI Risk ANCHOR to frozen L2.1 source read-only (free CPU)
on:
  push:
    branches: [feature/l1-7king-2026-928-preflight-20261017]
    paths:
      - .github/workflows/l1-2026-1017-original-ai-risk-anchor-to-frozen-l21-readonly-freecpu.yml
      - research/audit_2026_1017_backfill_eight_odds_to_frozen_l21_v1.py
      - research/audit_2026_1017_original_l21_gate_feature_panel_v1.py
permissions:
  contents: read
concurrency:
  group: l21-2026-saved-original-source-readonly
  cancel-in-progress: false
jobs:
  audit-saved-original-frozen-l21:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      ORIGINAL_REF: pino1945/keiba-2026-original-pure-risk-anchor-v1
      L175_REF: pino1945/keiba-2026-1017-l175-market-v1
      L21_FREEZE_SHA: 9655c717333636b5cc931f672e12dbc377e396bc
      L21_FROZEN_BLOB: 600fa764565545c4898c79d65187b8843e51a5e1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free standard public CPU and script integrity gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m py_compile research/audit_2026_1017_saved_original_l21_source_v1.py
          python - <<'PY'
          import json,urllib.request
          u=urllib.request.Request(
            'https://api.github.com/repos/pinogame1945-dotcom/KEIBA-ML-',
            headers={'User-Agent':'keiba-standard-freecpu-audit'})
          assert json.load(urllib.request.urlopen(u,timeout=30)).get('private') is False, "REFUSE_PAID_RUNNER"
          print("PUBLIC_REPOSITORY_FREE_STANDARD_CPU_CONFIRMED")
          PY
      - name: Restore exact original frozen 50-rule contract without modification
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/frozen-l21"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/pinogame1945-dotcom/KEIBA-ML-.git
          git -C "$root" fetch -q --no-tags --depth 1 --filter=blob:none origin "$L21_FREEZE_SHA"
          test "$(git -C "$root" rev-parse FETCH_HEAD)" = "$L21_FREEZE_SHA"
          git -C "$root" show FETCH_HEAD:contracts/KEIBA_L2_1_FIXED_PURCHASE_V1.json > "$root/contract.json"
          test "$(git hash-object "$root/contract.json")" = "$L21_FROZEN_BLOB"
          echo "FROZEN_L21_BLOB_BYTES_VERIFIED"
      - name: Restore saved models score and saved research WIN odds only, never recompute
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --disable-pip-version-check kaggle
          mkdir -p "$RUNNER_TEMP/score" "$RUNNER_TEMP/market"
          for spec in "score|$ORIGINAL_REF|index.json" \
                      "score|$ORIGINAL_REF|original-2026-1017-36r-471h-ability-risk-anchor.jsonl" \
                      "market|$L175_REF|index.json" \
                      "market|$L175_REF|l175-real-market-research-1017.jsonl"; do
            IFS='|' read -r dir ref name <<< "$spec"
            target="$RUNNER_TEMP/$dir"
            for attempt in 1 2 3 4 5; do
              if result="$(kaggle datasets download "$ref" -f "$name" -p "$target" --unzip --quiet --force 2>&1)"; then
                test -s "$target/$name"
                break
              fi
              if [[ "$result" != *"429"* && "$result" != *"Too Many Requests"* && "$result" != *"503"* && "$result" != *"502"* ]] || [[ "$attempt" -eq 5 ]]; then
                echo "::error::Exact saved private source retrieval failed: $name: $result"
                exit 1
              fi
              sleep $((8 * attempt))
            done
            sleep 2
          done
          echo "SAVED_PRIVATE_ORIGINAL_SCORES_AND_MARKET_RESTORED_NO_REFIT"
      - name: Verify 36 real races 471 horses original axis against exact frozen L2.1 input boundary
        shell: bash
        run: |
          set -euo pipefail
          python research/audit_2026_1017_saved_original_l21_source_v1.py \
            --original-index "$RUNNER_TEMP/score/index.json" \
            --original-scores "$RUNNER_TEMP/score/original-2026-1017-36r-471h-ability-risk-anchor.jsonl" \
            --l175-index "$RUNNER_TEMP/market/index.json" \
            --l175-scores "$RUNNER_TEMP/market/l175-real-market-research-1017.jsonl" \
            --frozen-l21-contract "$RUNNER_TEMP/frozen-l21/contract.json" \
            --output "$RUNNER_TEMP/saved-original-to-frozen-l21-readonly.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"saved-original-to-frozen-l21-readonly.json").read_text())
          assert x["real_races_joined"]==36 and x["real_horses_joined"]==471
          assert x["original_ai_rank_horses"]==471 and x["original_correction_risk_horses"]==471
          assert x["original_anchor_full_probability_horses"]==471 and x["original_anchor_full_axis_races"]==36
          assert x["frozen_standard_rules"]==50 and x["frozen_strict_subset_rules"]==26
          assert not x["ready_for_betting"] and not x["frozen_l21_engine_invoked"] and not x["l3_v3_invoked"]
          assert all(r["tickets"] is None and not r["ready_for_betting"] for r in x["races"])
          print("ORIGINAL_SAVED_L21_RESEARCH_HORSE_AXIS_JOIN_PASS_BETTING_BLOCKED")
          PY
          {
            echo '### Authentic saved original 2026 source -> frozen L2.1 read-only'
            echo '- 36 races, 471 actual runners: original AI ranks / Correction Risk / ANCHOR_FULL probabilities matched.'
            echo '- Original ANCHOR_FULL axes: 36/36. Frozen STANDARD=50, STRICT=26, unchanged.'
            echo '- Source dates and bet-cutoff multi-ticket odds have no independent pre-start proof.'
            echo '- Research candidates remain unapproved. No L2.1 ticket engine, L3 V3, bets, model fit, or save.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore pinned BACKFILL 690 + original eight odds index and exact 36 race blobs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/odds-backfill"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git
          git -C "$root" sparse-checkout init --no-cone
          printf "/ml_features/delivery/690/index.json\n/ml_features/delivery/odds/index.json\n/ml_features/delivery/odds/2026-10-17/*\n" > "$root/.git/info/sparse-checkout"
          git -C "$root" fetch -q --depth 1 --filter=blob:none origin d6607946292efe79fc5eef8eaf143e689c41f6a9
          test "$(git -C "$root" rev-parse FETCH_HEAD)" = d6607946292efe79fc5eef8eaf143e689c41f6a9
          git -C "$root" checkout -q --detach FETCH_HEAD
          test -s "$root/ml_features/delivery/odds/index.json"
          test "$(find "$root/ml_features/delivery/odds/2026-10-17" -name '*.json' | wc -l)" -eq 36
          echo "PINNED_BACKFILL_JRA_EIGHT_ODDS_36_REAL_RACES_REUSED"
      - name: Join source original L1 prices to BACKFILL eight ticket odds without changing frozen L2.1
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/audit_2026_1017_backfill_eight_odds_to_frozen_l21_v1.py
          python research/audit_2026_1017_backfill_eight_odds_to_frozen_l21_v1.py \
            --backfill "$RUNNER_TEMP/odds-backfill" \
            --upstream-audit "$RUNNER_TEMP/saved-original-to-frozen-l21-readonly.json" \
            --l175-scores "$RUNNER_TEMP/market/l175-real-market-research-1017.jsonl" \
            --output "$RUNNER_TEMP/backfill-eight-odds-frozen-l21-audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          v=json.loads((Path(os.environ["RUNNER_TEMP"])/"backfill-eight-odds-frozen-l21-audit.json").read_text())
          assert v["real_races_verified"]==36 and v["real_horses_verified"]==471
          assert v["complete_stored_eight_bet_races"]==36
          assert set(v["l21_bet_types"])=={"QUINELLA","TRIO","TRIFECTA"}
          assert v["frozen_standard_rules"]==50 and v["frozen_strict_subset_rules"]==26
          assert v["frozen_l21_ticket_engine_invoked"] is False and v["l3_v3_invoked"] is False
          assert v["ready_for_betting"] is False and v["2026_target_results_used"] is False
          print("EXISTING_BACKFILL_THREE_L21_TICKET_PRICE_GROUPS_SOURCE_VERIFIED",v["frozen_l21_combinations_with_quotes"])
          print("DIFFERENT_WIN_SNAPSHOT_RACES",36-v["same_market_snapshot_races"])
          print("SOURCE_AUDIT_BLOCKERS",v["remaining_blockers"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"\nBACKFILL original 2026-10-17 eight odds: 36 races / 471 horses, L2.1 relevant ticket quotes: {v['frozen_l21_combinations_with_quotes']}.\n")
              f.write(f"\nL1.75 WIN exact market price matches: {v['same_market_snapshot_races']}/36 races; incompatible price horses: {v['different_market_win_quote_horses']}.\n")
              f.write("\nFrozen L2.1 STANDARD 50, STRICT 26 unchanged. Research source only, no ticket engine or L3.\n")
          PY
      - name: Restore pinned original 2025 ANCHOR geometry and exact frozen L2.1 gate function
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/frozen-l21"
          git -C "$root" show 9655c717333636b5cc931f672e12dbc377e396bc:research/run_l2_all_fixed_odds_band_lenses_v1.py > "$root/original-gate-function.py"
          test -s "$root/original-gate-function.py"
          old="$RUNNER_TEMP/original-2025-geometry"
          mkdir -p "$old"
          git -C "$old" init -q
          git -C "$old" remote add origin https://github.com/pinogame1945-dotcom/KEIBA-ML-.git
          git -C "$old" fetch -q --no-tags --depth 1 --filter=blob:none origin 25540d01c2bca3f070311b2e1bd5f8d48feca71b
          test "$(git -C "$old" rev-parse FETCH_HEAD)" = 25540d01c2bca3f070311b2e1bd5f8d48feca71b
          git -C "$old" show FETCH_HEAD:research/anchor-original-feature-geometry.py > "$old/geometry.py"
          test -s "$old/geometry.py"
          echo "ORIGINAL_UNMODIFIED_GATE_FLAGS_AND_ANCHOR_GEOMETRY_PINNED"
      - name: Audit 471 real frozen gate operand panels against unchanged original flags
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/audit_2026_1017_original_l21_gate_feature_panel_v1.py
          python research/audit_2026_1017_original_l21_gate_feature_panel_v1.py \
            --pure-index "$RUNNER_TEMP/score/index.json" \
            --pure-scores "$RUNNER_TEMP/score/original-2026-1017-36r-471h-ability-risk-anchor.jsonl" \
            --market-index "$RUNNER_TEMP/market/index.json" \
            --market-scores "$RUNNER_TEMP/market/l175-real-market-research-1017.jsonl" \
            --frozen-contract "$RUNNER_TEMP/frozen-l21/contract.json" \
            --original-gate-code "$RUNNER_TEMP/frozen-l21/original-gate-function.py" \
            --original-geometry-code "$RUNNER_TEMP/original-2025-geometry/geometry.py" \
            --output "$RUNNER_TEMP/l21-frozen-50-gate-panel-readonly.json"
          python - <<'PY'
          from pathlib import Path
          import json,os
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"l21-frozen-50-gate-panel-readonly.json").read_text())
          assert x["races"]==36 and x["horses"]==471
          assert x["frozen_standard_rules"]==50 and x["frozen_gate_names_covered"]==14
          assert x["original_gate_feature_values_verified"]==3297
          assert x["original_gate_probe_pairs_no_bets"]==435
          assert x["missing_gate_fields"]==[]
          assert not x["independent_original_asof_certification"]
          assert not x["frozen_l21_ticket_engine_invoked"] and not x["l3_v3_invoked"]
          assert not x["ready_for_betting"]
          print("FROZEN_L21_ALL_14_GATE_NAMES_SOURCE_COMPLETE_36R_471H_NO_BETS")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("### Frozen L2.1 source feature panel\n")
              out.write("Original unmodified gate_flags + original ANCHOR market geometry: 36 races / 471 horses, 7 fields x 471 = 3297 values, frozen 14 gate names, 435 safe schema probe pairs.\n")
              out.write("No ticket selection, L3, release, or source cutoff certification.\n")
          PY
      - name: No paid compute, storage, action artifacts, or 2026 target outcomes
        if: always()
        run: |
          echo "Read-only free public standard CPU. No GPU or paid runner."
          echo "No Kaggle creation, Actions cache/artifact, model recomputation, L2.1 engine or L3."
          echo "No target 2026 outcomes, payouts, or FINAL odds."
