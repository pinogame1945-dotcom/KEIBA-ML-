name: L2 TRIFECTA Odds-Rank Control V1

on:
  push:
    branches:
      - research/l2-trifecta-odds-rank-reverse-v1-20261008
    paths:
      - .github/triggers/l2-trifecta-odds-rank-control-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-trifecta-odds-rank-control-v1
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BACKFILL_SHA: a80f2c1994e10ddcf76efaa996c97147b1223e1f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/run_l2_trifecta_odds_rank_reverse_v1.py research/run_l2_trifecta_odds_rank_control_v1.py research/build_l2_bet_kings_dataset_v1.py
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/l2-trifecta-odds-rank-control-v1.yml").read_text()
          assert "runs-on: ubuntu-latest" in wf
          assert ("/data/daily/"+"2026-") not in wf
          assert ("/data/odds/daily/"+"2026-") not in wf
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload"+"-artifact") for u in uses)
          assert not any(u.startswith("actions/"+"cache") for u in uses)
          print("CONTROL_GUARDS_OK")
          PY
      - name: Install lightweight CPU dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Sparse restore fixed 2021-2025 BACKFILL once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          cat > out/backfill/.git/info/sparse-checkout <<'EOF'
          /data/daily/2021-*.jsonl.gz
          /data/daily/2022-*.jsonl.gz
          /data/daily/2023-*.jsonl.gz
          /data/daily/2024-*.jsonl.gz
          /data/daily/2025-*.jsonl.gz
          /data/odds/daily/2021-*.jsonl.gz
          /data/odds/daily/2022-*.jsonl.gz
          /data/odds/daily/2023-*.jsonl.gz
          /data/odds/daily/2024-*.jsonl.gz
          /data/odds/daily/2025-*.jsonl.gz
          EOF
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"
      - name: Run field-size control audit
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-trifecta-odds-rank-control-v1/run-$GITHUB_RUN_ID"
          python research/run_l2_trifecta_odds_rank_control_v1.py --backfill-root out/backfill --out-dir "$result"
          cat "$result/summary.json"
          cat "$result/percentile-bands.csv"
          head -20 "$result/controlled-effects.csv"
          cat "$result/fieldsize-summary.csv"
          cat "$result/yearly-percentiles.csv"
      - name: Cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner / artifact / cache / Kaggle."
          echo "Raw per-race rows are ephemeral; compact summaries only."
          echo "2026 remains sealed."
      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-trifecta-odds-rank-control-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: archive trifecta odds-rank control v1 run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
