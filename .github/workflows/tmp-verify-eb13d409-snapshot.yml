name: Verify Deep Snapshot eb13d409

on:
  push:
    branches:
      - research/l1-newcomer-specialist-v1-20260928
    paths:
      - .github/triggers/tmp-verify-eb13d409-snapshot.trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      KAGGLE_DATASET_REF: pino1945/keiba-ml-snapshot-eb13d4096519167b
      GENERATION_ID: eb13d4096519167b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check kaggle

      - name: Verify complete deep snapshot by restore
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/kaggle-fetch-snapshot.sh
          bash scripts/kaggle-fetch-snapshot.sh "$GENERATION_ID" all out/deep-restore
          for y in 2019 2020 2021 2022 2023 2024 2025; do
            test -s "out/deep-restore/snapshot-$y.jsonl" || test -s "out/deep-restore/snapshot-$y.jsonl.gz"
          done
          echo "RACE_CLASS_DEEP_SNAPSHOT_COMPLETE generation=$GENERATION_ID"

      - name: Cost guard
        if: always()
        run: |
          echo "Standard ubuntu-latest only."
          echo "No GPU."
          echo "No GitHub Artifact or Cache."
          echo "Read-only Kaggle restore verification."
