  ledger:
    name: ledger
    if: always()
    needs:
      - lane_core4_2025
      - lane_pedigree_legacy_2025
      - lane_condition_2025
      - lane_full_2025
      - lane_light_2025
      - lane_pedigree_v1_2025
      - lane_condition_rc_2025
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fast-forward branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Archive permanent turf absorption walk-forward ledger
        shell: bash
        run: |
          set -euo pipefail
          python research/archive_l1_walkforward_run.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --config research/l1-mixed-train-turf-valid-walkforward-v1.json \
            --out-root research-results/l1-mixed-train-turf-valid-walkforward

      - name: Commit permanent ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research-results/l1-mixed-train-turf-valid-walkforward/MIXED-TRAIN-TURF-VALID-WF-001
          if git diff --cached --quiet; then
            echo "No ledger changes to commit"
            exit 0
          fi
          git commit -m "research: archive MIXED-TRAIN-TURF-VALID-WF-001 run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1

      - name: Ledger cost guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU."
          echo "No GitHub Artifact/Cache."
          echo "Only small text/JSON result ledgers are committed to Git."
          echo "Kaggle snapshot eb13d4096519167b is read-only."
