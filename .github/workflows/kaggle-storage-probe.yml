name: Kaggle Storage Probe

on:
  push:
    branches:
      - research/l1-newcomer-specialist-v1-20260928
    paths:
      - .github/triggers/kaggle-storage-probe.trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check kaggle
      - name: Probe owned dataset list without upload
        shell: bash
        run: |
          set -euo pipefail
          echo "=== JSON DEFAULT ==="
          kaggle datasets list --mine --page 1 --format json || true
          echo "=== JSON SELECT ==="
          kaggle datasets list --mine --page 1 --format "json(ref,totalBytes)" || true
          echo "=== CSV ==="
          kaggle datasets list --mine --page 1 --csv || true
          echo "KAGGLE_STORAGE_PROBE_DONE"
      - name: Cost guard
        if: always()
        run: |
          echo "Standard ubuntu-latest only; no GPU, Artifact, Cache, upload, or dataset creation."
