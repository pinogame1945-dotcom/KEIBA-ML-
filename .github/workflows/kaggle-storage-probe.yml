name: Kaggle Storage Probe

on:
  push:
    branches:
      - research/l1-newcomer-specialist-v1-20260928
    paths:
      - .github/triggers/kaggle-storage-probe.trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check kaggle
      - name: Probe actual owned dataset file sizes without upload
        shell: bash
        run: |
          set -euo pipefail
          refs="$(kaggle datasets list --mine --page 1 --format json | python -c 'import json,sys; print("\n".join(x["ref"] for x in json.load(sys.stdin)))')"
          total=0
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            echo "=== FILES $ref ==="
            out="$(mktemp)"
            kaggle datasets files "$ref" --csv > "$out"
            cat "$out"
            bytes="$(python - "$out" <<'PY'
import csv,sys
p=sys.argv[1]
total=0
with open(p,encoding="utf-8",newline="") as fh:
    for row in csv.DictReader(fh):
        raw=row.get("size") or row.get("totalBytes") or row.get("bytes") or "0"
        try:
            total += int(float(raw))
        except ValueError:
            raise SystemExit(f"unparseable size value: {raw!r}")
print(total)
PY
)"
            echo "DATASET_BYTES $ref $bytes"
            total=$((total + bytes))
          done <<< "$refs"
          echo "OWNED_DATASET_FILE_BYTES=$total"
          echo "KAGGLE_STORAGE_PROBE_DONE"
      - name: Cost guard
        if: always()
        run: |
          echo "Standard ubuntu-latest only; no GPU, Artifact, Cache, upload, or dataset creation."
