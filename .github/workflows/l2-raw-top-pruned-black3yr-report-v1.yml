name: RAW AI Top1 3-Year Black-Only Odds Lines by Pruning Policy

on:
  push:
    branches:
      - research/l2-raw-top-ticket-pruning-oos-20261016
    paths:
      - .github/workflows/l2-raw-top-pruned-black3yr-report-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-raw-top-pruned-black3yr-report-v1
  cancel-in-progress: false

jobs:
  black-only-3yr-postprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout existing research and source reports
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CPU only and existing inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/run_l2_raw_top_pruned_black3yr_report_v1.py
          test -s research-results/l2-raw-top-3040-odds-border-v1/run-38863602506/phase1_all_3040_odds_bands_by_year.csv
          test -s research-results/l2-raw-top-ticket-pruning-oos-v1/run-38866412885/pruning_2024_2025_all_3040_odds_bands_by_year.csv.gz
          python - <<'PY'
          from pathlib import Path
          src=Path(".github/workflows/l2-raw-top-pruned-black3yr-report-v1.yml").read_text()
          assert [s.strip() for s in src.splitlines() if s.strip().startswith("runs-on:")]==["runs-on: ubuntu-latest"]
          actions=[s.strip() for s in src.splitlines() if s.strip().startswith("- uses:")]
          assert not any("upload-artifact" in a or "actions/cache" in a for a in actions)
          print("FREE_CPU_EXISTING_RESULT_TABLES_ONLY_NO_PAID_STORAGE")
          PY
      - name: Extract all 3-year black lines per method and sort by ROI
        shell: bash
        run: |
          set -euo pipefail
          out="research-results/l2-raw-top-pruned-black3yr-report-v1/run-$GITHUB_RUN_ID"
          python -u research/run_l2_raw_top_pruned_black3yr_report_v1.py \
            --baseline research-results/l2-raw-top-3040-odds-border-v1/run-38863602506/phase1_all_3040_odds_bands_by_year.csv \
            --pruned research-results/l2-raw-top-ticket-pruning-oos-v1/run-38866412885/pruning_2024_2025_all_3040_odds_bands_by_year.csv.gz \
            --out-dir "$out"
          for file in summary.json methods_ranked_by_3year_black_only_line_sum_roi.csv all_methods_3year_black_lines_ranked_within_method.csv.gz; do
            test -s "$out/$file"
          done
      - name: Save compact analysis reports to this research branch only
        shell: bash
        run: |
          set -euo pipefail
          out="research-results/l2-raw-top-pruned-black3yr-report-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$out"
          git commit -m "research: black 3-year odds bands ranked per ticket pruning method $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
