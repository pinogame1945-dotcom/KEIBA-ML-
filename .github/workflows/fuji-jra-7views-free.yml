name: Fuji JRA 7 Real Odds Views - Free CPU
on:
  push:
    branches: [audit/fuji-jra-onsale-odds-20261016]
    paths:
      - scripts/fuji_jra_7views_20261016.py
      - .github/workflows/fuji-jra-7views-free.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  odds_7_views:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir beautifulsoup4==4.14.3
      - name: JRA real odds pages seven views (no purchases)
        run: python scripts/fuji_jra_7views_20261016.py
