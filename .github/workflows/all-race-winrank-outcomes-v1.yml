name: All Race Winner Rank Outcomes V1

on:
  push:
    branches:
      - research/all-race-winrank-outcomes-v1-20261015
    paths:
      - .github/triggers/all-race-winrank-outcomes-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: all-race-winrank-outcomes-v1
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static and cost guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/run_all_race_winrank_outcomes_v1.py
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/all-race-winrank-outcomes-v1.yml").read_text()
          assert "runs-on: ubuntu-latest" in wf
          assert "upload-artifact" not in wf
          assert "actions/cache" not in wf
          print("STATIC_AND_COST_GUARDS_OK")
          PY
      - name: Install small dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pandas
      - name: Single-load, parallel-year all-race audit
        shell: bash
        run: |
          set -euo pipefail
          pred="research-results/market-fixed-anchor-residual-v2/run-38659856085/oos-fair-value-predictions.csv.gz"
          test -s "$pred"
          result="research-results/all-race-winrank-outcomes-v1/run-$GITHUB_RUN_ID"
          python research/run_all_race_winrank_outcomes_v1.py --predictions "$pred" --out-dir "$result"
      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only; no GPU or paid runner."
          echo "No Kaggle/network data retrieval; precommitted OOS source read once."
          echo "No actions/cache or upload-artifact; 2026 sealed."
      - name: Commit compact diagnostic results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/all-race-winrank-outcomes-v1/run-$GITHUB_RUN_ID"
          test -s "$result/summary.json"
          test -s "$result/four-outcome-counts.csv"
          test -s "$result/winner-rank-distributions.csv"
          test -s "$result/winner-market-vs-ai-rank.csv"
          test -s "$result/winner-topk-capture.csv"
          test -s "$result/all-race-winner-diagnostics.csv.gz"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: archive all-race winrank outcome run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
