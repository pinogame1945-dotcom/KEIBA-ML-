name: 2026 original ML remaining horse-front 19th numeric from strict-prior STYLE (free CPU)
on:
  push:
    branches: [feature/l1-7king-2026-928-preflight-20261017]
    paths:
      - .github/workflows/l1-2026-1017-original-ml-front19-strict-prior-numeric-freecpu.yml
      - research/audit_2026_original_ml_front19_from_prior_style_v1.py
permissions:
  contents: read
concurrency:
  group: original-2026-1017-ml-front19-strict-prior-readonly
  cancel-in-progress: false
jobs:
  original-bias-last-value:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PINNED_BACKFILL_SOURCE_SHA: 9fe9f1742aa074a84c03a779e1ee949c04f78c0d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Public GitHub free standard CPU, original frozen ML source guard
        shell: bash
        run: |
          set -euo pipefail
          node --check research/audit_2026_10_17_original_style_strict_prior_2026_v1.mjs
          python -m py_compile research/audit_2026_original_ml_front19_from_prior_style_v1.py
          python - <<'PY'
          import json,urllib.request
          u=urllib.request.Request("https://api.github.com/repos/pinogame1945-dotcom/KEIBA-ML-",headers={"User-Agent":"keiba-original-ml-19-bias"})
          assert json.load(urllib.request.urlopen(u,timeout=30))["private"] is False
          print("PUBLIC_STANDARD_GITHUB_FREE_CPU_VERIFIED")
          PY
          python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 pandas==3.0.6
      - name: Read untouched 2025 ML infer_front_score and validate original Git blob
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/original-ml"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/pinogame1945-dotcom/KEIBA-ML-.git
          git -C "$root" fetch -q --no-tags --depth 1 --filter=blob:none origin c782a7e0c6e2f09b2d0603b23336eab31ad5bc77
          test "$(git -C "$root" rev-parse FETCH_HEAD)" = c782a7e0c6e2f09b2d0603b23336eab31ad5bc77
          git -C "$root" show FETCH_HEAD:research/run_l1_sameday_track_bias_v1.py > "$root/original-ml-bias.py"
          test "$(git hash-object "$root/original-ml-bias.py")" = 6b2124558790b317063c1d48e5c3b0ce9b6952e6
          echo "UNTOUCHED_ORIGINAL_ML_INFER_FRONT_SCORE_SOURCE_PINNED"
      - name: Restore pinned 517 strictly prior dated BACKFILL files and original STYLE generator
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pinned-backfill"
          mkdir -p "$root"
          git -C "$root" init -q
          git -C "$root" remote add origin https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git
          git -C "$root" fetch -q --no-tags --depth 1 --filter=blob:none origin "$PINNED_BACKFILL_SOURCE_SHA"
          test "$(git -C "$root" rev-parse FETCH_HEAD)" = "$PINNED_BACKFILL_SOURCE_SHA"
          {
            git -C "$root" ls-tree -r --name-only FETCH_HEAD data/daily | awk '/^data\/daily\/20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]\.jsonl\.gz$/ {if(substr($0,12,10)>="2022-01-01" && substr($0,12,10)<"2026-10-17") print "/" $0}'
            echo '/ml_features/src/historical-extra-builder.mjs'
            echo '/ml_features/contracts/l1-feature-set-contract-v1.json'
            echo '/ml_features/research/live_json_to_daily_pack_v1.py'
            echo '/ml_features/delivery/690/index.json'
            echo '/ml_features/delivery/690/2026-10-17/*'
            echo '/data/live/2026-10-17/*'
          } > "$RUNNER_TEMP/source-prior-sparse.txt"
          test "$(grep -c '^/data/daily/' "$RUNNER_TEMP/source-prior-sparse.txt")" -gt 300
          test "$(grep -c '^/data/daily/2026-' "$RUNNER_TEMP/source-prior-sparse.txt")" -eq 87
          ! grep -q '^/data/daily/2026-10-17' "$RUNNER_TEMP/source-prior-sparse.txt"
          git -C "$root" sparse-checkout set --no-cone --stdin < "$RUNNER_TEMP/source-prior-sparse.txt"
          git -C "$root" checkout -q --detach FETCH_HEAD
          test ! -e "$root/data/daily/2026-10-17.jsonl.gz"
          echo "STRICTLY_PRIOR_DATE_HISTORY_AND_ORIGINAL_STYLE_ENGINE_RESTORED_NO_TARGET_RESULTS"
      - name: Recover original STYLE14 for 36 races and 471 horses once without 690 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pinned-backfill"
          python "$root/ml_features/research/live_json_to_daily_pack_v1.py" \
            --live-dir "$root/data/live/2026-10-17" \
            --output "$RUNNER_TEMP/original-prestart-1017.jsonl.gz"
          node research/audit_2026_10_17_original_style_strict_prior_2026_v1.mjs \
            --pinned-backfill-root "$root" \
            --pre-race-day-pack "$RUNNER_TEMP/original-prestart-1017.jsonl.gz" \
            --out "$RUNNER_TEMP/original-style14-strict-prior-471.jsonl"
          test -s "$RUNNER_TEMP/original-style14-strict-prior-471.jsonl"
          echo "ORIGINAL_STYLE14_PRIOR_DATA_RECOVERED_NO_FAKE_VALUES"
      - name: Recompute 19th genuine original ML bias numerical column on real 471-horse set
        shell: bash
        run: |
          set -euo pipefail
          python research/audit_2026_original_ml_front19_from_prior_style_v1.py \
            --original-ml-bias "$RUNNER_TEMP/original-ml/original-ml-bias.py" \
            --source-style14 "$RUNNER_TEMP/original-style14-strict-prior-471.jsonl" \
            --backfill-690 "$RUNNER_TEMP/pinned-backfill" \
            --output "$RUNNER_TEMP/original-ml-front19-check.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"original-ml-front19-check.json").read_text())
          assert j["races"]==36 and j["horses"]==471
          assert j["numerically_verified_original_ml_horse_front_score"]==471
          assert j["all_19_bias_full_universe_separately_verified"]
          assert not j["full_649_plus_22_numeric_parity_verified"]
          assert not j["entire_690_numeric_parity_certified"]
          assert not j["l21_tickets_generated"] and not j["l3_money_generated"]
          assert not j["ready_for_betting"]
          print("FROZEN_ORIGINAL_ML_19_OF_19_BIAS_INDEPENDENT_REAL_NUMERIC_PARITY_471H")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("Original ML (c782 pinned) infer_front_score compared exactly for 471 genuine 2026-10-17 runners using separate original strictly-prior STYLE14; original prior 18/19 values already verified in Run #39105758197.\n")
            f.write("Full 649+22 independent numeric comparison not claimed; no 2026 target results, no betting outputs, no model promotion.\n")
          PY
      - name: No paid resources, persistence, model changes, payout, L2/L3
        if: always()
        run: |
          echo 'Public standard free CPU; no GPU or paid runners, Artifact, Cache, Kaggle storage.'
          echo 'Frozen original ML/BACKFILL features/code unchanged, no training or target-day outcomes.'
          echo 'Original 690 remains unmodified; no L2.1 ticket purchase or L3 money.'
