name: L2 Combo Template Lab V1

on:
  push:
    branches:
      - research/l2-combo-template-lab-v1-20260929
    paths:
      - .github/triggers/l2-combo-template-lab-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-combo-template-lab-v1
  cancel-in-progress: true

jobs:
  combo-template-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1
      FIXED_LEDGER_DIR: research-results/l15-fixed-v1
      SELECTIONS: research-results/l2-router-arena-v1/run-36511322402/router-selections.csv

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/run_l2_combo_template_lab_v1.py
          test -s "$SELECTIONS"
          python - <<'PY'
          from pathlib import Path
          lines=Path(".github/workflows/l2-combo-template-lab-v1.yml").read_text().splitlines()
          runners=[x.strip().split(":",1)[1].strip() for x in lines if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"], runners
          uses=[x.strip().split(":",1)[1].strip() for x in lines if x.strip().startswith("uses:")]
          forbidden=[u for u in uses if u.startswith("actions/cache") or u.startswith("actions/upload-artifact")]
          assert not forbidden, forbidden
          print("COMBO_LAB_GUARDS_OK")
          PY

      - name: Install Kaggle client
        run: python -m pip install --disable-pip-version-check kaggle

      - name: Restore 2024-2025 seven-king routers only
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/kaggle-fetch-router-years.sh "2024,2025" out/l2-combo/router
          for y in 2024 2025; do
            p="$(find "out/l2-combo/router/$y" -type f \( -name 'router-7k.jsonl' -o -name 'router-7k.jsonl.gz' \) -print -quit)"
            test -n "$p"; test -s "$p"
            echo "ROUTER_$y=$p" >> "$GITHUB_ENV"
          done

      - name: Extract selected dates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l2-combo
          python - <<'PY'
          import csv
          from pathlib import Path
          dates=set()
          with open("research-results/l2-router-arena-v1/run-36511322402/router-selections.csv",newline="",encoding="utf-8-sig") as f:
              for r in csv.DictReader(f):
                  if r["router"]!="DIRECT_BET_TYPE": continue
                  if int(float(r["test_year"])) not in (2024,2025): continue
                  if r["bet_type"] not in ("EXACTA","TRIFECTA"): continue
                  dates.add(r["race_date"][:10])
          Path("out/l2-combo/dates.txt").write_text("\n".join(sorted(dates))+"\n",encoding="utf-8")
          print("SELECTED_DATES",len(dates))
          PY

      - name: Sparse restore selected race results
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          {
            echo "/data/manifest.json"
            while IFS= read -r d; do
              [[ -n "$d" ]] || continue
              echo "/data/daily/$d.jsonl.gz"
            done < out/l2-combo/dates.txt
          } > out/backfill/.git/info/sparse-checkout
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Run template lab
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-combo-template-lab-v1/run-$GITHUB_RUN_ID"
          python research/run_l2_combo_template_lab_v1.py \
            --selections "$SELECTIONS" \
            --fixed-ledger-dir "$FIXED_LEDGER_DIR" \
            --router-year "2024:$ROUTER_2024" \
            --router-year "2025:$ROUTER_2025" \
            --backfill-root out/backfill \
            --out-dir "$result"
          cat "$result/summary.json"
          echo "===== STABILITY TOP ====="
          python - <<'PY'
          import csv,os
          p=f"research-results/l2-combo-template-lab-v1/run-{os.environ['GITHUB_RUN_ID']}/template-stability.csv"
          rows=list(csv.DictReader(open(p,encoding="utf-8")))
          rows.sort(key=lambda r:(r["bet_type"],-float(r["min_year_roi_pct"]),-float(r["combined_profit_yen"])))
          for r in rows[:30]: print(r)
          PY

      - name: Cost guard
        if: always()
        run: |
          echo "Standard ubuntu-latest CPU only."
          echo "No GPU / paid runner / Artifact / Cache."
          echo "Only selected 2024-2025 result days restored."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-combo-template-lab-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: archive combo template lab run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
