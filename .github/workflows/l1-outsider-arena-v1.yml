  backfill_2025:
    name: backfill-2025
    needs: backfill_2024
    uses: ./.github/workflows/l1-outsider-score-one-v1.yml
    with:
      candidate: outsider_backfill
      validation_year: 2025
      start_delay_seconds: 0
    secrets:
