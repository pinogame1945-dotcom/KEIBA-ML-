name: "research: validate L1.5 legacy frozen ANCHOR v1"

on:
  workflow_dispatch:
  push:
    branches:
      - research/l15-legacy-frozen-v1-anchor-20260929
    paths:
      - research/legacy_frozen/l15_legacy_frozen_v1_anchor.json
      - research/verify_l15_legacy_frozen_anchor_v1.py
      - .github/workflows/research-l15-legacy-frozen-anchor-v1.yml

permissions:
  contents: read

jobs:
  validate-frozen-anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      FROZEN_DATASET: pino1945/keiba-l15-council-router-v3-anchor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cost guard
        run: |
          set -euo pipefail
          echo "standard_cpu_runner=ubuntu-latest"
          echo "new_paid_storage=disabled"
          echo "artifact_upload=disabled"
          echo "dataset_upload=disabled"

      - name: Syntax check
        run: |
          set -euo pipefail
          python -m py_compile research/verify_l15_legacy_frozen_anchor_v1.py
          python -m json.tool research/legacy_frozen/l15_legacy_frozen_v1_anchor.json >/dev/null

      - name: Install Kaggle client
        run: python -m pip install --disable-pip-version-check kaggle

      - name: Restore frozen historical output
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "::error::KAGGLE_API_TOKEN is not configured"; exit 1; }
          mkdir -p out/legacy-frozen-anchor
          kaggle datasets download "$FROZEN_DATASET"             -p out/legacy-frozen-anchor             --unzip --quiet --force
          summary="$(find out/legacy-frozen-anchor -type f -name summary.json -print -quit)"
          test -n "$summary" || { echo "::error::summary.json not found in frozen dataset"; exit 1; }
          echo "summary=$summary" >> "$GITHUB_ENV"

      - name: Verify frozen baseline
        run: |
          set -euo pipefail
          python research/verify_l15_legacy_frozen_anchor_v1.py             --summary "$summary"             --manifest research/legacy_frozen/l15_legacy_frozen_v1_anchor.json
