name: L2 TRIFECTA Full-Field Ability V2

on:
  push:
    branches:
      - research/l2-trifecta-fullfield-ability-v2-20260930
    paths:
      - .github/triggers/l2-trifecta-fullfield-ability-v2.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-trifecta-fullfield-ability-v2
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/materialize_l17_seven_king_fullfield_v1.py             research/build_l2_bet_kings_dataset_v1.py             research/run_l2_trifecta_fullfield_ability_v2.py
          bash -n scripts/kaggle-dataset-session-v2.sh
          bash -n scripts/rebuild-seven-score-local-v1.sh
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.load(open("contracts/l2-trifecta-fullfield-ability-v2.json",encoding="utf-8"))
          assert c["contract"]=="L2_TRIFECTA_FULLFIELD_ABILITY_V2"
          assert c["development_years"]==[2023,2024]
          assert c["holdout_year"]==2025
          assert c["locked_years"]==[2026]
          assert c["candidate_universe"]["top6_limit"] is False
          assert c["candidate_universe"]["positive_odds_completeness_required"] is False
          assert c["modes"]["PURE"]["market_dependency"] is False
          assert c["invariants"]["payout_as_model_feature"] is False
          assert c["invariants"]["odds_as_model_feature"] is False
          assert c["invariants"]["holdout_used_for_policy_selection"] is False
          assert c["invariants"]["2026_used"] is False
          cost=c["cost"]
          assert cost["standard_github_cpu_only"] is True
          for k in ("gpu","paid_runner","github_artifact","github_cache","persistent_kaggle_upload"):
              assert cost[k] is False,(k,cost[k])
          wf=Path(".github/workflows/l2-trifecta-fullfield-ability-v2.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses),uses
          assert not any(u.startswith("actions/cache") for u in uses),uses
          print("ABILITY_V2_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore seven horse-level score tables metadata-first
        shell: bash
        run: |
          set -euo pipefail
          session_script="scripts/kaggle-dataset-session-v2.sh"
          rebuild_script="scripts/rebuild-seven-score-local-v1.sh"
          for y in 2022 2023 2024 2025; do
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              d="out/ability-v2/scores/$y/$alias"
              ref="pino1945/keiba-l15-7k-$alias-y$y-v1"
              mkdir -p "$d"
              set +e
              bash "$session_script" init "$ref" "$d"
              rc=$?
              if [[ "$rc" -eq 0 ]]; then
                bash "$session_script" fetch "$d" score.jsonl
                rc=$?
              fi
              set -e
              if [[ "$rc" -eq 44 ]]; then
                echo "::warning::score metadata drift; no alternate filename guessing. rebuild locally year=$y alias=$alias"
                rm -f "$d/score.jsonl" "$d/score.jsonl.gz"
                bash "$rebuild_script" "$alias" "$y" "$d"
              elif [[ "$rc" -ne 0 ]]; then
                echo "::error::score restore failed year=$y alias=$alias rc=$rc"
                exit "$rc"
              fi
              p="$(find "$d" -maxdepth 1 -type f \( -name 'score.jsonl.gz' -o -name 'score.jsonl' \) -print -quit)"
              test -n "$p"; test -s "$p"
            done
          done

      - name: Materialize leak-safe L1.7 full-field consensus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/ability-v2/l17
          for y in 2022 2023 2024 2025; do
            args=()
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              p="$(find "out/ability-v2/scores/$y/$alias" -type f \( -name 'score.jsonl.gz' -o -name 'score.jsonl' \) -print -quit)"
              test -n "$p"; test -s "$p"
              args+=(--expert "$alias=$p")
            done
            python research/materialize_l17_seven_king_fullfield_v1.py               --year "$y" "${args[@]}"               --output "out/ability-v2/l17/l17-$y.jsonl.gz"
            echo "L17_$y=out/ability-v2/l17/l17-$y.jsonl.gz" >> "$GITHUB_ENV"
          done

      - name: Sparse restore fixed BACKFILL
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          cat > out/backfill/.git/info/sparse-checkout <<'EOF'
          /data/daily/2022-*.jsonl.gz
          /data/daily/2023-*.jsonl.gz
          /data/daily/2024-*.jsonl.gz
          /data/daily/2025-*.jsonl.gz
          /data/odds/daily/2022-*.jsonl.gz
          /data/odds/daily/2023-*.jsonl.gz
          /data/odds/daily/2024-*.jsonl.gz
          EOF
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Run corrected full-field reevaluation
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-trifecta-fullfield-ability-v2/run-$GITHUB_RUN_ID"
          python research/run_l2_trifecta_fullfield_ability_v2.py             --l17-year "2022:$L17_2022"             --l17-year "2023:$L17_2023"             --l17-year "2024:$L17_2024"             --l17-year "2025:$L17_2025"             --backfill-root out/backfill             --out-dir "$result"
          echo "===== SUMMARY ====="
          cat "$result/summary.json"
          echo "===== DEV COMPAT ====="
          cat "$result/dev-compat-topn.csv"
          echo "===== DEV PURE ====="
          cat "$result/dev-pure-topn.csv"
          echo "===== YEARLY ====="
          cat "$result/economics-yearly.csv"

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner / cache / artifact."
          echo "Existing Kaggle inputs are read-only; no persistence."
          echo "No paid storage."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-trifecta-fullfield-ability-v2/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add             "$result/README.md"             "$result/summary.json"             "$result/model-folds.csv"             "$result/economics-yearly.csv"             "$result/dev-compat-topn.csv"             "$result/dev-pure-topn.csv"             "$result/combined-compat.csv"             "$result/combined-pure.csv"             "$result/feature-importance.csv"
          git commit -m "research: archive corrected full-field ability v2 run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
