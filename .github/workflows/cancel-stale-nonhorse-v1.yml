name: Cancel Stale Nonhorse Run

on:
  push:
    branches:
      - research/l1-outsider-nonhorse-v1-20260928
    paths:
      - .github/triggers/cancel-stale-nonhorse-v1.trigger

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale nonhorse run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: "36395614289"
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/body -w '%{http_code}'             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/force-cancel")"
          cat /tmp/body || true
          if [[ "$code" != "202" && "$code" != "409" ]]; then
            echo "::error::cancel request failed HTTP $code"
            exit 1
          fi
          echo "Force-cancel request accepted/already terminal: HTTP $code"
