name: Fuji Oct16 1904 JRA Official Odds Sale Probe - Free CPU
on:
  push:
    branches: [audit/fuji-odds-on-sale-20261016-1904]
    paths:
      - scripts/fuji_onsale_jra_deep_probe_20261016.py
      - .github/workflows/fuji-onsale-jra-probe-free.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --no-cache-dir beautifulsoup4==4.14.3
      - name: Inspect real official odds POST landing DOM after 18:30 JST
        run: python scripts/fuji_onsale_jra_deep_probe_20261016.py
