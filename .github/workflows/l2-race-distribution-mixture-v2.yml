name: L2 Race Distribution Mixture V2

on:
  push:
    branches:
      - research/l2-race-distribution-mixture-v2-20261004
    paths:
      - .github/triggers/l2-race-distribution-mixture-v2.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-race-distribution-mixture-v2
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/materialize_l17_seven_king_fullfield_v1.py \
            research/extract_l2_core_dates_v1.py \
            research/build_l2_core_v1_dataset.py \
            research/run_l2_core_v1.py \
            research/run_l2_race_distribution_mixture_v2.py \
            research/build_l2_bet_kings_dataset_v1.py
          bash -n scripts/kaggle-dataset-session-v2.sh
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.load(open("contracts/l2-race-distribution-mixture-v2.json",encoding="utf-8"))
          assert c["contract"]=="L2_RACE_DISTRIBUTION_MIXTURE_V2"
          assert c["cost_policy"]["github_standard_cpu_only"] is True
          assert c["cost_policy"]["gpu"] is False
          assert c["cost_policy"]["paid_artifact_or_cache"] is False
          assert c["evaluation"]["no_roi_selection"] is True
          assert c["data_policy"]["locked_years"]==[2026]
          src=Path("research/run_l2_race_distribution_mixture_v2.py").read_text()
          for token in (
              'FOLDS=((2023,(2022,)),(2024,(2022,2023)),(2025,(2022,2023,2024)))',
              'COLLAPSE_FACTORS=(0.10,0.25,0.50,0.75,1.00)',
              'OUTSIDER_BOOSTS=(0.0,0.5,1.0,2.0,4.0)',
              '"roi_optimized":False',
              '"2026_locked":True',
          ):
              assert token in src,token
          assert "edge_threshold" not in src
          wf=Path(".github/workflows/l2-race-distribution-mixture-v2.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses)
          assert not any(u.startswith("actions/cache") for u in uses)
          print("L2_RACE_DISTRIBUTION_MIXTURE_STATIC_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Probability engine unit checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research python - <<'PY'
          from run_l2_race_distribution_mixture_v2 import weights,mix_ticket_probability
          from run_l2_core_v1 import probability_invariant
          worlds={
              "NORMAL":{1:0.4,2:0.3,3:0.2,4:0.1},
              "COLLAPSE":{1:0.2,2:0.4,3:0.25,4:0.15},
              "OUTSIDER":{1:0.35,2:0.25,3:0.15,4:0.25},
              "BOTH":{1:0.15,2:0.35,3:0.20,4:0.30},
          }
          w=weights(0.3,0.2)
          assert abs(sum(w.values())-1.0)<1e-12
          for p in worlds.values():
              assert probability_invariant(p)<1e-12
          q=sum(mix_ticket_probability("WIN",(n,),worlds,w) for n in (1,2,3,4))
          assert abs(q-1.0)<1e-12,q
          print("L2_RACE_DISTRIBUTION_MIXTURE_UNIT_OK")
          PY

      - name: Restore seven horse-level score tables metadata-first
        shell: bash
        run: |
          set -euo pipefail
          session="scripts/kaggle-dataset-session-v2.sh"
          for y in 2022 2023 2024 2025; do
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              d="out/l2-mixture/scores/$y/$alias"
              ref="pino1945/keiba-l15-7k-$alias-y$y-v1"
              bash "$session" init "$ref" "$d"
              bash "$session" fetch "$d" score.jsonl
              p="$(find "$d" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
              test -n "$p"; test -s "$p"
              echo "SCORE_OK year=$y alias=$alias path=$p"
            done
          done

      - name: Restore frozen safe Outsider ballots once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l2-mixture/ballots
          git fetch --depth=1 origin research/l16-outsider-support-safe-v1-20260930:refs/remotes/origin/mixture-outsider-source
          for y in 2022 2023 2024 2025; do
            git show "origin/mixture-outsider-source:research-results/l16-outsider-support-safe-fast-v2/run-36724124925/y$y/ballots.csv.gz" > "out/l2-mixture/ballots/y$y.csv.gz"
            test -s "out/l2-mixture/ballots/y$y.csv.gz"
          done

      - name: Materialize L1.7 full-field once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l2-mixture/l17
          for y in 2022 2023 2024 2025; do
            args=()
            for spec in \
              core4_no_pedigree=core4 \
              no_auto_full_pedigree_legacy=pedlegacy \
              jockey_trainer_condition=condition \
              no_auto_full=full \
              no_auto_jockey=light \
              no_auto_full_pedigree_v1=pedv1 \
              jockey_trainer_condition_plus_raceclass=condrc; do
              name="${spec%%=*}"; alias="${spec##*=}"
              p="$(find "out/l2-mixture/scores/$y/$alias" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
              args+=(--expert "$name=$p")
            done
            p="out/l2-mixture/l17/l17-$y.jsonl.gz"
            python research/materialize_l17_seven_king_fullfield_v1.py --year "$y" "${args[@]}" --output "$p"
            test -s "$p"
            echo "L17_$y=$p" >> "$GITHUB_ENV"
          done

      - name: Resolve exact race dates
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for y in 2022 2023 2024 2025; do
            p="$(find "out/l2-mixture/scores/$y/core4" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
            args+=(--score-year "$y:$p")
          done
          python research/extract_l2_core_dates_v1.py "${args[@]}" \
            --dates-out out/l2-mixture/all-dates.txt \
            --race-dates-out out/l2-mixture/race-dates.csv

      - name: Sparse restore exact race and odds packs once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          {
            while IFS= read -r d; do
              [[ -n "$d" ]] || continue
              echo "/data/daily/$d.jsonl.gz"
              echo "/data/odds/daily/$d.jsonl.gz"
            done < out/l2-mixture/all-dates.txt
          } > out/backfill/.git/info/sparse-checkout
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Build shared L1.7 horse dataset once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/l2-mixture/dataset
          python research/build_l2_core_v1_dataset.py \
            --l17-year "2022:$L17_2022" \
            --l17-year "2023:$L17_2023" \
            --l17-year "2024:$L17_2024" \
            --l17-year "2025:$L17_2025" \
            --race-dates out/l2-mixture/race-dates.csv \
            --backfill-root out/backfill \
            --out-dir out/l2-mixture/dataset
          cat out/l2-mixture/dataset/manifest.json

      - name: Run walk-forward mixture distribution engine
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-race-distribution-mixture-v2/run-$GITHUB_RUN_ID"
          PYTHONPATH=research python research/run_l2_race_distribution_mixture_v2.py \
            --contract contracts/l2-race-distribution-mixture-v2.json \
            --dataset-dir out/l2-mixture/dataset \
            --ballots-year "2022:out/l2-mixture/ballots/y2022.csv.gz" \
            --ballots-year "2023:out/l2-mixture/ballots/y2023.csv.gz" \
            --ballots-year "2024:out/l2-mixture/ballots/y2024.csv.gz" \
            --ballots-year "2025:out/l2-mixture/ballots/y2025.csv.gz" \
            --backfill-root out/backfill \
            --out-dir "$result"
          echo "===== FOLD METRICS ====="
          cat "$result/fold-metrics.csv"
          echo "===== GATE METRICS ====="
          cat "$result/gate-metrics.csv"
          echo "===== TICKET CALIBRATION ====="
          cat "$result/ticket-calibration-ab.csv"
          echo "===== SCENARIO DIAGNOSTICS ====="
          cat "$result/scenario-diagnostics.csv"
          echo "===== RESULT SIZE ====="
          du -sh "$result"
          test "$(du -sm "$result" | cut -f1)" -le 30

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner / paid cloud compute."
          echo "No actions/cache or upload-artifact."
          echo "Kaggle seven-score datasets are read-only and metadata-resolved."
          echo "No Kaggle writes."
          echo "Frozen Outsider ballots restored from git once and reused."
          echo "BACKFILL packs restored once and reused."
          echo "No ROI optimization, ticket selection, or stake optimization."
          echo "Odds price values are ignored by the probability model."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-race-distribution-mixture-v2/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add \
            "$result/README.md" \
            "$result/summary.json" \
            "$result/fold-metrics.csv" \
            "$result/gate-metrics.csv" \
            "$result/scenario-parameter-grid.csv" \
            "$result/ticket-calibration-ab.csv" \
            "$result/scenario-diagnostics.csv" \
            "$result/race-world-weights.csv.gz"
          git commit -m "research: archive L2 race distribution mixture V2 $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
