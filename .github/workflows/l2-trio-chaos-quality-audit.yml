name: L2 TRIO CHAOS Quality Audit

on:
  push:
    branches:
      - research/l2-trio-chaos-quality-audit-20261004
    paths:
      - .github/triggers/l2-trio-chaos-quality-audit.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1
      V4_SOURCE_BRANCH: research/l2-trio-split-residual-v4-20261004

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static and cost guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/materialize_l17_seven_king_fullfield_v1.py             research/extract_l2_core_dates_v1.py             research/build_l2_bet_kings_dataset_v1.py             research/analyze_l2_trio_chaos_quality.py
          bash -n scripts/kaggle-dataset-session-v2.sh
          python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/l2-trio-chaos-quality-audit.yml').read_text()
          runners=[x.strip().split(':',1)[1].strip() for x in wf.splitlines() if x.strip().startswith('runs-on:')]
          assert runners==['ubuntu-latest']
          uses=[x.strip().split(':',1)[1].strip() for x in wf.splitlines() if x.strip().startswith('- uses:')]
          assert not any(u.startswith('actions/upload-artifact') for u in uses)
          assert not any(u.startswith('actions/cache') for u in uses)
          print('CHAOS_QUALITY_GUARD_OK')
          PY

      - name: Install standard CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore seven scores metadata-first
        shell: bash
        run: |
          set -euo pipefail
          session='scripts/kaggle-dataset-session-v2.sh'
          for y in 2023 2024 2025; do
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              d="out/chaosq/scores/$y/$alias"
              ref="pino1945/keiba-l15-7k-$alias-y$y-v1"
              bash "$session" init "$ref" "$d"
              bash "$session" fetch "$d" score.jsonl
            done
          done

      - name: Materialize L1.7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/chaosq/l17
          for y in 2023 2024 2025; do
            args=()
            for spec in               core4_no_pedigree=core4               no_auto_full_pedigree_legacy=pedlegacy               jockey_trainer_condition=condition               no_auto_full=full               no_auto_jockey=light               no_auto_full_pedigree_v1=pedv1               jockey_trainer_condition_plus_raceclass=condrc; do
              name="${spec%%=*}"; alias="${spec##*=}"
              p="$(find "out/chaosq/scores/$y/$alias" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
              args+=(--expert "$name=$p")
            done
            p="out/chaosq/l17/l17-$y.jsonl.gz"
            python research/materialize_l17_seven_king_fullfield_v1.py --year "$y" "${args[@]}" --output "$p"
            echo "L17_$y=$p" >> "$GITHUB_ENV"
          done

      - name: Restore V4 labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/chaosq/labels
          git fetch --depth=1 origin "$V4_SOURCE_BRANCH":refs/remotes/origin/chaosq-v4
          git show "origin/chaosq-v4:research-results/l2-trio-split-residual-v4/run-37146919444/race-diagnostics.csv.gz" > out/chaosq/labels/v4.csv.gz
          test -s out/chaosq/labels/v4.csv.gz

      - name: Resolve exact dates
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for y in 2023 2024 2025; do
            p="$(find "out/chaosq/scores/$y/core4" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
            args+=(--score-year "$y:$p")
          done
          python research/extract_l2_core_dates_v1.py "${args[@]}"             --dates-out out/chaosq/all-dates.txt             --race-dates-out out/chaosq/race-dates.csv

      - name: Sparse restore result and odds packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git init out/backfill
          git -C out/backfill remote add origin https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git
          git -C out/backfill sparse-checkout init --no-cone
          {
            while IFS= read -r d; do
              [[ -n "$d" ]] || continue
              echo "/data/daily/$d.jsonl.gz"
              echo "/data/odds/daily/$d.jsonl.gz"
            done < out/chaosq/all-dates.txt
          } > out/backfill/.git/info/sparse-checkout
          git -C out/backfill fetch --filter=blob:none --depth=1 origin "$BACKFILL_SHA"
          git -C out/backfill checkout --detach FETCH_HEAD

      - name: Analyze CHAOS quality
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-trio-chaos-quality-audit/run-$GITHUB_RUN_ID"
          PYTHONPATH=research python research/analyze_l2_trio_chaos_quality.py             --l17-year "2023:$L17_2023"             --l17-year "2024:$L17_2024"             --l17-year "2025:$L17_2025"             --race-dates out/chaosq/race-dates.csv             --backfill-root out/backfill             --v4-diagnostics out/chaosq/labels/v4.csv.gz             --out-dir "$result"
          cat "$result/summary.json"
          cat "$result/summary-table.csv"
          du -sh "$result"

      - name: Commit compact audit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-trio-chaos-quality-audit/run-$GITHUB_RUN_ID"
          git config user.name 'keiba-ml-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result/summary.json" "$result/summary-table.csv" "$result/race-patterns.csv.gz"
          git commit -m "research: archive CHAOS quality audit $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Cost guard
        if: always()
        run: |
          echo 'Standard ubuntu-latest CPU only.'
          echo 'No GPU, paid runner, artifact, cache, or cloud resource.'
