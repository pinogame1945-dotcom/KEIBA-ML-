name: L2 L1.7 Full-Field A-B V1

on:
  push:
    branches:
      - research/l2-l17-fullfield-ab-v1-20260929
    paths:
      - .github/triggers/l2-l17-fullfield-ab-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-l17-fullfield-ab-v1
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1
      FIXED_LEDGER_DIR: research-results/l15-fixed-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/materialize_l17_seven_king_fullfield_v1.py research/build_l2_bet_kings_dataset_v1.py research/build_l2_l17_fullfield_dataset_v1.py research/run_l2_normal_router_v1.py research/run_l2_l17_fullfield_ab_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.load(open("contracts/l2-l17-fullfield-ab-v1.json",encoding="utf-8"))
          assert c["contract"]=="L2_L17_FULLFIELD_AB_V1"
          assert set(c["arms"])=={"OLD_V1","L17_INFO_ONLY","L17_FULLFIELD"}
          inv=c["invariants"]
          for k in ("odds_as_model_feature","popularity_as_model_feature","payout_as_model_feature","result_as_model_feature","outsider_used","gate_used_in_l17","race_filtering","skip_class"):
              assert inv[k] is False,(k,inv[k])
          assert inv["force_route_every_normal_race"] is True
          assert inv["same_direct_template_hyperparameters"] is True
          assert c["locked_years"]==[2026]
          assert c["cost"]["standard_github_cpu_only"] is True
          assert c["cost"]["gpu"] is False
          assert c["cost"]["github_artifact"] is False
          assert c["cost"]["github_cache"] is False
          assert c["cost"]["kaggle_existing_datasets_read_only"] is True
          assert c["cost"]["persistent_kaggle_upload"] is False
          wf=Path(".github/workflows/l2-l17-fullfield-ab-v1.yml").read_text()
          assert "runs-on: ubuntu-latest" in wf
          assert "actions/upload-artifact" not in wf
          assert "actions/cache" not in wf
          assert "persist_exact_kaggle" not in wf
          print("L2_L17_FULLFIELD_AB_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore old Seven-King routers
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/kaggle-fetch-router-years.sh "2022,2023,2024,2025" out/l17-ab/router
          for y in 2022 2023 2024 2025; do
            p="$(find "out/l17-ab/router/$y" -type f \( -name 'router-7k.jsonl' -o -name 'router-7k.jsonl.gz' \) -print -quit)"
            test -n "$p"; test -s "$p"
            echo "ROUTER_$y=$p" >> "$GITHUB_ENV"
          done

      - name: Restore persisted seven horse-level score tables read-only
        shell: bash
        run: |
          set -euo pipefail
          retry_download() {
            local ref="$1" dest="$2" attempt delay log p
            log="$(mktemp)"
            for attempt in 1 2 3 4 5 6 7 8; do
              rm -rf "$dest"; mkdir -p "$dest"; : > "$log"
              if kaggle datasets download "$ref" -f score.jsonl.gz -p "$dest" --unzip --quiet --force >"$log" 2>&1; then
                cat "$log"
                p="$(find "$dest" -type f \( -name 'score.jsonl.gz' -o -name 'score.jsonl' \) -print -quit)"
                if [[ -n "$p" && -s "$p" ]]; then rm -f "$log"; return 0; fi
              fi
              cat "$log" >&2
              if [[ "$attempt" -eq 8 ]]; then
                echo "::error::score restore failed ref=$ref"
                rm -f "$log"; return 1
              fi
              case "$attempt" in
                1) delay=10;; 2) delay=20;; 3) delay=40;; 4) delay=60;; 5) delay=90;; *) delay=120;;
              esac
              echo "::warning::retry score restore ref=$ref attempt=$attempt/8 sleep=$delay"
              sleep "$delay"
            done
          }

          for y in 2022 2023 2024 2025; do
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              d="out/l17-ab/scores/$y/$alias"
              ref="pino1945/keiba-l15-7k-$alias-y$y-v1"
              retry_download "$ref" "$d"
              p="$(find "$d" -type f \( -name 'score.jsonl.gz' -o -name 'score.jsonl' \) -print -quit)"
              test -n "$p"; test -s "$p"
              sleep 2
            done
          done

      - name: Materialize leak-safe L1.7 full-field consensus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l17-ab/l17
          for y in 2022 2023 2024 2025; do
            args=()
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              p="$(find "out/l17-ab/scores/$y/$alias" -type f \( -name 'score.jsonl.gz' -o -name 'score.jsonl' \) -print -quit)"
              test -n "$p"; test -s "$p"
              args+=(--expert "$alias=$p")
            done
            python research/materialize_l17_seven_king_fullfield_v1.py --year "$y" "${args[@]}" --output "out/l17-ab/l17/l17-$y.jsonl.gz"
            test -s "out/l17-ab/l17/l17-$y.jsonl.gz"
            echo "L17_$y=out/l17-ab/l17/l17-$y.jsonl.gz" >> "$GITHUB_ENV"
          done

      - name: Resolve race dates
        shell: bash
        run: |
          set -euo pipefail
          python research/extract_l2_bet_kings_dates_v1.py --router-year "2022:$ROUTER_2022" --router-year "2023:$ROUTER_2023" --router-year "2024:$ROUTER_2024" --router-year "2025:$ROUTER_2025" --dates-out out/l17-ab/all-dates.txt --race-dates-out out/l17-ab/all-race-dates.csv

      - name: Sparse restore race and market packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          {
            echo "/data/manifest.json"
            echo "/data/odds/manifest.json"
            while IFS= read -r d; do
              [[ -n "$d" ]] || continue
              echo "/data/daily/$d.jsonl.gz"
              echo "/data/odds/daily/$d.jsonl.gz"
            done < out/l17-ab/all-dates.txt
          } > out/backfill/.git/info/sparse-checkout
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Build old normal ticket universe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/l17-ab/old-dataset
          python research/build_l2_bet_kings_dataset_v1.py --fixed-ledger-dir "$FIXED_LEDGER_DIR" --router-year "2022:$ROUTER_2022" --router-year "2023:$ROUTER_2023" --router-year "2024:$ROUTER_2024" --router-year "2025:$ROUTER_2025" --backfill-root out/backfill --out-dir out/l17-ab/old-dataset

      - name: Build L1.7 full-field ticket universe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/l17-ab/full-dataset
          python research/build_l2_l17_fullfield_dataset_v1.py --fixed-ledger-dir "$FIXED_LEDGER_DIR" --router-year "2022:$ROUTER_2022" --router-year "2023:$ROUTER_2023" --router-year "2024:$ROUTER_2024" --router-year "2025:$ROUTER_2025" --l17-year "2022:$L17_2022" --l17-year "2023:$L17_2023" --l17-year "2024:$L17_2024" --l17-year "2025:$L17_2025" --backfill-root out/backfill --out-dir out/l17-ab/full-dataset

      - name: Run three-arm comparison
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-l17-fullfield-ab-v1/run-$GITHUB_RUN_ID"
          python research/run_l2_l17_fullfield_ab_v1.py --contract contracts/l2-l17-fullfield-ab-v1.json --fixed-ledger-dir "$FIXED_LEDGER_DIR" --router-year "2022:$ROUTER_2022" --router-year "2023:$ROUTER_2023" --router-year "2024:$ROUTER_2024" --router-year "2025:$ROUTER_2025" --l17-year "2022:$L17_2022" --l17-year "2023:$L17_2023" --l17-year "2024:$L17_2024" --l17-year "2025:$L17_2025" --old-dataset-dir out/l17-ab/old-dataset --fullfield-dataset-dir out/l17-ab/full-dataset --backfill-root out/backfill --v1-metrics research-results/l2-normal-router-v1/run-36528381682/router-metrics.csv --out-dir "$result"
          echo "===== METRICS ====="
          cat "$result/metrics.csv"
          echo "===== COMPARE VS OLD ====="
          cat "$result/comparison-vs-old.csv"
          echo "===== CANDIDATE COVERAGE ====="
          cat "$result/candidate-coverage.csv"

      - name: Cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner."
          echo "No actions/cache and no upload-artifact."
          echo "Existing Kaggle score/router datasets are downloaded read-only."
          echo "No Kaggle dataset/model persistence in this workflow."
          echo "L1.7 and ticket matrices stay ephemeral on the runner."
          echo "Only compact CSV/JSON/README and compressed decisions are committed."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-l17-fullfield-ab-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result/README.md" "$result/summary.json" "$result/metrics.csv" "$result/comparison-vs-old.csv" "$result/fold-status.csv" "$result/candidate-coverage.csv" "$result/route-decisions.csv.gz"
          git commit -m "research: archive L1.7 full-field L2 A-B run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
