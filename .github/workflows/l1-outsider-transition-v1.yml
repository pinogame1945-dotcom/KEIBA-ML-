name: L1 Outsider Transition Arena V1

on:
  push:
    branches:
      - research/l1-outsider-transition-v1-20260929
    paths:
      - .github/triggers/l1-outsider-transition-v1.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l1-outsider-transition-v1
  cancel-in-progress: true

jobs:
  candidate:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - candidate: outsider_rotation
            label: rotation
            delay: 0
          - candidate: outsider_classmove
            label: classmove
            delay: 45
          - candidate: outsider_weightchange
            label: weightchange
            delay: 90
          - candidate: outsider_bodychange
            label: bodychange
            delay: 135
          - candidate: outsider_disttransition
            label: disttransition
            delay: 180
          - candidate: outsider_coursetransition
            label: coursetransition
            delay: 225
          - candidate: outsider_opponentgap
            label: opponentgap
            delay: 270
    uses: ./.github/workflows/l1-outsider-transition-incremental-v1.yml
    with:
      candidate: ${{ matrix.candidate }}
      start_delay_seconds: ${{ matrix.delay }}
    secrets:
      KEIBA_ML_SNAPSHOTS: ${{ secrets.KEIBA_ML_SNAPSHOTS }}

  ledger:
    name: ledger
    needs:
      - candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - run: git pull --ff-only origin "$GITHUB_REF_NAME"
      - run: |
          python research/archive_l1_outsider_arena_v1.py             --repo "$GITHUB_REPOSITORY"             --run-id "$GITHUB_RUN_ID"             --config research/l1-outsider-transition-v1.json             --out-root research-results/l1-outsider-transition-v1
      - run: |
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research-results/l1-outsider-transition-v1/OUTSIDER-TRANSITION-001
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: archive transition outsider run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1
