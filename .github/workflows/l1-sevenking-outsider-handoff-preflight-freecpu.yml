name: L1 seven-king and Outsider input handoff preflight (free CPU)
on:
  push:
    branches: [feature/l1-sevenking-outsider-handoff-preflight-20261017]
    paths:
      - research/check_l1_seven_king_outsider_handoff_v1.py
      - tests/test_l1_seven_king_outsider_handoff_v1.py
      - .github/workflows/l1-sevenking-outsider-handoff-preflight-freecpu.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static source tests and synthetic handoff test (zero model changes)
        run: |
          python -m py_compile research/check_l1_seven_king_outsider_handoff_v1.py
          python -m unittest discover -s tests -p 'test_l1_seven_king_outsider_handoff_v1.py' -v
      - name: Inspect one real pinned BACKFILL 2026 feature file without scoring
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/backfill-690"
          mkdir -p "$source"
          git -C "$source" init -q
          git -C "$source" remote add origin https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git
          git -C "$source" fetch --no-tags --depth 1 --filter=blob:none origin handoff/690-feature-data-v1
          test "$(git -C "$source" rev-parse FETCH_HEAD)" = 113d6ab73bf840c95a761cf1d8df2b4a0281adf5
          git -C "$source" sparse-checkout init --no-cone
          git -C "$source" sparse-checkout set /ml_features/delivery/690/2026-10-10/202605040301.json
          git -C "$source" checkout --detach FETCH_HEAD -q
          python research/check_l1_seven_king_outsider_handoff_v1.py \
            --backfill-690 "$source/ml_features/delivery/690/2026-10-10/202605040301.json" \
            --output "$RUNNER_TEMP/l1-202605040301-readiness.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"l1-202605040301-readiness.json").read_text())
          assert report["status"]=="BLOCKED_ORIGINAL_7KING_OUTSIDER_2026_INPUTS"
          assert len(report["missing_experts"])==7
          assert report["outsider_ballots_verified"]==0
          assert report["2026_results_read_or_evaluated"] is False
          assert report["approved_for_betting"] is False
          print("REAL_2026_SEVEN_KING_OUTSIDER_GAP_IDENTIFIED_WITH_NO_PROXY_SCORES")
          PY
