name: L1 Warning Seat V1

on:
  push:
    branches:
      - research/l1-warning-seat-v1-20261008
    paths:
      - .github/triggers/l1-warning-seat-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l1-warning-seat-v1
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      DATASET_REF: pino1945/keiba-ml-snapshot-bf811fa2eab73db0
      GENERATION_ID: bf811fa2eab73db0
      PYTHONUNBUFFERED: "1"
      KAGGLE_DOWNLOAD_PARALLEL: "4"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/run_l1_winner_reason_mining_v1.py research/run_l1_winner_deepmiss_mega_v1.py research/run_l1_warning_seat_v1.py research/resolve_snapshot_manifest_remote_v1.py
          grep -q '2026_locked' research/run_l1_warning_seat_v1.py
          grep -q 'uses_odds.*False' research/run_l1_warning_seat_v1.py
          grep -q 'model_rank.*>=7' research/run_l1_warning_seat_v1.py
          grep -q 'RANK7' research/run_l1_warning_seat_v1.py
          echo WARNING_SEAT_STATIC_GUARDS_OK

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Run warning seat study
        shell: bash
        run: |
          set -euo pipefail
          cp research/run_l1_latent_ability_v1.sh /tmp/warning-seat-run.sh
          sed -i 's/l1-latent-ability-v1/l1-warning-seat-v1/g' /tmp/warning-seat-run.sh
          sed -i 's/l1-latent-ability/l1-warning-seat/g' /tmp/warning-seat-run.sh
          sed -i 's/run_l1_latent_ability_v1.py/run_l1_warning_seat_v1.py/g' /tmp/warning-seat-run.sh
          sed -i 's#test -s "$RESULT_ROOT/fold-metrics.csv"#test -s "$RESULT_ROOT/warning-metrics.csv"#' /tmp/warning-seat-run.sh
          sed -i 's#test -s "$RESULT_ROOT/pooled-metrics.csv"#test -s "$RESULT_ROOT/warning-stability.csv"#' /tmp/warning-seat-run.sh
          bash /tmp/warning-seat-run.sh

      - name: Runtime policy
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No paid runner or GPU."
          echo "Kaggle read-only; metadata first; 404 non-retryable."
          echo "2019-2025 snapshots downloaded once and reused."
          echo "Warning variants parallelized inside one standard runner."
          echo "Top6 is frozen; warning candidate is rank 7+ only."
          echo "2026 sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l1-warning-seat-v1/run-$GITHUB_RUN_ID"
          for f in summary.json warning-metrics.csv warning-rank-bins.csv warning-stability.csv; do
            test -s "$result/$f"
          done
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: archive warning seat run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
