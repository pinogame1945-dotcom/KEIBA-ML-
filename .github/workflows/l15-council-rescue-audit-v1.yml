name: L1.5 Council Rescue Audit V1

on:
  push:
    branches:
      - research/l15-role-router-v2-7kings-20260928
    paths:
      - .github/triggers/l15-council-rescue-audit-v1.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l15-council-rescue-audit-v1
  cancel-in-progress: true

jobs:
  audit:
    name: audit-${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: 2023
            delay: 0
          - year: 2024
            delay: 25
          - year: 2025
            delay: 50
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      YEAR: ${{ matrix.year }}
      RESTORE_DELAY: ${{ matrix.delay }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax and dependencies
        run: |
          set -euo pipefail
          python -m py_compile \
            research/analyze_l15_council_rescue_audit_v1.py \
            research/persist_exact_kaggle_dataset.py
          python -m pip install --disable-pip-version-check kaggle

      - name: Verify free-storage headroom
        run: bash scripts/kaggle-storage-preflight.sh

      - name: Stagger Kaggle restore
        run: |
          echo "year=$YEAR delay=${RESTORE_DELAY}s"
          sleep "$RESTORE_DELAY"

      - name: Restore saved V3 decisions and yearly inputs
        shell: bash
        run: |
          set -euo pipefail

          get_files_json() {
            local ref="$1" attempt log raw delay
            log="$(mktemp)"
            for attempt in 1 2 3 4 5 6; do
              : > "$log"
              if raw="$(kaggle datasets files "$ref" --page-size 200 --format "json(name,size)" 2>"$log")"; then
                rm -f "$log"
                printf '%s' "$raw"
                return 0
              fi
              cat "$log" >&2
              if ! grep -Eqi '429|too many requests|502|503|504|timed out|temporary|temporarily|connection' "$log"; then
                echo "::error::Non-retryable Kaggle metadata failure: $ref" >&2
                rm -f "$log"
                return 1
              fi
              if [[ "$attempt" -eq 6 ]]; then
                echo "::error::Kaggle metadata failed after retries: $ref" >&2
                rm -f "$log"
                return 1
              fi
              delay=$((5 * (2 ** (attempt - 1))))
              if [[ "$delay" -gt 60 ]]; then delay=60; fi
              echo "::warning::Kaggle metadata throttled; ref=$ref attempt=$attempt/6 sleep=${delay}s" >&2
              sleep "$delay"
            done
          }

          resolve_remote() {
            LOGICAL="$1" python - <<'PY'
          import json,os
          rows=json.loads(os.environ["RAW_JSON"])
          names=sorted(str(x.get("name") or "") for x in rows if str(x.get("name") or ""))
          logical=os.environ["LOGICAL"]
          candidates=[logical]
          if logical.endswith(".gz"):
              candidates.append(logical[:-3])
          else:
              candidates.append(logical+".gz")
          for x in candidates:
              if x in names:
                  print(x)
                  raise SystemExit
          nested=[
              x for x in names
              if x.startswith(logical+"/")
              or x.startswith(logical+".gz/")
              or (logical.endswith(".gz") and x.startswith(logical[:-3]+"/"))
          ]
          if len(nested)==1:
              print(nested[0])
              raise SystemExit
          raise SystemExit(f"missing/ambiguous remote file {logical}; nested={nested}; available={names}")
          PY
          }

          download_remote() {
            local ref="$1" remote="$2" out="$3" attempt log delay tmp p
            log="$(mktemp)"
            tmp="$out.tmpdir"
            for attempt in 1 2 3 4 5 6; do
              : > "$log"
              rm -rf "$tmp"; mkdir -p "$tmp"
              if kaggle datasets download "$ref" -f "$remote" -p "$tmp" --unzip --quiet --force >"$log" 2>&1; then
                p="$(find "$tmp" -type f -print -quit)"
                if [[ -n "$p" && -s "$p" ]]; then
                  mkdir -p "$(dirname "$out")"
                  cp "$p" "$out.tmp"
                  mv "$out.tmp" "$out"
                  rm -rf "$tmp"
                  cat "$log"
                  rm -f "$log"
                  return 0
                fi
              fi
              cat "$log" >&2 || true
              if ! grep -Eqi '404|429|too many requests|502|503|504|timed out|temporary|temporarily|connection' "$log"; then
                echo "::error::Non-retryable Kaggle download failure: $ref file=$remote" >&2
                rm -f "$log"; rm -rf "$tmp"
                return 1
              fi
              if [[ "$attempt" -eq 6 ]]; then
                echo "::error::Kaggle download failed after retries: $ref file=$remote" >&2
                rm -f "$log"; rm -rf "$tmp"
                return 1
              fi
              delay=$((5 * (2 ** (attempt - 1))))
              if [[ "$delay" -gt 60 ]]; then delay=60; fi
              echo "::warning::Kaggle download retry; ref=$ref file=$remote attempt=$attempt/6 sleep=${delay}s" >&2
              sleep "$delay"
            done
          }

          restore_logical() {
            local ref="$1" logical="$2" out="$3" remote
            export RAW_JSON="$(get_files_json "$ref")"
            remote="$(resolve_remote "$logical")"
            download_remote "$ref" "$remote" "$out"
          }

          root="out/council-rescue-audit-input-$YEAR"
          mkdir -p "$root"

          for role in anchor mainline cover; do
            restore_logical \
              "pino1945/keiba-l15-council-router-v3-$role" \
              "decisions.jsonl.gz" \
              "$root/decisions-$role.jsonl"
            sleep 1
          done

          restore_logical \
            "pino1945/keiba-l15-rolecmp-y$YEAR-v1" \
            "role-features-5k.jsonl" \
            "$root/role-features-5k.jsonl"

          restore_logical \
            "pino1945/keiba-l15-7k-fold-y$YEAR-v1" \
            "predictions-5k.jsonl" \
            "$root/predictions-5k.jsonl"

          echo "COUNCIL_RESCUE_AUDIT_INPUT_OK year=$YEAR"

      - name: Analyze rescue regression and dead zones
        shell: bash
        run: |
          set -euo pipefail
          root="out/council-rescue-audit-input-$YEAR"
          out="out/council-rescue-audit-y$YEAR"
          python research/analyze_l15_council_rescue_audit_v1.py \
            --year "$YEAR" \
            --decision "ANCHOR:$root/decisions-anchor.jsonl" \
            --decision "MAINLINE:$root/decisions-mainline.jsonl" \
            --decision "COVER:$root/decisions-cover.jsonl" \
            --year-feature "$root/role-features-5k.jsonl" \
            --year-pred "$root/predictions-5k.jsonl" \
            --out-dir "$out"

      - name: Persist yearly audit
        shell: bash
        run: |
          set -euo pipefail
          python research/persist_exact_kaggle_dataset.py \
            --ref "pino1945/keiba-l15-council-rescue-audit-y$YEAR-v1" \
            --title "KEIBA L15 Council Rescue Audit Y$YEAR V1" \
            --source-dir "out/council-rescue-audit-y$YEAR"

      - name: Cost guard
        if: always()
        run: |
          echo "Standard ubuntu-latest CPU only."
          echo "No GPU. No paid runner. No GitHub Artifact/Cache."
          echo "Three yearly lanes: 2023 / 2024 / 2025."
          echo "No snapshot reparse and no horse-score recomputation."
          echo "2026 is sealed."
          echo "No odds used; this is L1.5 diagnostic research only."
