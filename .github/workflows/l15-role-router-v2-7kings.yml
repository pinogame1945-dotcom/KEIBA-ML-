name: L1.5 Role Router V2 Seven Kings

on:
  push:
    branches:
      - research/l15-role-router-v2-7kings-20260928
    paths:
      - .github/triggers/l15-role-router-v2-7kings.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l15-role-router-v2-seven-kings
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ok: ${{ steps.capacity.outputs.ok }}
      bytes: ${{ steps.capacity.outputs.bytes }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check kaggle
      - name: Verify free-storage headroom once
        id: capacity
        run: bash scripts/kaggle-storage-preflight.sh
      - name: Cost guard
        run: |
          echo "Campaign-level preflight only."
          echo "No GPU. Standard ubuntu-latest CPU only."
          echo "All downstream jobs inherit this one preflight result."
          echo "2026 remains sealed."

  score-seven:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        king:
          - candidate: core4_no_pedigree
            alias: core4
          - candidate: no_auto_full_pedigree_legacy
            alias: pedlegacy
          - candidate: jockey_trainer_condition
            alias: condition
          - candidate: no_auto_full
            alias: full
          - candidate: no_auto_jockey
            alias: light
          - candidate: no_auto_full_pedigree_v1
            alias: pedv1
          - candidate: jockey_trainer_condition_plus_raceclass
            alias: condrc
        year: [2021, 2022, 2023, 2024, 2025]
    uses: ./.github/workflows/l15-7k-score-one.yml
    with:
      storage_preflight_ok: ${{ needs.preflight.outputs.ok }}
      candidate: ${{ matrix.king.candidate }}
      alias: ${{ matrix.king.alias }}
      validation_year: ${{ matrix.year }}
    secrets:
      KEIBA_ML_SNAPSHOTS: ${{ secrets.KEIBA_ML_SNAPSHOTS }}

  build-year:
    needs: [preflight, score-seven]
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: [2021, 2022, 2023, 2024, 2025]
    uses: ./.github/workflows/l15-7k-build-year.yml
    with:
      storage_preflight_ok: ${{ needs.preflight.outputs.ok }}
      year: ${{ matrix.year }}
    secrets:
      KEIBA_ML_SNAPSHOTS: ${{ secrets.KEIBA_ML_SNAPSHOTS }}

  train-fold:
    needs: [preflight, build-year]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        test_year: [2022, 2023, 2024, 2025]
    uses: ./.github/workflows/l15-7k-train-fold.yml
    with:
      storage_preflight_ok: ${{ needs.preflight.outputs.ok }}
      test_year: ${{ matrix.test_year }}
    secrets:
      KEIBA_ML_SNAPSHOTS: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
