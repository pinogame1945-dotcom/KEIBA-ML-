name: L1 Feature Arena first kodoku

on:
  workflow_dispatch:
  push:
    branches:
      - feature/l1-feature-arena-trainer-v1-20260927
    paths:
      - .github/workflows/l1-feature-arena-first-kodoku.yml

permissions:
  contents: read

jobs:
  arena:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - name: base
            sets: BASE
          - name: opponent
            sets: BASE,OPPONENT
          - name: network
            sets: BASE,NETWORK
          - name: lap
            sets: BASE,LAP
          - name: style
            sets: BASE,STYLE
          - name: distance
            sets: BASE,DISTANCE
          - name: backfill
            sets: BASE,BACKFILL
          - name: auto
            sets: BASE,AUTO
          - name: pedigree
            sets: BASE,PEDIGREE
          - name: actor
            sets: BASE,ACTOR
          - name: time_pace
            sets: BASE,TIME_PACE
          - name: all
            sets: BASE,OPPONENT,NETWORK,LAP,STYLE,DISTANCE,BACKFILL,AUTO,PEDIGREE,ACTOR,TIME_PACE

    name: arena-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      GENERATION_ID: e75cd10b7837f676
      KAGGLE_DATASET_REF: pino1945/keiba-ml-snapshot-e75cd10b7837f676
      BACKFILL_SHA: af9d0dcf3295e8276ca39fcbe104d7e9ac4c1cdc
      CANDIDATE_NAME: ${{ matrix.name }}
      CANDIDATE_SETS: ${{ matrix.sets }}

    steps:
      - name: Checkout KEIBA-ML
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax checks
        run: |
          python -m py_compile research/run_feature_arena.py research/train-staged-lightgbm.py
          node --check research/project-yearly-snapshots.mjs

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore 2023-2025 superset snapshots
        shell: bash
        run: |
          set -euo pipefail
          root="out/kodoku-input/$GENERATION_ID"
          mkdir -p "$root"
          for year in 2023 2024 2025; do
            bash scripts/kaggle-fetch-snapshot.sh "$GENERATION_ID" "$year" "$root"
          done
          test -s "$root/snapshot-2023.jsonl"
          test -s "$root/snapshot-2024.jsonl"
          test -s "$root/snapshot-2025.jsonl"
          du -h "$root"/snapshot-*.jsonl

      - name: Build one-candidate arena config
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          sets=[x.strip() for x in os.environ["CANDIDATE_SETS"].split(",") if x.strip()]
          with open("candidate.json","w",encoding="utf-8") as f:
              json.dump([{"name":os.environ["CANDIDATE_NAME"],"feature_sets":sets}],f,ensure_ascii=False)
          PY

      - name: Run candidate
        shell: bash
        run: |
          set -euo pipefail
          root="out/kodoku-input/$GENERATION_ID"
          python research/run_feature_arena.py             --inputs "$root/snapshot-2023.jsonl,$root/snapshot-2024.jsonl,$root/snapshot-2025.jsonl"             --out-dir "out/feature-arena-first-kodoku/$CANDIDATE_NAME"             --train-start 2023-01-01             --train-end 2024-12-31             --valid-start 2025-01-01             --valid-end 2025-12-31             --prediction-phase FINAL             --feature-selection none             --candidates-json candidate.json             --source-ref main             --source-sha "$BACKFILL_SHA"             --ml-source-sha "$GITHUB_SHA"

      - name: Print candidate score
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          name=os.environ["CANDIDATE_NAME"]
          p=Path("out/feature-arena-first-kodoku")/name/"feature-arena-summary.json"
          s=json.loads(p.read_text(encoding="utf-8"))
          r=s["results"][0]
          m=r["metrics"]
          print("FIRST_KODOKU_RESULT")
          print(json.dumps({
              "candidate": name,
              "feature_sets": r["feature_sets"],
              "feature_count": r["feature_count"],
              "metrics": m,
          },ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write(f"# First Kodoku — {name}\n\n")
              out.write(f"Feature sets: {', '.join(r['feature_sets'])}\n\n")
              out.write(f"Features: {r['feature_count']}\n\n")
              out.write("| Metric | Value |\n|---|---:|\n")
              for key in [
                  "top1_winner_capture","top3_winner_capture","top6_winner_capture",
                  "mean_winner_rank","mean_reciprocal_winner_rank",
                  "race_normalized_nll","raw_logloss","raw_brier","raw_roc_auc"
              ]:
                  value=m.get(key)
                  out.write(f"| {key} | {'' if value is None else f'{value:.6f}'} |\n")
          PY

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if grep -E "uses:[[:space:]]*actions/upload-artifact|uses:[[:space:]]*actions/cache" .github/workflows/l1-feature-arena-first-kodoku.yml; then
            echo "Persistent GitHub Artifact/Cache usage found; refusing workflow." >&2
            exit 1
          fi
          echo "Standard GitHub-hosted runner only."
          echo "No GPU."
          echo "No persistent Artifact or Cache."
          echo "Kaggle input snapshot already exists; this run only downloads it."
          echo "Candidate outputs remain ephemeral on each runner."
