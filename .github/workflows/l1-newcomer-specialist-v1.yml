name: L1 Newcomer Specialist V1

on:
  push:
    branches:
      - research/l1-newcomer-specialist-v1-20260928
    paths:
      - .github/triggers/l1-newcomer-specialist-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  newcomer-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BACKFILL_SHA: af9d0dcf3295e8276ca39fcbe104d7e9ac4c1cdc
      EXPERIMENT_ID: NEWCOMER-002

    steps:
      - name: Checkout KEIBA-ML
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact BACKFILL used by v0
        uses: actions/checkout@v4
        with:
          repository: pinogame1945-dotcom/KEIBA-BACKFILL
          ref: ${{ env.BACKFILL_SHA }}
          path: backfill

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ML dependencies
        run: python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Specialist syntax and unit smoke
        run: |
          set -euo pipefail
          node --check src/pedigree-feature-builder.mjs
          node --check research/build-yearly-superset-snapshots.mjs
          node --check research/project-yearly-snapshots.mjs
          python -m py_compile research/run_feature_arena.py research/train-staged-lightgbm.py research/archive_newcomer_local_summaries.py
          node scripts/pedigree-feature-builder-smoke.mjs

      - name: Build NEWCOMER v1 snapshots locally
        shell: bash
        run: |
          set -euo pipefail
          node research/build-yearly-superset-snapshots.mjs \
            --source-root backfill \
            --out-dir out/newcomer-v1-snapshots \
            --source-start 2022-01-01 \
            --source-end 2025-12-31 \
            --emit-start 2022-01-01 \
            --emit-end 2025-12-31 \
            --first-model-ready-year 2023 \
            --prediction-phase FINAL \
            --feature-sets BASE,OPPONENT,BACKFILL,PEDIGREE,ACTOR,TIME_PACE \
            --source-sha "$BACKFILL_SHA" \
            --ml-source-sha "$GITHUB_SHA"

          manifest="$(find out/newcomer-v1-snapshots -name manifest.json -print -quit)"
          test -n "$manifest"
          generation_dir="$(dirname "$manifest")"
          generation_id="$(basename "$generation_dir")"
          echo "GENERATION_DIR=$generation_dir" >> "$GITHUB_ENV"
          echo "GENERATION_ID=$generation_id" >> "$GITHUB_ENV"
          test -s "$generation_dir/snapshot-2023.jsonl.gz"
          test -s "$generation_dir/snapshot-2024.jsonl.gz"
          test -s "$generation_dir/snapshot-2025.jsonl.gz"
          echo "NEWCOMER_V1_SNAPSHOT_READY generation=$generation_id"

      - name: Build control candidate
        shell: bash
        run: |
          cat > general.json <<'JSON'
          [
            {
              "name":"general_no_auto_full",
              "feature_sets":["BASE","OPPONENT","ACTOR","TIME_PACE"]
            }
          ]
          JSON

      - name: Run general control on NEWCOMER holdout
        shell: bash
        run: |
          set -euo pipefail
          python research/run_feature_arena.py \
            --inputs "$GENERATION_DIR/snapshot-2023.jsonl.gz,$GENERATION_DIR/snapshot-2024.jsonl.gz,$GENERATION_DIR/snapshot-2025.jsonl.gz" \
            --out-dir out/newcomer-v1/general \
            --train-start 2023-01-01 \
            --train-end 2024-12-31 \
            --valid-start 2025-01-01 \
            --valid-end 2025-12-31 \
            --train-race-class ALL \
            --valid-race-class NEWCOMER \
            --prediction-phase FINAL \
            --feature-selection none \
            --candidates-json general.json \
            --source-ref "$BACKFILL_SHA" \
            --source-sha "$BACKFILL_SHA" \
            --ml-source-sha "$GITHUB_SHA"

      - name: Build specialist candidates
        shell: bash
        run: |
          cat > newcomer.json <<'JSON'
          [
            {
              "name":"newcomer_actor",
              "feature_sets":["BASE","ACTOR"],
              "actor_prefixes":["actor_jockey_","actor_trainer_"]
            },
            {
              "name":"newcomer_pedigree_v1",
              "feature_sets":["BASE","PEDIGREE"]
            },
            {
              "name":"newcomer_actor_pedigree_v1",
              "feature_sets":["BASE","PEDIGREE","ACTOR"],
              "actor_prefixes":["actor_jockey_","actor_trainer_"]
            }
          ]
          JSON

      - name: Run NEWCOMER v1 specialists
        shell: bash
        run: |
          set -euo pipefail
          python research/run_feature_arena.py \
            --inputs "$GENERATION_DIR/snapshot-2023.jsonl.gz,$GENERATION_DIR/snapshot-2024.jsonl.gz,$GENERATION_DIR/snapshot-2025.jsonl.gz" \
            --out-dir out/newcomer-v1/specialists \
            --train-start 2023-01-01 \
            --train-end 2024-12-31 \
            --valid-start 2025-01-01 \
            --valid-end 2025-12-31 \
            --train-race-class NEWCOMER \
            --valid-race-class NEWCOMER \
            --prediction-phase FINAL \
            --feature-selection none \
            --candidates-json newcomer.json \
            --source-ref "$BACKFILL_SHA" \
            --source-sha "$BACKFILL_SHA" \
            --ml-source-sha "$GITHUB_SHA"

      - name: Verify controls and print v1 score
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          general=json.loads(Path("out/newcomer-v1/general/feature-arena-summary.json").read_text())
          spec=json.loads(Path("out/newcomer-v1/specialists/feature-arena-summary.json").read_text())
          rows={r["name"]:r for r in general["results"]+spec["results"]}

          expected={
            "general_no_auto_full":{
              "top1_winner_capture":0.2532894736842105,
              "top3_winner_capture":0.5493421052631579,
              "top6_winner_capture":0.7828947368421053,
              "mean_winner_rank":4.1019736842105265,
            },
            "newcomer_actor":{
              "top1_winner_capture":0.21710526315789475,
              "top3_winner_capture":0.5460526315789473,
              "top6_winner_capture":0.756578947368421,
              "mean_winner_rank":4.404605263157895,
            },
          }
          for name,want in expected.items():
              got=rows[name]["metrics"]
              for key,value in want.items():
                  if abs(float(got[key])-float(value))>1e-12:
                      raise SystemExit(f"CONTROL_MISMATCH {name} {key}: expected={value} got={got[key]}")

          print("NEWCOMER_V1_CONTROL_REPRODUCTION_OK")
          for name in ["general_no_auto_full","newcomer_actor","newcomer_pedigree_v1","newcomer_actor_pedigree_v1"]:
              r=rows[name]
              print("NEWCOMER_V1_RESULT "+json.dumps({
                  "candidate":name,
                  "race_scope":r.get("race_scope"),
                  "feature_count":r.get("feature_count"),
                  "metrics":r.get("metrics"),
                  "resource_usage":r.get("resource_usage"),
              },ensure_ascii=False,separators=(",",":")))
          PY

      - name: Archive NEWCOMER-002 separate ledger
        shell: bash
        run: |
          set -euo pipefail
          python research/archive_newcomer_local_summaries.py \
            --experiment-id "$EXPERIMENT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --snapshot-generation "$GENERATION_ID" \
            --backfill-sha "$BACKFILL_SHA" \
            --summary out/newcomer-v1/general/feature-arena-summary.json \
            --summary out/newcomer-v1/specialists/feature-arena-summary.json \
            --expected-candidates general_no_auto_full,newcomer_actor,newcomer_pedigree_v1,newcomer_actor_pedigree_v1 \
            --train-start 2023-01-01 \
            --train-end 2024-12-31 \
            --valid-start 2025-01-01 \
            --valid-end 2025-12-31

      - name: Commit separate NEWCOMER ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "research-results/l1-newcomer-specialist/$EXPERIMENT_ID"
          git commit -m "research: archive $EXPERIMENT_ID run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if grep -E '^[[:space:]]+runs-on:[[:space:]]*(macos|windows|.*gpu)' .github/workflows/l1-newcomer-specialist-v1.yml; then
            echo "Paid/special runner found; refusing workflow." >&2
            exit 1
          fi
          if grep -E '^[[:space:]]+uses:[[:space:]]*actions/(upload-artifact|cache)@' .github/workflows/l1-newcomer-specialist-v1.yml; then
            echo "Persistent GitHub Artifact/Cache usage found; refusing workflow." >&2
            exit 1
          fi
          echo "Standard GitHub-hosted ubuntu-latest only."
          echo "No GPU."
          echo "No GitHub Artifact or Cache."
          echo "NEWCOMER v1 snapshots are runner-local and ephemeral."
          echo "Only small text/JSON ledger files are persisted to Git."
