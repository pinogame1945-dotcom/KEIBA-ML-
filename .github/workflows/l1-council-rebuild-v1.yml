name: L1 Council Rebuild V1

on:
  push:
    branches:
      - research/l1-council-rebuild-v1-20261004
    paths:
      - .github/triggers/l1-council-rebuild-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l1-council-rebuild-v1
  cancel-in-progress: true

jobs:
  year:
    name: materialize-${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: [2021, 2022, 2023, 2024, 2025]
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static and cost guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/run_l1_council_rebuild_v1.py             research/rerank_l1_score_safe_v1.py             research/resolve_kaggle_file_v1.py
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/l1-council-rebuild-v1.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest","ubuntu-latest","ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses)
          assert not any(u.startswith("actions/cache") for u in uses)
          src=Path("research/run_l1_council_rebuild_v1.py").read_text()
          assert "2026 sealed" in src
          assert "range(1,128)" in src
          assert "MARKET_SHARES" in src
          assert "PURE_L1" in src and "HYBRID" in src and "UNCONSTRAINED" in src
          print("L1_COUNCIL_REBUILD_STATIC_GUARDS_OK")
          PY

      - name: Install Kaggle client only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle

      - name: Restore seven scores metadata-first
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          delay=$(( (YEAR - 2021) * 8 ))
          if [[ "$delay" -gt 0 ]]; then sleep "$delay"; fi

          kaggle_transient() {
            local label="$1"; shift
            local attempt rc delay tmp
            for attempt in 1 2 3 4 5 6; do
              tmp="$(mktemp)"
              set +e
              "$@" >"$tmp.out" 2>"$tmp.err"
              rc=$?
              set -e
              cat "$tmp.out"; cat "$tmp.err" >&2
              if [[ "$rc" -eq 0 ]]; then
                rm -f "$tmp" "$tmp.out" "$tmp.err"
                return 0
              fi
              if grep -Eqi '404 Client Error|Not Found for url' "$tmp.out" "$tmp.err"; then
                echo "::error::Kaggle 404 non-retryable label=$label" >&2
                rm -f "$tmp" "$tmp.out" "$tmp.err"
                return "$rc"
              fi
              if ! grep -Eqi '429|502|503|504|Too Many Requests|Bad Gateway|Service Unavailable|Gateway Timeout|timed out|connection reset|temporary failure' "$tmp.out" "$tmp.err"; then
                echo "::error::Kaggle non-transient failure label=$label rc=$rc" >&2
                rm -f "$tmp" "$tmp.out" "$tmp.err"
                return "$rc"
              fi
              rm -f "$tmp" "$tmp.out" "$tmp.err"
              [[ "$attempt" -lt 6 ]] || return "$rc"
              case "$attempt" in
                1) delay=10 ;;
                2) delay=20 ;;
                3) delay=40 ;;
                4) delay=60 ;;
                *) delay=90 ;;
              esac
              sleep "$delay"
            done
          }

          root="out/l1-council-rebuild/y$YEAR/scores"
          mkdir -p "$root"
          for alias in core4 pedlegacy condition full light pedv1 condrc; do
            ref="pino1945/keiba-l15-7k-$alias-y$YEAR-v1"
            d="$root/$alias"
            mkdir -p "$d"
            meta="$d/files.json"
            kaggle_transient "files:$alias:$YEAR"               bash -c 'kaggle datasets files "$1" --page-size 200 --format "json(name,size)" >"$2"' _ "$ref" "$meta"
            remote="$(python research/resolve_kaggle_file_v1.py               --files-json "$meta" --wanted score.jsonl.gz --wanted score.jsonl)"
            echo "RESOLVED year=$YEAR alias=$alias remote=$remote"
            kaggle_transient "download:$alias:$YEAR:$remote"               kaggle datasets download "$ref" -f "$remote" -p "$d" --unzip --quiet --force
            p="$(find "$d" -type f \( -name 'score.jsonl.gz' -o -name 'score.jsonl' \) -print -quit)"
            test -n "$p"; test -s "$p"
            safe="$d/safe-score.jsonl.gz"
            python research/rerank_l1_score_safe_v1.py --input "$p" --output "$safe"
            rm -f "$p" "$meta"
          done
          echo "SCORE_ROOT=$root" >> "$GITHUB_ENV"

      - name: Restore saved tie-safe Outsider ballots
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          src="research-results/l16-outsider-support-safe-fast-v2/run-36724124925/y$YEAR/ballots.csv.gz"
          test -s "$src"
          mkdir -p "out/l1-council-rebuild/y$YEAR"
          cp "$src" "out/l1-council-rebuild/y$YEAR/ballots.csv.gz"
          echo "BALLOTS=out/l1-council-rebuild/y$YEAR/ballots.csv.gz" >> "$GITHUB_ENV"

      - name: Sparse checkout exact BACKFILL dates
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          core="$SCORE_ROOT/core4/safe-score.jsonl.gz"
          dates="out/l1-council-rebuild/y$YEAR/dates.txt"
          python - "$core" "$YEAR" "$dates" <<'PY'
          import gzip,json,sys
          src,year,out=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          races={}; dates=set()
          with gzip.open(src,"rt",encoding="utf-8") as f:
              for line in f:
                  if not line.strip(): continue
                  r=json.loads(line); rid=str(r.get("race_id") or "")
                  d=str(r.get("race_date") or "")[:10]
                  if rid and rid not in races:
                      if not d.startswith(str(year)+"-"): raise SystemExit(f"date drift {rid} {d}")
                      races[rid]=d; dates.add(d)
          if len(races)!=3456: raise SystemExit(f"race coverage {len(races)} != 3456")
          open(out,"w",encoding="utf-8").write("\n".join(sorted(dates))+"\n")
          print("DATES_READY",year,len(races),len(dates))
          PY

          rm -rf "out/backfill-$YEAR"
          git clone --depth 1 --filter=blob:none --no-checkout             https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git "out/backfill-$YEAR"
          git -C "out/backfill-$YEAR" sparse-checkout init --no-cone
          {
            while IFS= read -r d; do
              [[ -n "$d" ]] || continue
              echo "/data/daily/$d.jsonl.gz"
              echo "/data/odds/daily/$d.jsonl.gz"
            done < "$dates"
          } > "out/backfill-$YEAR/.git/info/sparse-checkout"
          git -C "out/backfill-$YEAR" checkout "$BACKFILL_SHA"
          test "$(git -C "out/backfill-$YEAR" rev-parse HEAD)" = "$BACKFILL_SHA"
          echo "BACKFILL_ROOT=out/backfill-$YEAR" >> "$GITHUB_ENV"

      - name: Materialize compact race state
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          root="research-results/l1-council-rebuild-v1/run-$GITHUB_RUN_ID/races"
          mkdir -p "$root"
          args=()
          for alias in core4 pedlegacy condition full light pedv1 condrc; do
            args+=(--expert "$alias=$SCORE_ROOT/$alias/safe-score.jsonl.gz")
          done
          python research/run_l1_council_rebuild_v1.py year             --year "$YEAR"             "${args[@]}"             --ballots "$BALLOTS"             --backfill-root "$BACKFILL_ROOT"             --output "$root/y$YEAR.jsonl.gz"             --summary "$root/y$YEAR-summary.json"
          test -s "$root/y$YEAR.jsonl.gz"
          test "$(du -sm "$root/y$YEAR.jsonl.gz" | cut -f1)" -le 20
          rm -rf "out/l1-council-rebuild/y$YEAR" "$BACKFILL_ROOT"
          echo "YEAR_FILE=$root/y$YEAR.jsonl.gz" >> "$GITHUB_ENV"
          echo "YEAR_SUMMARY=$root/y$YEAR-summary.json" >> "$GITHUB_ENV"

      - name: Commit year state
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$YEAR_FILE" "$YEAR_SUMMARY"
          git commit -m "research: materialize council rebuild year $YEAR run $GITHUB_RUN_ID"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

      - name: Cost guard
        if: always()
        run: |
          echo "Standard ubuntu-latest CPU only."
          echo "No GPU / paid runner / Artifact / Cache."
          echo "Kaggle metadata-first exact-name reads only."
          echo "404 is non-retryable; only transient 429/5xx/network failures retry."
          echo "BACKFILL pinned SHA, exact-date sparse checkout."
          echo "Only compact gzip race state is persisted to git."
          echo "2026 sealed."

  search:
    name: subset-search-${{ matrix.shard }}
    needs: year
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull all year states
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "$GITHUB_REF_NAME"
          root="research-results/l1-council-rebuild-v1/run-$GITHUB_RUN_ID/races"
          for y in 2021 2022 2023 2024 2025; do test -s "$root/y$y.jsonl.gz"; done

      - name: Search 127 subsets and market shares
        shell: bash
        run: |
          set -euo pipefail
          root="research-results/l1-council-rebuild-v1/run-$GITHUB_RUN_ID"
          mkdir -p "$root/search"
          python research/run_l1_council_rebuild_v1.py search             --root "$root/races"             --shard "${{ matrix.shard }}"             --shards 4             --output "$root/search/shard-${{ matrix.shard }}.csv"
          test -s "$root/search/shard-${{ matrix.shard }}.csv"
          echo "SHARD_FILE=$root/search/shard-${{ matrix.shard }}.csv" >> "$GITHUB_ENV"

      - name: Commit shard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$SHARD_FILE"
          git commit -m "research: council subset shard ${{ matrix.shard }} run $GITHUB_RUN_ID"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

      - name: Cost guard
        if: always()
        run: |
          echo "Standard ubuntu-latest CPU only."
          echo "No external dataset reads in search stage."
          echo "No GPU / paid runner / Artifact / Cache."

  final:
    name: strict-walk-forward-final
    needs: search
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Final strict OOS selection and Outsider rescue
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "$GITHUB_REF_NAME"
          root="research-results/l1-council-rebuild-v1/run-$GITHUB_RUN_ID"
          args=()
          for s in 0 1 2 3; do
            test -s "$root/search/shard-$s.csv"
            args+=(--shard-csv "$root/search/shard-$s.csv")
          done
          result="$root/final"
          python research/run_l1_council_rebuild_v1.py final             "${args[@]}"             --race-root "$root/races"             --out-dir "$result"
          test -s "$result/strict-oos-champions.csv"
          test -s "$result/rescue-strict-oos.csv"
          test "$(du -sm "$result" | cut -f1)" -le 5
          echo "FINAL_RESULT=$result" >> "$GITHUB_ENV"

      - name: Commit final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$FINAL_RESULT"
          git commit -m "research: archive strict L1 council rebuild $GITHUB_RUN_ID"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Cost guard
        if: always()
        run: |
          echo "Standard ubuntu-latest CPU only."
          echo "No network datasets in final stage."
          echo "No GPU / paid runner / Artifact / Cache."
          echo "All selection is prior-years-only; 2026 sealed."
