name: L1.5 Outsider Rescue Router V1

on:
  push:
    branches:
      - research/l15-outsider-rescue-router-v1-20260928
    paths:
      - .github/triggers/l15-outsider-rescue-router-v1.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l15-outsider-rescue-router-v1
  cancel-in-progress: true

jobs:
  year_lane:
    name: rescue-router-y${{ matrix.test_year }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - test_year: 2022
            delay_seconds: 0
          - test_year: 2023
            delay_seconds: 35
          - test_year: 2024
            delay_seconds: 70
          - test_year: 2025
            delay_seconds: 105

    env:
      TEST_YEAR: ${{ matrix.test_year }}
      START_DELAY_SECONDS: ${{ matrix.delay_seconds }}
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      GH_TOKEN: ${{ github.token }}
      OUTSIDER_LEDGER_SHA: d63a7c4
      NONHORSE_SCORECARD_PATH: research-results/l1-outsider-nonhorse-v1/OUTSIDER-NONHORSE-001/attempts/run-36419042735/scorecard.json

    steps:
      - name: Checkout Rescue Router branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/train_l15_outsider_rescue_router_v1.py             research/archive_l15_outsider_rescue_router_v1.py
          bash -n scripts/kaggle-fetch-router-years.sh
          python -m pip install --disable-pip-version-check kaggle lightgbm pandas numpy scikit-learn

      - name: Stagger Kaggle restore only
        shell: bash
        run: |
          set -euo pipefail
          echo "test_year=$TEST_YEAR restore_delay=${START_DELAY_SECONDS}s"
          sleep "$START_DELAY_SECONDS"

      - name: Restore pre-race seven-king router snapshots once
        shell: bash
        run: |
          set -euo pipefail
          years=""
          for ((y=2021; y<=TEST_YEAR; y++)); do
            if [[ -n "$years" ]]; then years="$years,$y"; else years="$y"; fi
          done
          bash scripts/kaggle-fetch-router-years.sh "$years" "out/router-input-y$TEST_YEAR"
          echo "ROUTER_RESTORE_DONE test_year=$TEST_YEAR years=$years"

      - name: Restore nonhorse outsider rescue ledger once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/ledger
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$OUTSIDER_LEDGER_SHA/$NONHORSE_SCORECARD_PATH"
          curl -fL             --retry 6             --retry-delay 3             --retry-all-errors             -H "Authorization: Bearer $GH_TOKEN"             "$url"             -o out/ledger/nonhorse-scorecard.json
          test -s out/ledger/nonhorse-scorecard.json
          python - <<'PY'
          import json
          p="out/ledger/nonhorse-scorecard.json"
          x=json.load(open(p,encoding="utf-8"))
          assert x.get("contract")=="L1_OUTSIDER_ARENA_SCORECARD_V2"
          assert x.get("run_id")==36419042735
          print("OUTSIDER_LEDGER_RESTORE_OK",len(x.get("fold_results") or []))
          PY

      - name: Train and evaluate Rescue Router V1 fold
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --config research/l15-outsider-rescue-router-v1.json
            --test-year "$TEST_YEAR"
            --nonhorse-scorecard out/ledger/nonhorse-scorecard.json
            --out "out/rescue-router-v1/y$TEST_YEAR/result.json"
          )

          for ((y=2021; y<=TEST_YEAR; y++)); do
            p="$(find "out/router-input-y$TEST_YEAR/$y" -type f \( -name 'router-7k.jsonl' -o -name 'router-7k.jsonl.gz' \) -print -quit)"
            test -n "$p"
            test -s "$p"
            args+=(--router-year "$y:$p")
          done

          python research/train_l15_outsider_rescue_router_v1.py "${args[@]}"

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "Four test-year lanes can compute in parallel."
          echo "Kaggle restore is staggered only to reduce 429 collisions."
          echo "Each runner restores each required router year once and reuses it locally."
          echo "No GPU. No paid runner."
          echo "No GitHub Artifact/Cache."
          echo "No new Kaggle dataset/model persistence."
          echo "Outsider ledger is read from existing Git history."
          echo "2026 remains sealed. Odds/popularity/payout remain forbidden."

  ledger:
    name: archive-rescue-router-ledger
    if: always()
    needs:
      - year_lane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fast-forward branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Archive fold results from Actions logs
        shell: bash
        run: |
          set -euo pipefail
          python research/archive_l15_outsider_rescue_router_v1.py             --repo "$GITHUB_REPOSITORY"             --run-id "$GITHUB_RUN_ID"

      - name: Commit permanent small ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "research-results/l15-outsider-rescue-router-v1/run-$GITHUB_RUN_ID"
          if git diff --cached --quiet; then
            echo "No ledger changes to commit"
            exit 0
          fi
          git commit -m "research: archive outsider rescue router run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1

      - name: Ledger policy
        if: always()
        shell: bash
        run: |
          echo "Only small summary/README are committed."
          echo "No trained models, matrices, candidate scores, GitHub Artifacts, or Cache are persisted."
          echo "No new Kaggle storage is created."
