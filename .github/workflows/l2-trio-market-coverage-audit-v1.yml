name: L2 TRIO Market Coverage Audit V1

on:
  push:
    branches:
      - research/l2-trio-market-gap-v0-20260930
    paths:
      - .github/triggers/l2-trio-market-coverage-audit-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-trio-market-coverage-audit-v1
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/audit_trio_market_coverage_v1.py
          grep -q 'runs-on: ubuntu-latest' .github/workflows/l2-trio-market-coverage-audit-v1.yml
          ! grep -q 'upload-artifact\|actions/cache\|runs-on:.*gpu' .github/workflows/l2-trio-market-coverage-audit-v1.yml
          python - <<'PY'
from pathlib import Path
wf=Path(".github/workflows/l2-trio-market-coverage-audit-v1.yml").read_text()
forbidden=("/data/daily/"+"2026-","/data/odds/daily/"+"2026-")
assert not any(x in wf for x in forbidden)
print("TRIO_MARKET_COVERAGE_AUDIT_GUARDS_OK")
PY
      - name: Install standard CPU dependencies
        run: python -m pip install --disable-pip-version-check pandas
      - name: Sparse restore 2022-2025 race and odds packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          cat > out/backfill/.git/info/sparse-checkout <<'EOF'
          /data/daily/2022-*.jsonl.gz
          /data/daily/2023-*.jsonl.gz
          /data/daily/2024-*.jsonl.gz
          /data/daily/2025-*.jsonl.gz
          /data/odds/daily/2022-*.jsonl.gz
          /data/odds/daily/2023-*.jsonl.gz
          /data/odds/daily/2024-*.jsonl.gz
          /data/odds/daily/2025-*.jsonl.gz
          EOF
          git -C out/backfill checkout "$BACKFILL_SHA"
      - name: Run coverage audit
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-trio-market-coverage-audit-v1/run-$GITHUB_RUN_ID"
          python research/audit_trio_market_coverage_v1.py --backfill-root out/backfill --out-dir "$result"
          cat "$result/summary.json"
          cat "$result/by-year.csv"
          cat "$result/coverage-bands.csv"
      - name: Cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted CPU only."
          echo "No GPU, paid runner, artifact/cache, or external storage write."
      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-trio-market-coverage-audit-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: archive TRIO market coverage audit $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
