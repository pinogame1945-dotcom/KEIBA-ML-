name: L2 Normal Budget Normalized V6

on:
  push:
    branches:
      - research/l2-normal-budget-normalized-v6-20260929
    paths:
      - .github/triggers/l2-normal-budget-normalized-v6.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-normal-budget-normalized-v6
  cancel-in-progress: true

jobs:
  normalized-router:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1
      FIXED_LEDGER_DIR: research-results/l15-fixed-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/build_l2_bet_kings_dataset_v1.py             research/run_l2_normal_router_v1.py             research/run_l2_normal_pairwise_router_v4.py             research/run_l2_normal_confidence_override_v5.py             research/run_l2_normal_budget_normalized_v6.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.load(open("contracts/l2-normal-budget-normalized-v6.json",encoding="utf-8"))
          assert c["contract"]=="L2_NORMAL_BUDGET_NORMALIZED_V6"
          assert c["upstream"]["l15_sha"]=="2db82c3ca3cfab6cf35c33cdf7a70d9972eced04"
          assert c["scope"]["battlefield"]=="PASS_SEVEN_ONLY"
          assert c["scope"]["race_filtering"] is False
          assert c["scope"]["force_route_every_normal_race"] is True
          assert c["scope"]["skip_class"] is False
          assert c["scope"]["locked_years"]==[2026]
          assert c["normalization"]["rule"]=="Each executed race receives exactly 1.0 research budget unit regardless of ticket count."
          assert c["candidates"]["pairwise_allowed_market_features"] is False
          assert c["selection"]["development_years"]==[2023,2024]
          assert c["selection"]["final_holdout_year"]==2025
          assert c["selection"]["raw_profit_not_used_for_selection"] is True
          assert c["selection"]["holdout_used_for_selection"] is False
          assert c["promotion"] is False
          s=Path("research/run_l2_normal_budget_normalized_v6.py").read_text()
          assert "Open 2025 only after normalized development selection is fixed." in s
          assert "dev_normalized_profit_units" in s
          assert "dev_raw_profit_yen_diagnostic" in s
          assert "V1 reproduction drift" in Path("research/run_l2_normal_confidence_override_v5.py").read_text()
          p=Path(".github/workflows/l2-normal-budget-normalized-v6.yml")
          lines=p.read_text().splitlines()
          runners=[x.strip().split(":",1)[1].strip() for x in lines if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"], runners
          uses=[x.strip().split(":",1)[1].strip() for x in lines if x.strip().startswith("uses:")]
          forbidden=[u for u in uses if u.startswith("actions/cache") or u.startswith("actions/upload-artifact")]
          assert not forbidden, forbidden
          print("L2_NORMAL_BUDGET_NORMALIZED_V6_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore 2022-2025 seven-king routers once
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/kaggle-fetch-router-years.sh "2022,2023,2024,2025" out/l2-normal-budget/router
          for y in 2022 2023 2024 2025; do
            p="$(find "out/l2-normal-budget/router/$y" -type f \( -name 'router-7k.jsonl' -o -name 'router-7k.jsonl.gz' \) -print -quit)"
            test -n "$p"; test -s "$p"
            echo "ROUTER_$y=$p" >> "$GITHUB_ENV"
          done

      - name: Resolve race dates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l2-normal-budget
          python research/extract_l2_bet_kings_dates_v1.py             --router-year "2022:$ROUTER_2022"             --router-year "2023:$ROUTER_2023"             --router-year "2024:$ROUTER_2024"             --router-year "2025:$ROUTER_2025"             --dates-out out/l2-normal-budget/all-dates.txt             --race-dates-out out/l2-normal-budget/all-race-dates.csv

      - name: Sparse restore market packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout             https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          {
            echo "/data/manifest.json"
            echo "/data/odds/manifest.json"
            while IFS= read -r d; do
              [[ -n "$d" ]] || continue
              echo "/data/daily/$d.jsonl.gz"
              echo "/data/odds/daily/$d.jsonl.gz"
            done < out/l2-normal-budget/all-dates.txt
          } > out/backfill/.git/info/sparse-checkout
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Build deterministic ticket dataset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/l2-normal-budget/dataset
          python research/build_l2_bet_kings_dataset_v1.py             --fixed-ledger-dir "$FIXED_LEDGER_DIR"             --router-year "2022:$ROUTER_2022"             --router-year "2023:$ROUTER_2023"             --router-year "2024:$ROUTER_2024"             --router-year "2025:$ROUTER_2025"             --backfill-root out/backfill             --out-dir out/l2-normal-budget/dataset

      - name: Run budget-normalized V6
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-normal-budget-normalized-v6/run-$GITHUB_RUN_ID"
          python research/run_l2_normal_budget_normalized_v6.py             --contract contracts/l2-normal-budget-normalized-v6.json             --fixed-ledger-dir "$FIXED_LEDGER_DIR"             --router-year "2022:$ROUTER_2022"             --router-year "2023:$ROUTER_2023"             --router-year "2024:$ROUTER_2024"             --router-year "2025:$ROUTER_2025"             --dataset-dir out/l2-normal-budget/dataset             --v1-metrics research-results/l2-normal-router-v1/run-36528381682/router-metrics.csv             --out-dir "$result"
          echo "===== DEVELOPMENT SELECTION ====="
          cat "$result/development-selection.csv"
          echo "===== HOLDOUT 2025 ====="
          cat "$result/holdout-2025.csv"
          echo "===== FOLD STATUS ====="
          cat "$result/fold-status.csv"

      - name: Cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner."
          echo "No actions/cache and no upload-artifact."
          echo "Kaggle router datasets are read-only."
          echo "BACKFILL is sparse-cloned read-only at a pinned commit."
          echo "Large ticket/pairwise matrices stay ephemeral on the runner."
          echo "Only compact research result files are committed."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-normal-budget-normalized-v6/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add             "$result/README.md"             "$result/summary.json"             "$result/development-normalized-sweep.csv"             "$result/development-selection.csv"             "$result/holdout-2025.csv"             "$result/fold-status.csv"             "$result/holdout-normalized-race-detail-v1.csv"             "$result/holdout-normalized-race-detail-selected.csv"
          git commit -m "research: archive budget-normalized v6 run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
