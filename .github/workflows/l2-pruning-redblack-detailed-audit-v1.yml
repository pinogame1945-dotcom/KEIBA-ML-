name: L2 Fixed 3040 Ticket Pruning Red to Black Detailed Audit
on:
  push:
    branches:
      - research/l2-pruning-redblack-detailed-audit-20261015
    paths:
      - .github/triggers/l2-fixed-pruning-redblack-report-v1.trigger
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Verify source and cost boundaries
        run: |
          set -euo pipefail
          python -m py_compile research/report_l2_fixed_pruning_redblack_detail_v1.py
          src="research-results/l2-fixed-ticket-pruning-3040-v1/run-38692491374"
          test -s "$src/all_3040_fixed_lines_before_after_2024_2025.csv.gz"
          test -s "$src/red_lines_changed_to_black_2024_25.csv.gz"
          test -s "$src/red_to_black_preservation_audit_all_policies.csv"
          test -s "$src/deduped_original_245_and_all_tickets_union_before_after.csv"
          echo "EXISTING_OOS_SOURCE_READY_STANDARD_CPU"
      - name: Compute all red to black details from existing archived results
        run: |
          set -euo pipefail
          python research/report_l2_fixed_pruning_redblack_detail_v1.py \
            --source research-results/l2-fixed-ticket-pruning-3040-v1/run-38692491374 \
            --out "research-results/l2-fixed-pruning-redblack-detailed-audit-v1/run-$GITHUB_RUN_ID"
      - name: Commit compact CSV reports to isolated research branch
        run: |
          set -euo pipefail
          dest="research-results/l2-fixed-pruning-redblack-detailed-audit-v1/run-$GITHUB_RUN_ID"
          test -s "$dest/summary.json"
          test -s "$dest/all_red_to_black_converted_lines_with_yearly_profit.csv"
          git config user.name keiba-ml-research-bot
          git config user.email actions@users.noreply.github.com
          git add "$dest"
          git commit -m "research: archive exhaustive red-to-black detailed accounting run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
