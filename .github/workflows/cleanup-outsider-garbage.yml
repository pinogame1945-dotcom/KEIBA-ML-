name: Cleanup Outsider Garbage Runs

on:
  push:
    branches:
      - research/l1-outsider-arena-v1-20260928
    paths:
      - .github/triggers/cleanup-outsider-garbage.trigger

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete stale workflow runs
        shell: bash
        run: |
          set -euo pipefail
          stale_runs=(
            36393230477
            36394131748
            36397531918
            36398285642
            36395614289
            36396635261
            36397411515
            36398065378
            36398495161
          )
          for id in "${stale_runs[@]}"; do
            code="$(curl -sS -o /tmp/delete-body -w '%{http_code}'               -X DELETE               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/actions/runs/$id")"
            if [[ "$code" == "204" || "$code" == "404" ]]; then
              echo "cleaned run=$id http=$code"
            else
              cat /tmp/delete-body || true
              echo "::error::failed to delete run=$id http=$code"
              exit 1
            fi
          done
          echo "Active first-wave run 36399041275 intentionally preserved."
