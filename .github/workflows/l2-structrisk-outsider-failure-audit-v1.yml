name: L2 Structural Risk Champion Failure Audit V1

on:
  push:
    branches:
      - research/l2-structrisk-outsider-failure-audit-v1-20261004
    paths:
      - ".github/triggers/l2-structrisk-outsider-failure-audit-v1.trigger"
  workflow_dispatch:

concurrency:
  group: l2-structrisk-outsider-failure-audit-v1
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Static and cost guard
        run: |
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/l2-structrisk-outsider-failure-audit-v1.yml").read_text()
          assert "runs-on: ubuntu-latest" in wf
          assert "upload-artifact" not in wf
          assert "actions/cache" not in wf
          src=Path("research/run_l2_structrisk_outsider_failure_audit_v1.py").read_text()
          assert "retraining\":False" in src
          assert "new_kaggle_downloads\":False" in src
          assert "2026_locked\":True" in src
          print("FAST_AUDIT_COST_GUARD_OK")
          PY

      - name: Ensure minimal Python deps
        run: |
          python -c "import numpy,pandas" || python -m pip install --disable-pip-version-check numpy pandas

      - name: Run race-level failure separation audit
        run: |
          python research/run_l2_structrisk_outsider_failure_audit_v1.py

      - name: Commit compact audit results
        run: |
          git config user.name 'keiba-ml-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add research-results/l2-structrisk-outsider-failure-audit-v1/
          git commit -m "research: archive Structural Risk champion-failure audit $GITHUB_RUN_ID" || exit 0
          git push origin "HEAD:$GITHUB_REF_NAME"
