name: L1 Outsider Safe Rescue Union V1

on:
  push:
    branches:
      - research/l1-outsider-safe-rescue-union-v1-20260930
    paths:
      - .github/triggers/l1-outsider-safe-rescue-union-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l1-outsider-safe-rescue-union-v1
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      GENERATION_ID: eb13d4096519167b
      KAGGLE_DATASET_REF: pino1945/keiba-ml-snapshot-eb13d4096519167b

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate code
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/run_l1_outsider_tie_audit_year_v1.py             research/score_l1_raw_light_v1.py             research/rerank_l1_score_safe_v1.py             research/analyze_l1_outsider_safe_rescue_union_v1.py             research/build_router_feature_snapshot_v1.py             research/build_l1_nonhorse_dataset_v1.py             research/run_feature_arena.py             research/train-staged-lightgbm.py             research/emit_l1_to_l2.py
          bash -n scripts/kaggle-snapshot-session.sh

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore 2019-2025 snapshots once
        shell: bash
        run: |
          set -euo pipefail
          root="out/safe-rescue-source/$GENERATION_ID"
          mkdir -p "$root"
          bash scripts/kaggle-snapshot-session.sh init "$GENERATION_ID" "$root"
          bash scripts/kaggle-snapshot-session.sh fetch "$GENERATION_ID" "$root" 2019 2020 2021 2022 2023 2024 2025
          for y in 2019 2020 2021 2022 2023 2024 2025; do
            test -s "$root/snapshot-$y.jsonl" || test -s "$root/snapshot-$y.jsonl.gz"
          done
          echo "SNAPSHOT_ROOT=$root" >> "$GITHUB_ENV"

      - name: Build safe seven-king routers locally
        shell: bash
        run: |
          set -euo pipefail

          kaggle_transient() {
            local label="$1"
            shift
            local attempt delay rc tmp
            for attempt in 1 2 3 4 5 6; do
              tmp="$(mktemp)"
              set +e
              "$@" >"$tmp.out" 2>"$tmp.err"
              rc=$?
              set -e
              cat "$tmp.out"
              cat "$tmp.err" >&2
              if [[ "$rc" -eq 0 ]]; then
                rm -f "$tmp" "$tmp.out" "$tmp.err"
                return 0
              fi
              if grep -Eqi '404 Client Error|Not Found for url' "$tmp.out" "$tmp.err"; then
                echo "::error::Kaggle 404 non-retryable label=$label" >&2
                rm -f "$tmp" "$tmp.out" "$tmp.err"
                return "$rc"
              fi
              if ! grep -Eqi '429|502|503|504|Too Many Requests|Bad Gateway|Service Unavailable|Gateway Timeout|timed out|connection reset|temporary failure' "$tmp.out" "$tmp.err"; then
                echo "::error::Kaggle non-transient failure label=$label rc=$rc" >&2
                rm -f "$tmp" "$tmp.out" "$tmp.err"
                return "$rc"
              fi
              rm -f "$tmp" "$tmp.out" "$tmp.err"
              if [[ "$attempt" -eq 6 ]]; then
                echo "::error::Kaggle transient failure label=$label after $attempt attempts" >&2
                return "$rc"
              fi
              case "$attempt" in
                1) delay=15 ;;
                2) delay=30 ;;
                3) delay=60 ;;
                4) delay=90 ;;
                *) delay=120 ;;
              esac
              echo "::warning::Kaggle transient retry label=$label attempt=$attempt/6 sleep=${delay}s" >&2
              sleep "$delay"
            done
          }

          snap() {
            local y="$1"
            if [[ -s "$SNAPSHOT_ROOT/snapshot-$y.jsonl.gz" ]]; then
              printf '%s' "$SNAPSHOT_ROOT/snapshot-$y.jsonl.gz"
            elif [[ -s "$SNAPSHOT_ROOT/snapshot-$y.jsonl" ]]; then
              printf '%s' "$SNAPSHOT_ROOT/snapshot-$y.jsonl"
            else
              echo "::error::snapshot missing year=$y" >&2
              exit 1
            fi
          }

          router_root="out/safe-seven-router"
          score_root="out/safe-seven-scores"
          mkdir -p "$router_root" "$score_root"

          for year in 2021 2022 2023 2024 2025; do
            args=()
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              ref="pino1945/keiba-l15-7k-$alias-y$year-v1"
              d="$score_root/y$year/$alias"
              mkdir -p "$d"
              meta="$d/files.json"

              kaggle_transient "seven-files:$alias:$year" bash -c                 'kaggle datasets files "$1" --page-size 200 --format "json(name,size)" >"$2"' _ "$ref" "$meta"

              remote="$(python - "$meta" <<'PY'
import json,sys
rows=json.load(open(sys.argv[1],encoding="utf-8"))
names=[str(x.get("name") or "") for x in rows]
for wanted in ("score.jsonl.gz","score.jsonl"):
    if wanted in names:
        print(wanted); raise SystemExit
nested=[x for x in names if x.endswith("/score.jsonl.gz") or x.endswith("/score.jsonl")]
if len(nested)==1:
    print(nested[0]); raise SystemExit
raise SystemExit(f"score file missing/ambiguous: {names}")
PY
)"
              echo "SEVEN_SCORE_REMOTE_RESOLVED alias=$alias year=$year file=$remote"
              kaggle_transient "seven-download:$alias:$year" kaggle datasets download "$ref" -f "$remote" -p "$d" --unzip --quiet --force

              p="$(find "$d" -type f \( -name 'score.jsonl.gz' -o -name 'score.jsonl' \) -print -quit)"
              test -n "$p"; test -s "$p"
              safe="$d/safe-score.jsonl.gz"
              python research/rerank_l1_score_safe_v1.py --input "$p" --output "$safe"
              args+=(--expert "$alias=$safe")
            done

            snapshot="$(snap "$year")"
            router="$router_root/router-$year.jsonl.gz"
            python research/build_router_feature_snapshot_v1.py               --snapshot "$snapshot"               "${args[@]}"               --output "$router"
            test -s "$router"
            rm -rf "$score_root/y$year"
          done

          echo "ROUTER_ROOT=$router_root" >> "$GITHUB_ENV"

      - name: Run safe outsider rescue audit 2021-2025
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l1-outsider-safe-rescue-union-v1/run-$GITHUB_RUN_ID"
          mkdir -p "$result"

          snap() {
            local y="$1"
            if [[ -s "$SNAPSHOT_ROOT/snapshot-$y.jsonl.gz" ]]; then
              printf '%s' "$SNAPSHOT_ROOT/snapshot-$y.jsonl.gz"
            elif [[ -s "$SNAPSHOT_ROOT/snapshot-$y.jsonl" ]]; then
              printf '%s' "$SNAPSHOT_ROOT/snapshot-$y.jsonl"
            else
              echo "::error::snapshot missing year=$y" >&2
              exit 1
            fi
          }

          for year in 2021 2022 2023 2024 2025; do
            t1=$((year-2))
            t2=$((year-1))
            p1="$(snap "$t1")"
            p2="$(snap "$t2")"
            pv="$(snap "$year")"
            router="$ROUTER_ROOT/router-$year.jsonl.gz"
            test -s "$router"

            python research/run_l1_outsider_tie_audit_year_v1.py               --year "$year"               --inputs "$p1,$p2,$pv"               --validation-snapshot "$pv"               --router-seven "$router"               --out-dir "$result/y$year"               --work-root "out/safe-rescue-work"               --ml-source-sha "$GITHUB_SHA"

            rm -rf "out/safe-rescue-work/$year"
          done

          echo "RESULT_ROOT=$result" >> "$GITHUB_ENV"

      - name: Analyze overlap, exclusives and combined rescue
        shell: bash
        run: |
          set -euo pipefail
          python research/analyze_l1_outsider_safe_rescue_union_v1.py             --root "$RESULT_ROOT"             --output-json "$RESULT_ROOT/union-summary.json"             --output-csv "$RESULT_ROOT/individual-rescue.csv"             --output-pairwise-csv "$RESULT_ROOT/pairwise-overlap.csv"

          RESULT_ROOT="$RESULT_ROOT" python - <<'PY'
import json,os
from pathlib import Path
p=Path(os.environ["RESULT_ROOT"])/"union-summary.json"
x=json.loads(p.read_text(encoding="utf-8"))
assert x["topn"]["6"]["seven_blind_count"]==1735, x["topn"]["6"]["seven_blind_count"]
t=x["topn"]["6"]
lines=[
    "# L1 Outsider Safe Rescue Union V1","",
    "- Years: 2021-2025",
    "- 2026: sealed",
    "- Seven Kings: persisted horse-level scores -> safe rerank -> local router rebuild",
    "- Outsiders: safe tie-break only",
    f"- Seven-King Top6 blind races: {t['seven_blind_count']}",
    f"- All 13 outsiders union rescue: {t['all_13_union_rescue_count']} ({t['all_13_union_rescue_rate']:.2%})",
    f"- Remaining unrescued: {t['remaining_unrescued_count']} ({t['remaining_unrescued_rate']:.2%})",
    "",
    "## Best Top6 rescue combinations by number of outsiders","",
    "| N | Rescue | Coverage | Marginal | Combination |",
    "|---:|---:|---:|---:|---|",
]
for r in t["best_combinations_by_size"]:
    lines.append(f"| {r['size']} | {r['rescue_count']} | {r['coverage_rate_on_blind']:.2%} | {r['marginal_vs_prev_best']:+d} | {' + '.join(r['labels'])} |")
(Path(os.environ["RESULT_ROOT"])/"README.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
print("\n".join(lines[:10]))
PY

      - name: Commit compact results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$RESULT_ROOT"
          git commit -m "research: archive safe outsider rescue union run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Cost guard
        if: always()
        run: |
          echo "One standard GitHub-hosted ubuntu-latest CPU runner only."
          echo "No GPU. No paid runner."
          echo "No GitHub Artifact or Cache."
          echo "No Kaggle dataset/model creation or update."
          echo "All Kaggle reads are metadata-first; 404 is non-retryable."
          echo "429/502/503/504 and temporary network failures only are retried."
          echo "2019-2025 snapshots are fetched once and reused across every fold."
          echo "Seven-King routers are rebuilt locally from persisted horse-level scores."
          echo "Only compact JSON/CSV/Markdown summaries are committed."
          echo "2026 remains sealed."
