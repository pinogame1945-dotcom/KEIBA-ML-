name: L2 Role Value Lab V1

on:
  push:
    branches:
      - research/l2-role-value-lab-v1-20260929
    paths:
      - .github/triggers/l2-role-value-lab-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-role-value-lab-v1
  cancel-in-progress: true

jobs:
  role-value-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1
      FIXED_LEDGER_DIR: research-results/l15-fixed-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/build_l2_win_edge_dataset_v1.py \
            research/run_l2_win_edge_audit_v1.py \
            research/run_l2_role_value_lab_v1.py
          python - <<'PY'
          from pathlib import Path
          lines=Path(".github/workflows/l2-role-value-lab-v1.yml").read_text().splitlines()
          runners=[x.strip().split(":",1)[1].strip() for x in lines if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"], runners
          uses=[x.strip().split(":",1)[1].strip() for x in lines if x.strip().startswith("uses:")]
          forbidden=[u for u in uses if u.startswith("actions/cache") or u.startswith("actions/upload-artifact")]
          assert not forbidden, forbidden
          print("ROLE_VALUE_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        run: python -m pip install --disable-pip-version-check kaggle pandas numpy scikit-learn lightgbm

      - name: Restore 2022-2025 seven-king routers once
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/kaggle-fetch-router-years.sh "2022,2023,2024,2025" out/l2-role/router
          for y in 2022 2023 2024 2025; do
            p="$(find "out/l2-role/router/$y" -type f \( -name 'router-7k.jsonl' -o -name 'router-7k.jsonl.gz' \) -print -quit)"
            test -n "$p"; test -s "$p"
            echo "ROUTER_$y=$p" >> "$GITHUB_ENV"
          done

      - name: Resolve 2022-2025 dates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l2-role
          python research/extract_l2_bet_kings_dates_v1.py \
            --router-year "2022:$ROUTER_2022" \
            --router-year "2023:$ROUTER_2023" \
            --router-year "2024:$ROUTER_2024" \
            --router-year "2025:$ROUTER_2025" \
            --dates-out out/l2-role/all-dates.txt \
            --race-dates-out out/l2-role/all-race-dates.csv

      - name: Sparse restore market packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          {
            echo "/data/manifest.json"
            echo "/data/odds/manifest.json"
            while IFS= read -r d; do
              [[ -n "$d" ]] || continue
              echo "/data/daily/$d.jsonl.gz"
              echo "/data/odds/daily/$d.jsonl.gz"
            done < out/l2-role/all-dates.txt
          } > out/backfill/.git/info/sparse-checkout
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Build accelerated WIN-only candidate dataset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/l2-role/dataset
          python research/build_l2_win_edge_dataset_v1.py \
            --fixed-ledger-dir "$FIXED_LEDGER_DIR" \
            --router-year "2022:$ROUTER_2022" \
            --router-year "2023:$ROUTER_2023" \
            --router-year "2024:$ROUTER_2024" \
            --router-year "2025:$ROUTER_2025" \
            --backfill-root out/backfill \
            --out-dir out/l2-role/dataset

      - name: Run role value lab
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-role-value-lab-v1/run-$GITHUB_RUN_ID"
          python research/run_l2_role_value_lab_v1.py \
            --dataset-dir out/l2-role/dataset \
            --backfill-root out/backfill \
            --out-dir "$result"
          echo "===== SUMMARY ====="
          cat "$result/summary.json"
          echo "===== FOCUS PRIORITY TOP 40 ====="
          python - <<'PY'
          import csv,os
          p=f"research-results/l2-role-value-lab-v1/run-{os.environ['GITHUB_RUN_ID']}/focus-priority.csv"
          rows=list(csv.DictReader(open(p,encoding="utf-8")))
          for r in rows[:40]: print(r)
          PY

      - name: Cost guard
        if: always()
        run: |
          echo "Standard ubuntu-latest CPU only."
          echo "No GPU / paid runner / Artifact / Cache."
          echo "No persistent raw prediction or ticket ledger stored."
          echo "Only compact aggregated CSV/JSON/README committed."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-role-value-lab-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add \
            "$result/README.md" \
            "$result/summary.json" \
            "$result/role-value-summary.csv" \
            "$result/focus-stability.csv" \
            "$result/focus-priority.csv"
          git commit -m "research: archive L2 role value lab run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
