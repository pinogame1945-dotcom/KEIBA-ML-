name: L1 Newcomer Specialist V0

on:
  push:
    branches:
      - research/l1-newcomer-specialist-v0-20260928
    paths:
      - .github/triggers/l1-newcomer-specialist-v0.trigger
      - .github/workflows/l1-newcomer-specialist-v0.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duel:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - name: general_no_auto_jockey
            train_scope: ALL
            sets: BASE,OPPONENT,ACTOR,TIME_PACE
            actor_prefixes: actor_jockey_
          - name: general_no_auto_full
            train_scope: ALL
            sets: BASE,OPPONENT,ACTOR,TIME_PACE
            actor_prefixes: ""
          - name: newcomer_same_jockey
            train_scope: NEWCOMER
            sets: BASE,OPPONENT,ACTOR,TIME_PACE
            actor_prefixes: actor_jockey_
          - name: newcomer_actor
            train_scope: NEWCOMER
            sets: BASE,ACTOR
            actor_prefixes: actor_jockey_,actor_trainer_
          - name: newcomer_pedigree
            train_scope: NEWCOMER
            sets: BASE,PEDIGREE
            actor_prefixes: ""
          - name: newcomer_actor_pedigree
            train_scope: NEWCOMER
            sets: BASE,PEDIGREE,ACTOR
            actor_prefixes: actor_jockey_,actor_trainer_

    name: newcomer-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      GENERATION_ID: e75cd10b7837f676
      BACKFILL_SHA: af9d0dcf3295e8276ca39fcbe104d7e9ac4c1cdc
      CANDIDATE_NAME: ${{ matrix.name }}
      TRAIN_SCOPE: ${{ matrix.train_scope }}
      CANDIDATE_SETS: ${{ matrix.sets }}
      ACTOR_PREFIXES: ${{ matrix.actor_prefixes }}

    steps:
      - name: Checkout KEIBA-ML
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax checks
        run: |
          python -m py_compile research/run_feature_arena.py research/train-staged-lightgbm.py
          node --check research/project-yearly-snapshots.mjs

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore 2023-2025 superset snapshots
        shell: bash
        run: |
          set -euo pipefail
          root="out/newcomer-input/$GENERATION_ID"
          mkdir -p "$root"
          for year in 2023 2024 2025; do
            bash scripts/kaggle-fetch-snapshot.sh "$GENERATION_ID" "$year" "$root"
          done
          test -s "$root/snapshot-2023.jsonl"
          test -s "$root/snapshot-2024.jsonl"
          test -s "$root/snapshot-2025.jsonl"

      - name: Build one-candidate config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          row={
              "name":os.environ["CANDIDATE_NAME"],
              "feature_sets":[x.strip() for x in os.environ["CANDIDATE_SETS"].split(",") if x.strip()],
          }
          actor=[x.strip() for x in os.environ.get("ACTOR_PREFIXES","").split(",") if x.strip()]
          if actor:
              row["actor_prefixes"]=actor
          with open("candidate.json","w",encoding="utf-8") as f:
              json.dump([row],f,ensure_ascii=False)
          print(json.dumps(row,ensure_ascii=False))
          PY

      - name: Run NEWCOMER duel candidate
        shell: bash
        run: |
          set -euo pipefail
          root="out/newcomer-input/$GENERATION_ID"
          python research/run_feature_arena.py \
            --inputs "$root/snapshot-2023.jsonl,$root/snapshot-2024.jsonl,$root/snapshot-2025.jsonl" \
            --out-dir "out/newcomer-v0/$CANDIDATE_NAME" \
            --train-start 2023-01-01 \
            --train-end 2024-12-31 \
            --valid-start 2025-01-01 \
            --valid-end 2025-12-31 \
            --train-race-class "$TRAIN_SCOPE" \
            --valid-race-class NEWCOMER \
            --prediction-phase FINAL \
            --feature-selection none \
            --candidates-json candidate.json \
            --source-ref main \
            --source-sha "$BACKFILL_SHA" \
            --ml-source-sha "$GITHUB_SHA"

      - name: Print NEWCOMER result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          name=os.environ["CANDIDATE_NAME"]
          p=Path("out/newcomer-v0")/name/"feature-arena-summary.json"
          s=json.loads(p.read_text(encoding="utf-8"))
          r=s["results"][0]
          print("NEWCOMER_DUEL_RESULT "+json.dumps({
              "candidate":name,
              "train_scope":os.environ["TRAIN_SCOPE"],
              "valid_scope":"NEWCOMER",
              "feature_sets":r["feature_sets"],
              "actor_prefixes":r.get("actor_prefixes") or [],
              "feature_count":r["feature_count"],
              "metrics":r["metrics"],
              "resource_usage":r.get("resource_usage"),
          },ensure_ascii=False,separators=(",",":")))
          PY

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if grep -E '^[[:space:]]+runs-on:[[:space:]]*(macos|windows|.*gpu)' .github/workflows/l1-newcomer-specialist-v0.yml; then
            echo "Paid/special runner found; refusing workflow." >&2
            exit 1
          fi
          if grep -E '^[[:space:]]+uses:[[:space:]]*actions/(upload-artifact|cache)@' .github/workflows/l1-newcomer-specialist-v0.yml; then
            echo "Persistent GitHub Artifact/Cache usage found; refusing workflow." >&2
            exit 1
          fi
          echo "Standard GitHub-hosted ubuntu-latest runner only."
          echo "No GPU."
          echo "No Artifact or Cache."
          echo "Existing Kaggle snapshot is download-only."
