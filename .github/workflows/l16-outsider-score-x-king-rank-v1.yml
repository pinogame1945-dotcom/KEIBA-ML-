name: L1.6 Outsider Score x King Rank V1

on:
  push:
    branches:
      - research/l16-outsider-support-safe-v1-20260930
    paths:
      - .github/triggers/l16-outsider-score-x-king-rank-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l16-outsider-score-x-king-rank-v1
  cancel-in-progress: true

jobs:
  year:
    name: year-${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: [2021, 2022, 2023, 2024, 2025]
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      YEAR: ${{ matrix.year }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m py_compile             research/rerank_l1_score_safe_v1.py             research/materialize_l16_full_rank_consensus_v1.py             research/resolve_kaggle_file_v1.py             research/analyze_l16_outsider_score_x_king_rank_v1.py

      - name: Rebuild safe Seven-King full rank for this year
        shell: bash
        run: |
          set -euo pipefail

          kaggle_transient() {
            local label="$1"
            shift
            local attempt delay rc tmp
            for attempt in 1 2 3 4 5 6; do
              tmp="$(mktemp)"
              set +e
              "$@" >"$tmp.out" 2>"$tmp.err"
              rc=$?
              set -e
              cat "$tmp.out"
              cat "$tmp.err" >&2
              if [[ "$rc" -eq 0 ]]; then
                rm -f "$tmp" "$tmp.out" "$tmp.err"
                return 0
              fi
              if grep -Eqi '404 Client Error|Not Found for url' "$tmp.out" "$tmp.err"; then
                echo "::error::Kaggle 404 non-retryable label=$label" >&2
                rm -f "$tmp" "$tmp.out" "$tmp.err"
                return "$rc"
              fi
              if ! grep -Eqi '429|502|503|504|Too Many Requests|Bad Gateway|Service Unavailable|Gateway Timeout|timed out|connection reset|temporary failure' "$tmp.out" "$tmp.err"; then
                echo "::error::Kaggle non-transient failure label=$label rc=$rc" >&2
                rm -f "$tmp" "$tmp.out" "$tmp.err"
                return "$rc"
              fi
              rm -f "$tmp" "$tmp.out" "$tmp.err"
              if [[ "$attempt" -eq 6 ]]; then return "$rc"; fi
              case "$attempt" in
                1) delay=15 ;;
                2) delay=30 ;;
                3) delay=60 ;;
                4) delay=90 ;;
                *) delay=120 ;;
              esac
              sleep "$delay"
            done
          }

          root="out/score-x-rank/y$YEAR"
          mkdir -p "$root/scores"
          args=()

          delay=$(( (YEAR - 2021) * 15 ))
          if [[ "$delay" -gt 0 ]]; then sleep "$delay"; fi

          for alias in core4 pedlegacy condition full light pedv1 condrc; do
            ref="pino1945/keiba-l15-7k-$alias-y$YEAR-v1"
            d="$root/scores/$alias"
            mkdir -p "$d"
            meta="$d/files.json"
            kaggle_transient "seven-files:$alias:$YEAR" bash -c 'kaggle datasets files "$1" --page-size 200 --format "json(name,size)" >"$2"' _ "$ref" "$meta"
            remote="$(python research/resolve_kaggle_file_v1.py --files-json "$meta" --wanted score.jsonl.gz --wanted score.jsonl)"
            kaggle_transient "seven-download:$alias:$YEAR" kaggle datasets download "$ref" -f "$remote" -p "$d" --unzip --quiet --force
            p="$(find "$d" -type f \( -name 'score.jsonl.gz' -o -name 'score.jsonl' \) -print -quit)"
            test -n "$p"; test -s "$p"
            safe="$d/safe-score.jsonl.gz"
            python research/rerank_l1_score_safe_v1.py --input "$p" --output "$safe"
            args+=(--expert "$alias=$safe")
          done

          python research/materialize_l16_full_rank_consensus_v1.py             "${args[@]}"             --output "$root/consensus.jsonl.gz"
          test -s "$root/consensus.jsonl.gz"
          echo "YEAR_ROOT=$root" >> "$GITHUB_ENV"

      - name: Analyze saved Outsider ballots against King ranks
        shell: bash
        run: |
          set -euo pipefail
          ballots="research-results/l16-outsider-support-safe-fast-v2/run-36724124925/y$YEAR/ballots.csv.gz"
          test -s "$ballots"
          result="research-results/l16-outsider-score-x-king-rank-v1/run-$GITHUB_RUN_ID/y$YEAR.json"
          mkdir -p "$(dirname "$result")"
          python research/analyze_l16_outsider_score_x_king_rank_v1.py             --ballots "$ballots"             --consensus "$YEAR_ROOT/consensus.jsonl.gz"             --year "$YEAR"             --output "$result"
          test -s "$result"
          echo "YEAR_RESULT=$result" >> "$GITHUB_ENV"

      - name: Commit year result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$YEAR_RESULT"
          git commit -m "research: score x king rank year $YEAR run $GITHUB_RUN_ID"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner / Artifact / Cache."
          echo "No snapshot restore and no Outsider retraining."
          echo "Only persisted Seven horse-level scores are read, metadata-first."
          echo "404 non-retryable; only transient errors retry."
          echo "2026 sealed."

  aggregate:
    name: aggregate
    needs: year
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Aggregate five years
        shell: bash
        run: |
          set -euo pipefail
          root="research-results/l16-outsider-score-x-king-rank-v1/run-$GITHUB_RUN_ID"
          ROOT="$root" python - <<'PY'
          import json,os
          from collections import defaultdict
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          years=[2021,2022,2023,2024,2025]
          rows={y:json.loads((root/f"y{y}.json").read_text()) for y in years}
          exact=defaultdict(lambda:{"horses":0,"score_sum":0,"support_count_sum":0})
          buckets=defaultdict(lambda:{"horses":0,"score_sum":0})
          cross=defaultdict(lambda:defaultdict(int))
          score_exact=defaultdict(lambda:defaultdict(int))
          total=0
          for y,x in rows.items():
              total+=x["scored_horse_rows"]
              for kr,d in x["king_rank_exact"].items():
                  z=exact[int(kr)]
                  z["horses"]+=d["horses"]; z["score_sum"]+=d["score_sum"]; z["support_count_sum"]+=d["support_count_sum"]
              for b,d in x["king_rank_buckets"].items():
                  z=buckets[b]; z["horses"]+=d["horses"]; z["score_sum"]+=d["score_sum"]
              for sb,d in x["score_bucket_x_king_rank"].items():
                  for b,n in d["king_rank_buckets"].items(): cross[sb][b]+=n
              for s,d in x["score_exact_x_king_rank"].items():
                  for b,n in d["king_rank_buckets"].items(): score_exact[int(s)][b]+=n
          bout={}
          order=("1","2","3","4-6","7-10","11+")
          for b in order:
              d=buckets[b]
              bout[b]={**d,"share":d["horses"]/total if total else 0,
                       "avg_outsider_score":d["score_sum"]/d["horses"] if d["horses"] else None}
          eout={}
          for kr,d in sorted(exact.items()):
              eout[str(kr)]={**d,"share":d["horses"]/total,
                             "avg_outsider_score":d["score_sum"]/d["horses"],
                             "avg_support_count":d["support_count_sum"]/d["horses"]}
          cout={}
          for sb in ("1-5","6-10","11-15","16-20","21-25","26+"):
              vals={b:cross[sb][b] for b in order}; n=sum(vals.values())
              cout[sb]={"horses":n,"king_rank_buckets":vals,
                        "shares":{b:(vals[b]/n if n else 0) for b in order}}
          sout={}
          for s,d in sorted(score_exact.items()):
              vals={b:d[b] for b in order}
              sout[str(s)]={"horses":sum(vals.values()),"king_rank_buckets":vals}
          out={"contract":"L16_OUTSIDER_SCORE_X_KING_RANK_ALL_YEARS_V1",
               "years":years,"races":17280,"scored_horse_rows":total,"candidate_count":13,
               "score_definition":"sum of 13 outsider Top3 ballots: rank1=3, rank2=2, rank3=1",
               "king_rank_exact":eout,"king_rank_buckets":bout,
               "score_bucket_x_king_rank":cout,"score_exact_x_king_rank":sout,
               "by_year":{str(y):rows[y] for y in years},"2026_sealed":True,"odds_used":False}
          (root/"summary.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({"scored_horse_rows":total,"king_rank_buckets":bout,"score_bucket_x_king_rank":cout},ensure_ascii=False,separators=(",",":")))
          PY

          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$root/summary.json"
          git commit -m "research: aggregate outsider score x king rank run $GITHUB_RUN_ID"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted CPU only; compact git output only."
