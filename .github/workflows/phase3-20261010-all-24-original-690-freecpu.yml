name: Phase 3 - Oct10 24 Original 690 Numeric Inputs Free CPU

on:
  push:
    branches: [audit/2026-feature-input-phase1-20261016]
    paths:
      - research/phase3_20261010_24_extra41_batch_v1.py
      - research/phase3_20261010_original_l1_24_cold_v1.py
      - research/phase3_20261010_daybias_cached_v1.py
      - .github/workflows/phase3-20261010-all-24-original-690-freecpu.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-oct10-all24-original-690-freecpu
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 1
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: No billed resources and immutable models
        run: |
          set -euo pipefail
          python -m py_compile research/phase3_20261010_24_extra41_batch_v1.py
          python -m py_compile research/phase3_20261010_all_24_unscored_inputs_v1.py
          python -m py_compile research/phase3_20261010_original_l1_24_cold_v1.py
          python -m py_compile research/phase3_20261010_daybias_cached_v1.py
          python scripts/verify_keiba_l2_1_freeze.py
          test -n "$KAGGLE_API_TOKEN"
          test "$(df -Pk "$RUNNER_TEMP" | tail -1 | awk '{print $4}')" -ge 6000000
          echo "STANDARD_CPU_EPHEMERAL_ONLY_NEVER_PUBLISH_OR_BET"
      - name: Install pre-existing original LightGBM/Pandas source dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r ml/requirements.txt
          python -m pip install --disable-pip-version-check --no-cache-dir kaggle
      - name: Fetch pinned BACKFILL historical daily source
        run: |
          set -euo pipefail
          SHA="03950cfe132abeca15ef17dbc7c6885ceb1591b7"
          src="$RUNNER_TEMP/backfill"
          mkdir -p "$src"
          git -C "$src" init --quiet
          git -C "$src" remote add origin https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git
          git -C "$src" fetch --no-tags --depth 1 --filter=blob:none origin "$SHA"
          git -C "$src" sparse-checkout init --cone
          git -C "$src" sparse-checkout set data/daily
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$SHA"
          gzip -t "$src/data/daily/2026-10-10.jsonl.gz"
      - name: Reconstruct original 2026 CORE4 strictly-prior source once
        run: |
          set -euo pipefail
          node research/build-yearly-superset-snapshots.mjs \
            --source-root "$RUNNER_TEMP/backfill" \
            --out-dir "$RUNNER_TEMP/p3-derived" \
            --source-start 2022-01-01 --source-end 2026-10-10 \
            --emit-start 2026-01-01 --emit-end 2026-10-10 \
            --first-model-ready-year 2023 --prediction-phase FINAL \
            --feature-sets BASE,OPPONENT,NETWORK,LAP,STYLE,DISTANCE,BACKFILL,AUTO,ACTOR,TIME_PACE \
            --source-sha 03950cfe132abeca15ef17dbc7c6885ceb1591b7 \
            --ml-source-sha "$GITHUB_SHA"
          source=$(find "$RUNNER_TEMP/p3-derived" -name snapshot-2026.jsonl.gz -print -quit)
          test -s "$source"
          echo "P3_SNAPSHOT_2026=$source" >> "$GITHUB_ENV"
      - name: Verify all 24 real starter fields and materialize only original 649
        run: |
          set -euo pipefail
          python research/phase3_20261010_all_24_unscored_inputs_v1.py \
            --backfill-day "$RUNNER_TEMP/backfill/data/daily/2026-10-10.jsonl.gz" \
            --snapshot-2026 "$P3_SNAPSHOT_2026" \
            --output "$RUNNER_TEMP/verification/649"
          mkdir -p "$RUNNER_TEMP/verification/compact"
          python research/phase3_20261010_24_extra41_batch_v1.py \
            --mode aggregate --panels "$RUNNER_TEMP/verification/649" \
            --out "$RUNNER_TEMP/verification/batch-unscored.json"
          python research/phase3_20261010_24_extra41_batch_v1.py \
            --mode compact --panels "$RUNNER_TEMP/verification/649" \
            --year 2026 --source "$P3_SNAPSHOT_2026" \
            --batch "$RUNNER_TEMP/verification/batch-unscored.json" \
            --out "$RUNNER_TEMP/verification/compact/prior-full-race-context-2026.pkl"
      - name: One shared strictly-prior 2019 through 2025 peer history for all 315 horses
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/verification"
          remote="$RUNNER_TEMP/original-snapshot-2019-25"
          mkdir -p "$remote"
          for year in 2019 2020 2021 2022 2023 2024 2025; do
            echo "P3_ALL24_PRIOR_CONTEXT_YEAR_START year=$year"
            bash scripts/fetch_original_state_history_snapshot.sh "$year" "$remote" | tee "$remote/fetch-$year.log"
            source=$(tail -n 1 "$remote/fetch-$year.log")
            test -s "$source"
            python research/phase3_20261010_24_extra41_batch_v1.py \
              --mode compact --panels "$out/649" \
              --year "$year" --source "$source" \
              --batch "$out/batch-unscored.json" \
              --out "$out/compact/prior-full-race-context-$year.pkl"
            python research/phase3_20261010_original_l1_24_cold_v1.py \
              --mode export --year "$year" --source "$source" \
              --prior-dir "$out/original-full-prior-model"
            rm -f "$source"
          done
          echo "P3_ALL24_COMPACT_PRIOR_HISTORY_READY"
      - name: Original batch numerics vs blind reconstruction for 24 x 41 feature values
        run: |
          set -euo pipefail
          python research/phase3_20261010_daybias_cached_v1.py \
            --panels "$RUNNER_TEMP/verification/649" \
            --source "$P3_SNAPSHOT_2026" \
            --compact-dir "$RUNNER_TEMP/verification/compact" \
            --out "$RUNNER_TEMP/verification/690"
          test "$(find "$RUNNER_TEMP/verification/690" -maxdepth 1 -name '2026*.json' | wc -l)" = 24
          echo "P3_ALL24_690_TRUE_NUMERICAL_INPUTS_VERIFIED_NOT_PREDICTION"
      - name: Real original 2024-25 LambdaRank fit once and blind-score all 24 target races
        run: |
          set -euo pipefail
          python research/phase3_20261010_original_l1_24_cold_v1.py \
            --mode score \
            --prior-dir "$RUNNER_TEMP/verification/original-full-prior-model" \
            --inputs-690 "$RUNNER_TEMP/verification/690" \
            --output "$RUNNER_TEMP/verification/original-real-l1-24"
          test "$(find "$RUNNER_TEMP/verification/original-real-l1-24" -maxdepth 1 -name '2026*.json' | wc -l)" = 24
          echo "ORIGINAL_L1_24_REAL_PREDICTION_COMPLETE_L175_L21_L3_NOT_YET"
