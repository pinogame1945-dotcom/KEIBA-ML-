name: Single race real BACKFILL two-day smoke (free CPU)

# One-shot push of THIS workflow file only. Subsequent code commits never
# rerun large BACKFILL sparse clones; manual workflow_dispatch is optional.
on:
  push:
    branches:
      - feature/single-race-engine-20261015
    paths:
      - ".github/workflows/single-race-real-archive-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-archive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify ephemeral disk and inspect historical BACKFILL Git tree only
        id: make_pair
        shell: bash
        run: |
          set -euo pipefail
          available=$(df -Pk . | tail -1 | awk '{print $4}')
          if [ "$available" -lt 3000000 ]; then
            echo "::error::Free ephemeral disk too small, refusing historical checkout"
            exit 1
          fi
          git clone --quiet --depth=1 --filter=blob:none --sparse \
            https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git \
            "$RUNNER_TEMP/keiba-backfill-partial"
          python3 scripts/prepare-real-archive-pair.py \
            "$RUNNER_TEMP/keiba-backfill-partial" \
            "$RUNNER_TEMP/keiba-backfill-smoke"
      - name: Real one-race BACKFILL-to-20-saved-model integrated replay (no retraining)
        shell: bash
        env:
          RACE_ID: ${{ steps.make_pair.outputs.race_id }}
          HISTORY_FROM: ${{ steps.make_pair.outputs.source_date }}
        run: |
          set -euo pipefail
          python3 research/analyze-one-race.py \
            --race "$RACE_ID" \
            --source-root "$RUNNER_TEMP/keiba-backfill-smoke" \
            --history-from "$HISTORY_FROM" \
            --github-saved \
            --require-scored \
            --output-dir "$RUNNER_TEMP/single-race-real-results"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"single-race-real-results"
          f=json.loads((root/"features.json").read_text())
          r=json.loads((root/"analysis.json").read_text())
          assert r["race_id"]==os.environ["RACE_ID"]
          assert f["history"]["days"]==1
          assert len(f["features_by_horse"])>=3
          assert r["starters"]==len(f["features_by_horse"])
          assert all("target" not in h and "market_outcome" not in h
                     for h in f["features_by_horse"])
          assert not any(m["status"]=="SCORED" for m in r["models"]), \
              "No promoted model binaries exist, do not invent scores"
          archived=r["saved_seven_kings"]
          assert archived["status"]=="GITHUB_ARCHIVED_7KING_REPLAY",archived
          assert archived["outsider_status"]=="VERIFIED_SAVED_BALLOTS"
          assert archived["seven_king_count"]==7
          assert archived["outsider_model_count"]==13
          assert len(r["horses"])==r["starters"]
          assert all(len(h["saved_seven_king_ranks"])==7 for h in r["horses"])
          assert all(h["archived_rank_sum_comparator_rank"]>=1 for h in r["horses"])
          print("REAL_ONE_RACE_ALL_SAVED_MODEL_REPLAY_PASS",
                r["race_id"],r["starters"],"horses",7,"kings",13,"outsiders")
          for h in sorted(r["horses"],key=lambda row:row["archived_rank_sum_comparator_rank"])[:6]:
              print("REAL_REPLAY_RANK",h["archived_rank_sum_comparator_rank"],
                    h["horse_number"],h["horse_name"],h["horse_id"],
                    "OUTSIDER_POINTS",h.get("saved_outsider_points"))
          PY
