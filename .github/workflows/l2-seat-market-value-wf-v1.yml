name: L2 Seat Market Value WF V1

on:
  push:
    branches:
      - research/l2-seat-market-value-wf-v1-20260930
    paths:
      - .github/triggers/l2-seat-market-value-wf-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-seat-market-value-wf-v1
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/materialize_l17_seven_king_fullfield_v1.py             research/build_l2_bet_kings_dataset_v1.py             research/run_l2_simple_rank_role_v1.py             research/run_l2_market_gap_v1.py             research/run_l2_seat_market_value_wf_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.load(open("contracts/l2-seat-market-value-wf-v1.json",encoding="utf-8"))
          assert c["contract"]=="L2_SEAT_MARKET_VALUE_WF_V1"
          assert c["years"]==[2022,2023,2024,2025]
          assert c["test_years"]==[2023,2024,2025]
          assert c["locked_years"]==[2026]
          inv=c["invariants"]
          for k in ("rerank_l1","train_on_test_year","test_outcome_as_selection_feature","payout_as_selection_feature","learn_skip_threshold","gate_used","outsider_used","production_promotion"):
              assert inv[k] is False,(k,inv[k])
          assert inv["payout_evaluation_only"] is True
          assert inv["current_final_trifecta_odds_as_selection_feature"] is True
          assert inv["current_final_popularity_as_group_feature"] is True
          cost=c["cost"]
          assert cost["standard_github_cpu_only"] is True
          for k in ("gpu","paid_runner","github_artifact","github_cache","persistent_kaggle_upload"):
              assert cost[k] is False,(k,cost[k])
          assert cost["kaggle_existing_datasets_read_only"] is True
          wf=Path(".github/workflows/l2-seat-market-value-wf-v1.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses),uses
          assert not any(u.startswith("actions/cache") for u in uses),uses
          print("L2_SEAT_MARKET_VALUE_WF_V1_GUARDS_OK")
          PY

      - name: Install Kaggle client only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle

      - name: Restore Seven-King horse scores metadata-first
        shell: bash
        run: |
          set -euo pipefail
          session_script="scripts/kaggle-dataset-session-v2.sh"
          test -s "$session_script"
          for y in 2022 2023 2024 2025; do
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              d="out/seat-market-value/scores/$y/$alias"
              ref="pino1945/keiba-l15-7k-$alias-y$y-v1"
              bash "$session_script" init "$ref" "$d"
              bash "$session_script" fetch "$d" score.jsonl
              p="$(find "$d" -type f \( -name 'score.jsonl.gz' -o -name 'score.jsonl' \) -print -quit)"
              test -n "$p"; test -s "$p"
              echo "SEVEN_SCORE_OK year=$y alias=$alias path=$p"
            done
          done

      - name: Materialize L1.7 full-field consensus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/seat-market-value/l17
          for y in 2022 2023 2024 2025; do
            args=()
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              p="$(find "out/seat-market-value/scores/$y/$alias" -type f \( -name 'score.jsonl.gz' -o -name 'score.jsonl' \) -print -quit)"
              test -n "$p"; test -s "$p"
              args+=(--expert "$alias=$p")
            done
            python research/materialize_l17_seven_king_fullfield_v1.py               --year "$y" "${args[@]}"               --output "out/seat-market-value/l17/l17-$y.jsonl.gz"
            test -s "out/seat-market-value/l17/l17-$y.jsonl.gz"
            echo "L17_$y=out/seat-market-value/l17/l17-$y.jsonl.gz" >> "$GITHUB_ENV"
          done

      - name: Sparse restore 2022-2025 race packs and odds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          cat > out/backfill/.git/info/sparse-checkout <<'EOF'
          /data/daily/2022-*.jsonl.gz
          /data/daily/2023-*.jsonl.gz
          /data/daily/2024-*.jsonl.gz
          /data/daily/2025-*.jsonl.gz
          /data/odds/daily/2022-*.jsonl.gz
          /data/odds/daily/2023-*.jsonl.gz
          /data/odds/daily/2024-*.jsonl.gz
          /data/odds/daily/2025-*.jsonl.gz
          EOF
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"
          echo "daily=$(find out/backfill/data/daily -type f -name '*.jsonl.gz' | wc -l)"
          echo "odds=$(find out/backfill/data/odds/daily -type f -name '*.jsonl.gz' | wc -l)"

      - name: Run market-value seat walk-forward
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-seat-market-value-wf-v1/run-$GITHUB_RUN_ID"
          python research/run_l2_seat_market_value_wf_v1.py             --l17-year "2022:$L17_2022"             --l17-year "2023:$L17_2023"             --l17-year "2024:$L17_2024"             --l17-year "2025:$L17_2025"             --backfill-root out/backfill             --out-dir "$result"

          echo "===== SUMMARY ====="
          cat "$result/summary.json"
          echo "===== COMBINED ====="
          cat "$result/walkforward-combined.csv"
          echo "===== COVERAGE ====="
          cat "$result/coverage.csv"

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner."
          echo "No actions/cache and no upload-artifact."
          echo "Existing Kaggle score datasets are read-only."
          echo "No Kaggle dataset/model persistence."
          echo "Race packs and odds are read from fixed GitHub data at BACKFILL_SHA."
          echo "Only compact CSV/JSON/README outputs are committed."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-seat-market-value-wf-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add             "$result/README.md"             "$result/summary.json"             "$result/walkforward-yearly.csv"             "$result/walkforward-combined.csv"             "$result/seat-choice-counts.csv"             "$result/coverage.csv"
          git commit -m "research: archive market-value seat WF run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
