name: L1.5 7K Score One King Year

on:
  workflow_call:
    inputs:
      candidate:
        required: true
        type: string
      validation_year:
        required: true
        type: number
      alias:
        required: true
        type: string
    secrets:
      KEIBA_ML_SNAPSHOTS:
        required: true

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      MATRIX_CANDIDATE: ${{ inputs.candidate }}
      VALIDATION_YEAR: ${{ inputs.validation_year }}
      ALIAS: ${{ inputs.alias }}
      GENERATION_ID: eb13d4096519167b
      KAGGLE_DATASET_REF: pino1945/keiba-ml-snapshot-eb13d4096519167b

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax
        run: |
          set -euo pipefail
          python -m py_compile \
            research/run_feature_arena.py \
            research/train-staged-lightgbm.py \
            research/emit_l1_to_l2.py \
            research/persist_exact_kaggle_dataset.py
          node --check research/project-yearly-snapshots.mjs
          bash -n scripts/kaggle-fetch-snapshot.sh
          bash -n scripts/kaggle-storage-preflight.sh

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Storage preflight before compute
        run: bash scripts/kaggle-storage-preflight.sh

      - name: Resolve candidate and fold
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          cfg=json.loads(Path("research/l1-raceclass-absorption-walkforward-v1.json").read_text(encoding="utf-8"))
          assert cfg["snapshot_generation"]=="eb13d4096519167b"
          assert cfg["training_window_years"]==2
          assert 2026 in cfg["locked_years"]
          y=int(os.environ["VALIDATION_YEAR"])
          if y not in cfg["validation_years"] or y==2026:
              raise SystemExit("invalid validation year")
          name=os.environ["MATRIX_CANDIDATE"]
          row=next((x for x in cfg["candidates"] if x["name"]==name),None)
          if row is None:
              raise SystemExit("candidate missing")
          cand={"name":name,"feature_sets":row["feature_sets"]}
          for k in ("actor_prefixes","auto_slices","pedigree_slices"):
              cand[k]=row.get(k) or []
          Path("candidate.json").write_text(json.dumps([cand],ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          env={
            "TRAIN_YEAR_1":str(y-2),
            "TRAIN_YEAR_2":str(y-1),
            "TRAIN_START":f"{y-2}-01-01",
            "TRAIN_END":f"{y-1}-12-31",
            "VALID_START":f"{y}-01-01",
            "VALID_END":f"{y}-12-31",
            "FEATURE_SETS_JSON":json.dumps(cand["feature_sets"],separators=(",",":")),
            "ACTOR_PREFIXES_JSON":json.dumps(cand["actor_prefixes"],separators=(",",":")),
            "AUTO_SLICES_JSON":json.dumps(cand["auto_slices"],separators=(",",":")),
            "PEDIGREE_SLICES_JSON":json.dumps(cand["pedigree_slices"],separators=(",",":")),
          }
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              for k,v in env.items(): f.write(f"{k}={v}\n")
          print("SEVEN_KING_SCORE",name,y-2,y-1,"->",y)
          PY

      - name: Restore exact rolling snapshots
        shell: bash
        run: |
          set -euo pipefail
          root="out/score-source/$GENERATION_ID"
          mkdir -p "$root"
          for y in "$TRAIN_YEAR_1" "$TRAIN_YEAR_2" "$VALIDATION_YEAR"; do
            bash scripts/kaggle-fetch-snapshot.sh "$GENERATION_ID" "$y" "$root"
          done
          paths=()
          for y in "$TRAIN_YEAR_1" "$TRAIN_YEAR_2" "$VALIDATION_YEAR"; do
            if [[ -s "$root/snapshot-$y.jsonl" ]]; then paths+=("$root/snapshot-$y.jsonl")
            elif [[ -s "$root/snapshot-$y.jsonl.gz" ]]; then paths+=("$root/snapshot-$y.jsonl.gz")
            else echo "::error::snapshot $y missing"; exit 1; fi
          done
          echo "INPUTS=$(IFS=,; echo "${paths[*]}")" >> "$GITHUB_ENV"

      - name: Score king
        shell: bash
        run: |
          set -euo pipefail
          out="out/seven-score/$MATRIX_CANDIDATE-y$VALIDATION_YEAR"
          python research/run_feature_arena.py \
            --inputs "$INPUTS" \
            --out-dir "$out" \
            --train-start "$TRAIN_START" \
            --train-end "$TRAIN_END" \
            --valid-start "$VALID_START" \
            --valid-end "$VALID_END" \
            --train-race-class ALL \
            --valid-race-class ALL \
            --prediction-phase FINAL \
            --feature-selection none \
            --candidates-json candidate.json \
            --source-ref main \
            --ml-source-sha "$GITHUB_SHA" \
            --keep-projections

          projection="$(find "$out/projections" -type f -name '*.jsonl.gz' -print -quit)"
          model="$(find "$out/models" -type f -name '*.txt' -print -quit)"
          meta="$(find "$out/models" -type f -name '*.json' -print -quit)"
          schema="$(find "$out/schemas" -type f -name '*-schema.json' -print -quit)"
          for x in "$projection" "$model" "$meta" "$schema"; do test -n "$x"; test -s "$x"; done

          python research/emit_l1_to_l2.py \
            --dataset "$projection" \
            --model "$model" \
            --schema "$schema" \
            --meta "$meta" \
            --output "$out/score.jsonl.gz" \
            --candidate-name "$MATRIX_CANDIDATE" \
            --feature-sets-json "$FEATURE_SETS_JSON" \
            --actor-prefixes-json "$ACTOR_PREFIXES_JSON" \
            --auto-slices-json "$AUTO_SLICES_JSON" \
            --pedigree-slices-json "$PEDIGREE_SLICES_JSON" \
            --valid-start "$VALID_START" \
            --valid-end "$VALID_END" \
            --chunk-size 64

      - name: Validate score
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,json,os
          from pathlib import Path
          p=Path(f"out/seven-score/{os.environ['MATRIX_CANDIDATE']}-y{os.environ['VALIDATION_YEAR']}/score.jsonl.gz")
          rows=0; races=set()
          with gzip.open(p,"rt",encoding="utf-8") as f:
              for line in f:
                  if not line.strip(): continue
                  x=json.loads(line); rows+=1; races.add(str(x["race_id"]))
                  assert x["contract"]=="L1_TO_L2_OUTPUT_CONTRACT_V1"
                  assert str(x["race_date"])[:4]==os.environ["VALIDATION_YEAR"]
          if not rows or not races: raise SystemExit("empty score")
          print("SEVEN_KING_SCORE_OK",os.environ["MATRIX_CANDIDATE"],os.environ["VALIDATION_YEAR"],rows,len(races))
          PY

      - name: Persist exact horse-level score
        shell: bash
        run: |
          set -euo pipefail
          out="out/seven-score/$MATRIX_CANDIDATE-y$VALIDATION_YEAR"
          stage="out/seven-stage"
          rm -rf "$stage"; mkdir -p "$stage"
          cp "$out/score.jsonl.gz" "$stage/score.jsonl.gz"
          cp "$out/feature-arena-summary.json" "$stage/feature-arena-summary.json"
          cp candidate.json "$stage/candidate.json"
          cp "$(find "$out/models" -type f -name '*.txt' -print -quit)" "$stage/model.txt"
          cp "$(find "$out/models" -type f -name '*.json' -print -quit)" "$stage/model.json"
          cp "$(find "$out/schemas" -type f -name '*-schema.json' -print -quit)" "$stage/schema.json"
          ref="pino1945/keiba-l15-7k-$ALIAS-y$VALIDATION_YEAR-v1"
          python research/persist_exact_kaggle_dataset.py \
            --ref "$ref" \
            --title "KEIBA L15 7K $ALIAS Y$VALIDATION_YEAR V1" \
            --source-dir "$stage"

      - name: Cost guard
        if: always()
        run: |
          echo "Standard ubuntu-latest CPU only."
          echo "No GPU. No GitHub Artifact/Cache."
          echo "Kaggle storage checked once before compute using remote file sizes."
          echo "2026 never read."
