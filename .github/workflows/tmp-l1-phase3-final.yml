name: Temporary L1 Phase3 final smoke

on:
  push:
    branches:
      - feature/l1-phase3-research-selection-v1-20260927
    paths:
      - .github/workflows/tmp-l1-phase3-final.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node smoke suite
        run: npm run smoke:all

      - name: Python syntax
        run: python -m py_compile research/run_phase3_selection.py research/run_walk_forward.py research/train-staged-lightgbm.py research/trainer-foundation-smoke.py

      - name: BASE plus one plan
        shell: bash
        run: |
          set -euo pipefail
          python research/run_phase3_selection.py \
            --source-root nowhere \
            --matrix base_plus_one \
            --first-holdout 2025 \
            --last-holdout 2025 > /tmp/phase3-plan.txt
          python - <<'PY'
          import json
          text = open("/tmp/phase3-plan.txt", encoding="utf-8").read()
          payload = json.loads(text.split("L1_PHASE3_RESEARCH_PLAN", 1)[1])
          assert payload["locked_year"] == 2026, payload
          assert payload["candidate_count"] == 11, payload
          labels = [x["label"] for x in payload["candidates"]]
          assert "BASE" in labels
          assert "BASE+PEDIGREE" in labels
          assert "BASE+ACTOR" in labels
          assert "BASE+TIME_PACE" in labels
          PY

      - name: Window and selection plan
        run: |
          python research/run_phase3_selection.py \
            --source-root nowhere \
            --matrix windows \
            --reference-feature-sets "BASE,OPPONENT,STYLE,AUTO,ACTOR,TIME_PACE" \
            --first-holdout 2025 \
            --last-holdout 2025
          python research/run_phase3_selection.py \
            --source-root nowhere \
            --matrix feature_selection \
            --reference-feature-sets "BASE,PEDIGREE,ACTOR,TIME_PACE" \
            --first-holdout 2025 \
            --last-holdout 2025

      - name: 2026 lock
        shell: bash
        run: |
          set -euo pipefail
          if python research/run_phase3_selection.py \
            --source-root nowhere \
            --matrix base_plus_one \
            --first-holdout 2026 \
            --last-holdout 2026; then
            echo "Phase3 2026 lock unexpectedly opened" >&2
            exit 1
          fi
          if python research/run_walk_forward.py \
            --source-root nowhere \
            --first-holdout 2026 \
            --last-holdout 2026 \
            --plan-only; then
            echo "Walk-forward 2026 lock unexpectedly opened" >&2
            exit 1
          fi

      - name: Install ML dependencies
        run: python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Trainer foundation smoke
        run: python research/trainer-foundation-smoke.py

      - name: Cost guard
        run: |
          if grep -R -E "uses:[[:space:]]*actions/upload-artifact" .github/workflows; then
            echo "Persistent artifact upload found" >&2
            exit 1
          fi
