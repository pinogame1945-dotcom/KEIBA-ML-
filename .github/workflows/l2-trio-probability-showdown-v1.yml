name: L2 TRIO Probability Showdown V1

on:
  push:
    branches:
      - research/l2-trio-probability-showdown-v1-20261004
    paths:
      - .github/triggers/l2-trio-probability-showdown-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-trio-probability-showdown-v1
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1
      OUTSIDER_SOURCE_BRANCH: research/l16-outsider-support-safe-v1-20260930

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static and cost guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/materialize_l17_seven_king_fullfield_v1.py             research/extract_l2_core_dates_v1.py             research/build_l2_core_v1_dataset.py             research/build_l2_bet_kings_dataset_v1.py             research/run_l2_trio_probability_v2.py             research/run_l2_trio_market_residual_v3.py             research/run_l2_trio_probability_showdown_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.load(open('contracts/l2-trio-probability-showdown-v1.json',encoding='utf-8'))
          assert c['contract']=='L2_TRIO_PROBABILITY_SHOWDOWN_V1'
          assert c['locked_years']==[2026]
          assert c['roi_policy']['probability_times_odds_ranking'] is False
          assert c['roi_policy']['odds_can_promote_ticket'] is False
          assert c['cost_policy']['github_standard_cpu_only'] is True
          assert c['cost_policy']['gpu'] is False
          assert c['cost_policy']['paid_runner'] is False
          assert c['cost_policy']['paid_artifact_or_cache'] is False
          assert c['data_policy']['kaggle_metadata_first'] is True
          assert c['data_policy']['404_retry'] is False
          wf=Path('.github/workflows/l2-trio-probability-showdown-v1.yml').read_text().splitlines()
          runners=[x.strip().split(':',1)[1].strip() for x in wf if x.strip().startswith('runs-on:')]
          uses=[x.strip().split(':',1)[1].strip() for x in wf if x.strip().startswith('- uses:')]
          assert runners==['ubuntu-latest'],runners
          assert not any(u.startswith('actions/upload-artifact') for u in uses)
          assert not any(u.startswith('actions/cache') for u in uses)
          src=Path('research/run_l2_trio_probability_showdown_v1.py').read_text()
          for token in ('CURRENT_HARVILLE_PL','DISCOUNTED_HARVILLE','POSITION_SPECIFIC_1_2_3','DIRECT_TRIO'):
              assert token in src
          assert 'BANNED_DIRECT_SUBSTRINGS' in src
          assert 'probability_times_odds_ranking' in src
          assert '"2026_locked":True' in src
          print('L2_TRIO_PROBABILITY_SHOWDOWN_STATIC_GUARDS_OK')
          PY
          bash -n scripts/kaggle-dataset-session-v2.sh

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore seven score tables once metadata-first
        shell: bash
        run: |
          set -euo pipefail
          session='scripts/kaggle-dataset-session-v2.sh'
          fetch_year() {
            y="$1"
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              d="out/l2-trio-probability-showdown-v1/scores/$y/$alias"
              ref="pino1945/keiba-l15-7k-$alias-y$y-v1"
              bash "$session" init "$ref" "$d"
              bash "$session" fetch "$d" score.jsonl
              p="$(find "$d" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
              test -n "$p"; test -s "$p"
            done
          }
          export -f fetch_year
          export session
          printf '%s\n' 2022 2023 2024 2025 | xargs -n1 -P2 bash -c 'fetch_year "$1"' _

      - name: Materialize L1.7 once per year
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l2-trio-probability-showdown-v1/l17
          build_l17_year() {
            y="$1"
            args=()
            for spec in core4_no_pedigree=core4 no_auto_full_pedigree_legacy=pedlegacy jockey_trainer_condition=condition no_auto_full=full no_auto_jockey=light no_auto_full_pedigree_v1=pedv1 jockey_trainer_condition_plus_raceclass=condrc; do
              name="${spec%%=*}"; alias="${spec##*=}"
              p="$(find "out/l2-trio-probability-showdown-v1/scores/$y/$alias" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
              args+=(--expert "$name=$p")
            done
            p="out/l2-trio-probability-showdown-v1/l17/l17-$y.jsonl.gz"
            python research/materialize_l17_seven_king_fullfield_v1.py --year "$y" "${args[@]}" --output "$p"
            test -s "$p"
          }
          export -f build_l17_year
          printf '%s\n' 2022 2023 2024 2025 | xargs -n1 -P2 bash -c 'build_l17_year "$1"' _
          for y in 2022 2023 2024 2025; do
            echo "L17_$y=out/l2-trio-probability-showdown-v1/l17/l17-$y.jsonl.gz" >> "$GITHUB_ENV"
          done

      - name: Resolve dates and restore exact BACKFILL files once
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for y in 2022 2023 2024 2025; do
            p="$(find "out/l2-trio-probability-showdown-v1/scores/$y/core4" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
            args+=(--score-year "$y:$p")
          done
          python research/extract_l2_core_dates_v1.py "${args[@]}"             --dates-out out/l2-trio-probability-showdown-v1/all-dates.txt             --race-dates-out out/l2-trio-probability-showdown-v1/race-dates.csv
          rm -rf out/backfill
          git init out/backfill
          git -C out/backfill remote add origin https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git
          git -C out/backfill sparse-checkout init --no-cone
          {
            while IFS= read -r d; do
              [[ -n "$d" ]] || continue
              echo "/data/daily/$d.jsonl.gz"
              echo "/data/odds/daily/$d.jsonl.gz"
            done < out/l2-trio-probability-showdown-v1/all-dates.txt
          } > out/backfill/.git/info/sparse-checkout
          git -C out/backfill fetch --filter=blob:none --depth=1 origin "$BACKFILL_SHA"
          git -C out/backfill checkout --detach FETCH_HEAD
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Build horse rows once
        shell: bash
        run: |
          set -euo pipefail
          python research/build_l2_core_v1_dataset.py             --l17-year "2022:$L17_2022"             --l17-year "2023:$L17_2023"             --l17-year "2024:$L17_2024"             --l17-year "2025:$L17_2025"             --race-dates out/l2-trio-probability-showdown-v1/race-dates.csv             --backfill-root out/backfill             --out-dir out/l2-trio-probability-showdown-v1/horse-dataset

      - name: Restore frozen Outsider podium context once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l2-trio-probability-showdown-v1/outsider
          git fetch --depth=1 origin "$OUTSIDER_SOURCE_BRANCH":refs/remotes/origin/l2-trio-probability-showdown-v1-outsider-source
          git show origin/l2-trio-probability-showdown-v1-outsider-source:research-results/l17-king-outsider-podium-calibrator-wf-v1/run-36747215581/predictions.csv.gz > out/l2-trio-probability-showdown-v1/outsider/predictions.csv.gz
          test -s out/l2-trio-probability-showdown-v1/outsider/predictions.csv.gz

      - name: Run final TRIO probability showdown
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-trio-probability-showdown-v1/run-$GITHUB_RUN_ID"
          PYTHONPATH=research python research/run_l2_trio_probability_showdown_v1.py             --contract contracts/l2-trio-probability-showdown-v1.json             --dataset-dir out/l2-trio-probability-showdown-v1/horse-dataset             --backfill-root out/backfill             --outsider-predictions out/l2-trio-probability-showdown-v1/outsider/predictions.csv.gz             --matrix-cache out/l2-trio-probability-showdown-v1/matrix-cache             --out-dir "$result"
          cat "$result/decision.csv"
          cat "$result/probability-metrics.csv"
          cat "$result/roi-topk.csv"
          cat "$result/fullfield-p3-calibration.csv"
          du -sh "$result"
          test "$(du -sm "$result" | cut -f1)" -le 15

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo 'Standard GitHub-hosted ubuntu-latest CPU only.'
          echo 'No GPU / paid runner / paid cloud compute.'
          echo 'No actions/cache or upload-artifact.'
          echo 'No Kaggle upload or paid storage.'
          echo 'Kaggle reads are metadata-first and session-reused.'
          echo 'BACKFILL sparse checkout is runner-local and reused.'
          echo 'Only compact CSV/JSON summaries are committed.'
          echo '2026 remains sealed.'

      - name: Commit compact summaries only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-trio-probability-showdown-v1/run-$GITHUB_RUN_ID"
          git config user.name 'keiba-ml-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result/README.md" "$result/summary.json" "$result/probability-metrics.csv" "$result/roi-topk.csv" "$result/parameters.csv" "$result/discount-alpha-grid.csv" "$result/market-blend-beta-grid.csv" "$result/temperature-grid.csv" "$result/fullfield-p3-calibration.csv" "$result/decision.csv"
          git commit -m "research: archive TRIO probability showdown V1 $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
