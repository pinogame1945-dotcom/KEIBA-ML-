name: All Race Flow Ticket Coverage V1

on:
  push:
    branches:
      - research/all-race-flow-ticket-audit-v1-20261015
    paths:
      - .github/triggers/all-race-flow-ticket-audit-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: all-race-flow-ticket-audit-v1
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static and cost checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/run_all_race_flow_ticket_audit_v1.py
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/all-race-flow-ticket-audit-v1.yml").read_text()
          assert [x.strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")] == ["runs-on: ubuntu-latest"]
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/cache") or u.startswith("actions/upload-artifact") for u in uses)
          print("STATIC_COST_GUARDS_OK")
          PY
      - name: Install lightweight dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pandas
      - name: Compute fixed-rule flow coverage across all 10368 races
        shell: bash
        run: |
          set -euo pipefail
          pred="research-results/market-fixed-anchor-residual-v2/run-38659856085/oos-fair-value-predictions.csv.gz"
          picks="research-results/all-race-one-pick-v1/run-38668174639/all-race-one-picks.csv.gz"
          test -s "$pred"
          test -s "$picks"
          result="research-results/all-race-flow-ticket-audit-v1/run-$GITHUB_RUN_ID"
          python research/run_all_race_flow_ticket_audit_v1.py --predictions "$pred" --picks "$picks" --out-dir "$result"
      - name: Cost guard log
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted CPU only. No Kaggle download, paid runner, GPU, caches or uploaded artifacts."
          echo "2026 sealed. Existing OOS inputs reused; no prediction model retraining."
      - name: Archive compact research report
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/all-race-flow-ticket-audit-v1/run-$GITHUB_RUN_ID"
          test -s "$result/summary.json"
          test -s "$result/all-race-flow-ticket-coverage.csv"
          test -s "$result/sample-race-combinations.csv.gz"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: archive all-race flow-ticket audit $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
