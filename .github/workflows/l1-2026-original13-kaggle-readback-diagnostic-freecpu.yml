name: Original 13 Kaggle private readback diagnostic (free CPU)
on:
  push:
    branches: [feature/l1-7king-2026-928-preflight-20261017]
    paths:
      - .github/workflows/l1-2026-original13-kaggle-readback-diagnostic-freecpu.yml
permissions:
  contents: read
jobs:
  inspect-existing-original13:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      REF: pino1945/keiba-ml-2026-original13-outsider-candidate-v1
    steps:
      - name: Require public standard free CPU runner and configured token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import json,urllib.request
          req=urllib.request.Request('https://api.github.com/repos/pinogame1945-dotcom/KEIBA-ML-',headers={'User-Agent':'keiba-free-cpu-check'})
          assert json.load(urllib.request.urlopen(req,timeout=30)).get('private') is False, 'STOP_GITHUB_NOT_PUBLIC'
          print('PUBLIC_FREE_STANDARD_CPU_VERIFIED')
          PY
      - name: Check prior upload visibility and verify remote model bundle without training or uploading
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --disable-pip-version-check kaggle
          python - <<'PY'
          import hashlib,json,os,subprocess,time
          from pathlib import Path
          from tempfile import TemporaryDirectory
          ref=os.environ['REF']
          def call(cmd):
              p=subprocess.run(cmd,text=True,capture_output=True)
              return p.returncode,(p.stdout or ''),(p.stderr or '')
          owned=False
          for page in range(1,501):
              code,out,err=call(['kaggle','datasets','list','--mine','--page',str(page),'--format','json(ref)'])
              if code:
                  raise SystemExit('MINE_LIST_ERROR '+err[-350:])
              try: rows=json.loads(out)
              except json.JSONDecodeError: rows=[]
              if not rows: break
              if any(r.get('ref')==ref for r in rows):
                  owned=True
                  break
          print('TARGET_DATASET_LISTED_AS_MINE='+str(owned).lower(),flush=True)
          code,out,err=call(['kaggle','datasets','status',ref])
          print('TARGET_STATUS_RETURN='+str(code)+' TEXT='+str((out or err)[-350:]),flush=True)
          code,out,err=call(['kaggle','datasets','files',ref,'--page-size','100','--format','json(name,size)'])
          print('TARGET_FILES_RETURN='+str(code)+' TEXT='+str((out if code else err)[-350:]),flush=True)
          if code==0:
              rows=json.loads(out)
              print('TARGET_REMOTE_FILE_COUNT='+str(len(rows)),flush=True)
          if not owned:
              raise SystemExit('STOP_DATASET_NOT_OWNED_OR_NOT_VISIBLE_NO_OVERWRITE')
          with TemporaryDirectory() as t:
              dest=Path(t)
              for attempt in range(3):
                  code,out,err=call(['kaggle','datasets','download',ref,'-p',str(dest),'--unzip','--quiet','--force'])
                  if code==0: break
                  print('REMOTE_READBACK_FAILED attempt='+str(attempt+1)+' error='+err[-350:],flush=True)
                  if attempt<2: time.sleep(15)
              if code:
                  raise SystemExit('STOP_PRIVATE_KAGGLE_DOWNLOAD_FORBIDDEN_NO_RETRAIN')
              idx=json.loads((dest/'index.json').read_text(encoding='utf-8'))
              assert idx['outsider_candidate_count']==13 and idx['2026_candidate_approval_status']=='UNRELEASED_RESEARCH_ONLY'
              checks={n:v['sha256'] for candidate in idx['candidates'].values() for n,v in candidate['files'].items()}
              assert len(checks)==78
              for name,expected in checks.items():
                  p=dest/name
                  assert p.is_file(), 'MISSING_REMOTE_FILE:'+name
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==expected, 'REMOTE_SHA_MISMATCH:'+name
              print('EXISTING_PRIVATE_ORIGINAL13_REMOTE_READBACK_VERIFIED 13_MODELS 78_MODEL_FILES PLUS_INDEX',flush=True)
          PY
