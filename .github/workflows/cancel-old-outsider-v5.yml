name: Cancel Old Outsider V5

on:
  push:
    branches:
      - research/l1-outsider-arena-v1-20260928
    paths:
      - .github/triggers/cancel-old-outsider-v5.trigger

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force cancel old run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: "36399041275"
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/body -w '%{http_code}'             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/force-cancel")"
          cat /tmp/body || true
          if [[ "$code" != "202" && "$code" != "409" ]]; then
            echo "::error::force-cancel failed HTTP $code"
            exit 1
          fi
          echo "force-cancel accepted/already terminal: HTTP $code"
