name: L2 Router Arena V1

on:
  push:
    branches:
      - research/l2-router-arena-v1-20260929
    paths:
      - .github/triggers/l2-router-arena-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-router-arena-v1
  cancel-in-progress: true

jobs:
  router-arena:
    name: three-router-kodoku
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1
      FIXED_LEDGER_DIR: research-results/l15-fixed-v1
      MARKET_GAP_RACE_SUMMARY: research-results/l21-market-gap-v1/run-36508670081/race-summary.csv
      K2_NOVEL_LEDGER: research-results/l21-k2-novel-decomp-v1/run-36509430674/novel-ledger.csv

    steps:
      - name: Checkout Router Arena branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Contract syntax leakage and cost guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/extract_l2_bet_kings_dates_v1.py \
            research/build_l2_bet_kings_dataset_v1.py \
            research/run_l2_bet_kings_arena_v1.py \
            research/run_l2_router_arena_v1.py
          python - <<'PY'
          import json
          c=json.load(open("contracts/l2-router-arena-v1.json",encoding="utf-8"))
          assert c["contract"]=="L2_ROUTER_ARENA_V1"
          assert c["upstream"]["l15_contract"]=="L15_FIXED_V1"
          assert c["upstream"]["l15_sha"]=="2db82c3ca3cfab6cf35c33cdf7a70d9972eced04"
          assert c["scope"]["locked_years"]==[2026]
          assert c["scope"]["place_bets"] is False
          assert c["scope"]["wide_bets"] is False
          assert c["probability_model"]["market_features_allowed"] is False
          assert c["router_walk_forward"]["evaluation_folds"]==[
              {"test_year":2024,"router_train_years":[2023]},
              {"test_year":2025,"router_train_years":[2023,2024]},
          ]
          assert c["research_leader_selection"]["promotion"].startswith("No production FIX")
          print("L2_ROUTER_ARENA_CONTRACT_OK")
          PY
          test -s "$MARKET_GAP_RACE_SUMMARY"
          test -s "$K2_NOVEL_LEDGER"
          if grep -E "uses:[[:space:]]*actions/(upload-artifact|cache)" .github/workflows/l2-router-arena-v1.yml; then
            echo "Artifact/Cache use is forbidden" >&2
            exit 1
          fi
          if grep -E "runs-on:.*(gpu|large|xlarge|[0-9]+-core)" .github/workflows/l2-router-arena-v1.yml; then
            echo "Paid/non-standard runner guard triggered" >&2
            exit 1
          fi

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            kaggle \
            pandas \
            numpy \
            scikit-learn \
            lightgbm

      - name: Restore 2022-2025 seven-king routers once
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/kaggle-fetch-router-years.sh "2022,2023,2024,2025" out/l2-router/router
          for y in 2022 2023 2024 2025; do
            p="$(find "out/l2-router/router/$y" -type f \( -name 'router-7k.jsonl' -o -name 'router-7k.jsonl.gz' \) -print -quit)"
            test -n "$p"
            test -s "$p"
            echo "ROUTER_$y=$p" >> "$GITHUB_ENV"
          done

      - name: Resolve all 2022-2025 race dates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l2-router
          python research/extract_l2_bet_kings_dates_v1.py \
            --router-year "2022:$ROUTER_2022" \
            --router-year "2023:$ROUTER_2023" \
            --router-year "2024:$ROUTER_2024" \
            --router-year "2025:$ROUTER_2025" \
            --dates-out out/l2-router/all-dates.txt \
            --race-dates-out out/l2-router/all-race-dates.csv

      - name: Sparse restore required BACKFILL market packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone \
            --depth 1 \
            --filter=blob:none \
            --no-checkout \
            https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git \
            out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          {
            echo "/data/manifest.json"
            echo "/data/odds/manifest.json"
            while IFS= read -r d; do
              [[ -n "$d" ]] || continue
              echo "/data/daily/$d.jsonl.gz"
              echo "/data/odds/daily/$d.jsonl.gz"
            done < out/l2-router/all-dates.txt
          } > out/backfill/.git/info/sparse-checkout
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Build frozen 23-template ticket datasets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/l2-router/dataset
          mkdir -p out/l2-router/dataset
          python research/build_l2_bet_kings_dataset_v1.py \
            --fixed-ledger-dir "$FIXED_LEDGER_DIR" \
            --router-year "2022:$ROUTER_2022" \
            --router-year "2023:$ROUTER_2023" \
            --router-year "2024:$ROUTER_2024" \
            --router-year "2025:$ROUTER_2025" \
            --backfill-root out/backfill \
            --out-dir out/l2-router/dataset

      - name: Run three Router Arena
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-router-arena-v1/run-$GITHUB_RUN_ID"
          rm -rf out/l2-router/work
          mkdir -p out/l2-router/work
          python research/run_l2_router_arena_v1.py \
            --contract contracts/l2-router-arena-v1.json \
            --dataset-dir out/l2-router/dataset \
            --market-gap-race-summary "$MARKET_GAP_RACE_SUMMARY" \
            --k2-novel-ledger "$K2_NOVEL_LEDGER" \
            --work-dir out/l2-router/work \
            --out-dir "$result"
          echo "===== SUMMARY ====="
          cat "$result/summary.json"
          echo "===== ROUTER METRICS ====="
          cat "$result/router-metrics.csv"
          echo "===== ROUTER CANDIDATES ====="
          cat "$result/router-candidates.csv"

      - name: Research cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner."
          echo "No GitHub Artifact or Cache."
          echo "Kaggle router datasets are read-only."
          echo "BACKFILL is sparse-cloned read-only at a pinned commit."
          echo "Ephemeral ticket/strategy datasets stay on the runner and are not persisted."
          echo "Only compact Router CSV/JSON/README ledgers are committed."
          echo "2026 remains sealed."

      - name: Commit compact Router Arena ledger
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-router-arena-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add \
            "$result/README.md" \
            "$result/summary.json" \
            "$result/phit-fold-status.csv" \
            "$result/router-fold-status.csv" \
            "$result/router-selections.csv" \
            "$result/router-metrics.csv" \
            "$result/router-candidates.csv"
          git commit -m "research: archive L2 Router Arena run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
