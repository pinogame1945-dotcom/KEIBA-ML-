name: Cancel Old Arenas For Mitigation

on:
  push:
    branches:
      - research/l1-outsider-arena-v1-20260928
    paths:
      - .github/triggers/cancel-old-arenas-for-mitigation.trigger

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force cancel old arena runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for RUN_ID in 36402183438 36402186745; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/force-cancel")"
            cat /tmp/body || true
            if [[ "$code" != "202" && "$code" != "409" ]]; then
              echo "::error::force-cancel failed run=$RUN_ID HTTP $code"
              exit 1
            fi
          done
