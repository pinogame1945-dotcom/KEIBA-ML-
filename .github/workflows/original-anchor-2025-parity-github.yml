name: Original frozen ANCHOR FULL 2025 source parity - Free CPU
on:
  push:
    branches:
      - feature/l3-v3-official-github-producer-20261016
    paths:
      - ".github/workflows/original-anchor-2025-parity-github.yml"
      - "research/replay-original-anchor-coefficients-2025.py"
      - "research/anchor-original-feature-geometry.py"
      - "research/score_github_original_anchor_asof.py"
      - "scripts/build_original_anchor_2025_params_github.sh"
      - "scripts/original-anchor-real-feature-parity.py"
permissions:
  contents: read
jobs:
  original-anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Check source, free runner and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/replay-original-anchor-coefficients-2025.py
          free=$(df -Pk "$RUNNER_TEMP" | tail -1 | awk '{print $4}')
          test "$free" -gt 1800000 || { echo "::error::No safe ephemeral space."; exit 1; }
      - name: Reconstruct archived 2025 original ANCHOR FULL from prior-only coefficients
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/original-anchor"
          mkdir -p "$root"
          bash scripts/build_original_anchor_2025_params_github.sh "$root"
          cp "$root/original-prior-2025-parity.json" "$root/proven.json"
          python3 scripts/original-anchor-real-feature-parity.py \
            --cache "$root/fair-base.csv.gz" \
            --predictions "$root/saved-oos.csv.gz" \
            --parameters "$root/original-prior-anchor-asof-params.json" \
            --race 202507010212 \
            --output "$root/19-feature-real-final-parity.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          z=json.loads((Path(os.environ["RUNNER_TEMP"])/"original-anchor"/"proven.json").read_text())
          model=json.loads((Path(os.environ["RUNNER_TEMP"])/"original-anchor"/"original-prior-anchor-asof-params.json").read_text())
          assert model["trained_only_on_years"] == [2022,2023,2024]
          assert model["variant"]=="ANCHOR_FULL"
          assert model["market_quote_asof_required"] is True
          assert model["prerace_risk_model_unavailable_or_not_yet_verified"] is True
          assert set(model["coefficients"])==set(model["standardizer"])
          assert len(model["coefficients"])==19
          assert z["original_anchored_probs_match"]
          assert z["training_data_years"] == [2022,2023,2024]
          assert z["heldout_year"]==2025
          assert not z["prediction_prebet_time_verified"]
          assert z["horse_count"]==16,z
          geometry=json.loads((Path(os.environ["RUNNER_TEMP"])/"original-anchor"/"19-feature-real-final-parity.json").read_text())
          assert geometry["horses"]==16
          assert geometry["max_19_feature_abs_error"]<1e-10
          assert geometry["max_original_pwin_error"]<5e-7
          assert geometry["never_validated_as_of_or_prebet"]
          print("REAL_19_ANCHOR_FEATURES_FORMULA_AND_ORIGINAL_COEFFICIENTS_PASS",
                geometry["race_id"],geometry["horses"],geometry["max_original_pwin_error"])
          print("REAL_2025_FROZEN_ANCHOR_FULL_PROBABILITIES_REPRODUCED",
                z["race_id"],z["horse_count"],z["max_absolute_prob_difference"])
          PY
      - name: Free only and not a live model
        if: always()
        run: |
          echo "Free standard GitHub CPU; ephemeral files deleted with runner, no upload/artifacts/cache."
          echo "Original 2025 FINAL odds/ability/risk OOS parity only. Never a LIVE 2026 betting result."
