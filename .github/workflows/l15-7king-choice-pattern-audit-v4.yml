name: Seven King Choice Pattern Audit V4
on:
  push:
    branches: [research/l15-7king-choice-pattern-audit-v1-20260928]
    paths: [.github/triggers/l15-7king-choice-pattern-audit-v4.trigger]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install Kaggle
        run: python -m pip install --disable-pip-version-check kaggle
      - name: Restore existing router snapshots
        run: bash scripts/kaggle-fetch-router-years.sh "2022,2023,2024,2025" out/audit
      - name: Restore existing outsider scorecard
        run: |
          mkdir -p out/ledger
          curl -fL -H "Authorization: Bearer $GH_TOKEN" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/d63a7c4/research-results/l1-outsider-nonhorse-v1/OUTSIDER-NONHORSE-001/attempts/run-36419042735/scorecard.json" -o out/ledger/scorecard.json
      - name: Audit every vote pattern by uncertainty
        run: |
          args=(--scorecard out/ledger/scorecard.json)
          for y in 2022 2023 2024 2025; do
            p="$(find out/audit/$y -type f \( -name 'router-7k.jsonl' -o -name 'router-7k.jsonl.gz' \) -print -quit)"
            test -n "$p"; test -s "$p"
            args+=(--router-year "$y:$p")
          done
          python research/analyze_7king_choice_patterns_v4.py "${args[@]}"
      - name: Cost guard
        if: always()
        run: |
          echo "Standard ubuntu-latest CPU only."
          echo "No GPU. No paid runner. No Artifact/Cache. No new Kaggle persistence."
