name: Temporary pedigree schema inspect

on:
  push:
    branches:
      - test/pedigree-feature-builder-v1-20260927
    paths:
      - .github/workflows/tmp-pedigree-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout BACKFILL exact source
        uses: actions/checkout@v4
        with:
          repository: pinogame1945-dotcom/KEIBA-BACKFILL
          ref: 7e13f0a7f04b20d452a2e719c38a91924646e8e1
          path: backfill
      - name: Inspect horse pack schema
        shell: bash
        run: |
          set -euo pipefail
          echo "LATEST_HORSE_FILES"
          find backfill/data/horses -maxdepth 1 -type f -name 'horse-*.jsonl.gz' -printf '%f\n' | sort | tail -n 10
          LATEST=$(find backfill/data/horses -maxdepth 1 -type f -name 'horse-*.jsonl.gz' | sort | tail -n 1)
          echo "LATEST=$LATEST"
          echo "FIRST_ROW"
          gzip -cd "$LATEST" | head -n 1
          echo "DAILY_LATEST"
          find backfill/data/daily -maxdepth 1 -type f -name '*.jsonl.gz' -printf '%f\n' | sort | tail -n 5
