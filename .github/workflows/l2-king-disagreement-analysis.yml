name: L2 King Disagreement Analysis

on:
  push:
    branches:
      - research/l2-multi-expert-prototype-v1-20260928
    paths:
      - .github/workflows/l2-king-disagreement-analysis.yml
      - .github/triggers/l2-king-disagreement-analysis.trigger
      - research/analyze_l2_king_disagreement.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      L2_DATASET_REF: pino1945/keiba-ml-l2-02f30855869e0f46
      SNAPSHOT_GENERATION: bf811fa2eab73db0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax checks
        run: |
          set -euo pipefail
          python -m py_compile research/analyze_l2_king_disagreement.py
          bash -n scripts/kaggle-fetch-snapshot.sh

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check kaggle

      - name: Restore persisted L2 bundle
        shell: bash
        run: |
          set -euo pipefail
          root="out/l2-analysis/bundle"
          mkdir -p "$root"
          kaggle datasets download "$L2_DATASET_REF" -p "$root" --unzip --quiet --force
          echo "--- downloaded L2 files ---"
          find "$root" -maxdepth 2 -type f -print | sort

          manifest="$(find "$root" -name manifest.json -print -quit)"
          test -n "$manifest"
          test -s "$manifest"
          cat "$manifest"

          python - "$manifest" "$root" "$GITHUB_ENV" <<'PY'
          import json,sys
          from pathlib import Path
          manifest_path,root,env_path=sys.argv[1:]
          m=json.load(open(manifest_path,encoding="utf-8"))
          candidates={str(x.get("candidate")):str(x.get("file")) for x in m.get("expert_outputs",[])}
          aliases={
              "LIGHT_L2":"no_auto_jockey",
              "CORE_L2":"core4_no_pedigree",
          }
          with open(env_path,"a",encoding="utf-8") as env:
              for env_name,candidate in aliases.items():
                  declared=candidates.get(candidate)
                  options=[]
                  if declared:
                      options.append(Path(root)/declared)
                      if declared.endswith(".gz"):
                          options.append(Path(root)/declared[:-3])
                  options.extend(Path(root).rglob(f"*{candidate}*.jsonl*"))
                  options.extend(Path(root).rglob(f"*{candidate.replace('_','-')}*.jsonl*"))
                  found=next((p for p in options if p.is_file() and p.stat().st_size>0),None)
                  if not found:
                      raise SystemExit(f"could not resolve {candidate}; declared={declared}")
                  print(f"{env_name}={found}",file=env)
                  print(f"{env_name} -> {found}")
          PY

      - name: Restore matching 2021 snapshot read-only
        shell: bash
        run: |
          set -euo pipefail
          root="out/l2-analysis/source/$SNAPSHOT_GENERATION"
          mkdir -p "$root"
          bash scripts/kaggle-fetch-snapshot.sh "$SNAPSHOT_GENERATION" 2021 "$root"
          if [[ -s "$root/snapshot-2021.jsonl" ]]; then
            echo "SNAP_2021=$root/snapshot-2021.jsonl" >> "$GITHUB_ENV"
          elif [[ -s "$root/snapshot-2021.jsonl.gz" ]]; then
            echo "SNAP_2021=$root/snapshot-2021.jsonl.gz" >> "$GITHUB_ENV"
          else
            echo "::error::snapshot 2021 missing" >&2
            exit 1
          fi

      - name: Decompose king disagreement
        shell: bash
        run: |
          set -euo pipefail
          python research/analyze_l2_king_disagreement.py             --light out/l2-analysis/bundle/no_auto_jockey.jsonl.gz             --core out/l2-analysis/bundle/core4_no_pedigree.jsonl.gz             --snapshot "$SNAP_2021"             --output out/l2-analysis/disagreement-analysis.json

      - name: Cost guard
        if: always()
        run: |
          if grep -E "uses:[[:space:]]*actions/upload-artifact|uses:[[:space:]]*actions/cache" .github/workflows/l2-king-disagreement-analysis.yml; then
            echo "GitHub Artifact/Cache persistence found; refusing workflow." >&2
            exit 1
          fi
          echo "Standard GitHub-hosted ubuntu-latest CPU runner only."
          echo "No GPU. No Artifact/Cache."
          echo "Kaggle access is read-only for this analysis."
