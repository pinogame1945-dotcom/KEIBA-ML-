name: All JRA 2026-10-17 Official Navigation Probe (free)
on:
  push:
    branches: [audit/all-jra-races-20261017]
    paths:
      - scripts/all_jra_20261017_probe.py
      - .github/workflows/all-jra-20261017-free.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official_navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --no-cache-dir beautifulsoup4==4.14.3
      - run: python scripts/all_jra_20261017_probe.py
