name: Probe 202505050812 unscored snapshot features - Free CPU

on:
  push:
    branches:
      - feature/original-ai-cold-inference-20261016
    paths:
      - research/extract_unscored_race_from_snapshot.mjs
      - scripts/fetch_2025_target_snapshot_metadata.sh
      - .github/workflows/probe-user-202505050812-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-race-no-label-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      TARGET_RACE_ID: '202505050812'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check target race and ephemeral free storage
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_RACE_ID" = "202505050812"
          test "$(df -Pk "$RUNNER_TEMP" | tail -1 | awk '{print $4}')" -ge 2000000
          node --check research/extract_unscored_race_from_snapshot.mjs
          bash -n scripts/fetch_2025_target_snapshot_metadata.sh
          python3 scripts/verify_keiba_l2_1_freeze.py
          echo "FREE_CPU_NO_GPU_NO_ARTIFACT_NO_CACHE_NO_RESULTS_SOURCE_ACCESS"
      - name: Install free Kaggle metadata and dataset reader
        run: python3 -m pip install --disable-pip-version-check kaggle
      - name: List Kaggle files then manifest, fetch only real 2025 filename
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          dest="$RUNNER_TEMP/keiba-cold-target"
          mkdir -p "$dest"
          bash scripts/fetch_2025_target_snapshot_metadata.sh 2025 "$dest" | tee "$dest/fetch.log"
          snapshot="$(tail -n 1 "$dest/fetch.log")"
          test -s "$snapshot"
          echo "TARGET_SNAPSHOT_PATH=$snapshot" >> "$GITHUB_ENV"
      - name: Extract target only, never read outcome or saved predictions
        shell: bash
        run: |
          set -euo pipefail
          node research/extract_unscored_race_from_snapshot.mjs \
            --input "$TARGET_SNAPSHOT_PATH" \
            --race-id "$TARGET_RACE_ID" \
            --output "$RUNNER_TEMP/keiba-cold-target/target-unscored.json"
          python3 - <<'PY'
          import json,os,pathlib,re
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"keiba-cold-target"
          d=json.loads((root/"target-unscored.json").read_text())
          assert d["race_id"]=="202505050812"
          assert d["contract"]=="KEIBA_UNSCORED_RACE_FEATURE_EXTRACT_V1"
          assert d["used_target_labels"] is False
          assert d["used_results_payouts_final_odds"] is False
          assert d["used_historical_oos_target_predictions"] is False
          assert d["actual_source_capture_time_independently_verified"] is False
          assert d["official_full_starter_list_compared"] is False
          assert len(d["rows"])==len({x["_horse_id"] for x in d["rows"]})
          forbidden=re.compile(r"^(?:_finish|_is_win|_is_top3|target_|_target_|finish_|final_|payout_|result_|after_race_|postrace_|P__|distill_|risk$|risk_|market_rank$)")
          assert all(not forbidden.match(k) for x in d["rows"] for k in x)
          print("REAL_UNSCORED_TARGET_FEASIBILITY_VERIFIED",
                d["race_id"],"year",d["race_date"][:4],
                "horses",len(d["rows"]),"features",d["feature_key_count"],
                "asof_certified",False,"full_field_certified",False,flush=True)
          PY
