name: Probe 202505050812 unscored snapshot features - Free CPU

on:
  push:
    branches:
      - feature/original-ai-cold-inference-20261016
    paths:
      - research/extract_unscored_race_from_snapshot.mjs
      - research/audit_blind_original_core4_features_v1.py
      - research/compute_blind_target_prior_day_bias_v1.py
      - tests/test_blind_target_prior_day_bias_v1.py
      - tests/test_blind_original_core4_features_v1.py
      - scripts/fetch_2025_target_snapshot_metadata.sh
      - .github/workflows/probe-user-202505050812-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-race-no-label-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      TARGET_RACE_ID: '202505050812'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check target race and ephemeral free storage
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_RACE_ID" = "202505050812"
          test "$(df -Pk "$RUNNER_TEMP" | tail -1 | awk '{print $4}')" -ge 2000000
          node --check research/extract_unscored_race_from_snapshot.mjs
          bash -n scripts/fetch_2025_target_snapshot_metadata.sh
          python3 scripts/verify_keiba_l2_1_freeze.py
          echo "FREE_CPU_NO_GPU_NO_ARTIFACT_NO_CACHE_NO_RESULTS_SOURCE_ACCESS"
      - name: Install free Kaggle metadata and dataset reader
        run: python3 -m pip install --disable-pip-version-check kaggle

      - name: Install original free CPU LightGBM audit dependencies
        run: python3 -m pip install --disable-pip-version-check -r ml/requirements.txt
      - name: Test strict original core4 source and outcome guards
        run: |
          python3 -m py_compile research/audit_blind_original_core4_features_v1.py
          python3 -m unittest discover -s tests -p test_blind_original_core4_features_v1.py -v
      - name: List Kaggle files then manifest, fetch only real 2025 filename
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          dest="$RUNNER_TEMP/keiba-cold-target"
          mkdir -p "$dest"
          bash scripts/fetch_2025_target_snapshot_metadata.sh 2025 "$dest" | tee "$dest/fetch.log"
          snapshot="$(tail -n 1 "$dest/fetch.log")"
          test -s "$snapshot"
          echo "TARGET_SNAPSHOT_PATH=$snapshot" >> "$GITHUB_ENV"
      - name: Extract target only, never read outcome or saved predictions
        shell: bash
        run: |
          set -euo pipefail
          IFS="$(printf '\t')" read -r snapshot_year logical remote mode sha expected_rows expected_min expected_max < "$RUNNER_TEMP/keiba-cold-target/resolved-2025.tsv"
          test "$snapshot_year" = "2025"
          node research/extract_unscored_race_from_snapshot.mjs \
            --input "$TARGET_SNAPSHOT_PATH" \
            --race-id "$TARGET_RACE_ID" \
            --manifest-rows "$expected_rows" \
            --manifest-min-date "$expected_min" \
            --manifest-max-date "$expected_max" \
            --output "$RUNNER_TEMP/keiba-cold-target/target-unscored.json" \
            --final-output "$RUNNER_TEMP/keiba-cold-target/target-unscored-final-stage.json"
          python3 - <<'PY'
          import json,os,pathlib,re
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"keiba-cold-target"
          d=json.loads((root/"target-unscored.json").read_text())
          assert d["race_id"]=="202505050812"
          assert d["contract"]=="KEIBA_UNSCORED_RACE_FEATURE_EXTRACT_V1"
          assert d["used_target_labels"] is False
          assert d["used_results_payouts_final_odds"] is False
          assert d["used_historical_oos_target_predictions"] is False
          assert d["source_manifest_count_and_date_range_verified"] is True
          assert len(d["blinded_feature_panel_sha256"])==64
          assert d["actual_source_capture_time_independently_verified"] is False
          assert d["official_full_starter_list_compared"] is False
          assert len(d["rows"])==len({x["_horse_id"] for x in d["rows"]})
          forbidden=re.compile(r"^(?:_finish|_is_win|_is_top3|target_|_target_|finish_|final_|payout_|result_|after_race_|postrace_|P__|distill_|risk$|risk_|market_rank$)")
          assert all(not forbidden.match(k) for x in d["rows"] for k in x)
          print("REAL_UNSCORED_TARGET_FEASIBILITY_VERIFIED",
                d["race_id"],"year",d["race_date"][:4],
                "horses",len(d["rows"]),"features",d["feature_key_count"],
                "asof_certified",False,"full_field_certified",False,flush=True)
          PY
      - name: Exact original L1 core4 real target schema audit
        shell: bash
        run: |
          set -euo pipefail
          python3 research/audit_blind_original_core4_features_v1.py \
            --input "$RUNNER_TEMP/keiba-cold-target/target-unscored.json" \
            --output "$RUNNER_TEMP/keiba-cold-target/target-original-core4-schema.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"keiba-cold-target/target-original-core4-schema.json"
          d=json.loads(p.read_text())
          assert d["race_id"]=="202505050812"
          assert d["horses"]==17
          assert d["core4_feature_count"]>0
          assert d["training_2023_2024_feature_schema_verified"] is False
          assert d["target_prediction_available"] is False
          print("USER_SELECTED_TARGET_ORIGINAL_CORE4_SCHEMA_CONFIRMED",
                d["core4_feature_count"],d["core4_feature_name_sha256"],flush=True)
          PY
      - name: Compare FINAL prestart stage with exact 2023-24 original training feature names
        shell: bash
        run: |
          set -euo pipefail
          python3 research/audit_blind_original_core4_features_v1.py \
            --input "$RUNNER_TEMP/keiba-cold-target/target-unscored-final-stage.json" \
            --output "$RUNNER_TEMP/keiba-cold-target/target-original-core4-final-stage.json"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"keiba-cold-target"
          data=json.loads((root/"target-original-core4-final-stage.json").read_text())
          stage=json.loads((root/"target-unscored-final-stage.json").read_text())
          prior_sha="eb3392b725560e77d46b28aef036b6188814125ed8f7a3bfde0c53522dbadf58"
          same=data["core4_feature_name_sha256"]==prior_sha
          assert stage["source_prediction_phase"]=="FINAL_PRESTART_PROJECTED_FROM_HISTORICAL_SNAPSHOT"
          assert stage["used_results_payouts_final_odds"] is False
          assert data["target_result_or_final_odds_used"] is False
          assert data["horses"]==17
          print("BLIND_REAL_FINAL_PRESTART_VS_ORIGINAL_2023_2024_CORE4",
                "target_features",data["core4_feature_count"],
                "prior_features",649,"exact_feature_names_match",same,
                "target_sha",data["core4_feature_name_sha256"],
                "prior_sha",prior_sha,
                "history_and_asof_still_NOT_VERIFIED",True,flush=True)
          PY
      - name: Original same-day bias from earlier 2025 race numbers only
        shell: bash
        run: |
          set -euo pipefail
          python3 research/compute_blind_target_prior_day_bias_v1.py \
            --2025-source "$TARGET_SNAPSHOT_PATH" \
            --unscored-target "$RUNNER_TEMP/keiba-cold-target/target-unscored-final-stage.json" \
            --output "$RUNNER_TEMP/keiba-cold-target/original-prior-daybias.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"keiba-cold-target/original-prior-daybias.json"
          d=json.loads(p.read_text())
          assert d["contract"]=="KEIBA_BLIND_TARGET_ORIGINAL_PRIOR_DAYBIAS_V1"
          assert d["race_id"]=="202505050812" and len(d["horse_scores"])==17
          assert d["target_result_or_final_odds_used"] is False
          assert d["l1_ready"] is False
          assert d["target_race_start_timestamp_independently_verified"] is False
          print("BLIND_202505050812_ORIGINAL_PRIOR_DAYBIAS_PROOF",
                "earlier_races",d["source_prior_race_count"],
                "horses",len(d["horse_scores"]),
                "asof_proven",False,flush=True)
          PY
