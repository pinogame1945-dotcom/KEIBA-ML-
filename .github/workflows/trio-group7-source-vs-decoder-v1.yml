name: TRIO Group7 Source vs Decoder Audit V1

on:
  push:
    branches:
      - research/l2-trio-market-gap-v0-20260930
    paths:
      - .github/triggers/trio-group7-source-vs-decoder-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trio-group7-source-vs-decoder-v1
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/audit_trio_group7_source_vs_decoder_v1.py
          grep -q 'runs-on: ubuntu-latest' .github/workflows/trio-group7-source-vs-decoder-v1.yml
      - name: Install standard CPU dependencies
        run: python -m pip install --disable-pip-version-check pandas
      - name: Restore 2025 race and odds packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          cat > out/backfill/.git/info/sparse-checkout <<'EOF'
          /data/daily/2025-*.jsonl.gz
          /data/odds/daily/2025-*.jsonl.gz
          EOF
          git -C out/backfill checkout "$BACKFILL_SHA"
      - name: Audit source payload vs decoder
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/trio-group7-source-vs-decoder-v1/run-$GITHUB_RUN_ID"
          python research/audit_trio_group7_source_vs_decoder_v1.py --backfill-root out/backfill --out-dir "$result"
          cat "$result/summary.json"
          cat "$result/by-started-field-size.csv"
      - name: Cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted CPU only."
          echo "No GPU, paid runner, artifact/cache, or external storage write."
      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/trio-group7-source-vs-decoder-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: archive TRIO group7 source-vs-decoder audit $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
