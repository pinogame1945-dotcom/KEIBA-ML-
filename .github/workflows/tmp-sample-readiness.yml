name: Temporary sample readiness audit

on:
  push:
    branches:
      - feature/l1-feature-catalog-v1-20260927
    paths:
      - .github/workflows/tmp-sample-readiness.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout KEIBA-ML
        uses: actions/checkout@v4
        with:
          ref: feature/l1-feature-catalog-v1-20260927

      - name: Checkout BACKFILL exact source
        uses: actions/checkout@v4
        with:
          repository: pinogame1945-dotcom/KEIBA-BACKFILL
          ref: a4cad94cd01ed28a2de47be82ca3df06ef9c71ee
          path: backfill

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare exact date samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/g3/data/daily tmp/g4/data/daily tmp-audit-results
          for d in 2026-09-20 2026-09-19 2026-09-13 2026-09-12 2026-09-06 2026-09-05; do
            test -f "backfill/data/daily/$d.jsonl.gz"
            cp "backfill/data/daily/$d.jsonl.gz" "tmp/g3/data/daily/"
          done
          for d in 2026-08-30 2026-08-29 2026-08-23 2026-08-22 2026-08-16 2026-08-15; do
            test -f "backfill/data/daily/$d.jsonl.gz"
            cp "backfill/data/daily/$d.jsonl.gz" "tmp/g4/data/daily/"
          done

      - name: Audit group 3
        continue-on-error: true
        run: |
          node scripts/audit-backfill-readiness.mjs \
            --source-root tmp/g3 \
            --start 2026-09-05 \
            --end 2026-09-20 \
            --source-sha a4cad94cd01ed28a2de47be82ca3df06ef9c71ee \
            --report-out tmp-audit-results/group3.json \
            --min-core-known-coverage 0.98 \
            --max-invalid-rate 0 \
            --max-year-gap 0.10

      - name: Audit group 4
        continue-on-error: true
        run: |
          node scripts/audit-backfill-readiness.mjs \
            --source-root tmp/g4 \
            --start 2026-08-15 \
            --end 2026-08-30 \
            --source-sha a4cad94cd01ed28a2de47be82ca3df06ef9c71ee \
            --report-out tmp-audit-results/group4.json \
            --min-core-known-coverage 0.98 \
            --max-invalid-rate 0 \
            --max-year-gap 0.10

      - name: Commit temporary reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-audit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-audit-results/group3.json tmp-audit-results/group4.json
          git commit -m "tmp: sample readiness reports [skip ci]"
          git push origin HEAD:feature/l1-feature-catalog-v1-20260927
