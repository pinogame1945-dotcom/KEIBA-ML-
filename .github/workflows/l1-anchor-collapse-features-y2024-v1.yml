name: L1 Anchor Collapse Feature Autopsy Y2024

on:
  push:
    branches:
      - research/l1-anchor-collapse-features-y2024-v1-20261004
    paths:
      - .github/triggers/l1-anchor-collapse-features-y2024-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l1-anchor-collapse-features-y2024-v1
  cancel-in-progress: true

jobs:
  autopsy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      SNAPSHOT_DATASET_REF: pino1945/keiba-ml-snapshot-eb13d4096519167b
      TARGET_YEAR: "2024"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/run_l1_anchor_collapse_feature_autopsy_v1.py
          bash -n scripts/kaggle-dataset-session-v2.sh
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/l1-anchor-collapse-features-y2024-v1.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses)
          assert not any(u.startswith("actions/cache") for u in uses)
          assert "kaggle-dataset-session-v2.sh" in wf
          assert "manifest.json" in wf
          assert "2026 sealed" in Path("research/run_l1_anchor_collapse_feature_autopsy_v1.py").read_text()
          print("ANCHOR_COLLAPSE_FEATURE_STATIC_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle numpy pandas

      - name: Restore frozen agreement sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/anchor-collapse-source
          git fetch --depth=1 origin research/l16-outsider-support-safe-v1-20260930:refs/remotes/origin/anchor-outsider-source
          git show origin/anchor-outsider-source:research-results/l17-king-outsider-podium-calibrator-wf-v1/run-36747215581/predictions.csv.gz > out/anchor-collapse-source/predictions.csv.gz
          test -s out/anchor-collapse-source/predictions.csv.gz
          test -s research-results/l1-asymmetric-dissent-v3/run-36818983849/scored.csv.gz

      - name: Restore exact 2024 snapshot from manifest
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          session="scripts/kaggle-dataset-session-v2.sh"
          d="out/anchor-collapse-snapshot"
          bash "$session" init "$SNAPSHOT_DATASET_REF" "$d"
          bash "$session" fetch "$d" manifest.json
          manifest="$(find "$d" -type f -name manifest.json -print -quit)"
          test -s "$manifest"
          snapshot_file="$(python - "$manifest" "$TARGET_YEAR" <<'PY'
          import json,os,re,sys
          m=json.load(open(sys.argv[1],encoding="utf-8"))
          y=int(sys.argv[2])
          hits=[]
          for row in m.get("years",[]):
              f=str(row.get("file") or "")
              ry=row.get("year")
              inferred=None
              mm=re.search(r"(20\d{2})",os.path.basename(f))
              if mm: inferred=int(mm.group(1))
              if (ry is not None and int(ry)==y) or inferred==y:
                  if f: hits.append(f)
          hits=list(dict.fromkeys(hits))
          if len(hits)!=1:
              raise SystemExit(f"manifest year resolution failed year={y} hits={hits}")
          print(hits[0])
          PY
          )"
          echo "Manifest resolved year=$TARGET_YEAR file=$snapshot_file"
          bash "$session" fetch "$d" "$snapshot_file"
          base="$(basename "$snapshot_file")"
          plain="${base%.gz}"
          snapshot_path="$(find "$d" -type f \( -name "$base" -o -name "$plain" \) -print -quit)"
          test -s "$snapshot_path"
          echo "SNAPSHOT_PATH=$snapshot_path" >> "$GITHUB_ENV"

      - name: Run 2024 unanimous-anchor feature autopsy
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l1-anchor-collapse-feature-autopsy/y2024/run-$GITHUB_RUN_ID"
          python research/run_l1_anchor_collapse_feature_autopsy_v1.py             --year 2024             --market-scored research-results/l1-asymmetric-dissent-v3/run-36818983849/scored.csv.gz             --outsider-predictions out/anchor-collapse-source/predictions.csv.gz             --snapshot "$SNAPSHOT_PATH"             --out-dir "$result"
          test "$(du -sm "$result" | cut -f1)" -le 10
          rm -rf out/anchor-collapse-snapshot out/anchor-collapse-source

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner / Artifact / Cache."
          echo "Kaggle read only: metadata -> manifest -> one exact year file."
          echo "404 is fail-fast metadata drift; only transient errors are retried by session v2."
          echo "No Kaggle writes and no dataset/model persistence."
          echo "2026 remains sealed."

      - name: Commit compact result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l1-anchor-collapse-feature-autopsy/y2024/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: anchor collapse feature autopsy y2024 $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
