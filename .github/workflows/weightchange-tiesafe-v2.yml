name: Weight-Change Outsider Tie-Safe V2

on:
  push:
    branches:
      - research/rank-tie-safe-v1-20260929
    paths:
      - .github/triggers/weightchange-tiesafe-v2.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weightchange-tiesafe-v2
  cancel-in-progress: true

jobs:
  weightchange:
    name: outsider-weightchange-tiesafe-all-years
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      GENERATION_ID: eb13d4096519167b
      SNAPSHOT_REF: pino1945/keiba-ml-snapshot-eb13d4096519167b

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate code and leakage guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/rank_utils.py             research/train-staged-lightgbm.py             research/emit_l1_to_l2.py             research/build_l1_nonhorse_dataset_v1.py             research/run_l1_outsider_year_lane_v2.py             research/analyze_l1_outsider_rescue_v1.py             research/archive_l1_outsider_arena_v1.py
          python research/test_rank_utils_v1.py
          bash -n scripts/kaggle-dataset-session-v2.sh
          grep -q '_canonical_horse_number' research/train-staged-lightgbm.py
          grep -q 'deterministic_ranks' research/train-staged-lightgbm.py
          grep -q 'deterministic_ranks' research/emit_l1_to_l2.py
          if grep -q 'rank(method="first"' research/train-staged-lightgbm.py; then
            echo "::error::unsafe first-order tie breaker remains"
            exit 1
          fi

      - name: Install dependencies once
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore shared snapshots exactly once
        shell: bash
        run: |
          set -euo pipefail
          root="out/weightchange-v2"
          snaproot="$root/snapshots"
          mkdir -p "$snaproot"

          bash scripts/kaggle-dataset-session-v2.sh init "$SNAPSHOT_REF" "$snaproot"
          bash scripts/kaggle-dataset-session-v2.sh fetch "$snaproot" manifest.json

          manifest="$(find "$snaproot" -type f -name manifest.json -print -quit)"
          test -n "$manifest"; test -s "$manifest"

          mapfile -t logicals < <(MANIFEST="$manifest" python - <<'PY'
          import json,os
          m=json.load(open(os.environ["MANIFEST"],encoding="utf-8"))
          wanted=set(range(2019,2026))
          rows={int(x["year"]):str(x["file"]) for x in m.get("years",[]) if int(x.get("year") or 0) in wanted}
          missing=sorted(wanted-set(rows))
          if missing:
              raise SystemExit(f"snapshot manifest missing years: {missing}")
          for y in sorted(wanted):
              print(rows[y])
          PY
          )
          test "${#logicals[@]}" -eq 7
          bash scripts/kaggle-dataset-session-v2.sh fetch "$snaproot" "${logicals[@]}"

          echo "SNAP_ROOT=$snaproot" >> "$GITHUB_ENV"
          echo "SNAP_MANIFEST=$manifest" >> "$GITHUB_ENV"
          echo "SHARED_SNAPSHOTS_READY count=${#logicals[@]}"

      - name: Restore five seven-king routers by metadata-resolved names
        shell: bash
        run: |
          set -euo pipefail
          root="out/weightchange-v2/routers"
          mkdir -p "$root"
          for y in 2021 2022 2023 2024 2025; do
            d="$root/$y"
            ref="pino1945/keiba-l15-rolecmp-y${y}-v1"
            bash scripts/kaggle-dataset-session-v2.sh init "$ref" "$d"
            bash scripts/kaggle-dataset-session-v2.sh fetch "$d" router-7k.jsonl
            p="$(find "$d" -type f \( -name 'router-7k.jsonl' -o -name 'router-7k.jsonl.gz' \) -print -quit)"
            test -n "$p"; test -s "$p"
            echo "ROUTER_EXACT_READY year=$y path=$p"
          done
          echo "ROUTER_ROOT=$root" >> "$GITHUB_ENV"

      - name: Run weight-change only across 2021-2025
        shell: bash
        run: |
          set -euo pipefail

          snapshot_for_year() {
            local y="$1"
            local logical
            logical="$(YEAR="$y" MANIFEST="$SNAP_MANIFEST" python - <<'PY'
          import json,os
          y=int(os.environ["YEAR"])
          m=json.load(open(os.environ["MANIFEST"],encoding="utf-8"))
          matches=[str(x["file"]) for x in m.get("years",[]) if int(x.get("year") or 0)==y]
          if len(matches)!=1:
              raise SystemExit(f"snapshot logical missing/ambiguous year={y}: {matches}")
          print(matches[0])
          PY
            )"
            local base plain p
            base="$(basename "$logical")"
            plain="${base%.gz}"
            p="$(find "$SNAP_ROOT" -type f \( -name "$base" -o -name "$plain" \) -print -quit)"
            test -n "$p"; test -s "$p"
            printf '%s' "$p"
          }

          for y in 2021 2022 2023 2024 2025; do
            t1=$((y-2))
            t2=$((y-1))
            p1="$(snapshot_for_year "$t1")"
            p2="$(snapshot_for_year "$t2")"
            pv="$(snapshot_for_year "$y")"
            router="$(find "$ROUTER_ROOT/$y" -type f \( -name 'router-7k.jsonl' -o -name 'router-7k.jsonl.gz' \) -print -quit)"
            test -n "$router"; test -s "$router"

            echo "=== WEIGHTCHANGE TIESAFE START year=$y train=$t1,$t2 ==="
            python research/run_l1_outsider_year_lane_v2.py               --year "$y"               --inputs "$p1,$p2,$pv"               --validation-snapshot "$pv"               --router-seven "$router"               --horse-config research/l1-outsider-arena-tiesafe-v1.json               --nonhorse-config research/l1-outsider-nonhorse-tiesafe-v1.json               --transition-config research/l1-outsider-weightchange-tiesafe-v1.json               --only-candidates outsider_weightchange               --out-root out/weightchange-v2/work               --ml-source-sha "$GITHUB_SHA"
            echo "=== WEIGHTCHANGE TIESAFE COMPLETE year=$y ==="
          done

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "Single runner reuses 2019-2025 snapshots across all five folds."
          echo "Kaggle filenames are resolved from metadata before download; no jsonl/gz 404 guessing."
          echo "No GPU. No paid runner."
          echo "No GitHub Artifact/Cache."
          echo "Kaggle read-only; no Dataset/Model creation or update."
          echo "Candidate model/score outputs are ephemeral."
          echo "2026 remains sealed."

  ledger:
    name: archive-weightchange-tiesafe
    if: always()
    needs: [weightchange]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Archive structured results
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"
          python research/archive_l1_outsider_arena_v1.py             --repo "$GITHUB_REPOSITORY"             --run-id "$GITHUB_RUN_ID"             --config research/l1-outsider-weightchange-tiesafe-v1.json             --out-root research-results/l1-outsider-weightchange-tiesafe-v1

      - name: Commit compact ledger
        shell: bash
        run: |
          set -euo pipefail
          root="research-results/l1-outsider-weightchange-tiesafe-v1/OUTSIDER-WEIGHTCHANGE-TIESAFE-001/attempts/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$root"
          if git diff --cached --quiet; then
            echo "No ledger changes"
            exit 0
          fi
          git commit -m "research: archive weight-change tie-safe run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1

      - name: Cost guard
        if: always()
        run: |
          echo "Compact git ledger only; no paid persistent storage."
