name: Temporary inspect Kaggle snapshot files

on:
  workflow_dispatch:
  push:
    branches:
      - feature/l1-feature-arena-trainer-v1-20260927
    paths:
      - .github/workflows/tmp-inspect-kaggle-snapshot-files.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      DATASET_REF: pino1945/keiba-ml-snapshot-e75cd10b7837f676
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check kaggle
      - name: List remote files
        shell: bash
        run: |
          set -euo pipefail
          echo "KAGGLE_REMOTE_FILES_BEGIN"
          kaggle datasets files "$DATASET_REF" --page-size 200
          echo "KAGGLE_REMOTE_FILES_END"
      - name: Cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted runner only."
          echo "No GPU."
          echo "No Artifact or Cache."
