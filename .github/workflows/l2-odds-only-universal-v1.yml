name: L2 Odds-Only Universal V1

on:
  push:
    branches:
      - research/l2-odds-only-universal-v1-20260930
    paths:
      - .github/triggers/l2-odds-only-universal-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-odds-only-universal-v1
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/run_l2_odds_only_universal_v1.py \
            research/build_l2_bet_kings_dataset_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.load(open("contracts/l2-odds-only-universal-v1.json",encoding="utf-8"))
          assert c["contract"]=="L2_ODDS_ONLY_UNIVERSAL_V1"
          assert c["inputs"]["l17"] is False
          assert c["inputs"]["seven_king"] is False
          assert c["inputs"]["odds"] is True
          assert c["calibration"]["roi_used_for_selection"] is False
          assert c["calibration"]["test_year_used_for_selection"] is False
          for k in ("manual_edge_threshold","manual_top_k","manual_ticket_cap","manual_odds_band","manual_race_skip_rule"):
              assert c["selection"][k] is False
          assert c["locked_years"]==[2026]
          assert c["cost"]["standard_github_cpu_only"] is True
          for k in ("gpu","paid_runner","github_artifact","github_cache","paid_persistent_storage"):
              assert c["cost"][k] is False,(k,c["cost"][k])
          wf=Path(".github/workflows/l2-odds-only-universal-v1.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses)
          assert not any(u.startswith("actions/cache") for u in uses)
          assert ("/data/daily/"+"2026-") not in wf
          assert ("/data/odds/daily/"+"2026-") not in wf
          print("L2_ODDS_ONLY_UNIVERSAL_V1_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy

      - name: Sparse restore 2021-2025 race and odds packs once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          cat > out/backfill/.git/info/sparse-checkout <<'EOF'
          /data/daily/2021-*.jsonl.gz
          /data/daily/2022-*.jsonl.gz
          /data/daily/2023-*.jsonl.gz
          /data/daily/2024-*.jsonl.gz
          /data/daily/2025-*.jsonl.gz
          /data/odds/daily/2021-*.jsonl.gz
          /data/odds/daily/2022-*.jsonl.gz
          /data/odds/daily/2023-*.jsonl.gz
          /data/odds/daily/2024-*.jsonl.gz
          /data/odds/daily/2025-*.jsonl.gz
          EOF
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Run odds-only five-bet control
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-odds-only-universal-v1/run-$GITHUB_RUN_ID"
          python research/run_l2_odds_only_universal_v1.py \
            --backfill-root out/backfill \
            --out-dir "$result"
          echo "===== SUMMARY ====="
          cat "$result/summary.json"
          echo "===== RAW VS CALIBRATED ====="
          cat "$result/raw-vs-calibrated-market.csv"
          echo "===== ECONOMICS COMBINED ====="
          cat "$result/economics-combined.csv"

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner / artifact / cache."
          echo "No Kaggle access."
          echo "Only existing BACKFILL Git data are read."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-odds-only-universal-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: archive odds-only universal v1 run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
