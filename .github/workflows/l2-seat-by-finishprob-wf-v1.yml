name: L2 Seat By Finish Probability WF V1

on:
  push:
    branches:
      - research/l2-seat-by-finishprob-wf-v1-20260930
    paths:
      - .github/triggers/l2-seat-by-finishprob-wf-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/run_l2_seat_by_finishprob_wf_v1.py
          test -s research-results/l2-market-gap-seat-v1/run-36706811732/horse-seat-outcomes.csv
          test -s research-results/l2-market-gap-seat-v1/run-36706811732/seat-gap-yearly.csv
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/l2-seat-by-finishprob-wf-v1.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses)
          assert not any(u.startswith("actions/cache") for u in uses)
          print("GUARD_OK")
          PY

      - name: Run walk-forward
        shell: bash
        run: |
          set -euo pipefail
          python research/run_l2_seat_by_finishprob_wf_v1.py
          cat research-results/l2-seat-by-finishprob-wf-v1/summary.json
          cat research-results/l2-seat-by-finishprob-wf-v1/walkforward-combined.csv

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner / artifact / cache / Kaggle access."
          echo "Uses only already-committed compact research outputs."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add             research-results/l2-seat-by-finishprob-wf-v1/summary.json             research-results/l2-seat-by-finishprob-wf-v1/seat-choices.csv             research-results/l2-seat-by-finishprob-wf-v1/walkforward-yearly.csv             research-results/l2-seat-by-finishprob-wf-v1/walkforward-combined.csv
          git commit -m "research: archive finish-probability seat walk-forward"
          git push origin "HEAD:$GITHUB_REF_NAME"
