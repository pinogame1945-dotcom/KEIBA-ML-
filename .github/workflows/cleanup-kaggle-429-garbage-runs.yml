name: Cleanup Kaggle 429 Garbage Runs

on:
  push:
    branches:
      - research/l1-outsider-arena-v1-20260928
    paths:
      - .github/triggers/cleanup-kaggle-429-garbage-runs.trigger

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete cancelled and mitigation workflow runs
        shell: bash
        run: |
          set -euo pipefail
          stale_runs=(
            36398606087
            36399041275
            36399357707
            36400383212
            36400532858
            36400706865
            36401889135
            36401899502
            36402183438
            36402186745
            36403915011
            36404134917
            36404153444
            36404159477
            36404297162
            36406206973
            36406244058
            36406319446
          )
          for id in "${stale_runs[@]}"; do
            code="$(curl -sS -o /tmp/delete-body -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$id")"
            if [[ "$code" == "204" || "$code" == "404" ]]; then
              echo "cleaned run=$id http=$code"
            else
              cat /tmp/delete-body || true
              echo "::error::failed to delete run=$id http=$code"
              exit 1
            fi
          done
          echo "Kept successful research runs and preserved structured partial results."
