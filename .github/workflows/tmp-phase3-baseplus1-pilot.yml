name: Temporary Phase3 BASE plus 1 pilot

on:
  push:
    branches:
      - feature/l1-phase3-research-selection-v1-20260927
    paths:
      - .github/workflows/tmp-phase3-baseplus1-pilot.yml

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout KEIBA-ML
        uses: actions/checkout@v4

      - name: Checkout BACKFILL
        uses: actions/checkout@v4
        with:
          repository: pinogame1945-dotcom/KEIBA-BACKFILL
          ref: main
          path: backfill

      - name: Record source SHA
        run: echo "BACKFILL_SHA=$(git -C backfill rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Safety smoke
        run: npm run smoke:all

      - name: Install ML dependencies
        run: python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Run pilot BASE plus one matrix
        run: |
          python research/run_phase3_selection.py \
            --source-root backfill \
            --out-dir out/phase3-pilot \
            --first-holdout 2025 \
            --last-holdout 2025 \
            --train-years 2 \
            --warmup-years 1 \
            --prediction-phase FINAL \
            --matrix base_plus_one \
            --families "OPPONENT,PEDIGREE,ACTOR,TIME_PACE" \
            --max-execute-candidates 5 \
            --source-ref main \
            --source-sha "$BACKFILL_SHA" \
            --ml-source-sha "$GITHUB_SHA" \
            --execute

      - name: Print compact result
        run: cat out/phase3-pilot/research-summary.json

      - name: Cost guard
        if: always()
        run: |
          if grep -R -E "uses:[[:space:]]*actions/upload-artifact" .github/workflows; then
            echo "Persistent artifact upload found" >&2
            exit 1
          fi
