name: L1.5 Podium Containment V1

on:
  push:
    branches:
      - research/l15-podium-containment-v1-20260929
    paths:
      - .github/triggers/l15-podium-containment-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l15-podium-containment-v1
  cancel-in-progress: true

jobs:
  analyze:
    name: podium-containment
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      GENERATION_ID: eb13d4096519167b
      KAGGLE_DATASET_REF: pino1945/keiba-ml-snapshot-eb13d4096519167b

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate analysis and install Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/analyze_l15_podium_containment_v1.py
          bash -n scripts/kaggle-snapshot-session.sh
          bash -n scripts/kaggle-fetch-router-years.sh
          python -m pip install --disable-pip-version-check kaggle

      - name: Restore frozen inputs read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/podium/snapshot out/podium/router
          bash scripts/kaggle-snapshot-session.sh init "$GENERATION_ID" out/podium/snapshot
          bash scripts/kaggle-snapshot-session.sh fetch "$GENERATION_ID" out/podium/snapshot 2022 2023 2024 2025
          bash scripts/kaggle-fetch-router-years.sh "2022,2023,2024,2025" out/podium/router

      - name: Analyze podium containment
        shell: bash
        run: |
          set -euo pipefail
          out="research-results/l15-podium-containment-v1/run-$GITHUB_RUN_ID"
          python research/analyze_l15_podium_containment_v1.py \
            --snapshot-root out/podium/snapshot \
            --router-root out/podium/router \
            --fixed-root research-results/l15-fixed-v1 \
            --out-dir "$out"
          cat "$out/summary.json"

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner."
          echo "No GitHub Artifact or Cache."
          echo "Kaggle inputs are read-only; no Dataset/Model persistence."
          echo "Only small summary JSON/CSV files are committed to Git."
          echo "No odds/popularity/payout. 2026 remains sealed."

      - name: Commit compact result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          out="research-results/l15-podium-containment-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$out/summary.json" "$out/summary.csv"
          git commit -m "research: podium containment run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
