name: L2 EXACTA V0 Direction Audit

on:
  push:
    branches:
      - research/l2-exacta-v0-20260930
    paths:
      - .github/triggers/l2-exacta-v0.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-exacta-v0
  cancel-in-progress: true

jobs:
  exacta-v0:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Contract and cost guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/run_l2_exacta_v0.py             research/materialize_l17_seven_king_fullfield_v1.py             research/build_l2_bet_kings_dataset_v1.py             research/build_l2_l17_fullfield_dataset_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.load(open("contracts/l2-exacta-v0.json",encoding="utf-8"))
          assert c["contract"]=="L2_EXACTA_V0"
          assert c["bet_type"]=="EXACTA"
          assert c["locked_years"]==[2026]
          assert c["candidate_universe"]["all_runners"] is True
          assert c["candidate_universe"]["ordered_pairs"] is True
          assert c["candidate_universe"]["candidate_horse_filter"] is False
          assert c["rankers"]["L17_ONLY_MODEL"]["market_features"] is False
          assert c["direction_audit"]["reverse_pair_test"] is True
          assert c["invariants"]["tie_break_by_source_row_order"] is False
          assert c["cost"]["standard_github_cpu_only"] is True
          assert c["cost"]["gpu"] is False
          assert c["cost"]["github_artifact"] is False
          assert c["cost"]["github_cache"] is False
          assert c["cost"]["persistent_kaggle_upload"] is False
          wf=Path(".github/workflows/l2-exacta-v0.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses),uses
          assert not any(u.startswith("actions/cache") for u in uses),uses
          print("L2_EXACTA_V0_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore persisted seven horse-level score tables read-only
        shell: bash
        run: |
          set -euo pipefail
          session_script="scripts/kaggle-dataset-session-v2.sh"
          test -s "$session_script"
          for y in 2022 2023 2024 2025; do
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              d="out/exacta-v0/scores/$y/$alias"
              ref="pino1945/keiba-l15-7k-$alias-y$y-v1"
              bash "$session_script" init "$ref" "$d"
              bash "$session_script" fetch "$d" score.jsonl
              p="$(find "$d" -type f \( -name 'score.jsonl.gz' -o -name 'score.jsonl' \) -print -quit)"
              test -n "$p"; test -s "$p"
              echo "SEVEN_SCORE_OK year=$y alias=$alias path=$p"
            done
          done

      - name: Materialize leak-safe L1.7 full-field consensus once per year
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/exacta-v0/l17
          for y in 2022 2023 2024 2025; do
            args=()
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              p="$(find "out/exacta-v0/scores/$y/$alias" -type f \( -name 'score.jsonl.gz' -o -name 'score.jsonl' \) -print -quit)"
              test -n "$p"; test -s "$p"
              args+=(--expert "$alias=$p")
            done
            python research/materialize_l17_seven_king_fullfield_v1.py               --year "$y" "${args[@]}"               --output "out/exacta-v0/l17/l17-$y.jsonl.gz"
            test -s "out/exacta-v0/l17/l17-$y.jsonl.gz"
            echo "L17_$y=out/exacta-v0/l17/l17-$y.jsonl.gz" >> "$GITHUB_ENV"
          done

      - name: Sparse restore 2022-2025 race and odds packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          cat > out/backfill/.git/info/sparse-checkout <<'EOF'
          /data/daily/2022-*.jsonl.gz
          /data/daily/2023-*.jsonl.gz
          /data/daily/2024-*.jsonl.gz
          /data/daily/2025-*.jsonl.gz
          /data/odds/daily/2022-*.jsonl.gz
          /data/odds/daily/2023-*.jsonl.gz
          /data/odds/daily/2024-*.jsonl.gz
          /data/odds/daily/2025-*.jsonl.gz
          EOF
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"
          echo "daily=$(find out/backfill/data/daily -type f -name '*.jsonl.gz' | wc -l)"
          echo "odds=$(find out/backfill/data/odds/daily -type f -name '*.jsonl.gz' | wc -l)"

      - name: Run EXACTA V0 and direction audit
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-exacta-v0/run-$GITHUB_RUN_ID"
          python research/run_l2_exacta_v0.py             --l17-year "2022:$L17_2022"             --l17-year "2023:$L17_2023"             --l17-year "2024:$L17_2024"             --l17-year "2025:$L17_2025"             --backfill-root out/backfill             --out-dir "$result"
          echo "===== SUMMARY ====="
          cat "$result/summary.json"
          echo "===== FOLDS ====="
          cat "$result/fold-metrics.csv"
          echo "===== RANKING COVERAGE ====="
          cat "$result/ranking-coverage.csv"
          echo "===== DIRECTION AUDIT ====="
          cat "$result/direction-audit.csv"
          echo "===== TOP1 MISS DECOMPOSITION ====="
          cat "$result/top1-miss-decomposition.csv"

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner."
          echo "No actions/cache and no upload-artifact."
          echo "Existing Kaggle score datasets are downloaded read-only."
          echo "No Kaggle dataset/model persistence."
          echo "L1.7 and EXACTA ticket matrices remain ephemeral on the runner."
          echo "Only compact research outputs are committed."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-exacta-v0/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add             "$result/README.md"             "$result/summary.json"             "$result/fold-metrics.csv"             "$result/ranking-coverage.csv"             "$result/direction-audit.csv"             "$result/top1-miss-decomposition.csv"             "$result/feature-importance-l17-only.csv"             "$result/feature-importance-market-aware.csv"             "$result/winner-ticket-diagnostics.csv.gz"
          git commit -m "research: archive exacta V0 run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
