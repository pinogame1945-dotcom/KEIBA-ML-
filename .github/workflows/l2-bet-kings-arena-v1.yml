name: L2 Bet Kings Arena V1

on:
  push:
    branches:
      - research/l2-bet-kings-arena-v1-20260929
    paths:
      - .github/triggers/l2-bet-kings-arena-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-bet-kings-arena-v1
  cancel-in-progress: true

jobs:
  arena:
    name: five-bet-kings-arena
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1
      FIXED_LEDGER_DIR: research-results/l15-fixed-v1

    steps:
      - name: Checkout Bet Kings branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax leakage and cost guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/extract_l2_bet_kings_dates_v1.py \
            research/build_l2_bet_kings_dataset_v1.py \
            research/run_l2_bet_kings_arena_v1.py
          python - <<'PY'
          import json
          c=json.load(open("contracts/l2-bet-kings-arena-v1.json",encoding="utf-8"))
          assert c["contract"]=="L2_BET_KINGS_ARENA_V1"
          assert c["upstream"]["contract"]=="L15_FIXED_V1"
          assert c["upstream"]["sha"]=="2db82c3ca3cfab6cf35c33cdf7a70d9972eced04"
          assert c["probability_model"]["allowed_market_features"] is False
          assert c["walk_forward"]["development_selection_years"]==[2023,2024]
          assert c["walk_forward"]["final_holdout_year"]==2025
          assert c["scope"]["locked_years"]==[2026]
          assert c["scope"]["place_bets"] is False
          assert c["scope"]["wide_bets"] is False
          print("L2_BET_KINGS_CONTRACT_OK")
          PY
          if grep -E "uses:[[:space:]]*actions/(upload-artifact|cache)" .github/workflows/l2-bet-kings-arena-v1.yml; then
            echo "Artifact/Cache use is forbidden for this research run" >&2
            exit 1
          fi
          echo "Static syntax checks passed; runtime feature_columns() enforces the market leakage guard."

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore 2022-2025 seven-king routers once
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/kaggle-fetch-router-years.sh "2022,2023,2024,2025" out/l2-kings/router
          for y in 2022 2023 2024 2025; do
            p="$(find "out/l2-kings/router/$y" -type f \( -name 'router-7k.jsonl' -o -name 'router-7k.jsonl.gz' \) -print -quit)"
            test -n "$p"
            test -s "$p"
            echo "ROUTER_$y=$p" >> "$GITHUB_ENV"
          done

      - name: Resolve all 2022-2025 race dates
        shell: bash
        run: |
          set -euo pipefail
          python research/extract_l2_bet_kings_dates_v1.py \
            --router-year "2022:$ROUTER_2022" \
            --router-year "2023:$ROUTER_2023" \
            --router-year "2024:$ROUTER_2024" \
            --router-year "2025:$ROUTER_2025" \
            --dates-out out/l2-kings/all-dates.txt \
            --race-dates-out out/l2-kings/all-race-dates.csv

      - name: Sparse restore required BACKFILL market packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone \
            --depth 1 \
            --filter=blob:none \
            --no-checkout \
            https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git \
            out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          {
            echo "/data/manifest.json"
            echo "/data/odds/manifest.json"
            while IFS= read -r d; do
              [[ -n "$d" ]] || continue
              echo "/data/daily/$d.jsonl.gz"
              echo "/data/odds/daily/$d.jsonl.gz"
            done < out/l2-kings/all-dates.txt
          } > out/backfill/.git/info/sparse-checkout
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"
          echo "BACKFILL_SPARSE_FILES=$(find out/backfill/data -type f | wc -l)"

      - name: Build five Bet Kings ticket datasets
        shell: bash
        run: |
          set -euo pipefail
          python research/build_l2_bet_kings_dataset_v1.py \
            --fixed-ledger-dir "$FIXED_LEDGER_DIR" \
            --router-year "2022:$ROUTER_2022" \
            --router-year "2023:$ROUTER_2023" \
            --router-year "2024:$ROUTER_2024" \
            --router-year "2025:$ROUTER_2025" \
            --backfill-root out/backfill \
            --out-dir out/l2-kings/dataset
          cat out/l2-kings/dataset/manifest.json

      - name: Run five Bet Kings walk-forward arena
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-bet-kings-arena-v1/run-$GITHUB_RUN_ID"
          python research/run_l2_bet_kings_arena_v1.py \
            --dataset-dir out/l2-kings/dataset \
            --contract contracts/l2-bet-kings-arena-v1.json \
            --out-dir "$result"
          cp out/l2-kings/dataset/manifest.json "$result/dataset-manifest.json"
          echo "===== KING SELECTION ====="
          cat "$result/king-selection.csv"

      - name: Research cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner."
          echo "No GitHub Artifact or Cache."
          echo "Kaggle router datasets are read-only."
          echo "BACKFILL is sparse-cloned read-only at a pinned commit."
          echo "No Kaggle Dataset/Model is created or updated."
          echo "Large ticket datasets remain ephemeral on the runner."
          echo "Only compact CSV/JSON/README research ledgers are committed."
          echo "2026 sealed. PLACE/WIDE excluded."

      - name: Commit compact Bet Kings ledger
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-bet-kings-arena-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add \
            "$result/README.md" \
            "$result/summary.json" \
            "$result/dataset-manifest.json" \
            "$result/king-selection.csv" \
            "$result/development-candidates.csv" \
            "$result/model-quality.csv" \
            "$result/fold-status.csv" \
            "$result/all-metrics.csv"
          git commit -m "research: archive L2 Bet Kings Arena run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
