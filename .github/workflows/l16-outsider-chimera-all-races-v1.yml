name: L1.6 Outsider Chimera All-Races V1

on:
  push:
    branches:
      - research/l16-outsider-chimera-all-races-v1-20260929
    paths:
      - .github/triggers/l16-outsider-chimera-all-races-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l16-outsider-chimera-all-races-v1
  cancel-in-progress: true

jobs:
  year:
    name: outsider-all-races-y${{ matrix.test_year }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - test_year: 2022
            delay_seconds: 0
          - test_year: 2023
            delay_seconds: 35
          - test_year: 2024
            delay_seconds: 70
          - test_year: 2025
            delay_seconds: 105

    env:
      TEST_YEAR: ${{ matrix.test_year }}
      START_DELAY_SECONDS: ${{ matrix.delay_seconds }}
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      GENERATION_ID: eb13d4096519167b
      KAGGLE_DATASET_REF: pino1945/keiba-ml-snapshot-eb13d4096519167b
      ONLY_CANDIDATES: outsider_chimera

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/run_l1_outsider_year_lane_v2.py             research/build_l1_nonhorse_dataset_v1.py             research/run_feature_arena.py             research/train-staged-lightgbm.py             research/emit_l1_to_l2.py             research/analyze_l1_outsider_rescue_v1.py
          node --check research/project-yearly-snapshots.mjs
          bash -n scripts/kaggle-snapshot-session.sh
          bash -n scripts/kaggle-fetch-router-years.sh

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Stagger restore
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$START_DELAY_SECONDS" -gt 0 ]]; then sleep "$START_DELAY_SECONDS"; fi

      - name: Restore rolling fold and seven-king router once
        shell: bash
        run: |
          set -euo pipefail
          y="$TEST_YEAR"
          train1=$((y-2))
          train2=$((y-1))
          snapshot_root="out/l16-outsider-source/$GENERATION_ID/y$y"
          router_root="out/l16-outsider-router"
          mkdir -p "$snapshot_root" "$router_root"

          bash scripts/kaggle-snapshot-session.sh init "$GENERATION_ID" "$snapshot_root"
          bash scripts/kaggle-snapshot-session.sh fetch "$GENERATION_ID" "$snapshot_root" "$train1" "$train2" "$y"
          bash scripts/kaggle-fetch-router-years.sh "$y" "$router_root"

          snapshot_path() {
            local yy="$1"
            if [[ -s "$snapshot_root/snapshot-$yy.jsonl.gz" ]]; then
              printf '%s' "$snapshot_root/snapshot-$yy.jsonl.gz"
            elif [[ -s "$snapshot_root/snapshot-$yy.jsonl" ]]; then
              printf '%s' "$snapshot_root/snapshot-$yy.jsonl"
            else
              echo "::error::snapshot missing year=$yy" >&2
              return 1
            fi
          }

          p1="$(snapshot_path "$train1")"
          p2="$(snapshot_path "$train2")"
          pv="$(snapshot_path "$y")"
          router="$(find "$router_root/$y" -type f \( -name 'router-7k.jsonl.gz' -o -name 'router-7k.jsonl' \) -print -quit)"
          test -n "$router"
          test -s "$router"

          echo "INPUTS=$p1,$p2,$pv" >> "$GITHUB_ENV"
          echo "VALID_SNAPSHOT=$pv" >> "$GITHUB_ENV"
          echo "ROUTER_SEVEN=$router" >> "$GITHUB_ENV"
          echo "YEAR_OUT=research-results/l16-outsider-chimera-all-races-v1/run-$GITHUB_RUN_ID/y$y" >> "$GITHUB_ENV"

      - name: Run chimera outsider across every race
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$YEAR_OUT"
          python research/run_l1_outsider_year_lane_v2.py             --year "$TEST_YEAR"             --inputs "$INPUTS"             --validation-snapshot "$VALID_SNAPSHOT"             --router-seven "$ROUTER_SEVEN"             --only-candidates "$ONLY_CANDIDATES"             --all-races-topk-output "$YEAR_OUT/chimera-all-topk.csv"             --ml-source-sha "$GITHUB_SHA"

      - name: Validate all-race ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, os
          p=os.path.join(os.environ["YEAR_OUT"],"chimera-all-topk.csv")
          rows=list(csv.DictReader(open(p,encoding="utf-8-sig")))
          assert rows
          cands={r["candidate"] for r in rows}
          expected={"outsider_chimera"}
          assert cands==expected,(cands,expected)
          by={c:0 for c in expected}
          race_sets={c:set() for c in expected}
          for r in rows:
              by[r["candidate"]]+=1
              race_sets[r["candidate"]].add(r["race_id"])
              assert r["top3_horse_ids"]
              assert r["top6_horse_ids"]
          counts={c:len(s) for c,s in race_sets.items()}
          assert len(set(counts.values()))==1,counts
          race_count=next(iter(counts.values()))
          assert race_count==3456,(race_count,counts)
          assert len(rows)==3456,len(rows)
          print("OUTSIDER_CHIMERA_ALL_RACES_LEDGER_OK",os.environ["TEST_YEAR"],race_count,len(rows))
          PY

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Four standard ubuntu-latest CPU lanes in parallel."
          echo "No GPU / paid runner."
          echo "No GitHub Artifact or Cache."
          echo "Kaggle read-only; no Dataset/Model creation or update."
          echo "Only compact Top3/Top6 CSV ledgers are committed."
          echo "2026 locked. Odds/popularity/payout forbidden."

      - name: Commit compact year ledger
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$YEAR_OUT/chimera-all-topk.csv"
          git commit -m "research: chimera all-races y$TEST_YEAR run $GITHUB_RUN_ID"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1

  aggregate:
    name: aggregate-chimera-all-races
    if: always()
    needs: [year]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pull ledgers and validate coverage
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"
          root="research-results/l16-outsider-chimera-all-races-v1/run-$GITHUB_RUN_ID"
          ROOT="$root" python - <<'PY'
          import csv,json,os
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          years=[2022,2023,2024,2025]
          expected={"outsider_chimera"}
          summary={"contract":"L16_OUTSIDER_CHIMERA_ALL_RACES_V1","years":years,"locked_years":[2026],"ability_uses_odds":False,"parallel_year_lanes":4,"by_year":{}}
          total=0
          for y in years:
              p=root/f"y{y}"/"chimera-all-topk.csv"
              if not p.exists(): raise SystemExit(f"missing {p}")
              rows=list(csv.DictReader(open(p,encoding="utf-8-sig")))
              rs={c:set() for c in expected}
              for r in rows: rs[r["candidate"]].add(r["race_id"])
              counts={c:len(v) for c,v in rs.items()}
              if set(counts.values())!={3456}: raise SystemExit((y,counts))
              if len(rows)!=3456: raise SystemExit((y,len(rows)))
              summary["by_year"][str(y)]={"races":3456,"candidate_rows":len(rows),"candidates":sorted(expected)}
              total+=3456
          summary["races"]=total
          summary["candidate_race_rows"]=total*5
          (root/"summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False,separators=(",",":")))
          PY

      - name: Commit aggregate summary
        shell: bash
        run: |
          set -euo pipefail
          root="research-results/l16-outsider-chimera-all-races-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$root/summary.json"
          git commit -m "research: aggregate chimera all-races run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
