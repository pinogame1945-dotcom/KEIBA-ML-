name: Temporary L1 hardening final smoke

on:
  push:
    branches:
      - feature/l1-foundation-hardening-v1-20260927
    paths:
      - .github/workflows/tmp-l1-hardening-final.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout current BACKFILL
        uses: actions/checkout@v4
        with:
          repository: pinogame1945-dotcom/KEIBA-BACKFILL
          ref: main
          path: backfill
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Node smoke suite
        run: npm run smoke:all
      - name: Python syntax
        run: python -m py_compile research/run_walk_forward.py research/train-staged-lightgbm.py research/trainer-foundation-smoke.py
      - name: Install ML dependencies
        run: python -m pip install --disable-pip-version-check -r ml/requirements.txt
      - name: Trainer foundation smoke
        run: python research/trainer-foundation-smoke.py
      - name: BACKFILL readiness v3 one-day integration
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git -C backfill rev-parse HEAD)
          node scripts/audit-backfill-readiness.mjs \
            --source-root backfill \
            --start 2026-09-20 \
            --end 2026-09-20 \
            --report-out out/readiness-v3-smoke.json \
            --source-sha "$SHA" \
            --min-core-known-coverage 0.98 \
            --max-invalid-rate 0 \
            --max-year-gap 1 \
            --require-source-integrity
          node -e 'const r=require("./out/readiness-v3-smoke.json"); if(r.report_version!=="BACKFILL_READINESS_V3"||r.source_integrity?.passed!==true||r.ready_for_l1_research!==true) process.exit(2);'
      - name: Confirm no persistent artifact workflow
        run: |
          if grep -R -E "uses:[[:space:]]*actions/upload-artifact" .github/workflows; then
            echo "Persistent artifact upload found" >&2
            exit 1
          fi
