name: L1 Surface Specialist Walk-Forward V1

on:
  push:
    branches:
      - research/l1-surface-specialists-v1-20260928
    paths:
      - .github/triggers/l1-surface-specialists-v1.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l1-surface-specialists-v1
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout KEIBA-ML
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ML dependencies
        run: python -m pip install --disable-pip-version-check -r ml/requirements.txt
      - name: Syntax and surface split behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/train-staged-lightgbm.py research/run_feature_arena.py research/archive_l1_surface_specialist_run.py
          python - <<'PY'
          import importlib.util
          from argparse import Namespace
          from pathlib import Path
          import pandas as pd

          path=Path("research/train-staged-lightgbm.py")
          spec=importlib.util.spec_from_file_location("train_surface_test",path)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          df=pd.DataFrame([
            {"_race_id":"tr_turf","_horse_id":"a","_target":1,"_race_date_dt":pd.Timestamp("2020-06-01"),"_race_class":"OPEN","_surface":"TURF"},
            {"_race_id":"tr_dirt","_horse_id":"b","_target":1,"_race_date_dt":pd.Timestamp("2020-06-02"),"_race_class":"OPEN","_surface":"DIRT"},
            {"_race_id":"va_turf","_horse_id":"c","_target":1,"_race_date_dt":pd.Timestamp("2021-06-01"),"_race_class":"OPEN","_surface":"TURF"},
            {"_race_id":"va_dirt","_horse_id":"d","_target":1,"_race_date_dt":pd.Timestamp("2021-06-02"),"_race_class":"OPEN","_surface":"DIRT"}
          ])
          base=dict(
            train_start="2020-01-01",train_end="2020-12-31",
            valid_start="2021-01-01",valid_end="2021-12-31",
            train_race_class="ALL",valid_race_class="ALL"
          )
          for surface,train_id,valid_id in [
            ("TURF","tr_turf","va_turf"),
            ("DIRT","tr_dirt","va_dirt")
          ]:
            a=Namespace(**base,train_surface=surface,valid_surface=surface)
            tr,va=mod.split(df,a)
            assert set(tr["_race_id"])=={train_id}, (surface,tr["_race_id"].tolist())
            assert set(va["_race_id"])=={valid_id}, (surface,va["_race_id"].tolist())
          print("SURFACE_SPECIALIST_PREFLIGHT_OK")
          PY
      - name: Cost guard
        run: |
          echo "Standard ubuntu-latest CPU only."
          echo "No GPU / Artifact / Cache / paid storage."

  turf_core4_2021:
    name: specialist-TURF-core4_no_pedigree-y2021
