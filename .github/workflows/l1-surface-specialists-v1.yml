name: L1 Surface Specialist Walk-Forward V1

on:
  push:
    branches:
      - research/l1-surface-specialists-v1-20260928
    paths:
      - .github/triggers/l1-surface-specialists-v1.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l1-surface-specialists-v1
  cancel-in-progress: true

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout KEIBA-ML
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ML dependencies
        run: python -m pip install --disable-pip-version-check -r ml/requirements.txt
      - name: Syntax and surface split behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/train-staged-lightgbm.py research/run_feature_arena.py research/archive_l1_surface_specialist_run.py
          python - <<'PY'
          import importlib.util
          from argparse import Namespace
          from pathlib import Path
          import pandas as pd

          path=Path("research/train-staged-lightgbm.py")
          spec=importlib.util.spec_from_file_location("train_surface_test",path)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          df=pd.DataFrame([
            {"_race_id":"tr_turf","_horse_id":"a","_target":1,"_race_date_dt":pd.Timestamp("2020-06-01"),"_race_class":"OPEN","_surface":"TURF"},
            {"_race_id":"tr_dirt","_horse_id":"b","_target":1,"_race_date_dt":pd.Timestamp("2020-06-02"),"_race_class":"OPEN","_surface":"DIRT"},
            {"_race_id":"va_turf","_horse_id":"c","_target":1,"_race_date_dt":pd.Timestamp("2021-06-01"),"_race_class":"OPEN","_surface":"TURF"},
            {"_race_id":"va_dirt","_horse_id":"d","_target":1,"_race_date_dt":pd.Timestamp("2021-06-02"),"_race_class":"OPEN","_surface":"DIRT"}
          ])
          base=dict(
            train_start="2020-01-01",train_end="2020-12-31",
            valid_start="2021-01-01",valid_end="2021-12-31",
            train_race_class="ALL",valid_race_class="ALL"
          )
          for surface,train_id,valid_id in [
            ("TURF","tr_turf","va_turf"),
            ("DIRT","tr_dirt","va_dirt")
          ]:
            a=Namespace(**base,train_surface=surface,valid_surface=surface)
            tr,va=mod.split(df,a)
            assert set(tr["_race_id"])=={train_id}
            assert set(va["_race_id"])=={valid_id}
          print("SURFACE_SPECIALIST_PREFLIGHT_OK")
          PY
      - name: Cost guard
        run: |
          echo "Standard ubuntu-latest CPU only."
          echo "No GPU / Artifact / Cache / paid storage."

  specialists:
    name: candidate-${{ matrix.candidate }}
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        candidate:
          - core4_no_pedigree
          - no_auto_full_pedigree_legacy
          - jockey_trainer_condition
          - no_auto_full
          - no_auto_jockey
          - no_auto_full_pedigree_v1
          - jockey_trainer_condition_plus_raceclass
    uses: ./.github/workflows/l1-surface-specialist-candidate.yml
    with:
      candidate: ${{ matrix.candidate }}
    secrets:
      KEIBA_ML_SNAPSHOTS: ${{ secrets.KEIBA_ML_SNAPSHOTS }}

  ledger:
    name: ledger
    if: always()
    needs: specialists
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Fast-forward branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"
      - name: Archive surface specialist ledger
        shell: bash
        run: |
          set -euo pipefail
          python research/archive_l1_surface_specialist_run.py             --repo "$GITHUB_REPOSITORY"             --run-id "$GITHUB_RUN_ID"             --config research/l1-surface-specialists-v1.json             --out-root research-results/l1-surface-specialists
      - name: Commit dedicated ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          if [[ ! -d research-results/l1-surface-specialists/SURFACE-SPECIALIST-WF-001 ]]; then
            echo "No complete specialist ledger to persist"
            exit 0
          fi
          git add research-results/l1-surface-specialists/SURFACE-SPECIALIST-WF-001
          if git diff --cached --quiet; then
            echo "No ledger changes to commit"
            exit 0
          fi
          git commit -m "research: archive SURFACE-SPECIALIST-WF-001 run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1
      - name: Ledger cost guard
        if: always()
        run: |
          echo "Only small structured result ledgers are persisted to Git."
          echo "No GitHub Artifact or Cache."
          echo "Existing Kaggle snapshot is read-only."
