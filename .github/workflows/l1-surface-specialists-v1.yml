  ledger:
    name: ledger
    if: always()
    needs:
      - turf_core4_2025
      - turf_pedigree_legacy_2025
      - turf_condition_2025
      - turf_full_2025
      - turf_light_2025
      - turf_pedigree_v1_2025
      - turf_condition_rc_2025
      - dirt_core4_2025
      - dirt_pedigree_legacy_2025
      - dirt_condition_2025
      - dirt_full_2025
      - dirt_light_2025
      - dirt_pedigree_v1_2025
      - dirt_condition_rc_2025
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Fast-forward branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"
      - name: Archive surface specialist ledger
        shell: bash
        run: |
          set -euo pipefail
          python research/archive_l1_surface_specialist_run.py             --repo "$GITHUB_REPOSITORY"             --run-id "$GITHUB_RUN_ID"             --config research/l1-surface-specialists-v1.json             --out-root research-results/l1-surface-specialists
      - name: Commit dedicated ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research-results/l1-surface-specialists/SURFACE-SPECIALIST-WF-001
          if git diff --cached --quiet; then
            echo "No ledger changes to commit"
            exit 0
          fi
          git commit -m "research: archive SURFACE-SPECIALIST-WF-001 run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1
      - name: Ledger cost guard
        if: always()
        run: |
          echo "Only small structured result ledgers are persisted to Git."
          echo "No GitHub Artifact or Cache."
          echo "Existing Kaggle snapshot is read-only."
