name: L2 AI vs Market Blindspot Audit

on:
  push:
    branches:
      - research/l2-core-v1-redefinition-20261001
    paths:
      - .github/triggers/l2-ai-market-blindspot.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-ai-market-blindspot
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/materialize_l17_seven_king_fullfield_v1.py             research/extract_l2_core_dates_v1.py             research/build_l2_core_v1_dataset.py             research/run_l2_core_v1.py             research/run_l2_core_v1_confidence_ab.py             research/run_l2_core_v1_ticket_calibration.py             research/run_l2_ai_market_blindspot_audit.py             research/build_l2_bet_kings_dataset_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.load(open("contracts/l2-core-v1.json",encoding="utf-8"))
          assert c["cost_policy"]["github_standard_cpu_only"] is True
          assert c["cost_policy"]["gpu"] is False
          src=Path("research/run_l2_ai_market_blindspot_audit.py").read_text()
          assert "all horses, all races, WIN market only" in src
          assert "no buying rule learned" in src
          assert "MARKET_PLUS_AI" in src
          assert "2026_locked" in src
          wf=Path(".github/workflows/l2-ai-market-blindspot.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses)
          assert not any(u.startswith("actions/cache") for u in uses)
          print("BLINDSPOT_STATIC_GUARDS_OK")
          PY
          bash -n scripts/kaggle-dataset-session-v2.sh

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt
          python -m pip install --disable-pip-version-check scikit-learn

      - name: Restore seven score tables once
        shell: bash
        run: |
          set -euo pipefail
          session="scripts/kaggle-dataset-session-v2.sh"
          for y in 2022 2023 2024 2025; do
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              d="out/l2-blindspot/scores/$y/$alias"
              ref="pino1945/keiba-l15-7k-$alias-y$y-v1"
              bash "$session" init "$ref" "$d"
              bash "$session" fetch "$d" score.jsonl
              p="$(find "$d" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
              test -n "$p"; test -s "$p"
            done
          done

      - name: Materialize L1.7 once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l2-blindspot/l17
          for y in 2022 2023 2024 2025; do
            args=()
            for spec in               core4_no_pedigree=core4               no_auto_full_pedigree_legacy=pedlegacy               jockey_trainer_condition=condition               no_auto_full=full               no_auto_jockey=light               no_auto_full_pedigree_v1=pedv1               jockey_trainer_condition_plus_raceclass=condrc; do
              name="${spec%%=*}"; alias="${spec##*=}"
              p="$(find "out/l2-blindspot/scores/$y/$alias" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
              args+=(--expert "$name=$p")
            done
            p="out/l2-blindspot/l17/l17-$y.jsonl.gz"
            python research/materialize_l17_seven_king_fullfield_v1.py --year "$y" "${args[@]}" --output "$p"
            echo "L17_$y=$p" >> "$GITHUB_ENV"
          done

      - name: Resolve dates and restore exact packs
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for y in 2022 2023 2024 2025; do
            p="$(find "out/l2-blindspot/scores/$y/core4" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
            args+=(--score-year "$y:$p")
          done
          python research/extract_l2_core_dates_v1.py "${args[@]}"             --dates-out out/l2-blindspot/all-dates.txt             --race-dates-out out/l2-blindspot/race-dates.csv
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          {
            while IFS= read -r d; do
              [[ -n "$d" ]] || continue
              echo "/data/daily/$d.jsonl.gz"
              echo "/data/odds/daily/$d.jsonl.gz"
            done < out/l2-blindspot/all-dates.txt
          } > out/backfill/.git/info/sparse-checkout
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Build L2 dataset once
        shell: bash
        run: |
          set -euo pipefail
          python research/build_l2_core_v1_dataset.py             --l17-year "2022:$L17_2022"             --l17-year "2023:$L17_2023"             --l17-year "2024:$L17_2024"             --l17-year "2025:$L17_2025"             --race-dates out/l2-blindspot/race-dates.csv             --backfill-root out/backfill             --out-dir out/l2-blindspot/dataset

      - name: Run blind-spot audit
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-ai-market-blindspot/run-$GITHUB_RUN_ID"
          python research/run_l2_ai_market_blindspot_audit.py             --dataset-dir out/l2-blindspot/dataset             --backfill-root out/backfill             --out-dir "$result"
          echo "===== RAW MODEL METRICS ====="
          cat "$result/raw-model-metrics.csv"
          echo "===== INCREMENTAL INFORMATION ====="
          cat "$result/incremental-information-test.csv"
          echo "===== DIVERGENCE BANDS ====="
          cat "$result/divergence-bands.csv"
          echo "===== BY RANK ====="
          cat "$result/divergence-by-rank.csv"
          test "$(du -sm "$result" | cut -f1)" -le 10

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard ubuntu-latest CPU only."
          echo "No GPU / paid runner / Artifact / Cache."
          echo "Horse-level WIN audit only; no exotic-ticket expansion."
          echo "No Kaggle writes."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-ai-market-blindspot/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: archive AI vs market blindspot audit $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
