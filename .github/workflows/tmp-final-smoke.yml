name: Temporary final smoke

on:
  push:
    branches:
      - feature/l1-feature-catalog-v1-20260927
    paths:
      - .github/workflows/tmp-final-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all Node smoke checks
        run: npm run smoke:all
      - name: Python syntax check
        run: python -m py_compile research/run_walk_forward.py research/train-staged-lightgbm.py
