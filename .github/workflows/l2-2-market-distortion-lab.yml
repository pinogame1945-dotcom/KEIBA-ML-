name: L2.2 Statistical Market Distortion Lab

on:
  push:
    branches:
      - research/l2.2-market-distortion-lab-20261015
    paths:
      - l2_2/**
      - .github/workflows/l2-2-market-distortion-lab.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l22-independent-20261015
  cancel-in-progress: false

jobs:
  full-study:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/l2.2-market-distortion-lab-20261015
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CPU dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Preflight no paid compute/artifacts and freeze check
        run: |
          set -euo pipefail
          python -m py_compile l2_2/market_distortion_lab.py
          git cat-file -e 9655c717333636b5cc931f672e12dbc377e396bc^{commit}
          python l2_2/market_distortion_lab.py --selftest
          if grep -E '^[[:space:]]*(runs-on: (gpu|self-hosted)|- uses: (actions/cache|actions/upload-artifact))' .github/workflows/l2-2-market-distortion-lab.yml; then exit 2; fi
      - name: Fetch pinned metadata once
        run: |
          set -euo pipefail
          mkdir -p out/pinned-history
          git init -q out/pinned-history
          git -C out/pinned-history remote add origin https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git
          git -C out/pinned-history sparse-checkout init --no-cone
          git -C out/pinned-history sparse-checkout set --no-cone data/manifest.json data/odds/manifest.json
          git -C out/pinned-history fetch --depth=1 --filter=blob:none origin 0d4af461b77f0060dd9c789dd2da646026fada47
          git -C out/pinned-history checkout -q --detach FETCH_HEAD
          test "$(git -C out/pinned-history rev-parse HEAD)" = 0d4af461b77f0060dd9c789dd2da646026fada47
          python l2_2/market_distortion_lab.py --prepare \
            --predictions research-results/market-fixed-anchor-residual-v2/run-38659856085/oos-fair-value-predictions.csv.gz \
            --backfill-root out/pinned-history --sparse-paths out/l22_paths.txt
      - name: Download only manifest-exact files once per runner
        run: |
          set -euo pipefail
          git -C out/pinned-history sparse-checkout set --no-cone --stdin < out/l22_paths.txt
      - name: One integrated statistical experiment, three year CPU processes
        run: |
          set -euo pipefail
          dest="research-results/l2-2-market-distortion-lab-v1/run-$GITHUB_RUN_ID"
          python -u l2_2/market_distortion_lab.py \
            --predictions research-results/market-fixed-anchor-residual-v2/run-38659856085/oos-fair-value-predictions.csv.gz \
            --joined research-results/l3-l175-frozen-ticket-trust-audit-v1/run-38710197503/joined_ticket_trust_complete.csv.gz \
            --missing research-results/l3-l175-frozen-ticket-trust-audit-v1/run-38710197503/tickets_missing_l175_signal.csv.gz \
            --backfill-root out/pinned-history --out-dir "$dest"
          test -s "$dest/summary.json"
          test -s "$dest/forward_portfolios.csv"
          test -s "$dest/annual_cells.jsonl.gz"
          test "$(du -sm "$dest" | cut -f1)" -le 4
      - name: Erase disposable historical source
        if: always()
        run: rm -rf out/pinned-history out/l22_paths.txt
      - name: Commit compact aggregate evidence only
        if: success()
        run: |
          set -euo pipefail
          dest="research-results/l2-2-market-distortion-lab-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin research/l2.2-market-distortion-lab-20261015
          git add "$dest"
          git commit -m "research(l2.2): walk-forward aggregate evidence $GITHUB_RUN_ID"
          git push origin HEAD:research/l2.2-market-distortion-lab-20261015
