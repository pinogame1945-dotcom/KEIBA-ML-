name: L1.5 Candidate Inflation V1

on:
  push:
    branches:
      - research/l15-candidate-inflation-v1-20260929
    paths:
      - .github/triggers/l15-candidate-inflation-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l15-candidate-inflation-v1
  cancel-in-progress: true

jobs:
  year:
    name: candidate-inflation-y${{ matrix.test_year }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - test_year: 2022
            delay_seconds: 0
          - test_year: 2023
            delay_seconds: 35
          - test_year: 2024
            delay_seconds: 70
          - test_year: 2025
            delay_seconds: 105

    env:
      TEST_YEAR: ${{ matrix.test_year }}
      START_DELAY_SECONDS: ${{ matrix.delay_seconds }}
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      GH_TOKEN: ${{ github.token }}
      GENERATION_ID: eb13d4096519167b
      ROUTER31_SHA: 97b4e3225f643d3ee5a8f72476678b16f5a7d95e
      ONLY_CANDIDATES: outsider_daytrend,outsider_raceshape,outsider_gatecourse,outsider_field,outsider_jockey

    steps:
      - name: Checkout candidate-inflation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax and contract checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/run_l1_outsider_year_lane_v2.py \
            research/aggregate_l15_candidate_inflation_v1.py \
            research/build_l1_nonhorse_dataset_v1.py \
            research/run_feature_arena.py \
            research/train-staged-lightgbm.py \
            research/emit_l1_to_l2.py \
            research/analyze_l1_outsider_rescue_v1.py
          node --check research/project-yearly-snapshots.mjs
          bash -n scripts/kaggle-snapshot-session.sh
          bash -n scripts/kaggle-fetch-router-years.sh

      - name: Install dependencies once
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Stagger read-only Kaggle restore
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$START_DELAY_SECONDS" -gt 0 ]]; then
            sleep "$START_DELAY_SECONDS"
          fi

      - name: Restore one rolling fold and seven-king router once
        shell: bash
        run: |
          set -euo pipefail
          y="$TEST_YEAR"
          train1=$((y-2))
          train2=$((y-1))
          snapshot_root="out/candidate-inflation-source/$GENERATION_ID/y$y"
          router_root="out/candidate-inflation-router"
          mkdir -p "$snapshot_root" "$router_root"

          bash scripts/kaggle-snapshot-session.sh init "$GENERATION_ID" "$snapshot_root"
          bash scripts/kaggle-snapshot-session.sh fetch "$GENERATION_ID" "$snapshot_root" "$train1" "$train2" "$y"
          bash scripts/kaggle-fetch-router-years.sh "$y" "$router_root"

          snapshot_path() {
            local yy="$1"
            if [[ -s "$snapshot_root/snapshot-$yy.jsonl.gz" ]]; then
              printf '%s' "$snapshot_root/snapshot-$yy.jsonl.gz"
            elif [[ -s "$snapshot_root/snapshot-$yy.jsonl" ]]; then
              printf '%s' "$snapshot_root/snapshot-$yy.jsonl"
            else
              echo "::error::snapshot missing year=$yy" >&2
              return 1
            fi
          }

          p1="$(snapshot_path "$train1")"
          p2="$(snapshot_path "$train2")"
          pv="$(snapshot_path "$y")"
          router="$(find "$router_root/$y" -type f \( -name 'router-7k.jsonl.gz' -o -name 'router-7k.jsonl' \) -print -quit)"
          test -n "$router"
          test -s "$router"

          echo "INPUTS=$p1,$p2,$pv" >> "$GITHUB_ENV"
          echo "VALID_SNAPSHOT=$pv" >> "$GITHUB_ENV"
          echo "ROUTER_SEVEN=$router" >> "$GITHUB_ENV"
          echo "CANDIDATE_INFLATION_DATA_READY year=$y train=$train1,$train2 valid=$y"

      - name: Restore Router31 decisions and fixed policies
        shell: bash
        run: |
          set -euo pipefail
          out="research-results/l15-candidate-inflation-v1/run-$GITHUB_RUN_ID/y$TEST_YEAR"
          mkdir -p "$out"
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$ROUTER31_SHA/research-results/l15-outsider-router-31-v1/run-36448207055/y$TEST_YEAR"
          curl -fL --retry 6 --retry-delay 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$base/decisions.csv" -o "$out/router-decisions.csv"
          curl -fL --retry 6 --retry-delay 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$base/result.json" -o "$out/router-result.json"
          test -s "$out/router-decisions.csv"
          test -s "$out/router-result.json"
          echo "YEAR_OUT=$out" >> "$GITHUB_ENV"

      - name: Recompute only five primary outsiders and export Gate Top6
        shell: bash
        run: |
          set -euo pipefail
          python research/run_l1_outsider_year_lane_v2.py \
            --year "$TEST_YEAR" \
            --inputs "$INPUTS" \
            --validation-snapshot "$VALID_SNAPSHOT" \
            --router-seven "$ROUTER_SEVEN" \
            --only-candidates "$ONLY_CANDIDATES" \
            --gate-race-ids "$YEAR_OUT/router-decisions.csv" \
            --top6-output "$YEAR_OUT/outsider-top6.csv" \
            --seven-union-output "$YEAR_OUT/seven-union.csv" \
            --ml-source-sha "$GITHUB_SHA"

      - name: Validate compact year ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          out=Path(os.environ["YEAR_OUT"])
          decisions=list(csv.DictReader(open(out/"router-decisions.csv",encoding="utf-8-sig")))
          top6=list(csv.DictReader(open(out/"outsider-top6.csv",encoding="utf-8-sig")))
          seven=list(csv.DictReader(open(out/"seven-union.csv",encoding="utf-8-sig")))
          assert decisions
          assert len(seven)==len(decisions), (len(seven),len(decisions))
          assert len(top6)==len(decisions)*5, (len(top6),len(decisions))
          assert {r["race_id"] for r in decisions}=={r["race_id"] for r in seven}
          assert {r["label_ja"] for r in top6}=={"当日傾向型","レース構造型","枠・コース型","メンバー構成型","騎手型"}
          fold=json.load(open(out/"router-result.json",encoding="utf-8"))
          assert int(fold["test_year"])==int(os.environ["TEST_YEAR"])
          print("CANDIDATE_INFLATION_YEAR_LEDGER_OK",os.environ["TEST_YEAR"],len(decisions))
          PY

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "Four validation-year lanes maximum."
          echo "Each lane restores its rolling three-year fold and seven-king router once."
          echo "Only five primary nonhorse outsiders are recomputed."
          echo "No GPU. No paid runner."
          echo "No GitHub Artifact/Cache."
          echo "Kaggle read-only; no new Dataset/Model persistence."
          echo "Only compact Gate Top6/union/Router ledgers are committed."
          echo "2026 sealed. Odds/popularity/payout forbidden."

      - name: Commit compact year ledger
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$YEAR_OUT"
          if git diff --cached --quiet; then
            echo "No year ledger changes"
            exit 0
          fi
          git commit -m "research: candidate inflation y$TEST_YEAR run $GITHUB_RUN_ID"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1

  aggregate:
    name: aggregate-candidate-inflation
    if: always()
    needs:
      - year
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout candidate-inflation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fast-forward year ledgers
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Aggregate Candidate Inflation
        shell: bash
        run: |
          set -euo pipefail
          python research/aggregate_l15_candidate_inflation_v1.py --run-id "$GITHUB_RUN_ID"

      - name: Commit aggregate ledgers
        shell: bash
        run: |
          set -euo pipefail
          out="research-results/l15-candidate-inflation-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            "$out/summary.json" \
            "$out/policy-comparison.csv" \
            "$out/race-level-policy.csv" \
            "$out/README.md"
          git commit -m "research: aggregate candidate inflation run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Aggregate policy
        if: always()
        shell: bash
        run: |
          echo "No Artifact/Cache/new external persistence."
          echo "Aggregate is small JSON/CSV/README committed to Git."
          echo "L2 ROI/EV remains a separate downstream gate."
