name: L2 Pure AI vs Market Rank Betting Frontier V1

on:
  push:
    branches:
      - research/l2-ai-market-rank-betfrontier-v1-20261015
    paths:
      - .github/triggers/l2-ai-market-rank-betfrontier-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-ai-market-rank-betfrontier-v1
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free standard CPU and source guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/run_l2_ai_market_rank_betfrontier_v1.py \
            research/run_l2_value_anchor_bet_frontier_v1.py \
            research/run_all_race_flow_ticket_audit_v1.py \
            research/build_l2_market_helpers_v1.py
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/l2-ai-market-rank-betfrontier-v1.yml").read_text()
          runners=[line.strip() for line in wf.splitlines() if line.strip().startswith("runs-on:")]
          uses=[line.strip() for line in wf.splitlines() if line.strip().startswith("- uses:")]
          assert runners == ["runs-on: ubuntu-latest"], runners
          assert not any("actions/cache" in item or "upload-artifact" in item for item in uses)
          assert not any("gpu" in line.lower() or "self-hosted" in line.lower() for line in runners)
          print("FREE_STANDARD_RUNNER_NO_PAID_STORAGE_OK")
          PY
      - name: Install only NumPy and Pandas
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check numpy pandas
      - name: Sparse checkout historical exact payout packs once
        shell: bash
        run: |
          set -euo pipefail
          pred="research-results/market-fixed-anchor-residual-v2/run-38659856085/oos-fair-value-predictions.csv.gz"
          test -s "$pred"
          SHA="0d4af461b77f0060dd9c789dd2da646026fada47"
          mkdir -p out/backfill
          git init -q out/backfill
          git -C out/backfill remote add origin https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git
          git -C out/backfill sparse-checkout init --no-cone
          python - "$pred" out/backfill/.git/info/sparse-checkout <<'PY'
          import pandas as pd,sys
          dat=pd.read_csv(sys.argv[1],compression="infer",usecols=["year","_race_date","_race_id"])
          assert set(dat["year"].astype(int))=={2023,2024,2025}
          dates=sorted(set(dat["_race_date"].astype(str).str[:10]))
          assert 200<=len(dates)<=500,len(dates)
          with open(sys.argv[2],"w") as f:
              for day in dates:f.write("/data/daily/"+day+".jsonl.gz\n")
          print("DATES",len(dates))
          PY
          git -C out/backfill fetch --filter=blob:none --depth=1 origin "$SHA"
          git -C out/backfill checkout -q --detach FETCH_HEAD
          test "$(git -C out/backfill rev-parse HEAD)" = "$SHA"
          echo "PINNED_PAYOUT_SOURCE_OK"
      - name: Compare raw AI, calibrated AI, market and EV on all races
        shell: bash
        run: |
          set -euo pipefail
          pred="research-results/market-fixed-anchor-residual-v2/run-38659856085/oos-fair-value-predictions.csv.gz"
          picks="research-results/all-race-one-pick-v1/run-38668174639/all-race-one-picks.csv.gz"
          out="research-results/l2-ai-market-rank-betfrontier-v1/run-$GITHUB_RUN_ID"
          python research/run_l2_ai_market_rank_betfrontier_v1.py \
            --predictions "$pred" --picks "$picks" \
            --backfill-root out/backfill --out-dir "$out"
          test -s "$out/summary.json"
          test -s "$out/all-anchor-fixed-template-results.csv"
          test -s "$out/ranking-topk-coverage.csv"
          test -s "$out/axis-hit-and-rank-comparison.csv"
          test -s "$out/selection-overlap-and-disagreement.csv"
          test -s "$out/per-anchor-cost-hit-roi-frontier.csv"
          test -s "$out/easy-compare-common-tickets.csv"
      - name: Remove temporary Backfill checkout
        if: always()
        shell: bash
        run: |
          rm -rf out/backfill
          echo "Standard free CPU only, ephemeral sparse checkout, no artifact or cache."
          echo "2026 data sealed."
      - name: Archive complete reproducible comparison to research branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          out="research-results/l2-ai-market-rank-betfrontier-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$out"
          git commit -m "research: archive pure AI vs market rank payout frontier $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
