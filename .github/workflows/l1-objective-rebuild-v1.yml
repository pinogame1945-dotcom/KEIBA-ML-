name: L1 Objective Rebuild V1

on:
  push:
    branches:
      - research/l1-objective-rebuild-v1-20261008
    paths:
      - .github/triggers/l1-objective-rebuild-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l1-objective-rebuild-v1
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      DATASET_REF: pino1945/keiba-ml-snapshot-bf811fa2eab73db0
      GENERATION_ID: bf811fa2eab73db0
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static and cost guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/run_l1_objective_rebuild_v1.py             research/resolve_snapshot_manifest_remote_v1.py
          node --check research/project-yearly-snapshots.mjs
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/l1-objective-rebuild-v1.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"], runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("uses:")]
          assert not any(x.startswith("actions/upload-artifact") for x in uses)
          assert not any(x.startswith("actions/cache") for x in uses)
          src=Path("research/run_l1_objective_rebuild_v1.py").read_text()
          for token in ("WIN_BINARY","TOP3_BINARY","RANK_GRADED","2026_locked"):
              assert token in src, token
          print("L1_OBJECTIVE_REBUILD_STATIC_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore snapshots metadata-first
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          root="out/l1-objective-snapshot"
          mkdir -p "$root"

          kaggle_transient() {
            local label="$1"; shift
            local attempt rc delay tmp
            for attempt in 1 2 3 4 5 6; do
              tmp="$(mktemp)"
              set +e
              "$@" >"$tmp.out" 2>"$tmp.err"
              rc=$?
              set -e
              cat "$tmp.out"
              cat "$tmp.err" >&2
              if [[ "$rc" -eq 0 ]]; then
                rm -f "$tmp" "$tmp.out" "$tmp.err"
                return 0
              fi
              if grep -Eqi '404 Client Error|Not Found for url' "$tmp.out" "$tmp.err"; then
                echo "::error::Kaggle 404 non-retryable label=$label" >&2
                rm -f "$tmp" "$tmp.out" "$tmp.err"
                return "$rc"
              fi
              if ! grep -Eqi '429|502|503|504|Too Many Requests|Bad Gateway|Service Unavailable|Gateway Timeout|timed out|connection reset|temporary failure' "$tmp.out" "$tmp.err"; then
                echo "::error::Kaggle non-transient failure label=$label rc=$rc" >&2
                rm -f "$tmp" "$tmp.out" "$tmp.err"
                return "$rc"
              fi
              rm -f "$tmp" "$tmp.out" "$tmp.err"
              [[ "$attempt" -lt 6 ]] || return "$rc"
              case "$attempt" in
                1) delay=10 ;;
                2) delay=20 ;;
                3) delay=40 ;;
                4) delay=60 ;;
                *) delay=90 ;;
              esac
              sleep "$delay"
            done
          }

          files="$root/files.json"
          kaggle_transient "files"             bash -c 'kaggle datasets files "$1" --page-size 200 --format "json(name,size)" >"$2"' _ "$DATASET_REF" "$files"

          python - "$files" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1],encoding="utf-8"))
          names={str(x.get("name") or "") for x in rows}
          if "manifest.json" not in names:
              raise SystemExit("manifest.json missing from metadata")
          PY

          kaggle_transient "download:manifest.json"             kaggle datasets download "$DATASET_REF" -f manifest.json -p "$root" --unzip --quiet --force
          test -s "$root/manifest.json"

          python research/resolve_snapshot_manifest_remote_v1.py             --manifest "$root/manifest.json"             --files-json "$files"             --generation-id "$GENERATION_ID"             --output "$root/requested.txt"

          while IFS=$'\t' read -r y logical remote mode sha rows min_date max_date; do
            [[ -n "$remote" ]] || continue
            kaggle_transient "download:$remote"               kaggle datasets download "$DATASET_REF" -f "$remote" -p "$root" --unzip --quiet --force
            test -s "$root/$remote"
          done < "$root/requested.txt"

          python - "$root/requested.txt" "$root" <<'PY'
          import gzip,hashlib,json,os,sys
          req,root=sys.argv[1:]
          for line in open(req,encoding="utf-8"):
              y,logical,remote,mode,expected_sha,expected_rows,min_date,max_date=line.rstrip("\n").split("\t")
              path=os.path.join(root,remote)
              if remote.endswith(".gz") and logical==remote and expected_sha:
                  h=hashlib.sha256()
                  with open(path,"rb") as f:
                      for block in iter(lambda:f.read(1024*1024),b""):
                          h.update(block)
                  if h.hexdigest()!=expected_sha:
                      raise SystemExit(f"sha256 mismatch {remote}")
              opener=gzip.open if remote.endswith(".gz") else open
              rows=0
              actual_min=None
              actual_max=None
              with opener(path,"rt",encoding="utf-8") as f:
                  for raw in f:
                      if not raw.strip():
                          continue
                      row=json.loads(raw)
                      d=str(row.get("race_date") or (row.get("features") or {}).get("race_date") or "")[:10]
                      rows+=1
                      if d:
                          actual_min=d if actual_min is None or d<actual_min else actual_min
                          actual_max=d if actual_max is None or d>actual_max else actual_max
              if expected_rows and rows!=int(expected_rows):
                  raise SystemExit(f"row mismatch {remote}: expected={expected_rows} actual={rows}")
              if min_date and actual_min!=min_date:
                  raise SystemExit(f"min_date mismatch {remote}: expected={min_date} actual={actual_min}")
              if max_date and actual_max!=max_date:
                  raise SystemExit(f"max_date mismatch {remote}: expected={max_date} actual={actual_max}")
              print(f"SNAPSHOT_OK year={y} logical={logical} remote={remote} mode={mode} rows={rows}")
          PY

      - name: Run core4 objective arena
        shell: bash
        run: |
          set -euo pipefail
          root="out/l1-objective-snapshot"
          proj="out/l1-objective-proj/core4"
          result="research-results/l1-objective-rebuild-v1/run-$GITHUB_RUN_ID/core4"
          mkdir -p "$proj" "$result"
          args=()
          while IFS=$'\t' read -r y logical remote mode sha rows min_date max_date; do
            node research/project-yearly-snapshots.mjs               --inputs "$root/$remote"               --output "$proj/y$y.jsonl.gz"               --feature-sets BASE,OPPONENT,AUTO,ACTOR,TIME_PACE               --prediction-phase FINAL
            args+=(--year-file "$y:$proj/y$y.jsonl.gz")
          done < "$root/requested.txt"
          python research/run_l1_objective_rebuild_v1.py             --variant core4             "${args[@]}"             --out-dir "$result"
          rm -rf "$proj"
          rm -f "$result/oos-predictions.csv.gz"

      - name: Run structural objective arena
        shell: bash
        run: |
          set -euo pipefail
          root="out/l1-objective-snapshot"
          proj="out/l1-objective-proj/structural"
          result="research-results/l1-objective-rebuild-v1/run-$GITHUB_RUN_ID/structural"
          mkdir -p "$proj" "$result"
          args=()
          while IFS=$'\t' read -r y logical remote mode sha rows min_date max_date; do
            node research/project-yearly-snapshots.mjs               --inputs "$root/$remote"               --output "$proj/y$y.jsonl.gz"               --feature-sets BASE,OPPONENT,NETWORK,LAP,STYLE,DISTANCE,BACKFILL,ACTOR,TIME_PACE               --actor-prefixes actor_jockey_,actor_trainer_               --prediction-phase FINAL
            args+=(--year-file "$y:$proj/y$y.jsonl.gz")
          done < "$root/requested.txt"
          python research/run_l1_objective_rebuild_v1.py             --variant structural_rich             "${args[@]}"             --out-dir "$result"
          rm -rf "$proj"
          rm -f "$result/oos-predictions.csv.gz"

      - name: Aggregate compact comparison
        shell: bash
        run: |
          set -euo pipefail
          root="research-results/l1-objective-rebuild-v1/run-$GITHUB_RUN_ID"
          python - "$root" <<'PY'
          import csv,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          rows=[]
          for variant in ("core4","structural"):
              with (root/variant/"pooled-metrics.csv").open(newline="",encoding="utf-8") as f:
                  rows.extend(csv.DictReader(f))
          fields=[]
          for row in rows:
              for k in row:
                  if k not in fields:
                      fields.append(k)
          with (root/"comparison.csv").open("w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=fields)
              w.writeheader()
              w.writerows(rows)
          summary={
              "contract":"L1_OBJECTIVE_REBUILD_V1_AGGREGATE",
              "walk_forward":"2 prior years -> next year, 2021-2025",
              "ability_uses_odds":False,
              "2026_locked":True,
              "promotion":False
          }
          (root/"summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print((root/"comparison.csv").read_text())
          PY
          echo "RESULT_DIR=$root" >> "$GITHUB_ENV"

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU or paid runner."
          echo "No Artifact or Cache."
          echo "Kaggle read-only."
          echo "Metadata listed once; manifest logical names resolve to one actual remote name."
          echo "404 is non-retryable."
          echo "Snapshots/projections stay runner-local."
          echo "Only compact CSV/JSON results are committed."
          echo "2026 sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$RESULT_DIR"
          git commit -m "research: archive L1 objective rebuild run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
