name: L1 Feature Arena KODOKU-002

on:
  push:
    branches:
      - feature/l1-feature-arena-trainer-v1-20260927
    paths:
      - .github/workflows/l1-feature-arena-kodoku002.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arena:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - name: base
            sets: BASE
          - name: actor
            sets: BASE,ACTOR
          - name: auto
            sets: BASE,AUTO
          - name: actor_auto
            sets: BASE,ACTOR,AUTO
          - name: actor_opponent
            sets: BASE,ACTOR,OPPONENT
          - name: actor_timepace
            sets: BASE,ACTOR,TIME_PACE
          - name: actor_pedigree
            sets: BASE,ACTOR,PEDIGREE
          - name: auto_opponent
            sets: BASE,AUTO,OPPONENT
          - name: auto_timepace
            sets: BASE,AUTO,TIME_PACE
          - name: actor_auto_opponent
            sets: BASE,ACTOR,AUTO,OPPONENT
          - name: actor_auto_timepace
            sets: BASE,ACTOR,AUTO,TIME_PACE
          - name: elite5
            sets: BASE,ACTOR,AUTO,OPPONENT,TIME_PACE,PEDIGREE

    name: arena-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      GENERATION_ID: e75cd10b7837f676
      KAGGLE_DATASET_REF: pino1945/keiba-ml-snapshot-e75cd10b7837f676
      BACKFILL_SHA: af9d0dcf3295e8276ca39fcbe104d7e9ac4c1cdc
      CANDIDATE_NAME: ${{ matrix.name }}
      CANDIDATE_SETS: ${{ matrix.sets }}

    steps:
      - name: Checkout KEIBA-ML
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax checks
        run: |
          python -m py_compile research/run_feature_arena.py research/train-staged-lightgbm.py research/archive_feature_arena_run.py
          node --check research/project-yearly-snapshots.mjs

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore 2023-2025 superset snapshots
        shell: bash
        run: |
          set -euo pipefail
          root="out/kodoku-input/$GENERATION_ID"
          mkdir -p "$root"
          for year in 2023 2024 2025; do
            bash scripts/kaggle-fetch-snapshot.sh "$GENERATION_ID" "$year" "$root"
          done
          test -s "$root/snapshot-2023.jsonl"
          test -s "$root/snapshot-2024.jsonl"
          test -s "$root/snapshot-2025.jsonl"

      - name: Build one-candidate config
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          sets=[x.strip() for x in os.environ["CANDIDATE_SETS"].split(",") if x.strip()]
          with open("candidate.json","w",encoding="utf-8") as f:
              json.dump([{"name":os.environ["CANDIDATE_NAME"],"feature_sets":sets}],f,ensure_ascii=False)
          PY

      - name: Run candidate
        shell: bash
        run: |
          set -euo pipefail
          root="out/kodoku-input/$GENERATION_ID"
          python research/run_feature_arena.py             --inputs "$root/snapshot-2023.jsonl,$root/snapshot-2024.jsonl,$root/snapshot-2025.jsonl"             --out-dir "out/feature-arena-kodoku002/$CANDIDATE_NAME"             --train-start 2023-01-01             --train-end 2024-12-31             --valid-start 2025-01-01             --valid-end 2025-12-31             --prediction-phase FINAL             --feature-selection none             --candidates-json candidate.json             --source-ref main             --source-sha "$BACKFILL_SHA"             --ml-source-sha "$GITHUB_SHA"

      - name: Print candidate score
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          name=os.environ["CANDIDATE_NAME"]
          p=Path("out/feature-arena-kodoku002")/name/"feature-arena-summary.json"
          s=json.loads(p.read_text(encoding="utf-8"))
          r=s["results"][0]
          print("FEATURE_ARENA_RESULT")
          print(json.dumps({
              "candidate":name,
              "feature_sets":r["feature_sets"],
              "feature_count":r["feature_count"],
              "metrics":r["metrics"],
              "resource_usage":r.get("resource_usage"),
          },ensure_ascii=False,separators=(",",":")))
          PY

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if grep -E "uses:[[:space:]]*actions/upload-artifact|uses:[[:space:]]*actions/cache" .github/workflows/l1-feature-arena-kodoku002.yml; then
            echo "Persistent GitHub Artifact/Cache usage found; refusing workflow." >&2
            exit 1
          fi
          echo "Standard GitHub-hosted runner only."
          echo "No GPU."
          echo "No Artifact or Cache."
          echo "Existing Kaggle snapshot is download-only."

  ledger:
    if: always()
    needs: arena
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPERIMENT_ID: KODOKU-002
      GENERATION_ID: e75cd10b7837f676
      BACKFILL_SHA: af9d0dcf3295e8276ca39fcbe104d7e9ac4c1cdc
      EXPECTED_CANDIDATES: base,actor,auto,actor_auto,actor_opponent,actor_timepace,actor_pedigree,auto_opponent,auto_timepace,actor_auto_opponent,actor_auto_timepace,elite5

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fast-forward branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Archive immutable ledger
        shell: bash
        run: |
          set -euo pipefail
          python research/archive_feature_arena_run.py             --repo "$GITHUB_REPOSITORY"             --run-id "$GITHUB_RUN_ID"             --experiment-id "$EXPERIMENT_ID"             --snapshot-generation "$GENERATION_ID"             --backfill-sha "$BACKFILL_SHA"             --train-start 2023-01-01             --train-end 2024-12-31             --valid-start 2025-01-01             --valid-end 2025-12-31             --prediction-phase FINAL             --model-family WIN_BINARY_LIGHTGBM             --feature-selection none             --expected-candidates "$EXPECTED_CANDIDATES"

      - name: Commit permanent ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "research-results/l1-feature-arena/$EXPERIMENT_ID"
          git commit -m "research: archive $EXPERIMENT_ID run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1

      - name: Ledger cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted runner only."
          echo "No GPU."
          echo "No Artifact or Cache."
          echo "Only small text/JSON ledger files are committed to Git."
