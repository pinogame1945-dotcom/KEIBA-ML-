name: L2 PRICER Contextual Volatility V2

on:
  push:
    branches:
      - research/l2-pricer-contextual-volatility-v2-20261004
    paths:
      - .github/triggers/l2-pricer-contextual-volatility-v2.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-pricer-contextual-volatility-v2
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static and cost guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/materialize_l17_seven_king_fullfield_v1.py \
            research/extract_l2_core_dates_v1.py \
            research/build_l2_core_v1_dataset.py \
            research/run_l2_pricer_latent_race_v1.py \
            research/run_l2_pricer_contextual_volatility_v2.py
          bash -n scripts/kaggle-dataset-session-v2.sh
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.load(open("contracts/l2-pricer-contextual-volatility-v2.json",encoding="utf-8"))
          assert c["contract"]=="L2_PRICER_CONTEXTUAL_VOLATILITY_V2"
          cp=c["cost_policy"]
          assert cp["github_standard_cpu_only"] is True
          assert cp["paid_runner"] is False and cp["gpu"] is False
          assert cp["paid_cloud_compute"] is False and cp["paid_artifact_or_cache"] is False
          assert c["data_policy"]["locked_years"]==[2026]
          wf=Path(".github/workflows/l2-pricer-contextual-volatility-v2.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert runners==["ubuntu-latest"],runners
          assert not any(u.startswith("actions/upload-artifact") for u in uses)
          assert not any(u.startswith("actions/cache") for u in uses)
          src=Path("research/run_l2_pricer_contextual_volatility_v2.py").read_text()
          assert "LABEL_DRAWS=192" in src and "FINAL_DRAWS=1536" in src
          assert '"roi_optimized":False' in src
          assert "ORACLE_DIAGNOSTIC" in src
          print("L2_CONTEXTUAL_VOLATILITY_STATIC_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore seven score tables metadata-first in parallel
        shell: bash
        run: |
          set -euo pipefail
          session="scripts/kaggle-dataset-session-v2.sh"
          mkdir -p out/l2-context/scores
          fetch_one() {
            y="$1"; alias="$2"
            d="out/l2-context/scores/$y/$alias"
            ref="pino1945/keiba-l15-7k-$alias-y$y-v1"
            bash "$session" init "$ref" "$d"
            bash "$session" fetch "$d" score.jsonl
            p="$(find "$d" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
            test -n "$p"; test -s "$p"
          }
          export -f fetch_one
          export session
          for y in 2022 2023 2024 2025; do
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              printf '%s %s\n' "$y" "$alias"
            done
          done | xargs -n2 -P2 bash -c 'fetch_one "$0" "$1"'

      - name: Materialize L1.7 years in parallel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l2-context/l17
          build_year() {
            y="$1"; args=()
            for spec in \
              core4_no_pedigree=core4 \
              no_auto_full_pedigree_legacy=pedlegacy \
              jockey_trainer_condition=condition \
              no_auto_full=full \
              no_auto_jockey=light \
              no_auto_full_pedigree_v1=pedv1 \
              jockey_trainer_condition_plus_raceclass=condrc; do
              name="${spec%%=*}"; alias="${spec##*=}"
              p="$(find "out/l2-context/scores/$y/$alias" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
              args+=(--expert "$name=$p")
            done
            python research/materialize_l17_seven_king_fullfield_v1.py --year "$y" "${args[@]}" --output "out/l2-context/l17/l17-$y.jsonl.gz"
          }
          export -f build_year
          printf '%s\n' 2022 2023 2024 2025 | xargs -n1 -P2 bash -c 'build_year "$0"'
          for y in 2022 2023 2024 2025; do test -s "out/l2-context/l17/l17-$y.jsonl.gz"; done

      - name: Resolve dates and restore BACKFILL daily packs once
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for y in 2022 2023 2024 2025; do
            p="$(find "out/l2-context/scores/$y/core4" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
            args+=(--score-year "$y:$p")
          done
          python research/extract_l2_core_dates_v1.py "${args[@]}" \
            --dates-out out/l2-context/all-dates.txt \
            --race-dates-out out/l2-context/race-dates.csv
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          while IFS= read -r d; do
            [[ -n "$d" ]] && echo "/data/daily/$d.jsonl.gz"
          done < out/l2-context/all-dates.txt > out/backfill/.git/info/sparse-checkout
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Build shared horse dataset once
        shell: bash
        run: |
          set -euo pipefail
          python research/build_l2_core_v1_dataset.py \
            --l17-year "2022:out/l2-context/l17/l17-2022.jsonl.gz" \
            --l17-year "2023:out/l2-context/l17/l17-2023.jsonl.gz" \
            --l17-year "2024:out/l2-context/l17/l17-2024.jsonl.gz" \
            --l17-year "2025:out/l2-context/l17/l17-2025.jsonl.gz" \
            --race-dates out/l2-context/race-dates.csv \
            --backfill-root out/backfill \
            --out-dir out/l2-context/dataset

      - name: Run contextual volatility main battle
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-pricer-contextual-volatility-v2/run-$GITHUB_RUN_ID"
          python research/run_l2_pricer_contextual_volatility_v2.py \
            --contract contracts/l2-pricer-contextual-volatility-v2.json \
            --dataset-dir out/l2-context/dataset \
            --backfill-root out/backfill \
            --out-dir "$result"
          cat "$result/fold-summary.csv"
          cat "$result/policy-selection.csv"
          du -sh "$result"
          test "$(du -sm "$result" | cut -f1)" -le 10

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner / paid cloud compute."
          echo "No actions/cache or upload-artifact."
          echo "Kaggle score restore is metadata-first, read-only, concurrency capped at 2."
          echo "All 13 volatility actions reuse one dataset and common random draws."
          echo "No odds, no ROI optimization, no ticket scan, no staking."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-pricer-contextual-volatility-v2/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result/README.md" "$result/summary.json" "$result/fold-summary.csv" "$result/policy-selection.csv" "$result/policy-nll-metrics.csv" "$result/threshold-search.csv" "$result/feature-importance.csv"
          git commit -m "research: archive L2 contextual volatility V2 $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
