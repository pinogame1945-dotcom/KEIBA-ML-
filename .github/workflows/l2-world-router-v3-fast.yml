name: L2 World Router V3 Fast

on:
  push:
    branches:
      - research/l2-world-router-v3-fast-20261004
    paths:
      - .github/triggers/l2-world-router-v3-fast.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-world-router-v3-fast
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/materialize_l17_seven_king_fullfield_v1.py \
            research/extract_l2_core_dates_v1.py \
            research/build_l2_core_v1_dataset.py \
            research/run_l2_core_v1.py \
            research/run_l2_race_distribution_mixture_v2.py \
            research/run_l2_world_router_v3.py \
            research/build_l2_bet_kings_dataset_v1.py
          bash -n scripts/kaggle-dataset-session-v2.sh
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.load(open("contracts/l2-world-router-v3.json",encoding="utf-8"))
          assert c["contract"]=="L2_WORLD_ROUTER_V3"
          assert c["router"]["margins"]==[0.05,0.10,0.15,0.20]
          assert c["evaluation"]["roi_optimized"] is False
          assert c["cost_policy"]["github_standard_cpu_only"] is True
          assert c["cost_policy"]["gpu"] is False
          assert c["cost_policy"]["paid_artifact_or_cache"] is False
          assert c["data_policy"]["locked_years"]==[2026]
          src=Path("research/run_l2_world_router_v3.py").read_text()
          for token in (
              'MARGINS=(0.05,0.10,0.15,0.20)',
              '"roi_optimized":False',
              '"market_price_used":False',
              '"2026_locked":True',
          ):
              assert token in src,token
          assert "edge_threshold" not in src
          wf=Path(".github/workflows/l2-world-router-v3-fast.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses)
          assert not any(u.startswith("actions/cache") for u in uses)
          print("L2_WORLD_ROUTER_STATIC_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Router unit checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research python - <<'PY'
          from run_l2_world_router_v3 import route_world
          assert route_world(.40,.60,.40,.60,.10,.10)=="NORMAL"
          assert route_world(.55,.60,.40,.60,.10,.10)=="COLLAPSE"
          assert route_world(.40,.75,.40,.60,.10,.10)=="OUTSIDER"
          assert route_world(.55,.75,.40,.60,.10,.10)=="BOTH"
          print("L2_WORLD_ROUTER_UNIT_OK")
          PY

      - name: Restore seven horse-level score tables metadata-first
        shell: bash
        run: |
          set -euo pipefail
          session="scripts/kaggle-dataset-session-v2.sh"
          for y in 2022 2023 2024 2025; do
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              d="out/l2-router/scores/$y/$alias"
              ref="pino1945/keiba-l15-7k-$alias-y$y-v1"
              bash "$session" init "$ref" "$d"
              bash "$session" fetch "$d" score.jsonl
              p="$(find "$d" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
              test -n "$p"; test -s "$p"
              echo "SCORE_OK year=$y alias=$alias path=$p"
            done
          done

      - name: Restore frozen safe Outsider ballots once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l2-router/ballots
          git fetch --depth=1 origin research/l16-outsider-support-safe-v1-20260930:refs/remotes/origin/router-outsider-source
          for y in 2022 2023 2024 2025; do
            git show "origin/router-outsider-source:research-results/l16-outsider-support-safe-fast-v2/run-36724124925/y$y/ballots.csv.gz" > "out/l2-router/ballots/y$y.csv.gz"
            test -s "out/l2-router/ballots/y$y.csv.gz"
          done

      - name: Materialize L1.7 full-field once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l2-router/l17
          for y in 2022 2023 2024 2025; do
            args=()
            for spec in \
              core4_no_pedigree=core4 \
              no_auto_full_pedigree_legacy=pedlegacy \
              jockey_trainer_condition=condition \
              no_auto_full=full \
              no_auto_jockey=light \
              no_auto_full_pedigree_v1=pedv1 \
              jockey_trainer_condition_plus_raceclass=condrc; do
              name="${spec%%=*}"; alias="${spec##*=}"
              p="$(find "out/l2-router/scores/$y/$alias" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
              args+=(--expert "$name=$p")
            done
            p="out/l2-router/l17/l17-$y.jsonl.gz"
            python research/materialize_l17_seven_king_fullfield_v1.py --year "$y" "${args[@]}" --output "$p"
            test -s "$p"
            echo "L17_$y=$p" >> "$GITHUB_ENV"
          done

      - name: Resolve exact race dates
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for y in 2022 2023 2024 2025; do
            p="$(find "out/l2-router/scores/$y/core4" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
            args+=(--score-year "$y:$p")
          done
          python research/extract_l2_core_dates_v1.py "${args[@]}" \
            --dates-out out/l2-router/all-dates.txt \
            --race-dates-out out/l2-router/race-dates.csv

      - name: Sparse restore exact result packs once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          {
            while IFS= read -r d; do
              [[ -n "$d" ]] || continue
              echo "/data/daily/$d.jsonl.gz"
            done < out/l2-router/all-dates.txt
          } > out/backfill/.git/info/sparse-checkout
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Build shared L1.7 horse dataset once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/l2-router/dataset
          python research/build_l2_core_v1_dataset.py \
            --l17-year "2022:$L17_2022" \
            --l17-year "2023:$L17_2023" \
            --l17-year "2024:$L17_2024" \
            --l17-year "2025:$L17_2025" \
            --race-dates out/l2-router/race-dates.csv \
            --backfill-root out/backfill \
            --out-dir out/l2-router/dataset
          cat out/l2-router/dataset/manifest.json

      - name: Run sparse world router walk-forward
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-world-router-v3-fast/run-$GITHUB_RUN_ID"
          PYTHONPATH=research python research/run_l2_world_router_v3.py \
            --contract contracts/l2-world-router-v3.json \
            --dataset-dir out/l2-router/dataset \
            --ballots-year "2022:out/l2-router/ballots/y2022.csv.gz" \
            --ballots-year "2023:out/l2-router/ballots/y2023.csv.gz" \
            --ballots-year "2024:out/l2-router/ballots/y2024.csv.gz" \
            --ballots-year "2025:out/l2-router/ballots/y2025.csv.gz" \
            --backfill-root out/backfill \
            --headline-only \
            --out-dir "$result"
          echo "===== FOLD METRICS ====="
          cat "$result/fold-metrics.csv"
          echo "===== ROUTER DIAGNOSTICS ====="
          cat "$result/router-diagnostics.csv"
          du -sh "$result"
          test "$(du -sm "$result" | cut -f1)" -le 30

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner / paid cloud compute."
          echo "No actions/cache or upload-artifact."
          echo "Kaggle seven-score datasets are read-only and metadata-resolved."
          echo "No Kaggle writes."
          echo "Frozen Outsider ballots restored once and reused."
          echo "Only BACKFILL result packs are restored; odds packs are not downloaded."
          echo "Headline-only fast path: no full-ticket enumeration/calibration."
          echo "No ROI, market-price, ticket-selection, or staking optimization."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-world-router-v3-fast/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add \
            "$result/README.md" \
            "$result/summary.json" \
            "$result/fold-metrics.csv" \
            "$result/gate-metrics.csv" \
            "$result/router-grid.csv" \
            "$result/router-diagnostics.csv" \
            "$result/race-router.csv.gz"
          git commit -m "research: archive L2 world router V3 fast $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
