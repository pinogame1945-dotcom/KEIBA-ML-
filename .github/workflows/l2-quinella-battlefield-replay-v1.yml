name: L2 QUINELLA Battlefield Replay V1

on:
  push:
    branches:
      - research/l2-quinella-battlefield-replay-v1-20260930
    paths:
      - .github/triggers/l2-quinella-battlefield-replay-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-quinella-battlefield-replay-v1
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/build_l2_bet_kings_dataset_v1.py             research/run_l2_quinella_battlefield_replay_v1.py             research/run_l2_ticket_eval_quinella_v0.py             research/run_l2_ticket_market_gap_v2.py             research/run_l2_market_gap_law_arena_v1.py             research/run_l2_quinella_auto_calibration_v1.py
          python research/test_odds_comma_decoder_v1.py
          bash -n scripts/kaggle-dataset-session-v2.sh
          bash -n scripts/rebuild-seven-score-local-v1.sh
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/l2-quinella-battlefield-replay-v1.yml").read_text()
          src=Path("research/run_l2_quinella_battlefield_replay_v1.py").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses)
          assert not any(u.startswith("actions/cache") for u in uses)
          forbidden=("/data/daily/"+"2026-","/data/odds/daily/"+"2026-","--l17-"+"2026")
          assert not any(x in wf for x in forbidden)
          decoder=Path("research/build_l2_bet_kings_dataset_v1.py").read_text()
          assert 'replace(",","")' in decoder
          assert "wilson_lower" in src
          assert "target_year_never_used_for_segment_selection" in src
          assert "overlap_aware_top" in src
          assert '"target_year_never_used_for_segment_selection":True' in src
          assert '"2026_locked":True' in src
          print("BATTLEFIELD_REPLAY_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Sparse restore 2021-2025 race and odds packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          cat > out/backfill/.git/info/sparse-checkout <<'EOF'
          /data/daily/2021-*.jsonl.gz
          /data/daily/2022-*.jsonl.gz
          /data/daily/2023-*.jsonl.gz
          /data/daily/2024-*.jsonl.gz
          /data/daily/2025-*.jsonl.gz
          /data/odds/daily/2021-*.jsonl.gz
          /data/odds/daily/2022-*.jsonl.gz
          /data/odds/daily/2023-*.jsonl.gz
          /data/odds/daily/2024-*.jsonl.gz
          /data/odds/daily/2025-*.jsonl.gz
          EOF
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Restore seven scores metadata-first two-wide
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/score-status
          cat > out/fetch-score-one.sh <<'SH'
          #!/usr/bin/env bash
          set -u
          y="$1"; alias="$2"
          d="out/scores/$y/$alias"
          ref="pino1945/keiba-l15-7k-$alias-y$y-v1"
          status="out/score-status/$y-$alias.rc"
          mkdir -p "$d"
          set +e
          bash scripts/kaggle-dataset-session-v2.sh init "$ref" "$d"
          rc=$?
          if [[ "$rc" -eq 0 ]]; then
            bash scripts/kaggle-dataset-session-v2.sh fetch "$d" score.jsonl
            rc=$?
          fi
          set -e
          printf '%s\n' "$rc" > "$status"
          exit 0
          SH
          chmod +x out/fetch-score-one.sh
          : > out/score-jobs.txt
          for y in 2021 2022 2023 2024 2025; do
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              echo "$y $alias" >> out/score-jobs.txt
            done
          done
          xargs -n2 -P2 out/fetch-score-one.sh < out/score-jobs.txt
          while read -r y alias; do
            rc="$(cat "out/score-status/$y-$alias.rc")"
            d="out/scores/$y/$alias"
            if [[ "$rc" -eq 43 || "$rc" -eq 44 ]]; then
              rm -f "$d/score.jsonl" "$d/score.jsonl.gz"
              bash scripts/rebuild-seven-score-local-v1.sh "$alias" "$y" "$d"
            elif [[ "$rc" -ne 0 ]]; then
              exit "$rc"
            fi
            p="$(find "$d" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
            test -n "$p"; test -s "$p"
          done < out/score-jobs.txt

      - name: Materialize L1.7 two-wide
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l17
          cat > out/materialize-l17-one.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          y="$1"
          args=()
          for spec in             core4_no_pedigree=core4             no_auto_full_pedigree_legacy=pedlegacy             jockey_trainer_condition=condition             no_auto_full=full             no_auto_jockey=light             no_auto_full_pedigree_v1=pedv1             jockey_trainer_condition_plus_raceclass=condrc; do
            name="${spec%%=*}"; alias="${spec##*=}"
            p="$(find "out/scores/$y/$alias" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
            test -n "$p"; test -s "$p"
            args+=(--expert "$name=$p")
          done
          out="out/l17/l17-$y.jsonl.gz"
          python research/materialize_l17_seven_king_fullfield_v1.py --year "$y" "${args[@]}" --output "$out"
          test -s "$out"
          SH
          chmod +x out/materialize-l17-one.sh
          printf '%s\n' 2021 2022 2023 2024 2025 | xargs -n1 -P2 out/materialize-l17-one.sh
          for y in 2021 2022 2023 2024 2025; do
            echo "L17_$y=out/l17/l17-$y.jsonl.gz" >> "$GITHUB_ENV"
          done

      - name: Replay pretarget battlefield segments
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-quinella-battlefield-replay-v1/run-$GITHUB_RUN_ID"
          python research/run_l2_quinella_battlefield_replay_v1.py             --l17-2021 "$L17_2021"             --l17-2022 "$L17_2022"             --l17-2023 "$L17_2023"             --l17-2024 "$L17_2024"             --l17-2025 "$L17_2025"             --backfill-root out/backfill             --out-dir "$result"
          cat "$result/summary.json"
          cat "$result/pretarget-union-replay.csv"
          cat "$result/pretarget-selected-segments.csv"

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner."
          echo "No actions/cache or upload-artifact."
          echo "Kaggle existing datasets read-only."
          echo "No persistent dataset/model upload."
          echo "Two-wide parallelism stays inside the same standard runner."
          echo "Only compact result files are committed."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-quinella-battlefield-replay-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result/summary.json" "$result/pretarget-union-replay.csv" \
                  "$result/pretarget-selected-segments.csv" "$result/best-segment-by-dimension.csv" \
                  "$result/selection-audit.csv"
          git commit -m "research: archive quinella battlefield replay run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
