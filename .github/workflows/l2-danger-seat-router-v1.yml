name: L2 Danger Seat Router V1

on:
  push:
    branches:
      - research/l2-danger-seat-router-v1-20260929
    paths:
      - .github/triggers/l2-danger-seat-router-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-danger-seat-router-v1
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1
      FIXED_LEDGER_DIR: research-results/l15-fixed-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/run_l2_danger_seat_router_v1.py
          python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/l2-danger-seat-router-v1.yml').read_text()
          assert 'runs-on: ubuntu-latest' in wf
          uses=[line.strip().split(':',1)[1].strip() for line in wf.splitlines() if line.strip().startswith('- uses:')]
          forbidden=[u for u in uses if u.startswith('actions/cache') or u.startswith('actions/upload-artifact')]
          assert not forbidden, forbidden
          src=Path('research/run_l2_danger_seat_router_v1.py').read_text()
          assert 'ACTIONS=("BASE","K2_SECOND")' in src
          assert 'LOCKED_YEARS=(2026,)' in src
          assert 'percentile_against_train' in src
          assert 'No trifecta odds' in src
          print('SEAT_ROUTER_GUARDS_OK')
          PY

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check kaggle pandas scikit-learn

      - name: Restore 2022-2025 seven-king routers once
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/kaggle-fetch-router-years.sh "2022,2023,2024,2025" out/l2-danger-seat-router/router
          for y in 2022 2023 2024 2025; do
            p="$(find "out/l2-danger-seat-router/router/$y" -type f \( -name 'router-7k.jsonl' -o -name 'router-7k.jsonl.gz' \) -print -quit)"
            test -n "$p"; test -s "$p"
            echo "ROUTER_$y=$p" >> "$GITHUB_ENV"
          done

      - name: Resolve danger dates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l2-danger-seat-router
          python - <<'PY'
          import gzip,json,os
          from pathlib import Path
          dates=set()
          for y in (2022,2023,2024,2025):
              ids=set()
              with open(f'research-results/l15-fixed-v1/y{y}.jsonl',encoding='utf-8') as fh:
                  for line in fh:
                      if line.strip(): ids.add(str(json.loads(line)['race_id']))
              p=os.environ[f'ROUTER_{y}']
              op=gzip.open if p.endswith('.gz') else open
              with op(p,'rt',encoding='utf-8') as fh:
                  for line in fh:
                      if not line.strip(): continue
                      row=json.loads(line); rid=str(row.get('race_id') or '')
                      if rid in ids: dates.add(str(row['race_date'])[:10])
          Path('out/l2-danger-seat-router/dates.txt').write_text('\n'.join(sorted(dates))+'\n',encoding='utf-8')
          print(f'DANGER_DATES={len(dates)}')
          PY

      - name: Sparse restore race and WIN odds packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          {
            echo "/data/manifest.json"
            echo "/data/odds/manifest.json"
            while IFS= read -r dt; do
              [[ -n "$dt" ]] || continue
              echo "/data/daily/$dt.jsonl.gz"
              echo "/data/odds/daily/$dt.jsonl.gz"
            done < out/l2-danger-seat-router/dates.txt
          } > out/backfill/.git/info/sparse-checkout
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Run seat router walk-forward
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-danger-seat-router-v1/run-$GITHUB_RUN_ID"
          python research/run_l2_danger_seat_router_v1.py \
            --fixed-ledger-dir "$FIXED_LEDGER_DIR" \
            --router-year "2022:$ROUTER_2022" \
            --router-year "2023:$ROUTER_2023" \
            --router-year "2024:$ROUTER_2024" \
            --router-year "2025:$ROUTER_2025" \
            --backfill-root out/backfill \
            --out-dir "$result"
          echo "===== MODEL QUALITY ====="
          cat "$result/model-quality.csv"
          echo "===== STABILITY ====="
          cat "$result/stability.csv"

      - name: Cost guard
        if: always()
        run: |
          echo "Standard ubuntu-latest CPU only."
          echo "No GPU / paid runner / Artifact / Cache."
          echo "Only compact CSV/JSON/README results are committed."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-danger-seat-router-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add \
            "$result/README.md" "$result/summary.json" "$result/folds.csv" \
            "$result/model-quality.csv" "$result/selection-metrics.csv" \
            "$result/stability.csv" "$result/selected-races.csv"
          git commit -m "research: archive danger seat router v1 run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
