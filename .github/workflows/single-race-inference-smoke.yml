name: Single race inference safety tests
on:
  pull_request:
    paths:
      - "src/ml-dataset.mjs"
      - "src/single-race-engine.mjs"
      - "src/single-race-historical-extra.mjs"
      - "research/predict-one-race.mjs"
      - "research/score-one-race.py"
      - "scripts/single-race-engine-smoke.mjs"
      - "models/one-race-registry.json"
      - "research/replay-seven-kings.py"
      - "research/replay-archived-council.py"
      - "research/replay-one-race-id.py"
      - "research/analyze-one-race.py"
      - "scripts/archived-council-smoke.py"
      - "research/replay-seven-kings-kaggle.sh"
      - "scripts/seven-king-replay-smoke.py"
      - "research/replay-saved-l17.py"
      - "research/market_context_v1.py"
      - "scripts/market-context-v1-smoke.py"
      - "research/bridge-keiba-mobile-odds.py"
      - "scripts/mobile-jra-bridge-smoke.py"
      - "research/audit-seven-king-bundles.py"
      - "research/verify-trained-kings-vs-saved-scores.py"
      - "research/predict-prior-year-seven-kings.py"
      - "scripts/prove-existing-trained-kings.sh"
      - "research/extract-race-snapshot.py"
      - "scripts/single-race-snapshot-extraction-smoke.py"
      - "scripts/score-known-race-kaggle.sh"
      - ".github/workflows/one-race-previous-year-king-prediction.yml"
      - "scripts/l17-saved-p3-smoke.py"
      - "scripts/github-readonly-archive.py"
      - ".github/workflows/single-race-inference-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Parser syntax and one-race replay smoke
        run: |
          node --check src/ml-dataset.mjs
          node --check src/single-race-engine.mjs
          node --check src/single-race-historical-extra.mjs
          node --check research/predict-one-race.mjs
          python3 -m py_compile research/score-one-race.py research/replay-seven-kings.py research/replay-one-race-id.py
          bash -n research/replay-seven-kings-kaggle.sh
          python3 scripts/seven-king-replay-smoke.py
          python3 scripts/l17-saved-p3-smoke.py
          python3 scripts/market-context-v1-smoke.py
          python3 scripts/mobile-jra-bridge-smoke.py
          python3 -m py_compile research/audit-seven-king-bundles.py research/verify-trained-kings-vs-saved-scores.py research/predict-prior-year-seven-kings.py
          python3 scripts/single-race-snapshot-extraction-smoke.py
          bash -n scripts/score-known-race-kaggle.sh
          bash -n scripts/prove-existing-trained-kings.sh
          python3 -m py_compile scripts/github-readonly-archive.py
          python3 scripts/archived-council-smoke.py
          node scripts/single-race-engine-smoke.mjs
      - name: Existing L1 feature tests
        run: npm run smoke:all
