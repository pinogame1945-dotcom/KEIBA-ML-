name: L1 walk-forward research

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only or execute training
        required: true
        default: plan
        type: choice
        options:
          - plan
          - run
      first_holdout:
        description: First holdout year
        required: true
        default: "2025"
      last_holdout:
        description: Last holdout year
        required: true
        default: "2025"
      train_years:
        description: Training window in years
        required: true
        default: "3"
      warmup_years:
        description: History warm-up years before train window
        required: true
        default: "1"
      history_limit:
        description: Recent-race history limit
        required: true
        default: "5"
      stage:
        description: Cumulative feature stage
        required: true
        default: style
        type: choice
        options:
          - base
          - opponent_v1
          - opponent_both
          - lap
          - style
          - distance_v1
          - backfill_v1
          - auto_v1
          - auto_backfill_v1
      backfill_ref:
        description: KEIBA-BACKFILL branch/tag/sha
        required: true
        default: main

permissions:
  contents: read

jobs:
  walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout KEIBA-ML
        uses: actions/checkout@v4

      - name: Checkout BACKFILL data source
        if: ${{ inputs.mode == 'run' }}
        uses: actions/checkout@v4
        with:
          repository: pinogame1945-dotcom/KEIBA-BACKFILL
          ref: ${{ inputs.backfill_ref }}
          path: backfill

      - name: Record BACKFILL source commit
        if: ${{ inputs.mode == 'run' }}
        shell: bash
        run: |
          echo "BACKFILL_SHA=$(git -C backfill rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        if: ${{ inputs.mode == 'run' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: BACKFILL readiness gate
        if: ${{ inputs.mode == 'run' }}
        run: |
          node scripts/audit-backfill-readiness.mjs \
            --source-root backfill \
            --start "$(( ${{ inputs.first_holdout }} - ${{ inputs.train_years }} - ${{ inputs.warmup_years }} ))-01-01" \
            --end "${{ inputs.last_holdout }}-12-31" \
            --report-out out/backfill-readiness.json \
            --source-sha "$BACKFILL_SHA" \
            --min-core-known-coverage 0.98 \
            --max-invalid-rate 0 \
            --max-year-gap 0.10

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: L1 leakage smoke
        if: ${{ inputs.mode == 'run' }}
        run: npm run smoke:l1-dataset

      - name: Install ML dependencies
        if: ${{ inputs.mode == 'run' }}
        run: python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Print walk-forward plan
        run: |
          python research/run_walk_forward.py             --source-root backfill             --out-dir out/walk-forward             --first-holdout "${{ inputs.first_holdout }}"             --last-holdout "${{ inputs.last_holdout }}"             --train-years "${{ inputs.train_years }}"             --warmup-years "${{ inputs.warmup_years }}"             --history-limit "${{ inputs.history_limit }}"             --stage "${{ inputs.stage }}"             --source-ref "${{ inputs.backfill_ref }}"             --source-sha "$BACKFILL_SHA"             --ml-source-sha "$GITHUB_SHA"             --readiness-report out/backfill-readiness.json             --ml-source-sha "$GITHUB_SHA"             --plan-only

      - name: Run L1 walk-forward
        if: ${{ inputs.mode == 'run' }}
        run: |
          python research/run_walk_forward.py             --source-root backfill             --out-dir out/walk-forward             --first-holdout "${{ inputs.first_holdout }}"             --last-holdout "${{ inputs.last_holdout }}"             --train-years "${{ inputs.train_years }}"             --warmup-years "${{ inputs.warmup_years }}"             --history-limit "${{ inputs.history_limit }}"             --stage "${{ inputs.stage }}"             --source-ref "${{ inputs.backfill_ref }}"             --source-sha "$BACKFILL_SHA"

      - name: Show output sizes
        if: ${{ inputs.mode == 'run' }}
        run: du -ah out/walk-forward | sort -h | tail -50

      # Persistent artifact upload is intentionally disabled.
      # Cost policy: results stay on the ephemeral standard runner unless the user
      # explicitly approves chargeable/persistent storage in a separate change.
