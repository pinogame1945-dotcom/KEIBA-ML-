name: Historical 2025 seven-king council read-only free CPU
on:
  push:
    branches: [feature/l1-7king-2026-928-preflight-20261017]
    paths:
      - .github/workflows/l1-7king-2025-historical-council-freecpu.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seven-king-2025-council:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen 2026 research lock
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/materialize_l16_full_rank_consensus_v1.py
          python -c "import json; x=json.load(open('research/l1-raceclass-absorption-walkforward-v1.json')); assert x['locked_years']==[2026] and len(x['candidates'])==7"
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install --no-cache-dir --disable-pip-version-check kaggle
      - name: Restore seven original 2025 score files without changing models
        shell: bash
        run: |
          set -euo pipefail
          for alias in core4 pedlegacy condition full light pedv1 condrc; do
            mkdir -p "$RUNNER_TEMP/king2025/$alias"
            kaggle datasets download "pino1945/keiba-l15-7k-$alias-y2025-v1" -f score.jsonl.gz -p "$RUNNER_TEMP/king2025/$alias" --unzip --quiet --force
            test -s "$RUNNER_TEMP/king2025/$alias/score.jsonl.gz"
          done
      - name: Apply unchanged frozen L1.6 full-rank council to real 2025 scores
        shell: bash
        run: |
          set -euo pipefail
          python research/materialize_l16_full_rank_consensus_v1.py \
            --expert "core4=$RUNNER_TEMP/king2025/core4/score.jsonl.gz" \
            --expert "pedlegacy=$RUNNER_TEMP/king2025/pedlegacy/score.jsonl.gz" \
            --expert "condition=$RUNNER_TEMP/king2025/condition/score.jsonl.gz" \
            --expert "full=$RUNNER_TEMP/king2025/full/score.jsonl.gz" \
            --expert "light=$RUNNER_TEMP/king2025/light/score.jsonl.gz" \
            --expert "pedv1=$RUNNER_TEMP/king2025/pedv1/score.jsonl.gz" \
            --expert "condrc=$RUNNER_TEMP/king2025/condrc/score.jsonl.gz" \
            --output "$RUNNER_TEMP/council2025.jsonl.gz"
          python research/audit_historical_7king_2025_council_v1.py \
            --input "$RUNNER_TEMP/council2025.jsonl.gz"
      - name: Read-only and cost policy
        if: always()
        run: |
          echo "Free standard CPU; read-only Kaggle 2025 scores."
          echo "No model training, 2026 results, Kaggle writes, paid artifacts or cache."
