name: L2 Normal Role Structure Lab V1

on:
  push:
    branches:
      - research/l2-normal-role-structure-lab-v1-20260929
    paths:
      - .github/triggers/l2-normal-role-structure-lab-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-normal-role-structure-lab-v1
  cancel-in-progress: true

jobs:
  normal-role-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1
      FIXED_LEDGER_DIR: research-results/l15-fixed-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/build_l2_bet_kings_dataset_v1.py             research/run_l2_normal_role_structure_lab_v1.py
          python - <<'PY'
          from pathlib import Path
          p=Path(".github/workflows/l2-normal-role-structure-lab-v1.yml")
          lines=p.read_text().splitlines()
          runners=[x.strip().split(":",1)[1].strip() for x in lines if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"], runners
          uses=[x.strip().split(":",1)[1].strip() for x in lines if x.strip().startswith("uses:")]
          forbidden=[u for u in uses if u.startswith("actions/cache") or u.startswith("actions/upload-artifact")]
          assert not forbidden, forbidden
          s=Path("research/run_l2_normal_role_structure_lab_v1.py").read_text()
          assert 'race_filtering":False' in s
          assert 'gate_alert") or 0)!=0' in s
          assert 'ticket_novel_count") or 0)!=0' in s
          print("NORMAL_ROLE_STRUCTURE_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        run: python -m pip install --disable-pip-version-check kaggle

      - name: Restore 2022-2025 seven-king routers once
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/kaggle-fetch-router-years.sh "2022,2023,2024,2025" out/l2-normal/router
          for y in 2022 2023 2024 2025; do
            p="$(find "out/l2-normal/router/$y" -type f \( -name 'router-7k.jsonl' -o -name 'router-7k.jsonl.gz' \) -print -quit)"
            test -n "$p"; test -s "$p"
            echo "ROUTER_$y=$p" >> "$GITHUB_ENV"
          done

      - name: Resolve race dates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/l2-normal
          python research/extract_l2_bet_kings_dates_v1.py             --router-year "2022:$ROUTER_2022"             --router-year "2023:$ROUTER_2023"             --router-year "2024:$ROUTER_2024"             --router-year "2025:$ROUTER_2025"             --dates-out out/l2-normal/all-dates.txt             --race-dates-out out/l2-normal/all-race-dates.csv

      - name: Sparse restore market packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout             https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          {
            echo "/data/manifest.json"
            echo "/data/odds/manifest.json"
            while IFS= read -r d; do
              [[ -n "$d" ]] || continue
              echo "/data/daily/$d.jsonl.gz"
              echo "/data/odds/daily/$d.jsonl.gz"
            done < out/l2-normal/all-dates.txt
          } > out/backfill/.git/info/sparse-checkout
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Build deterministic ticket dataset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/l2-normal/dataset
          python research/build_l2_bet_kings_dataset_v1.py             --fixed-ledger-dir "$FIXED_LEDGER_DIR"             --router-year "2022:$ROUTER_2022"             --router-year "2023:$ROUTER_2023"             --router-year "2024:$ROUTER_2024"             --router-year "2025:$ROUTER_2025"             --backfill-root out/backfill             --out-dir out/l2-normal/dataset

      - name: Run PASS_SEVEN_ONLY structure tournament
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-normal-role-structure-lab-v1/run-$GITHUB_RUN_ID"
          python research/run_l2_normal_role_structure_lab_v1.py             --dataset-dir out/l2-normal/dataset             --out-dir "$result"
          cp out/l2-normal/dataset/manifest.json "$result/dataset-manifest.json"
          echo "===== STRUCTURE STABILITY ====="
          cat "$result/structure-stability.csv"
          echo "===== BET TYPE LEADERS ====="
          cat "$result/bet-type-leaders.csv"

      - name: Cost guard
        if: always()
        run: |
          echo "Standard ubuntu-latest CPU only."
          echo "No GPU / paid runner / Artifact / Cache."
          echo "Kaggle router datasets are read-only."
          echo "BACKFILL is sparse-cloned read-only at a pinned commit."
          echo "Large deterministic ticket datasets are ephemeral."
          echo "Only compact result CSV/JSON/README files are committed."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-normal-role-structure-lab-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add             "$result/README.md"             "$result/summary.json"             "$result/dataset-manifest.json"             "$result/yearly-metrics.csv"             "$result/structure-stability.csv"             "$result/bet-type-leaders.csv"
          git commit -m "research: archive normal-role structure lab v1 run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
