name: L2 Fixed Scenario Portfolio V1

on:
  push:
    branches:
      - research/l2-outsider-fixed-strategy-v1-20261001
    paths:
      - .github/triggers/l2-fixed-scenario-portfolio-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-fixed-scenario-portfolio-v1
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/run_l2_fixed_scenario_portfolio_v1.py research/run_l2_outsider_fixed_strategy_v1.py research/run_l2_ticket_lab_v1.py research/build_l2_bet_kings_dataset_v1.py
          python - <<'PY'
          from pathlib import Path
          src=Path("research/run_l2_fixed_scenario_portfolio_v1.py").read_text()
          for token in (
              'PORTFOLIO_BUDGET_YEN=1000',
              '"MAINLINE"',
              '"HOLE_MIX"',
              '"REVERSE"',
              '"target_budget_yen":PORTFOLIO_BUDGET_YEN',
              '"2026_locked":True',
              '"promotion":False',
          ):
              assert token in src,token
          assert "predict_proba" not in src
          assert "edge_threshold" not in src
          assert "odds_gate" in src
          wf=Path(".github/workflows/l2-fixed-scenario-portfolio-v1.yml").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses)
          assert not any(u.startswith("actions/cache") for u in uses)
          print("L2_FIXED_SCENARIO_PORTFOLIO_STATIC_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pandas numpy lightgbm

      - name: Restore frozen safe Outsider ballots once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/outsider-fixed/ballots
          git fetch --depth=1 origin research/l16-outsider-support-safe-v1-20260930:refs/remotes/origin/l2-outsider-source
          for y in 2023 2024 2025; do
            git show "origin/l2-outsider-source:research-results/l16-outsider-support-safe-fast-v2/run-36724124925/y$y/ballots.csv.gz" > "out/outsider-fixed/ballots/y$y.csv.gz"
            test -s "out/outsider-fixed/ballots/y$y.csv.gz"
          done

      - name: Sparse restore 2023-2025 race packs once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          cat > out/backfill/.git/info/sparse-checkout <<'PATTERNS'
          /data/daily/2023-*.jsonl.gz
          /data/daily/2024-*.jsonl.gz
          /data/daily/2025-*.jsonl.gz
          PATTERNS
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Run fixed scenario portfolio
        shell: bash
        run: |
          set -euo pipefail
          source_market="research-results/l1-asymmetric-dissent-v3/run-36818983849/scored.csv.gz"
          test -s "$source_market"
          result="research-results/l2-fixed-scenario-portfolio-v1/run-$GITHUB_RUN_ID"
          PYTHONPATH=research python research/run_l2_fixed_scenario_portfolio_v1.py \
            --market-scored "$source_market" \
            --ballots-year "2023:out/outsider-fixed/ballots/y2023.csv.gz" \
            --ballots-year "2024:out/outsider-fixed/ballots/y2024.csv.gz" \
            --ballots-year "2025:out/outsider-fixed/ballots/y2025.csv.gz" \
            --backfill-root out/backfill \
            --out-dir "$result"
          echo "===== SUMMARY ====="
          cat "$result/summary.json"
          echo "===== PORTFOLIO ====="
          cat "$result/portfolio-summary.csv"
          echo "===== SCENARIOS ====="
          cat "$result/scenario-summary.csv"
          du -sh "$result"
          test "$(du -sm "$result" | cut -f1)" -le 20

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard ubuntu-latest CPU only."
          echo "No GPU / paid runner / paid cloud compute."
          echo "No Artifact / Cache."
          echo "No Kaggle access."
          echo "No ML training, no odds gate, no threshold search, no race selection."
          echo "Human-defined fixed 500/300/200 scenario portfolio."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-fixed-scenario-portfolio-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: archive L2 Fixed Scenario Portfolio V1 $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
