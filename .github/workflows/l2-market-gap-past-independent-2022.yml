name: L2 Market Gap Past Independent 2022

on:
  push:
    branches:
      - research/l2-market-gap-past-independent-v1-20260930
    paths:
      - .github/triggers/l2-market-gap-past-independent-2022.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-market-gap-past-independent-2022
  cancel-in-progress: true

jobs:
  evaluate:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      BACKFILL_SHA: 923c6b296b2ef2dc6dc1e17e3c71e794ceffe3a1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             research/materialize_l17_seven_king_fullfield_v1.py             research/run_l2_market_gap_past_independent_2022.py             research/run_feature_arena.py             research/emit_l1_to_l2.py
          bash -n scripts/kaggle-dataset-session-v2.sh
          bash -n scripts/rebuild-seven-score-local-v1.sh
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/l2-market-gap-past-independent-2022.yml").read_text()
          lines=wf.splitlines()
          runners=[x.strip().split(":",1)[1].strip() for x in lines if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in lines if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses),uses
          assert not any(u.startswith("actions/cache") for u in uses),uses
          forbidden_year="20"+"26"
          runtime_steps=wf.split("\n    steps:\n",1)[1]
          assert forbidden_year not in runtime_steps,forbidden_year
          print("PAST_INDEPENDENT_2022_GUARDS_OK")
          PY

      - name: Install standard CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Restore 2021-2022 seven scores metadata-first
        shell: bash
        run: |
          set -euo pipefail
          session_script="scripts/kaggle-dataset-session-v2.sh"
          rebuild_script="scripts/rebuild-seven-score-local-v1.sh"
          for y in 2021 2022; do
            for alias in core4 pedlegacy condition full light pedv1 condrc; do
              d="out/scores/$y/$alias"
              ref="pino1945/keiba-l15-7k-$alias-y$y-v1"
              mkdir -p "$d"
              set +e
              bash "$session_script" init "$ref" "$d"
              rc=$?
              if [[ "$rc" -eq 0 ]]; then
                bash "$session_script" fetch "$d" score.jsonl
                rc=$?
              fi
              set -e
              if [[ "$rc" -eq 43 || "$rc" -eq 44 ]]; then
                echo "::warning::score source unavailable; deterministic local rebuild year=$y alias=$alias rc=$rc"
                rm -f "$d/score.jsonl" "$d/score.jsonl.gz"
                bash "$rebuild_script" "$alias" "$y" "$d"
              elif [[ "$rc" -ne 0 ]]; then
                echo "::error::score restore failed year=$y alias=$alias rc=$rc"
                exit "$rc"
              fi
              p="$(find "$d" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
              test -n "$p"; test -s "$p"
              echo "SEVEN_SCORE_OK year=$y alias=$alias path=$p"
            done
          done

      - name: Materialize L1.7 full-field 2021-2022
        shell: bash
        run: |
          set -euo pipefail
          for y in 2021 2022; do
            args=()
            for spec in               core4_no_pedigree=core4               no_auto_full_pedigree_legacy=pedlegacy               jockey_trainer_condition=condition               no_auto_full=full               no_auto_jockey=light               no_auto_full_pedigree_v1=pedv1               jockey_trainer_condition_plus_raceclass=condrc; do
              name="${spec%%=*}"; alias="${spec##*=}"
              p="$(find "out/scores/$y/$alias" -maxdepth 1 -type f \( -name 'score.jsonl' -o -name 'score.jsonl.gz' \) -print -quit)"
              test -n "$p"; test -s "$p"
              args+=(--expert "$name=$p")
            done
            out="out/l17/l17-$y.jsonl.gz"
            python research/materialize_l17_seven_king_fullfield_v1.py               --year "$y" "${args[@]}" --output "$out"
            test -s "$out"
            echo "L17_$y=$out" >> "$GITHUB_ENV"
          done

      - name: Sparse restore 2021-2022 race and odds packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          cat > out/backfill/.git/info/sparse-checkout <<'EOF'
          /data/daily/2021-*.jsonl.gz
          /data/daily/2022-*.jsonl.gz
          /data/odds/daily/2021-*.jsonl.gz
          /data/odds/daily/2022-*.jsonl.gz
          EOF
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"
          echo "daily2021=$(find out/backfill/data/daily -type f -name '2021-*.jsonl.gz' | wc -l)"
          echo "daily2022=$(find out/backfill/data/daily -type f -name '2022-*.jsonl.gz' | wc -l)"
          echo "odds2021=$(find out/backfill/data/odds/daily -type f -name '2021-*.jsonl.gz' | wc -l)"
          echo "odds2022=$(find out/backfill/data/odds/daily -type f -name '2022-*.jsonl.gz' | wc -l)"

      - name: Run 2021 to 2022 independent test
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-market-gap-past-independent-2022/run-$GITHUB_RUN_ID"
          python research/run_l2_market_gap_past_independent_2022.py             --l17-2021 "$L17_2021"             --l17-2022 "$L17_2022"             --backfill-root out/backfill             --out-dir "$result"
          cat "$result/summary.json"
          echo "===== FROZEN POLICY ====="
          cat "$result/frozen-policy.csv"
          echo "===== GAP BANDS ====="
          cat "$result/frozen-gap-bands.csv"
          echo "===== PURE RANKING ====="
          cat "$result/pure-ranking-policies.csv"

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner."
          echo "No actions/cache or upload-artifact."
          echo "Kaggle existing datasets read-only; no Kaggle writes."
          echo "404/403 are non-retryable; score fallback is deterministic local rebuild from existing snapshots."
          echo "Only compact research outputs are committed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-market-gap-past-independent-2022/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: archive past-independent 2022 market-gap run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
