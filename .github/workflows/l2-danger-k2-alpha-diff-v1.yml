name: L2 Danger K2 Alpha Difference V1

on:
  push:
    branches:
      - research/l2-danger-k2-alpha-diff-v1-20260929
    paths:
      - .github/triggers/l2-danger-k2-alpha-diff-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-danger-k2-alpha-diff-v1
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/run_l2_danger_k2_alpha_diff_v1.py
          python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/l2-danger-k2-alpha-diff-v1.yml').read_text()
          assert 'runs-on: ubuntu-latest' in wf
          uses=[line.strip().split(':',1)[1].strip() for line in wf.splitlines() if line.strip().startswith('- uses:')]
          forbidden=[u for u in uses if u.startswith('actions/cache') or u.startswith('actions/upload-artifact')]
          assert not forbidden, forbidden
          src=Path('research/run_l2_danger_k2_alpha_diff_v1.py').read_text()
          assert 'FIXED_A0' in src and 'FIXED_A1' in src
          assert 'No new model' in src
          print('K2_ALPHA_DIFF_GUARD_OK')
          PY

      - name: Install pandas
        run: python -m pip install --disable-pip-version-check pandas

      - name: Diagnose alpha0 vs alpha1
        shell: bash
        run: |
          set -euo pipefail
          source_csv="research-results/l2-danger-k2-alpha-wf-v1/run-36543847643/selected-races.csv"
          result="research-results/l2-danger-k2-alpha-diff-v1/run-$GITHUB_RUN_ID"
          test -s "$source_csv"
          python research/run_l2_danger_k2_alpha_diff_v1.py \
            --selected-races "$source_csv" \
            --out-dir "$result"
          echo "===== SUMMARY ====="
          cat "$result/summary.csv"
          echo "===== TOP CONTRIBUTORS ====="
          head -n 20 "$result/delta-contributors.csv"

      - name: Cost guard
        if: always()
        run: |
          echo "Standard ubuntu-latest CPU only."
          echo "No Kaggle / BACKFILL refetch."
          echo "No GPU / paid runner / Artifact / Cache."
          echo "Compact CSV/JSON/README only."

      - name: Commit compact diagnostic
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-danger-k2-alpha-diff-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result/README.md" "$result/summary.json" "$result/summary.csv" \
                  "$result/changed-races.csv" "$result/delta-contributors.csv"
          git commit -m "research: archive K2 alpha difference v1 run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
