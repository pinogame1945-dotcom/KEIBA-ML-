  ledger:
    name: ledger
    if: always()
    needs:
      - round_2021
      - round_2022
      - round_2023
      - round_2024
      - round_2025
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fast-forward branch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Archive permanent walk-forward ledger
        shell: bash
        run: |
          set -euo pipefail
          python research/archive_l1_walkforward_run.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --config research/l1-final-walkforward-v1.json

      - name: Commit permanent ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research-results/l1-final-walkforward/L1-FINAL-WF-001
          if git diff --cached --quiet; then
            echo "No ledger changes to commit"
            exit 0
          fi
          git commit -m "research: archive L1 final walk-forward run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1

      - name: Ledger cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted CPU runner only."
          echo "No GPU."
          echo "No Artifact or Cache."
          echo "Only small text/JSON result ledgers are committed to Git."
