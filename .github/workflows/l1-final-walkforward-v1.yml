name: L1 Final Walk-Forward League V1

on:
  push:
    branches:
      - feature/l1-feature-arena-trainer-v1-20260927
    paths:
      - .github/triggers/l1-final-walkforward-v1.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l1-final-walkforward-round-robin-v1
  cancel-in-progress: false

jobs:
  round_2021:
    name: round-2021
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        candidate:
          - core4_no_pedigree
          - no_auto_full_pedigree
          - jockey_trainer_condition
          - no_auto_full
          - no_auto_jockey
          - all_retest_v5
          - elite5_retest_v5
          - jockey_pedigree_fullauto_v3
          - jockey_horse_pedigree_fullauto_v3

    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      MATRIX_CANDIDATE: ${{ matrix.candidate }}
      VALIDATION_YEAR: "2021"

    steps:
      - name: Checkout KEIBA-ML
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax checks
        run: |
          python -m py_compile research/run_feature_arena.py research/train-staged-lightgbm.py research/archive_l1_walkforward_run.py
          node --check research/project-yearly-snapshots.mjs
          bash -n scripts/kaggle-fetch-snapshot.sh

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Load league config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path

          cfg=json.loads(Path("research/l1-final-walkforward-v1.json").read_text(encoding="utf-8"))
          generation=str(cfg.get("snapshot_generation") or "")
          if not generation or generation.startswith("PENDING"):
              raise SystemExit("snapshot_generation is still pending; refusing to launch")

          year=int(os.environ["VALIDATION_YEAR"])
          if year in set(int(x) for x in cfg.get("locked_years") or []):
              raise SystemExit(f"locked validation year: {year}")
          if year not in [int(x) for x in cfg["validation_years"]]:
              raise SystemExit(f"validation year not in config: {year}")

          name=os.environ["MATRIX_CANDIDATE"]
          rows=[x for x in cfg["candidates"] if x["name"]==name]
          if len(rows)!=1:
              raise SystemExit(f"expected one candidate config for {name}")
          row=rows[0]

          window=int(cfg["training_window_years"])
          if window!=2:
              raise SystemExit("V1 workflow requires exactly two rolling training years")

          train_y1=year-2
          train_y2=year-1
          candidate={"name":name,"feature_sets":row["feature_sets"]}
          if row.get("actor_prefixes"):
              candidate["actor_prefixes"]=row["actor_prefixes"]
          if row.get("auto_slices"):
              candidate["auto_slices"]=row["auto_slices"]
          Path("candidate.json").write_text(json.dumps([candidate],ensure_ascii=False)+"\n",encoding="utf-8")

          env={
              "GENERATION_ID":generation,
              "KAGGLE_DATASET_REF":f"pino1945/keiba-ml-snapshot-{generation}",
              "CANDIDATE_LABEL_JA":str(row.get("label_ja") or name),
              "TRAIN_YEAR_1":str(train_y1),
              "TRAIN_YEAR_2":str(train_y2),
              "TRAIN_START":f"{train_y1}-01-01",
              "TRAIN_END":f"{train_y2}-12-31",
              "VALID_START":f"{year}-01-01",
              "VALID_END":f"{year}-12-31",
          }
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              for k,v in env.items():
                  fh.write(f"{k}={v}\n")
          print(json.dumps({"candidate":candidate,"label_ja":row.get("label_ja"),"generation":generation,
                            "train":[train_y1,train_y2],"validation":year},ensure_ascii=False))
          PY

      - name: Restore rolling three-year snapshots
        shell: bash
        run: |
          set -euo pipefail
          root="out/wf-input/$GENERATION_ID"
          mkdir -p "$root"
          for year in "$TRAIN_YEAR_1" "$TRAIN_YEAR_2" "$VALIDATION_YEAR"; do
            bash scripts/kaggle-fetch-snapshot.sh "$GENERATION_ID" "$year" "$root"
          done

          paths=()
          for year in "$TRAIN_YEAR_1" "$TRAIN_YEAR_2" "$VALIDATION_YEAR"; do
            if [[ -s "$root/snapshot-$year.jsonl" ]]; then
              paths+=("$root/snapshot-$year.jsonl")
            elif [[ -s "$root/snapshot-$year.jsonl.gz" ]]; then
              paths+=("$root/snapshot-$year.jsonl.gz")
            else
              echo "::error::snapshot for $year missing after restore"
              exit 1
            fi
          done
          input_csv="$(IFS=,; echo "${paths[*]}")"
          echo "INPUTS=$input_csv" >> "$GITHUB_ENV"

      - name: Run walk-forward candidate
        shell: bash
        run: |
          set -euo pipefail
          out="out/l1-final-walkforward/$MATRIX_CANDIDATE-y$VALIDATION_YEAR"
          python research/run_feature_arena.py \
            --inputs "$INPUTS" \
            --out-dir "$out" \
            --train-start "$TRAIN_START" \
            --train-end "$TRAIN_END" \
            --valid-start "$VALID_START" \
            --valid-end "$VALID_END" \
            --prediction-phase FINAL \
            --feature-selection none \
            --candidates-json candidate.json \
            --source-ref main \
            --ml-source-sha "$GITHUB_SHA"

      - name: Print walk-forward result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          name=os.environ["MATRIX_CANDIDATE"]
          year=int(os.environ["VALIDATION_YEAR"])
          p=Path("out/l1-final-walkforward")/f"{name}-y{year}"/"feature-arena-summary.json"
          s=json.loads(p.read_text(encoding="utf-8"))
          r=s["results"][0]
          print("L1_WALKFORWARD_RESULT")
          print(json.dumps({
              "candidate":name,
              "label_ja":os.environ.get("CANDIDATE_LABEL_JA"),
              "validation_year":year,
              "train_start":os.environ["TRAIN_START"],
              "train_end":os.environ["TRAIN_END"],
              "feature_sets":r["feature_sets"],
              "actor_prefixes":r.get("actor_prefixes") or [],
              "auto_slices":r.get("auto_slices") or [],
              "feature_count":r["feature_count"],
              "metrics":r["metrics"],
              "resource_usage":r.get("resource_usage"),
          },ensure_ascii=False,separators=(",",":")))
          PY

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if grep -E "uses:[[:space:]]*actions/upload-artifact|uses:[[:space:]]*actions/cache" .github/workflows/l1-final-walkforward-v1.yml; then
            echo "::error::Persistent GitHub Artifact/Cache usage found; refusing workflow."
            exit 1
          fi
          echo "Round 2021: exactly one job per candidate."
          echo "Standard GitHub-hosted CPU runner only."
          echo "No GPU."
          echo "No GitHub Artifact/Cache."
          echo "Existing approved Kaggle private snapshot storage is read-only."

