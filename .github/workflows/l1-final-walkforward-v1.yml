                            "generation":generation,"train":[train_y1,train_y2],
                            "validation":year},ensure_ascii=False))
          PY

      - name: Restore rolling three-year snapshots
        shell: bash
        run: |
          set -euo pipefail
          root="out/wf-input/$GENERATION_ID"
          mkdir -p "$root"
          for y in "$TRAIN_YEAR_1" "$TRAIN_YEAR_2" "$VALIDATION_YEAR"; do
            bash scripts/kaggle-fetch-snapshot.sh "$GENERATION_ID" "$y" "$root"
          done

          paths=()
          for y in "$TRAIN_YEAR_1" "$TRAIN_YEAR_2" "$VALIDATION_YEAR"; do
            if [[ -s "$root/snapshot-$y.jsonl" ]]; then
              paths+=("$root/snapshot-$y.jsonl")
            elif [[ -s "$root/snapshot-$y.jsonl.gz" ]]; then
              paths+=("$root/snapshot-$y.jsonl.gz")
            else
              echo "::error::snapshot for $y missing after restore"
              exit 1
            fi
          done
          input_csv="$(IFS=,; echo "${paths[*]}")"
          echo "INPUTS=$input_csv" >> "$GITHUB_ENV"

      - name: Run walk-forward candidate
        shell: bash
        run: |
          set -euo pipefail
          out="out/l1-final-walkforward/$MATRIX_CANDIDATE-y$VALIDATION_YEAR"
          python research/run_feature_arena.py \
            --inputs "$INPUTS" \
            --out-dir "$out" \
            --train-start "$TRAIN_START" \
            --train-end "$TRAIN_END" \
            --valid-start "$VALID_START" \
            --valid-end "$VALID_END" \
            --prediction-phase FINAL \
            --feature-selection none \
            --candidates-json candidate.json \
            --source-ref main \
            --ml-source-sha "$GITHUB_SHA"

      - name: Print walk-forward result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          name=os.environ["MATRIX_CANDIDATE"]
          year=int(os.environ["VALIDATION_YEAR"])
          p=Path("out/l1-final-walkforward")/f"{name}-y{year}"/"feature-arena-summary.json"
          s=json.loads(p.read_text(encoding="utf-8"))
          r=s["results"][0]
          print("L1_WALKFORWARD_RESULT")
          print(json.dumps({
              "candidate":name,
              "label_ja":os.environ.get("CANDIDATE_LABEL_JA"),
              "validation_year":year,
              "train_start":os.environ["TRAIN_START"],
              "train_end":os.environ["TRAIN_END"],
              "feature_sets":r["feature_sets"],
              "actor_prefixes":r.get("actor_prefixes") or [],
              "auto_slices":r.get("auto_slices") or [],
              "feature_count":r["feature_count"],
              "metrics":r["metrics"],
              "resource_usage":r.get("resource_usage"),
          },ensure_ascii=False,separators=(",",":")))
          PY

      - name: Cost guard
        if: always()
        run: |
          echo "Candidate lane: jockey_horse_pedigree_fullauto_v3"
          echo "Validation year: 2024"
          echo "Standard GitHub-hosted CPU runner only."
          echo "No GPU."
          echo "No GitHub Artifact/Cache."
          echo "Existing approved Kaggle private snapshot storage is read-only."

  lane_jockey_horse_pedigree_2025:
    name: league-jockey_horse_pedigree_fullauto_v3-y2025
    needs: lane_jockey_horse_pedigree_2024
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KEIBA_ML_SNAPSHOTS }}
      MATRIX_CANDIDATE: "jockey_horse_pedigree_fullauto_v3"
      VALIDATION_YEAR: "2025"

    steps:
      - name: Checkout KEIBA-ML
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax checks
        run: |
          python -m py_compile research/run_feature_arena.py research/train-staged-lightgbm.py research/archive_l1_walkforward_run.py
          node --check research/project-yearly-snapshots.mjs
          bash -n scripts/kaggle-fetch-snapshot.sh

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check kaggle
          python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Load league config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path

          cfg=json.loads(Path("research/l1-final-walkforward-v1.json").read_text(encoding="utf-8"))
          generation=str(cfg.get("snapshot_generation") or "")
          if not generation or generation.startswith("PENDING"):
              raise SystemExit("snapshot_generation is still pending; refusing to launch")

          year=int(os.environ["VALIDATION_YEAR"])
          if year in set(int(x) for x in cfg.get("locked_years") or []):
              raise SystemExit(f"locked validation year: {year}")
          if year not in [int(x) for x in cfg["validation_years"]]:
              raise SystemExit(f"validation year not in config: {year}")

          name=os.environ["MATRIX_CANDIDATE"]
          rows=[x for x in cfg["candidates"] if x["name"]==name]
          if len(rows)!=1:
              raise SystemExit(f"expected one candidate config for {name}")
          row=rows[0]

          window=int(cfg["training_window_years"])
          if window!=2:
              raise SystemExit("V1 workflow requires exactly two rolling training years")

          train_y1=year-2
          train_y2=year-1
          candidate={"name":name,"feature_sets":row["feature_sets"]}
          if row.get("actor_prefixes"):
              candidate["actor_prefixes"]=row["actor_prefixes"]
          if row.get("auto_slices"):
              candidate["auto_slices"]=row["auto_slices"]
          Path("candidate.json").write_text(json.dumps([candidate],ensure_ascii=False)+"\n",encoding="utf-8")

          env={
              "GENERATION_ID":generation,
              "KAGGLE_DATASET_REF":f"pino1945/keiba-ml-snapshot-{generation}",
              "CANDIDATE_LABEL_JA":str(row.get("label_ja") or name),
              "TRAIN_YEAR_1":str(train_y1),
              "TRAIN_YEAR_2":str(train_y2),
              "TRAIN_START":f"{train_y1}-01-01",
              "TRAIN_END":f"{train_y2}-12-31",
              "VALID_START":f"{year}-01-01",
              "VALID_END":f"{year}-12-31",
          }
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              for k,v in env.items():
                  fh.write(f"{k}={v}\n")
          print(json.dumps({"candidate":candidate,"label_ja":row.get("label_ja"),
                            "generation":generation,"train":[train_y1,train_y2],
                            "validation":year},ensure_ascii=False))
          PY

      - name: Restore rolling three-year snapshots
        shell: bash
        run: |
          set -euo pipefail
          root="out/wf-input/$GENERATION_ID"
          mkdir -p "$root"
          for y in "$TRAIN_YEAR_1" "$TRAIN_YEAR_2" "$VALIDATION_YEAR"; do
            bash scripts/kaggle-fetch-snapshot.sh "$GENERATION_ID" "$y" "$root"
          done

          paths=()
          for y in "$TRAIN_YEAR_1" "$TRAIN_YEAR_2" "$VALIDATION_YEAR"; do
            if [[ -s "$root/snapshot-$y.jsonl" ]]; then
              paths+=("$root/snapshot-$y.jsonl")
            elif [[ -s "$root/snapshot-$y.jsonl.gz" ]]; then
              paths+=("$root/snapshot-$y.jsonl.gz")
            else
              echo "::error::snapshot for $y missing after restore"
              exit 1
            fi
          done
          input_csv="$(IFS=,; echo "${paths[*]}")"
          echo "INPUTS=$input_csv" >> "$GITHUB_ENV"

      - name: Run walk-forward candidate
        shell: bash
        run: |
          set -euo pipefail
          out="out/l1-final-walkforward/$MATRIX_CANDIDATE-y$VALIDATION_YEAR"
          python research/run_feature_arena.py \
            --inputs "$INPUTS" \
            --out-dir "$out" \
            --train-start "$TRAIN_START" \
            --train-end "$TRAIN_END" \
            --valid-start "$VALID_START" \
            --valid-end "$VALID_END" \
            --prediction-phase FINAL \
            --feature-selection none \
            --candidates-json candidate.json \
            --source-ref main \
            --ml-source-sha "$GITHUB_SHA"

      - name: Print walk-forward result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          name=os.environ["MATRIX_CANDIDATE"]
          year=int(os.environ["VALIDATION_YEAR"])
          p=Path("out/l1-final-walkforward")/f"{name}-y{year}"/"feature-arena-summary.json"
          s=json.loads(p.read_text(encoding="utf-8"))
          r=s["results"][0]
          print("L1_WALKFORWARD_RESULT")
          print(json.dumps({
              "candidate":name,
              "label_ja":os.environ.get("CANDIDATE_LABEL_JA"),
              "validation_year":year,
              "train_start":os.environ["TRAIN_START"],
              "train_end":os.environ["TRAIN_END"],
              "feature_sets":r["feature_sets"],
              "actor_prefixes":r.get("actor_prefixes") or [],
              "auto_slices":r.get("auto_slices") or [],
              "feature_count":r["feature_count"],
              "metrics":r["metrics"],
              "resource_usage":r.get("resource_usage"),
          },ensure_ascii=False,separators=(",",":")))
          PY

      - name: Cost guard
        if: always()
        run: |
          echo "Candidate lane: jockey_horse_pedigree_fullauto_v3"
          echo "Validation year: 2025"
          echo "Standard GitHub-hosted CPU runner only."
          echo "No GPU."
          echo "No GitHub Artifact/Cache."
          echo "Existing approved Kaggle private snapshot storage is read-only."

  ledger:
    name: ledger
    if: always()
    needs:
      - lane_core4_2025
      - lane_pedigree_2025
      - lane_condition_2025
      - lane_top1_2025
      - lane_light_2025
      - lane_all_2025
      - lane_elite5_2025
      - lane_jockey_pedigree_2025
      - lane_jockey_horse_pedigree_2025
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fast-forward branch
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Archive permanent walk-forward ledger
        run: |
          set -euo pipefail
          python research/archive_l1_walkforward_run.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --config research/l1-final-walkforward-v1.json

      - name: Commit permanent ledger
        run: |
          set -euo pipefail
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research-results/l1-final-walkforward/L1-FINAL-WF-001
          if git diff --cached --quiet; then
            echo "No ledger changes to commit"
            exit 0
          fi
          git commit -m "research: archive L1 final walk-forward run $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1

      - name: Ledger cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted CPU runner only."
          echo "No GPU."
          echo "No Artifact or Cache."
          echo "Only small text/JSON result ledgers are committed to Git."
