name: L1 Phase 3 research selection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan matrix or execute it
        required: true
        default: plan
        type: choice
        options:
          - plan
          - run
      matrix:
        description: Research matrix
        required: true
        default: base_plus_one
        type: choice
        options:
          - base_plus_one
          - windows
          - shrinkage
          - feature_selection
          - all
      first_holdout:
        description: First unknown-year holdout (2026 is locked)
        required: true
        default: "2025"
      last_holdout:
        description: Last unknown-year holdout (must be <=2025)
        required: true
        default: "2025"
      train_years:
        required: true
        default: "3"
      warmup_years:
        required: true
        default: "1"
      prediction_phase:
        required: true
        default: FINAL
        type: choice
        options:
          - EARLY
          - FINAL
      families:
        description: BASE+1 family list
        required: true
        default: "OPPONENT,NETWORK,LAP,STYLE,DISTANCE,BACKFILL,AUTO,PEDIGREE,ACTOR,TIME_PACE"
      reference_feature_sets:
        description: Reference sets for windows/shrinkage/Feature Selection
        required: true
        default: "BASE,OPPONENT,NETWORK,LAP,STYLE,DISTANCE,PEDIGREE,ACTOR,TIME_PACE"
      max_execute_candidates:
        description: Safety cap for one run
        required: true
        default: "24"
      backfill_ref:
        required: true
        default: main

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout KEIBA-ML
        uses: actions/checkout@v4

      - name: Checkout BACKFILL
        if: ${{ inputs.mode == 'run' }}
        uses: actions/checkout@v4
        with:
          repository: pinogame1945-dotcom/KEIBA-BACKFILL
          ref: ${{ inputs.backfill_ref }}
          path: backfill

      - name: Record BACKFILL SHA
        if: ${{ inputs.mode == 'run' }}
        run: echo "BACKFILL_SHA=$(git -C backfill rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Safety smoke
        if: ${{ inputs.mode == 'run' }}
        run: npm run smoke:all

      - name: Python syntax
        run: python -m py_compile research/run_phase3_selection.py research/run_walk_forward.py research/train-staged-lightgbm.py research/trainer-foundation-smoke.py

      - name: Install ML dependencies
        if: ${{ inputs.mode == 'run' }}
        run: python -m pip install --disable-pip-version-check -r ml/requirements.txt

      - name: Trainer foundation smoke
        if: ${{ inputs.mode == 'run' }}
        run: python research/trainer-foundation-smoke.py

      - name: Plan Phase 3 matrix
        if: ${{ inputs.mode == 'plan' }}
        run: |
          python research/run_phase3_selection.py \
            --source-root backfill \
            --first-holdout "${{ inputs.first_holdout }}" \
            --last-holdout "${{ inputs.last_holdout }}" \
            --train-years "${{ inputs.train_years }}" \
            --warmup-years "${{ inputs.warmup_years }}" \
            --prediction-phase "${{ inputs.prediction_phase }}" \
            --matrix "${{ inputs.matrix }}" \
            --families "${{ inputs.families }}" \
            --reference-feature-sets "${{ inputs.reference_feature_sets }}"

      - name: Execute Phase 3 matrix
        if: ${{ inputs.mode == 'run' }}
        run: |
          python research/run_phase3_selection.py \
            --source-root backfill \
            --out-dir out/phase3 \
            --first-holdout "${{ inputs.first_holdout }}" \
            --last-holdout "${{ inputs.last_holdout }}" \
            --train-years "${{ inputs.train_years }}" \
            --warmup-years "${{ inputs.warmup_years }}" \
            --prediction-phase "${{ inputs.prediction_phase }}" \
            --matrix "${{ inputs.matrix }}" \
            --families "${{ inputs.families }}" \
            --reference-feature-sets "${{ inputs.reference_feature_sets }}" \
            --max-execute-candidates "${{ inputs.max_execute_candidates }}" \
            --source-ref "${{ inputs.backfill_ref }}" \
            --source-sha "$BACKFILL_SHA" \
            --ml-source-sha "$GITHUB_SHA" \
            --execute

      - name: Print compact result
        if: ${{ inputs.mode == 'run' }}
        run: cat out/phase3/research-summary.json

      - name: Cost guard
        run: |
          if grep -R -E "uses:[[:space:]]*actions/upload-artifact" .github/workflows; then
            echo "Persistent artifact upload found" >&2
            exit 1
          fi

      # No artifact upload. Candidate datasets/models/OOF remain ephemeral on this
      # standard runner. Only the compact JSON summary is designed to be persisted
      # later after explicit review.
