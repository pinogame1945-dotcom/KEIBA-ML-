name: L2 TRIFECTA Boundary Router V1

on:
  push:
    branches:
      - research/l2-trifecta-boundary-router-v1-20261008
    paths:
      - .github/triggers/l2-trifecta-boundary-router-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l2-trifecta-boundary-router-v1
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BACKFILL_SHA: a80f2c1994e10ddcf76efaa996c97147b1223e1f
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/run_l2_trifecta_boundary_router_v1.py research/run_l2_trifecta_depth_router_v1.py research/run_l2_trifecta_odds_rank_reverse_v1.py research/build_l2_bet_kings_dataset_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.load(open("contracts/l2-trifecta-boundary-router-v1.json",encoding="utf-8"))
          assert c["years"]==[2021,2022,2023,2024,2025]
          assert c["selection_test_years"]==[2023,2024]
          assert c["holdout_year"]==2025
          assert c["locked_years"]==[2026]
          assert c["feature_extraction_once"] is True
          assert c["parallel_cpu"] is True
          assert c["winner_dependent_features"] is False
          assert c["cost"]["standard_github_cpu_only"] is True
          assert all(c["cost"][k] is False for k in ("gpu","paid_runner","github_artifact","github_cache","paid_persistent_storage"))
          wf=Path(".github/workflows/l2-trifecta-boundary-router-v1.yml").read_text()
          assert "runs-on: ubuntu-latest" in wf
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload"+"-artifact") for u in uses)
          assert not any(u.startswith("actions/"+"cache") for u in uses)
          print("BOUNDARY_ROUTER_GUARDS_OK")
          PY

      - name: Install CPU research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn joblib

      - name: Sparse restore fixed 2021-2025 BACKFILL once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/backfill
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/pinogame1945-dotcom/KEIBA-BACKFILL.git out/backfill
          git -C out/backfill sparse-checkout init --no-cone
          cat > out/backfill/.git/info/sparse-checkout <<'EOF'
          /data/daily/2021-*.jsonl.gz
          /data/daily/2022-*.jsonl.gz
          /data/daily/2023-*.jsonl.gz
          /data/daily/2024-*.jsonl.gz
          /data/daily/2025-*.jsonl.gz
          /data/odds/daily/2021-*.jsonl.gz
          /data/odds/daily/2022-*.jsonl.gz
          /data/odds/daily/2023-*.jsonl.gz
          /data/odds/daily/2024-*.jsonl.gz
          /data/odds/daily/2025-*.jsonl.gz
          EOF
          git -C out/backfill checkout "$BACKFILL_SHA"
          test "$(git -C out/backfill rev-parse HEAD)" = "$BACKFILL_SHA"

      - name: Run consolidated boundary-router research
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-trifecta-boundary-router-v1/run-$GITHUB_RUN_ID"
          workers="$(python - <<'PY'
          import os
          print(max(2,min(3,(os.cpu_count() or 2)-1)))
          PY
          )"
          echo "CPU_WORKERS=$workers"
          python research/run_l2_trifecta_boundary_router_v1.py --backfill-root out/backfill --out-dir "$result" --workers "$workers"
          echo "===== SUMMARY ====="; cat "$result/summary.json"
          echo "===== HOLDOUT ====="; cat "$result/2025-boundary-metrics.csv"
          echo "===== DYNAMIC ====="; cat "$result/2025-dynamic-policies.csv"
          echo "===== FIXED ====="; cat "$result/2025-fixed-curve.csv"

      - name: Cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner / artifact / cache / Kaggle."
          echo "Pinned BACKFILL restored once and reused runner-local."
          echo "Model/calibration tasks use local CPU process parallelism."
          echo "Only compact result files are committed."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l2-trifecta-boundary-router-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: archive trifecta boundary router v1 run $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
