name: L1 Consensus Trap V1

on:
  push:
    branches:
      - research/l1-consensus-trap-v1-20261004
    paths:
      - .github/triggers/l1-consensus-trap-v1.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l1-consensus-trap-v1
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/run_l1_consensus_trap_v1.py
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/l1-consensus-trap-v1.yml").read_text()
          src=Path("research/run_l1_consensus_trap_v1.py").read_text()
          runners=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("runs-on:")]
          assert runners==["ubuntu-latest"],runners
          uses=[x.strip().split(":",1)[1].strip() for x in wf.splitlines() if x.strip().startswith("- uses:")]
          assert not any(u.startswith("actions/upload-artifact") for u in uses)
          assert not any(u.startswith("actions/cache") for u in uses)
          assert "2026 sealed" in src
          assert "exact final WIN odds" in src
          assert "race-cluster bootstrap" in src
          print("L1_CONSENSUS_TRAP_STATIC_GUARDS_OK")
          PY

      - name: Install lightweight CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pandas

      - name: Restore frozen Outsider support source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/consensus-trap-source
          git fetch --depth=1 origin research/l16-outsider-support-safe-v1-20260930:refs/remotes/origin/consensus-trap-outsider-source
          git show origin/consensus-trap-outsider-source:research-results/l17-king-outsider-podium-calibrator-wf-v1/run-36747215581/predictions.csv.gz > out/consensus-trap-source/predictions.csv.gz
          test -s out/consensus-trap-source/predictions.csv.gz
          test -s research-results/l1-asymmetric-dissent-v3/run-36818983849/scored.csv.gz

      - name: Test consensus trap hypothesis
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l1-consensus-trap-v1/run-$GITHUB_RUN_ID"
          python research/run_l1_consensus_trap_v1.py             --market-scored research-results/l1-asymmetric-dissent-v3/run-36818983849/scored.csv.gz             --outsider-predictions out/consensus-trap-source/predictions.csv.gz             --out-dir "$result"
          test "$(du -sm "$result" | cut -f1)" -le 5

      - name: Cost guard
        if: always()
        shell: bash
        run: |
          echo "Standard GitHub-hosted ubuntu-latest CPU only."
          echo "No GPU / paid runner / Artifact / Cache."
          echo "No Kaggle access and no paid storage."
          echo "Frozen repository research outputs only."
          echo "2026 remains sealed."

      - name: Commit compact results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="research-results/l1-consensus-trap-v1/run-$GITHUB_RUN_ID"
          git config user.name "keiba-ml-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add "$result"
          git commit -m "research: archive consensus trap test $GITHUB_RUN_ID"
          git push origin "HEAD:$GITHUB_REF_NAME"
