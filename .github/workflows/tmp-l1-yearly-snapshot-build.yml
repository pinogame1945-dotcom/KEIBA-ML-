name: Temporary L1 yearly snapshot build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/l1-yearly-superset-snapshot-v1-20260927
    paths:
      - .github/workflows/tmp-l1-yearly-snapshot-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Require free Kaggle snapshot storage
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo "::error::KAGGLE_API_TOKEN is not available. Stop before the expensive snapshot build."
            exit 1
          fi

      - name: Checkout KEIBA-ML
        uses: actions/checkout@v4

      - name: Checkout BACKFILL
        uses: actions/checkout@v4
        with:
          repository: pinogame1945-dotcom/KEIBA-BACKFILL
          ref: main
          path: backfill

      - name: Record BACKFILL SHA
        run: echo "BACKFILL_SHA=$(git -C backfill rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot unit smoke
        run: npm run smoke:l1-yearly-snapshot

      - name: Syntax checks
        run: |
          node --check src/ml-dataset.mjs
          node --check src/historical-extra-builder.mjs
          node --check src/yearly-snapshot-store.mjs
          node --check research/build-yearly-superset-snapshots.mjs
          bash -n scripts/kaggle-persist-snapshot.sh
          bash -n scripts/kaggle-fetch-snapshot.sh

      - name: READINESS 2022-2025
        run: |
          node scripts/audit-backfill-readiness.mjs \
            --source-root backfill \
            --start 2022-01-01 \
            --end 2025-12-31 \
            --report-out out/snapshot-readiness.json \
            --source-sha "$BACKFILL_SHA" \
            --min-core-known-coverage 0.98 \
            --max-invalid-rate 0 \
            --max-year-gap 0.10 \
            --require-source-integrity

      - name: Build yearly superset snapshots
        run: |
          node research/build-yearly-superset-snapshots.mjs \
            --source-root backfill \
            --out-dir out/yearly-snapshots \
            --source-start 2022-01-01 \
            --source-end 2025-12-31 \
            --emit-start 2022-01-01 \
            --emit-end 2025-12-31 \
            --first-model-ready-year 2023 \
            --prediction-phase FINAL \
            --source-sha "$BACKFILL_SHA" \
            --ml-source-sha "$GITHUB_SHA"

      - name: Print snapshot manifest and sizes
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(find out/yearly-snapshots -name manifest.json -print -quit)
          test -n "$manifest"
          cat "$manifest"
          echo "--- disk usage ---"
          du -h "$(dirname "$manifest")"/*

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check kaggle

      - name: Persist snapshot to Kaggle private storage
        shell: bash
        run: bash scripts/kaggle-persist-snapshot.sh out/yearly-snapshots

      - name: Cost guard
        if: always()
        run: |
          if grep -E "uses:[[:space:]]*actions/upload-artifact|uses:[[:space:]]*actions/cache" .github/workflows/tmp-l1-yearly-snapshot-build.yml; then
            echo "GitHub Artifact/Cache persistence found; refusing this workflow." >&2
            exit 1
          fi
          echo "Standard GitHub-hosted runner only."
          echo "No GPU."
          echo "No GitHub Artifact."
          echo "No GitHub Cache."
          echo "Kaggle persistence helper enforces a conservative 180 GiB owned-dataset safety ceiling."
